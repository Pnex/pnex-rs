# Rauthy dev config (OIDC IdP, D10) — http on localhost:8080, embedded hiqlite
# DB persisted in the pnex-rauthydata volume (compose.yaml).
# Mounted on /app/config.toml; the compose.yaml env overrides these values.
# Full reference: https://sebadob.github.io/rauthy/config/config.html

[server]
port_http = 8080
port_https = 8443
# Local dev: http + self-signed https side by side — http for the backend's
# server-to-server calls (token/JWKS, no certificate to validate),
# https for device browsers (secure context: `crypto.subtle`
# required by the Rauthy login page on a LAN IP).
# pub_url = issuer seen by browsers (host LAN IP). If the DHCP IP
# changes: `task rauthy:lan` (detects the IP, rewrites everything, restarts and
# extends the OIDC client live — cumulated URIs, see apply-lan.sh)
# (development.yaml) + the redirect_uri of the pnex client (admin API, see
# bootstrap/api_keys.json).
scheme = "http_https"
# (overridden by PUB_URL in compose.yaml — mirror value for a run outside compose)
pub_url = '192.168.1.185:8443'

[cluster]
# Single hiqlite node (single instance) — data under /app/data (volume).
node_id = 1
data_dir = '/app/data'
# hiqlite raft/gossip secrets — required (≥ 16 chars, distinct).
# Versioned dev values (parity with Keycloak admin/admin) — DO NOT reuse.
secret_raft = 'pnex-dev-raft-secret-1337'
secret_api = 'pnex-dev-api-secret-7331'

[encryption]
# DEV_MODE=true → the dev migration inserts a dev JWKS encrypted with Rauthy's
# hardcoded DEV key (upstream config-test.toml): the cryptr registry
# MUST contain it, otherwise token issuance fails with
# "CryptrError::Keys(EncKey ID does not exist)" (observed 2026-09-08:
# cause of the end of the token debug day — the old key "adeeefd9"
# did not cover the dev ID).
key_active = 'bVCyTsGaggVy5yqQ'
keys = ['bVCyTsGaggVy5yqQ/UzluN29DZW41M3hTSkx6Y3NtZmRuQkR2TnJxUTYzcjQ=']

# Keycloak realm parity (registrationAllowed): open sign-up.
# Activation goes through a mail → mailcrab SMTP catcher (compose env).
[user_registration]
enable = true

# NOTE dev brute-force IP blocking: the TOML section `[login_delay]` makes
# Rauthy 0.36.2 panic at boot ("Unknown data in section") — the setting
# goes through other channels (compose env or admin UI). Meanwhile, on an
# IP block (172.18.0.1 = the single IP of all our dev sources):
# wait for expiry WITHOUT any request, or Admin UI → Security → Blocked.
# A request during the window seems to extend it (22 → 27 min, observed
# 2026-09-08).

[bootstrap]
# The admin password comes from BOOTSTRAP_ADMIN_PASSWORD_PLAIN (compose.yaml).
admin_email = 'admin@localhost'

[webauthn]
# Required in 0.36 (no default applied despite the docs) — local dev.
# MUST stay on a DOMAIN (not an IP): webauthn-rs (WebauthnBuilder)
# rejects an IP host in rp_origin → panic at boot "Invalid rp_id".
# pub_url can be an IP, webauthn keeps working via localhost.
rp_id = 'localhost'
rp_origin = 'http://localhost:8080'
