; Image build only (deploy/docker/Dockerfile, target `builder`): compiles a
; trivial sketch once per SoC family so the platforms, toolchains and
; Arduino frameworks are baked into the image — device builds then run
; without downloading ~1 GB of packages on first use.
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
