version: '3'

env:
  FRONT_DIST: crates/pnex-frontend/dist
  DX_OUT: target/dx/pnex-frontend

# Firmware merged into the monorepo (firmware/) + toolchain pinned to
# its venv when it exists (otherwise `pio` from PATH — a potentially
# divergent install: see docs/observations.md O7). Used by
# dev:backend and the fw:* tasks.
vars:
  # Every heavy build (cargo, dx, docker buildx) runs through the guard:
  # own memory-capped scope, low priority, disk check, one at a time across
  # sessions (scripts/guarded.sh — a build OOM no longer kills the terminal).
  G: '{{.ROOT_DIR}}/scripts/guarded.sh'
  FW_DIR: firmware
  # ABSOLUTE paths ({{.ROOT_DIR}} = monorepo root): the build worker
  # runs with cwd = crates/pnex-backend — a relative path resolved
  # from it points next door (cause of an instant failure of ALL
  # firmware builds, see journal 2026-09-02).
  PIO_CMD:
    sh: test -x "{{.ROOT_DIR}}/firmware/.venv/bin/pio" && echo "{{.ROOT_DIR}}/firmware/.venv/bin/pio" || echo pio
  ESPTOOL_CMD:
    sh: test -x "{{.ROOT_DIR}}/firmware/.venv/bin/esptool" && echo "{{.ROOT_DIR}}/firmware/.venv/bin/esptool" || echo esptool
  # Outillage Android (build:frontend:android) — surcharges via l'env shell.
  ANDROID_HOME:
    sh: echo "${ANDROID_HOME:-$HOME/Android/Sdk}"
  NDK_HOME:
    sh: echo "${NDK_HOME:-$(ls -d "$HOME"/Android/Sdk/ndk/* 2>/dev/null | sort | tail -1)}"
  JAVA_HOME:
    sh: echo "${JAVA_HOME:-/usr/lib/jvm/java-21-openjdk-amd64}"

tasks:
  default:
    desc: Task overview
    cmds:
      - task --list

  # ---------- Build ----------

  build:frontend:
    desc: Build the Dioxus front (wasm, release) and copy it into crates/pnex-frontend/dist
    deps: [css:build, js:build]
    # method timestamp (dist mtime vs sources) and not the default checksum:
    # go-task writes the checksum BEFORE running the cmds — an interrupted
    # wasm build (Ctrl-C) records an "up to date" checksum without producing anything,
    # and task dev then skips the front forever (seen 2026-09-05:
    # yesterday's dist served while task dev was running).
    method: timestamp
    sources:
      - crates/pnex-frontend/src/**/*
      # Fluent labels are embedded (include_str!): a locales change
      # must trigger the rebuild (observed 2026-09-12: .ftl fix
      # served stale because dev:frontend was "up to date").
      - crates/pnex-frontend/locales/**/*
      - crates/pnex-frontend/assets/**/*
      - crates/pnex-frontend/Dioxus.toml
      - crates/pnex-core/src/**/*
      # The stitcher (360° assembly) is statically linked into the front
      # binary: a change must trigger the rebuild (observed
      # 2026-09-10: fill_poles modified, task stayed "up to date").
      - crates/pnex-stitcher/src/**/*
      # The API contract is embedded by the front: a change must
      # trigger the rebuild (otherwise stale dist after a bump).
      - crates/pnex-api-contract/src/**/*
    generates:
      - "{{.FRONT_DIST}}/**/*"
    cmds:
      # Empty the dx output (hashed assets of previous builds pile up there)
      - rm -rf {{.DX_OUT}}/release/web/public
      - cd crates/pnex-frontend && {{.G}} dx build --platform web --release
      - rm -rf {{.FRONT_DIST}}
      - cp -r {{.DX_OUT}}/release/web/public {{.FRONT_DIST}}

  build:extension:
    desc: Build the PNeX browser agent (wasm) as an unpacked extension in dist/extension (load it from chrome://extensions, developer mode)
    cmds:
      - '{{.G}} crates/pnex-extension/build-dist.sh {{.ROOT_DIR}}/dist/extension'

  build:frontend:android:
    desc: Build the release arm64 Android APK (mobile chain validation — see docs/architecture/features.md)
    deps: [css:build, js:build]
    # method timestamp (same reason as build:frontend): go-task writes the
    # checksum BEFORE running — an interrupted build would record an
    # "up to date" checksum with no APK produced.
    method: timestamp
    sources:
      - crates/pnex-frontend/src/**/*
      # Fluent labels are embedded (include_str!): a locales change
      # must trigger the rebuild (observed 2026-09-12: .ftl fix
      # served stale because dev:frontend was "up to date").
      - crates/pnex-frontend/locales/**/*
      - crates/pnex-frontend/assets/**/*
      - crates/pnex-frontend/Dioxus.toml
      - crates/pnex-frontend/patch-android-manifest.py
      - Taskfile.yml
      - crates/pnex-core/src/**/*
      # The stitcher (360° assembly) is statically linked into the front
      # binary: a change must trigger the rebuild (observed
      # 2026-09-10: fill_poles modified, task stayed "up to date").
      - crates/pnex-stitcher/src/**/*
      # The API contract is embedded by the front: a change must
      # trigger the rebuild (otherwise stale dist after a bump).
      - crates/pnex-api-contract/src/**/*
    generates:
      # dx signs with its debug key and keeps the name app-debug.apk even in release.
      - "{{.DX_OUT}}/release/android/app/app/build/outputs/apk/debug/app-debug.apk"
    cmds:
      - task: android:apk
        vars: { ANDROID_FEATURES: mobile }

  # Signed release APK (P1.2, SEC-10): not debuggable, signed with the
  # release key instead of the dx debug key. The key never touches the repo:
  # PNEX_ANDROID_KEYSTORE (path), PNEX_ANDROID_KEYSTORE_PASSWORD,
  # PNEX_ANDROID_KEY_ALIAS, PNEX_ANDROID_KEY_PASSWORD come from the
  # environment (CI secrets). versionCode derives from the last v* tag
  # (override: PNEX_ANDROID_VERSION_NAME / PNEX_ANDROID_VERSION_CODE).
  # An APK signed by another key cannot upgrade in place: testers who
  # installed a debug-signed APK uninstall it first.
  build:frontend:android:release:
    desc: Build the signed release APK arm64 → target/dist/pnex-android-arm64.apk (keystore from env, see Taskfile)
    deps: [css:build, js:build]
    preconditions:
      - sh: test -n "$PNEX_ANDROID_KEYSTORE" && test -f "$PNEX_ANDROID_KEYSTORE"
        msg: "PNEX_ANDROID_KEYSTORE must point to the release keystore"
      - sh: test -n "$PNEX_ANDROID_KEYSTORE_PASSWORD" && test -n "$PNEX_ANDROID_KEY_ALIAS" && test -n "$PNEX_ANDROID_KEY_PASSWORD"
        msg: "PNEX_ANDROID_KEYSTORE_PASSWORD, PNEX_ANDROID_KEY_ALIAS and PNEX_ANDROID_KEY_PASSWORD must be set"
    vars:
      VERSION_NAME:
        sh: echo "${PNEX_ANDROID_VERSION_NAME:-$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')}"
    cmds:
      - task: android:apk
        vars: { ANDROID_FEATURES: mobile, GRADLE_TASK: assembleRelease, VERSION_NAME: "{{.VERSION_NAME}}" }
      - mkdir -p target/dist
      - cp {{.DX_OUT}}/release/android/app/app/build/outputs/apk/release/app-release.apk target/dist/pnex-android-arm64.apk
      - echo "target/dist/pnex-android-arm64.apk (release {{.VERSION_NAME}})"

  build:frontend:android:e2e:
    desc: Build the e2e APK (feature `e2e` = harness hooks; never distributed) → target/dx/pnex-frontend/pnex-e2e.apk
    deps: [css:build, js:build]
    cmds:
      - task: android:apk
        vars: { ANDROID_FEATURES: "mobile,e2e" }
      # Moved, not copied: build:frontend:android checks the timestamp of
      # app-debug.apk, a leftover e2e APK there would pass as up to date.
      - mv {{.DX_OUT}}/release/android/app/app/build/outputs/apk/debug/app-debug.apk {{.DX_OUT}}/pnex-e2e.apk

  # Shared APK build (dx + manifest/resources patch + gradle). No sources
  # check here: the callers own it (the feature set is not in the APK path).
  android:apk:
    internal: true
    requires:
      vars: [ANDROID_FEATURES]
    vars:
      GRADLE_TASK: '{{.GRADLE_TASK | default "assembleDebug"}}'
    cmds:
      # dx piles up the jniLibs of previous builds in the generated gradle
      # project (seen 2026-09-08: arm64 was ADDED to the x86_64 of a previous
      # build → 192 MB APK with both ABIs). Clean before building.
      - rm -rf {{.DX_OUT}}/release/android
      # Machine-specific env: SDK/NDK/JDK resolved by the global vars
      # ANDROID_HOME/NDK_HOME/JAVA_HOME (see root vars block).
      - cmd: |
          export ANDROID_HOME="{{.ANDROID_HOME}}"
          export NDK_HOME="{{.NDK_HOME}}"
          export JAVA_HOME="{{.JAVA_HOME}}"
          cd crates/pnex-frontend
          # --release REQUIRED: the debug build embeds Dioxus's autoreload
          # client which probes /_dioxus towards localhost:8080 at
          # launch — Rauthy instantly blacklists any IP requesting
          # a /_* path ("suspicious API scan") → login blocks in
          # a row (observed 2026-09-08, half a day of debugging).
          {{.G}} dx build --platform android --release --target aarch64-linux-android --no-default-features --features "{{.ANDROID_FEATURES}}"
          # dx regenerates the manifest on every build (no way to inject an
          # intent-filter via Dioxus.toml): patch the `pnex` deep link afterwards
          # then gradle re-assembly (fast when warm). Paths in
          # {{.ROOT_DIR}}: the cd above invalidates the relative DX_OUT.
          python3 "{{.ROOT_DIR}}/crates/pnex-frontend/patch-android-manifest.py" \
            "{{.ROOT_DIR}}/{{.DX_OUT}}/release/android/app/app/src/main/AndroidManifest.xml"
          cd "{{.ROOT_DIR}}/{{.DX_OUT}}/release/android/app"
          if [ "{{.GRADLE_TASK}}" = "assembleRelease" ]; then
            PNEX_ANDROID_VERSION_NAME="{{.VERSION_NAME}}" \
              python3 "{{.ROOT_DIR}}/crates/pnex-frontend/patch-android-release.py" app/build.gradle.kts
          fi
          ./gradlew {{.GRADLE_TASK}}

  # Native desktop UI (Dioxus desktop: webkit2gtk on Linux, WebView2 on
  # Windows). The webviews have no Web Serial: firmware flashing runs the
  # esptool binary shipped in `<app>/esptool/` (cf. src/flash.rs `native`).
  # Linux prerequisites (apt): libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev.
  # Native build for the host architecture (x86_64 or aarch64): webkit2gtk
  # cross-compiling needs a full target sysroot, so CI builds aarch64 on an
  # arm64 runner instead.
  build:frontend:linux:
    desc: Build the native Linux desktop UI for the host arch → target/dist/pnex-desktop-linux-<arch>.tar.gz
    deps: [css:build, js:build]
    vars:
      ARCH:
        sh: uname -m
      ESPTOOL_PLATFORM: '{{if eq .ARCH "aarch64"}}linux-aarch64{{else}}linux-amd64{{end}}'
    cmds:
      - task: esptool:fetch
        vars: { ESPTOOL_PLATFORM: '{{.ESPTOOL_PLATFORM}}' }
      - cd crates/pnex-frontend && {{.G}} dx build --linux --release --no-default-features --features desktop
      - rm -rf {{.DX_OUT}}/release/linux/app/esptool
      - cp -r target/esptool/{{.ESPTOOL_PLATFORM}} {{.DX_OUT}}/release/linux/app/esptool
      - mkdir -p target/dist
      - tar -C {{.DX_OUT}}/release/linux -czf target/dist/pnex-desktop-linux-{{.ARCH}}.tar.gz --transform 's,^app,pnex,' app

  build:cli:
    desc: 'Build the pnex admin CLI (D251) → target/dist/pnex-cli-<target>.tar.gz (.zip on Windows), TARGET=<triple> (default: host)'
    vars:
      HOST:
        sh: rustc -vV | awk '/^host/ {print $2}'
      TARGET: '{{.TARGET | default .HOST}}'
      EXE: '{{if contains "windows" .TARGET}}pnex.exe{{else}}pnex{{end}}'
    cmds:
      - '{{.G}} cargo build --release --locked -p pnex-cli --target {{.TARGET}}'
      - mkdir -p target/dist
      - >-
        {{if contains "windows" .TARGET}}cd target/{{.TARGET}}/release && zip -j ../../dist/pnex-cli-{{.TARGET}}.zip {{.EXE}}{{else}}tar -C target/{{.TARGET}}/release -czf target/dist/pnex-cli-{{.TARGET}}.tar.gz {{.EXE}}{{end}}

  build:frontend:linux:e2e:
    desc: Build the Linux e2e app (feature `e2e` = harness hooks + WebKitWebDriver automation; never distributed) → target/dx/pnex-frontend/linux-e2e/
    deps: [css:build, js:build]
    cmds:
      - cd crates/pnex-frontend && {{.G}} dx build --linux --release --no-default-features --features "desktop,e2e"
      # Copied out of the dx output: build:frontend:linux reruns dx (no
      # sources check), the e2e app can never end up in its tarball.
      - rm -rf {{.DX_OUT}}/linux-e2e
      - cp -r {{.DX_OUT}}/release/linux/app {{.DX_OUT}}/linux-e2e

  # Windows cross-build from Linux (x86_64-pc-windows-gnu). Prerequisites:
  # `apt install mingw-w64` + `rustup target add x86_64-pc-windows-gnu`.
  # win-linker.sh strips the MSVC-only flags dx injects for Windows bundles.
  # WebView2Loader.dll must ship next to the exe (gnu target; the msvc target
  # links it statically). The WebView2 runtime itself ships with Windows 10/11.
  build:frontend:windows:
    desc: Cross-build the native Windows desktop UI (x86_64) → target/dist/pnex-desktop-windows-x86_64.zip
    deps: [css:build, js:build]
    cmds:
      - task: esptool:fetch
        vars: { ESPTOOL_PLATFORM: windows-amd64 }
      - cmd: |
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER="{{.ROOT_DIR}}/crates/pnex-frontend/win-linker.sh"
          cd crates/pnex-frontend
          {{.G}} dx build --windows --target x86_64-pc-windows-gnu --release --no-default-features --features desktop
      - cmd: |
          app={{.DX_OUT}}/release/windows/app
          loader=$(ls -d "$HOME"/.cargo/registry/src/*/webview2-com-sys-*/x64/WebView2Loader.dll | sort -V | tail -1)
          test -f "$loader" || { echo "WebView2Loader.dll not found in the cargo registry" >&2; exit 1; }
          cp "$loader" "$app/"
          rm -rf "$app/esptool" && cp -r target/esptool/windows-amd64 "$app/esptool"
          mkdir -p target/dist && rm -f target/dist/pnex-desktop-windows-x86_64.zip
          cd "$app/.." && rm -rf pnex && cp -r app pnex && zip -qr "{{.ROOT_DIR}}/target/dist/pnex-desktop-windows-x86_64.zip" pnex && rm -rf pnex

  # Edge agent distribution (D95), served by pnex-server at
  # /api/v1/agent/download/{target} (PNEX_AGENT_DIST_DIR, dev default
  # target/agent-dist). Linux targets are static musl linked through zig
  # (cargo-zigbuild, zig fetched pinned); Windows through mingw.
  # Prerequisites: `cargo install --locked cargo-zigbuild`, `apt install mingw-w64`.
  build:agent:
    desc: Build pnex-agent for Linux x86_64/aarch64/armv7 (static) + Windows x86_64 → target/agent-dist (+ SHA256SUMS)
    cmds:
      - deploy/agent/build-dist.sh

  # esptool standalone release binary (PyInstaller, GPL-2.0 — shipped as a
  # separate program with its LICENSE), pinned by sha256. Only `esptool` is
  # kept (espefuse/espsecure/rfc2217 are not used).
  esptool:fetch:
    desc: Download the pinned esptool binary for ESPTOOL_PLATFORM → target/esptool/<platform>/
    vars:
      ESPTOOL_VERSION: 5.4.0
      ESPTOOL_PLATFORM: '{{.ESPTOOL_PLATFORM | default "linux-amd64"}}'
    status:
      - test -f target/esptool/{{.ESPTOOL_PLATFORM}}/.v{{.ESPTOOL_VERSION}}
    cmds:
      - cmd: |
          set -eu
          case "{{.ESPTOOL_PLATFORM}}" in
            linux-amd64)   ext=tar.gz; sum=61648fbae20735cabb342f2fbe8fc89b3046e1ed6f9c3e09528d837dc9a9b152; bin=esptool ;;
            linux-aarch64) ext=tar.gz; sum=2964fff085071c1403f2cf812a7a1d425f987f9992851a60236bbee17b6e7dcc; bin=esptool ;;
            macos-arm64)   ext=tar.gz; sum=ba332671130939e2e6db90c2784488f7e62a1459b0fe3c5ec66e9a366821de7a; bin=esptool ;;
            macos-amd64)   ext=tar.gz; sum=910bb64fe39a84c792752701293c8aa294faeef229fe8705ecd6955b01db3778; bin=esptool ;;
            windows-amd64) ext=zip;    sum=b7f6b9dd301a210b31f4829118c909c84aae23107f9ca1fdc14ccf4d7384be2e; bin=esptool.exe ;;
            *) echo "unknown ESPTOOL_PLATFORM {{.ESPTOOL_PLATFORM}}" >&2; exit 1 ;;
          esac
          dir=target/esptool/{{.ESPTOOL_PLATFORM}}
          tmp=$(mktemp -d)
          archive="$tmp/esptool.$ext"
          curl -fsSL -o "$archive" "https://github.com/espressif/esptool/releases/download/v{{.ESPTOOL_VERSION}}/esptool-v{{.ESPTOOL_VERSION}}-{{.ESPTOOL_PLATFORM}}.$ext"
          echo "$sum  $archive" | sha256sum -c --quiet
          if [ "$ext" = zip ]; then unzip -q "$archive" -d "$tmp"; else tar -xzf "$archive" -C "$tmp"; fi
          rm -rf "$dir" && mkdir -p "$dir"
          cp "$tmp/esptool-{{.ESPTOOL_PLATFORM}}/$bin" "$tmp/esptool-{{.ESPTOOL_PLATFORM}}/LICENSE" "$dir/"
          touch "$dir/.v{{.ESPTOOL_VERSION}}"
          rm -rf "$tmp"

  # ---------- CSS (Tailwind v4) ----------

  css:build:
    desc: Generate crates/pnex-frontend/assets/tailwind.css (required before any dx build)
    dir: crates/pnex-frontend
    # Incremental, otherwise it would re-touch assets/tailwind.css on every
    # invocation and invalidate the dev:frontend/build:frontend timestamp.
    # method checksum is enough here: an interruption only loses a few ms.
    sources:
      - src/**/*.rs
      - style/*.css
      - package.json
    generates:
      - assets/tailwind.css
    cmds:
      - bun run css:build

  css:ensure:
    desc: Ensure assets/tailwind.css exists (stub) — the asset!() macro requires it at compile time
    cmds:
      # The real CSS is gitignored (generated by css:build): without this stub, every
      # fresh clone breaks on cargo check/test/clippy (asset! cannot find the
      # file). The assets/ folder does not exist either in a fresh clone
      # (no tracked file). Never overwrites the real CSS if it exists.
      - mkdir -p crates/pnex-frontend/assets
      - test -f crates/pnex-frontend/assets/tailwind.css || printf '/* Stub — real CSS generated by task css:build (bun) */\n' > crates/pnex-frontend/assets/tailwind.css

  css:watch:
    desc: Regenerate the Tailwind CSS on the fly (run next to dev:hot)
    dir: crates/pnex-frontend
    cmds:
      - bun run css:watch

  # ---------- JS (esptool-js browser flash) ----------

  js:build:
    desc: Bundle assets/flasher.js + assets/viewers.js (esbuild IIFE — required before any dx build)
    dir: crates/pnex-frontend
    # Incremental, same reason as css:build.
    sources:
      - js/*.js
      - package.json
    generates:
      - assets/flasher.js
      - assets/viewers.js
      - assets/viewers.css
      - assets/map.js
      - assets/map.css
      - assets/doc.js
      - assets/graph.js
    cmds:
      - bun run js:build
      - bun run js:viewers
      - bun run js:map
      - bun run js:doc
      - bun run js:graph

  js:ensure:
    desc: Ensure the JS/CSS bundles exist (stubs) — the asset!() macro requires them at compile time
    cmds:
      # Same guard as css:ensure: the real bundles are gitignored (generated
      # by js:build) and without a stub every fresh clone breaks on cargo check/test.
      # Never overwrites the real bundles if they exist.
      - mkdir -p crates/pnex-frontend/assets
      - test -f crates/pnex-frontend/assets/flasher.js || printf '/* Stub — real bundle generated by task js:build (bun) */\n' > crates/pnex-frontend/assets/flasher.js
      - test -f crates/pnex-frontend/assets/viewers.js || printf '/* Stub — real bundle generated by task js:build (bun) */\n' > crates/pnex-frontend/assets/viewers.js
      - test -f crates/pnex-frontend/assets/viewers.css || printf '/* Stub — real bundle generated by task js:build (bun) */\n' > crates/pnex-frontend/assets/viewers.css
      - test -f crates/pnex-frontend/assets/map.js || printf '/* Stub — real bundle generated by task js:build (bun) */\n' > crates/pnex-frontend/assets/map.js
      - test -f crates/pnex-frontend/assets/map.css || printf '/* Stub — maplibre CSS generated by task js:build (bun) */\n' > crates/pnex-frontend/assets/map.css
      - test -f crates/pnex-frontend/assets/doc.js || printf '/* Stub — real bundle generated by task js:build (bun) */\n' > crates/pnex-frontend/assets/doc.js
      - test -f crates/pnex-frontend/assets/graph.js || printf '/* Stub — real bundle generated by task js:build (bun) */\n' > crates/pnex-frontend/assets/graph.js

  # ---------- Rauthy (branding IdP) ----------

  rauthy:branding:
    desc: Apply the PNeX theme + logo to the Rauthy pages (login/register/account) — needs RAUTHY_API_KEY='<name>$<secret>'
    cmds:
      - bash deploy/rauthy/apply-branding.sh

  rauthy:lan:
    desc: Canonical LAN run — detects the active IP, rewrites the configs, restarts Rauthy+backend, extends the OIDC client live (cumulated URIs, previous spots kept)
    cmds:
      - bash deploy/rauthy/apply-lan.sh

  # ---------- TLS edge (D70) ----------

  edge:up:
    desc: TLS everywhere — nginx + local CA (or Let's Encrypt with PNEX_EDGE_MODE=cloud) on https://<hostname>.local
    cmds:
      - bash deploy/edge/apply-edge.sh

  edge:down:
    desc: Remove the TLS edge and put Rauthy back on its dev ports (8080/8443)
    cmds:
      # Placeholders: the overlay refuses to parse without them.
      - PNEX_DOMAIN=down PNEX_BACKEND_UPSTREAM=down docker compose -f compose.yaml -f compose.edge.yaml --profile cloud rm -sf edge-nginx edge-pki edge-certbot
      - rm -f deploy/edge/edge.env
      - docker compose up -d rauthy

  edge:trust:
    desc: Trust the local edge root CA on this machine (system store + Chrome/Firefox NSS)
    cmds:
      - bash deploy/edge/trust-ca.sh

  # ---------- Container images (D71) ----------

  docker:build:
    desc: Build the pnex-server (Chainguard glibc-dynamic) and pnex-builder (Wolfi + PlatformIO) images — TAG=dev by default
    vars:
      TAG: '{{.TAG | default "dev"}}'
    cmds:
      - '{{.G}} docker buildx build -f deploy/docker/Dockerfile --target server -t pnex-server:{{.TAG}} --load .'
      - '{{.G}} docker buildx build -f deploy/docker/Dockerfile --target builder -t pnex-builder:{{.TAG}} --load .'

  changelog:
    desc: Release notes from the Conventional Commits (cliff.toml) — unreleased commits by default; `-- --latest` = last tag, `-- -o CHANGELOG.md` = whole history
    cmds:
      - uvx git-cliff@2.14.2 {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}--unreleased{{end}}

  docker:publish:
    desc: Build + push multi-arch (amd64, arm64) images to Docker Hub — TAG=dirty-<githash> by default (needs `docker login` and arm64 binfmt)
    vars:
      REGISTRY: '{{.REGISTRY | default "docker.io/shanisma"}}'
      PLATFORMS: '{{.PLATFORMS | default "linux/amd64,linux/arm64"}}'
      TAG:
        sh: '[ -n "{{.TAG}}" ] && echo "{{.TAG}}" || echo "dirty-$(git rev-parse --short HEAD)"'
    cmds:
      - |
        # arm64 runs only the builder image's PlatformIO prewarm under QEMU
        # (Rust is cross-compiled): register the emulator when missing.
        [ -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ] || docker run --privileged --rm tonistiigi/binfmt --install arm64
      - '{{.G}} docker buildx build -f deploy/docker/Dockerfile --platform {{.PLATFORMS}} --target server -t {{.REGISTRY}}/pnex-server-rs:{{.TAG}} --push .'
      - '{{.G}} docker buildx build -f deploy/docker/Dockerfile --platform {{.PLATFORMS}} --target builder -t {{.REGISTRY}}/pnex-builder-rs:{{.TAG}} --push .'
      - echo "Published {{.REGISTRY}}/pnex-server-rs:{{.TAG}} and {{.REGISTRY}}/pnex-builder-rs:{{.TAG}}"

  app:up:
    desc: Run PNeX itself in containers (server + builder) on top of the infra — EDGE=1 puts the TLS edge in front
    cmds:
      - |
        # An active edge (edge.env present) must never be bypassed: a plain
        # compose up would recreate rauthy/pnex-server without the TLS
        # overrides (browser redirected to http://rauthy:8080).
        if [ -n "{{.EDGE}}" ] || [ -f deploy/edge/edge.env ]; then
          PNEX_EDGE_BACKEND=container bash deploy/edge/apply-edge.sh
        else
          docker compose -f compose.yaml -f compose.app.yaml up -d pnex-server pnex-builder
        fi

  app:down:
    desc: Stop the containerised pnex-server + pnex-builder
    cmds:
      - docker compose -f compose.yaml -f compose.app.yaml rm -sf pnex-server pnex-builder

  # ---------- Pi simulation VM (pnex-deploy installer tests) ----------
  # ARCH=arm64 (default for vm:up, faithful Pi, TCG) | amd64 (KVM, fast).
  # Extra script flags after `--`, e.g. `task vm:up ARCH=amd64 -- --usb 10c4:ea60`.

  vm:up:
    desc: Boot the Raspberry-Pi-like test VM (qemu + cloud-init) — ARCH=arm64|amd64
    cmds:
      - bash deploy/vm/up.sh --arch {{.ARCH | default "arm64"}} {{.CLI_ARGS}}

  vm:down:
    desc: Power the test VM off (disk kept) — ARCH to pick one when both run
    cmds:
      - bash deploy/vm/down.sh {{if .ARCH}}--arch {{.ARCH}}{{end}}

  vm:destroy:
    desc: Stop the test VM and delete its disk (downloaded base image kept)
    cmds:
      - bash deploy/vm/destroy.sh {{if .ARCH}}--arch {{.ARCH}}{{end}} {{.CLI_ARGS}}

  vm:ssh:
    desc: Shell into the test VM, or run a command after `--`
    interactive: true
    cmds:
      - bash deploy/vm/ssh.sh {{if .ARCH}}--arch {{.ARCH}}{{end}} {{.CLI_ARGS}}

  vm:install:
    desc: Run the pnex-deploy installer in the VM — SOURCE=local (../pnex-deploy checkout, default) | remote (GitHub one-liner); installer flags after `--`
    cmds:
      - bash deploy/vm/install-in-vm.sh {{if .ARCH}}--arch {{.ARCH}}{{end}} --source={{.SOURCE | default "local"}} {{if .CLI_ARGS}}-- {{.CLI_ARGS}}{{end}}

  build:
    desc: Full build (front + native workspace)
    deps: [build:frontend]
    cmds:
      - '{{.G}} cargo build --workspace'

  check:
    desc: Native + wasm32 cargo check (safeguard "never red")
    deps: [css:ensure, js:ensure]
    cmds:
      - '{{.G}} cargo check --workspace'
      - '{{.G}} cargo check -p pnex-core -p pnex-api-contract -p pnex-frontend --target wasm32-unknown-unknown'

  test:
    desc: Workspace tests
    deps: [css:ensure, js:ensure]
    cmds:
      - '{{.G}} cargo test --workspace'

  openapi:
    desc: Regenerate docs/contracts/openapi.json from the utoipa annotations (source of the SDKs)
    cmds:
      - 'UPDATE_OPENAPI=1 {{.G}} cargo test -p pnex-backend --test openapi'

  openapi:lint:
    desc: Lint docs/contracts/openapi.json with Redocly (rules and exceptions in docs/contracts/redocly.yaml)
    dir: docs/contracts
    cmds:
      - bunx @redocly/cli@2.0.8 lint openapi.json --config redocly.yaml

  sdk:
    desc: Generate and compile the TypeScript and Rust SDKs from docs/contracts/openapi.json → target/sdk/{ts,rust}
    cmds:
      - rm -rf target/sdk && mkdir -p target/sdk
      - bunx @hey-api/openapi-ts@0.80.1 -i docs/contracts/openapi.json -o target/sdk/ts -c @hey-api/client-fetch
      - bunx -p typescript@5.8.3 tsc --noEmit --strict --skipLibCheck --target es2022 --module nodenext --moduleResolution nodenext target/sdk/ts/index.ts
      # `file=Vec<u8>`: the rust generator maps binary bodies to PathBuf,
      # which reqwest cannot send (8 upload routes would not compile).
      - >-
        docker run --rm -u "$(id -u):$(id -g)" -v "{{.ROOT_DIR}}:/local"
        openapitools/openapi-generator-cli:v7.14.0 generate
        -i /local/docs/contracts/openapi.json -g rust -o /local/target/sdk/rust
        --additional-properties=packageName=pnex_sdk --type-mappings='file=Vec<u8>'
      # Own workspace root: the crate lives under this repo's workspace.
      - echo '[workspace]' >> target/sdk/rust/Cargo.toml
      - 'CARGO_TARGET_DIR=target/sdk/target {{.G}} cargo check --manifest-path target/sdk/rust/Cargo.toml'

  # ---------- Dev ----------

  dev:
    desc: Debug front + Loco server (build worker + ETL flow engine) — http://localhost:5150
    # cmds sequence (and not deps): go-task runs the cmds strictly
    # in order — dev:backend only starts once dev:frontend has
    # finished (dx build + copy to dist). As deps, a race window
    # killed the server at boot ("dist not found") when the wasm
    # recompiled more slowly than the native backend (observed 2026-09-12).
    cmds:
      - task: dev:frontend
      - task: dev:backend

  dev:frontend:
    desc: Debug build of the front into crates/pnex-frontend/dist (for Loco serving)
    deps: [css:build, js:build]
    # Same guard as build:frontend (checksum written before running → a
    # Ctrl-C during the wasm freezes the task as "up to date").
    method: timestamp
    sources:
      - crates/pnex-frontend/src/**/*
      # Fluent labels are embedded (include_str!): a locales change
      # must trigger the rebuild (observed 2026-09-12: .ftl fix
      # served stale because dev:frontend was "up to date").
      - crates/pnex-frontend/locales/**/*
      - crates/pnex-frontend/assets/**/*
      - crates/pnex-frontend/Dioxus.toml
      - crates/pnex-core/src/**/*
      # The stitcher (360° assembly) is statically linked into the front
      # binary: a change must trigger the rebuild (observed
      # 2026-09-10: fill_poles modified, task stayed "up to date").
      - crates/pnex-stitcher/src/**/*
      # The API contract is embedded by the front: a change must
      # trigger the rebuild (otherwise stale dist after a bump).
      - crates/pnex-api-contract/src/**/*
    generates:
      - "{{.FRONT_DIST}}/**/*"
    cmds:
      - rm -rf {{.DX_OUT}}/debug/web/public
      - cd crates/pnex-frontend && {{.G}} dx build --platform web
      - rm -rf {{.FRONT_DIST}}
      - cp -r {{.DX_OUT}}/debug/web/public {{.FRONT_DIST}}

  dev:backend:
    desc: Start the Loco backend (server + build worker + ETL flow engine — target used by task dev)
    # TLS edge (D70): when `task edge:up` is active, edge.env provides
    # RAUTHY_ISSUER_URL=https://<domain> (a missing file is ignored).
    dotenv: ['deploy/edge/edge.env']
    # The engine binary must exist before boot (default runtime_cmd
    # = ./target/debug/pnex-flow-runtime, see config/development.yaml).
    deps: [flow:build]
    # Toolchain pinned via the global vars PIO_CMD/ESPTOOL_CMD (shared
    # with the USB debug fw:* tasks). PNEX_FLOW_ENABLED=true: the flow
    # engine starts with the server — outside task dev, the default stays false
    # (config/development.yaml).
    env:
      PNEX_PIO_CMD: "{{.PIO_CMD}}"
      PNEX_ESPTOOL_CMD: "{{.ESPTOOL_CMD}}"
      PNEX_FLOW_ENABLED: "true"
      # Dev: default orgs on the Admin tier (unlimited) — the test
      # account is not capped by the Free quotas. Prod: variable unset →
      # Free (product behaviour unchanged).
      PNEX_DEFAULT_ORG_TIER: "Admin"
      # Dev: the scripted login account is a platform admin (D72: system
      # status + global O2 retention). Prod: unset → nobody is promoted.
      PNEX_PLATFORM_ADMIN_EMAILS: "admin@example.com"
      # Server-to-server calls to Rauthy (token, JWKS): local HTTP —
      # no self-signed certificate to validate, insensitive to DHCP.
      # The issuer seen by devices (HTTPS) is issuer_url in
      # development.yaml (RAUTHY_ISSUER_URL), aligned with the compose PUB_URL.
      RAUTHY_URL: "http://localhost:8080"
      # Platform browser (compose service browser, Chrome headless, D325).
      PNEX_BROWSER_URL: "http://127.0.0.1:9222"
    cmds:
      - '{{.G}} cargo build -p pnex-backend --bin pnex-server'
      - cd crates/pnex-backend && PNEX_GUARD_NO_LOCK=1 {{.G}} cargo run --bin pnex-server -- start --server-and-worker

  flow:build:
    desc: Compile the ETL flow runtime (pnex-flow-runtime) — launched by dev:backend
    cmds:
      - '{{.G}} cargo build -p pnex-flow-runtime'

  dev:backend:server-only:
    desc: Loco backend server only (no worker — the pg_loco_queue queue is not driven)
    cmds:
      - '{{.G}} cargo build -p pnex-backend --bin pnex-server'
      - cd crates/pnex-backend && PNEX_GUARD_NO_LOCK=1 {{.G}} cargo run --bin pnex-server -- start

  dev:hot:
    desc: Hot-reload front dev (dx :5151 + Tailwind watch) — Loco API on :5150 separately
    deps: [css:watch]
    cmds:
      - task: dev:hot:dx

  dev:hot:dx:
    desc: dx serve with hot-reload, API pointed at the Loco backend (:5150)
    env:
      # In hot dev the front is served by dx (:5151), not by Loco: the API
      # base URL becomes explicit (seam see api/config.rs). Dev CORS
      # on the Loco side see config/development.yaml.
      PNEX_API_BASE_URL: http://localhost:5150
    cmds:
      - cd crates/pnex-frontend && PNEX_GUARD_NO_LOCK=1 {{.G}} dx serve --platform web --port 5151

  # ---------- IoT firmware (USB debug) ----------
  # The WiFi/HOST/TOKEN/DEVICE_ID credentials are compiled into the firmware
  # (build_flags -D … of platformio.ini): "the settings are ok" on the
  # server side says nothing about the image actually flashed. The serial monitor
  # reveals it at boot ([WiFi] Connecting to <ssid>) — see
  # docs/architecture/firmware-build.md §2.1.

  fw:ports:
    desc: List the USB serial ports (identify the ESP — /dev/ttyUSB0, /dev/ttyACM0…)
    cmds:
      - "{{.PIO_CMD}} device list"

  fw:hil:
    desc: Pin self-test bench (D122) — flashes the bench firmware on the board, runs every pin × mode, writes firmware/hil/reports/<BOARD>.json — ex. task fw:hil BOARD=esp32-c3 PORT=/dev/ttyACM0 (NO_FLASH=1 to reuse the flashed bench)
    dir: "{{.FW_DIR}}"
    requires:
      vars: [BOARD, PORT]
    cmds:
      - uv run python hil/pnex_hil.py --board {{.BOARD}} --port {{.PORT}}{{if .NO_FLASH}} --no-flash{{end}}

  fw:monitor:
    desc: Serial monitor of the USB-connected ESP (115200 + platformio.ini filters) — e.g. task fw:monitor FIRMWARE=generic_esp8266 PORT=/dev/ttyUSB0
    dir: "{{.FW_DIR}}/{{.FIRMWARE}}"
    vars:
      FIRMWARE: generic_esp8266
    cmds:
      - "{{.PIO_CMD}} device monitor{{if .PORT}} --port {{.PORT}}{{end}}"

  # ---------- Database ----------

  db:up:
    desc: Start PostgreSQL 18 + Rauthy (IdP) + mailcrab (docker compose)
    cmds:
      - docker compose up -d

  db:down:
    desc: Stop the containers (data kept in the volume)
    cmds:
      - docker compose stop

  db:migrate:
    desc: Apply the SeaORM migrations (development)
    cmds:
      - cd crates/pnex-backend && {{.G}} cargo loco db migrate

  db:entities:
    desc: Regenerate the SeaORM entities from the schema (after a migration)
    cmds:
      - cd crates/pnex-backend && {{.G}} cargo loco db entities

  db:seed:
    desc: Idempotent seed of the global catalog (reuses the YAML fixtures)
    cmds:
      - cd crates/pnex-backend && {{.G}} cargo loco task seed

  db:reset:
    desc: "Recreate the database from scratch: drop, migrate, seed"
    cmds:
      - |
        docker exec pnex-postgres psql -U pnex -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'pnex' AND pid <> pg_backend_pid()" || true
        docker exec pnex-postgres psql -U pnex -d postgres -c "DROP DATABASE IF EXISTS pnex" -c "CREATE DATABASE pnex"
      - task: db:migrate
      - task: db:seed

  # ---------- Quality ----------

  fmt:
    desc: Format the workspace — rsx through the guarded dx fmt, then cargo fmt (docs/architecture/rsx-fmt.md)
    cmds:
      - python3 crates/pnex-frontend/scripts/rsx_fmt.py write
      - cargo fmt --all

  fmt:check:
    desc: Check formatting without touching any file (same gate as CI)
    cmds:
      - cargo fmt --all -- --check
      - python3 crates/pnex-frontend/scripts/rsx_fmt.py check

  lint:english:
    desc: No French in code comments and messages, on the lines added since main (same gate as CI job `english`)
    cmds:
      - python3 scripts/english_guard.py selftest
      - python3 scripts/english_guard.py diff {{.BASE | default "origin/main"}}
      - python3 scripts/english_guard.py diff

  lint:english:report:
    desc: French left in code comments and messages, whole repo, per directory (audit)
    cmds:
      - python3 scripts/english_guard.py report

  graph:update:
    desc: Rebuild the graphify code graph from scratch, keep the semantic layer, drop name-guessed calls (scripts/graphify_clean.py)
    cmds:
      - mv graphify-out/graph.json graphify-out/graph.prev.json
      - graphify update . --force
      - python3 scripts/graphify_clean.py graphify-out/graph.prev.json
      - graphify cluster-only . --no-viz
      - rm graphify-out/graph.prev.json

  # ---------- End-to-end UI tests (e2e/, Playwright) ----------
  # Run against a live stack (task app:up, or task dev). Extra Playwright
  # flags after `--`, e.g. `task e2e -- --grep @flows --headed`.

  e2e:install:
    desc: Install the e2e suite dependencies and its Chromium build
    dir: e2e
    cmds:
      - bun install --frozen-lockfile
      - bunx playwright install chromium

  e2e:
    desc: Run the end-to-end UI suite against the running stack (e2e/README.md)
    dir: e2e
    cmds:
      - bunx playwright test {{.CLI_ARGS}}

  e2e:smoke:
    desc: Every route renders, both locales (fast sanity pass)
    dir: e2e
    cmds:
      - bunx playwright test --grep @smoke {{.CLI_ARGS}}

  e2e:hardware:
    desc: Tests needing boards on serial ports (PNEX_E2E_C3_PORT / PNEX_E2E_CAM_PORT, see e2e/README.md)
    dir: e2e
    cmds:
      - bunx playwright test --grep @hardware --workers=1 {{.CLI_ARGS}}

  e2e:android:
    desc: Native Android suite on the adb device (builds + installs the e2e APK; e2e/README.md "Android")
    dir: e2e
    cmds:
      - task: build:frontend:android:e2e
      - adb install -r {{.ROOT_DIR}}/{{.DX_OUT}}/pnex-e2e.apk
      - bunx playwright test -c playwright.android.config.ts {{.CLI_ARGS}}

  e2e:linux:
    desc: Native Linux desktop suite through WebKitWebDriver (builds the e2e app; apt webkit2gtk-driver; e2e/README.md "Linux")
    dir: e2e
    cmds:
      - task: build:frontend:linux:e2e
      - bunx playwright test -c playwright.linux.config.ts {{.CLI_ARGS}}

  lint:
    desc: Clippy on the whole workspace
    deps: [css:ensure]
    cmds:
      - '{{.G}} cargo clippy --workspace -- -D warnings'

  security:deps:
    desc: Dependency gate — RustSec advisories + crate sources (deny.toml, same gate as CI job `deny`)
    cmds:
      - cargo deny check advisories sources

  laya:bundle:
    desc: Build the Laya multilingual decision bundle for the text-decide node (D197) — OUT=dir (default data/decide/laya-ml); offline tooling (uv + torch CPU), PneX itself never runs Python
    vars:
      OUT: '{{.OUT | default "data/decide/laya-ml"}}'
      # Pinned checkpoint revision (Q15: never follow main).
      REV: 7b928d828b7b0e022f929d9bd2e44165aa270148
      WORK: '{{.WORK | default "/tmp/pnex-laya-export"}}'
    cmds:
      - mkdir -p {{.WORK}}/ckpt/encoder {{.WORK}}/ckpt/tokenizer {{.OUT}}
      - |
        set -eu
        base=https://huggingface.co/convaiinnovations/laya/resolve/{{.REV}}
        for f in rl_common.py multilingual/encoder/config.json multilingual/rl_agent_config.json \
                 multilingual/tokenizer/tokenizer.json multilingual/tokenizer/tokenizer_config.json \
                 multilingual/model.safetensors; do
          curl -sfL -o "{{.WORK}}/ckpt/${f#multilingual/}" "$base/$f"
        done
      - uv venv -q -p 3.12 {{.WORK}}/venv
      - uv pip install -q -p {{.WORK}}/venv/bin/python --index-url https://download.pytorch.org/whl/cpu torch
      - uv pip install -q -p {{.WORK}}/venv/bin/python transformers safetensors onnx onnxscript onnxruntime numpy
      - scripts/guarded.sh {{.WORK}}/venv/bin/python -I scripts/laya/export_onnx.py {{.WORK}}/ckpt {{.OUT}}
      - echo "bundle ready in {{.OUT}} — set PNEX_DECIDE_MODEL_DIR to its absolute path"

  # ---------- Local disk cleanup (dev only) ----------

  tools:sweep:
    desc: Install cargo-sweep (local dev tool, not a workspace dependency)
    status:
      - command -v cargo-sweep
    cmds:
      - cargo install cargo-sweep --locked

  clean:
    desc: Sweep target/ artifacts unused for DAYS days (default 3) + artifacts from uninstalled toolchains — DRY=1 to preview
    deps: [tools:sweep]
    vars:
      DAYS: '{{.DAYS | default "3"}}'
    cmds:
      - df -h . | tail -1
      - cargo sweep {{if .DRY}}--dry-run {{end}}--time {{.DAYS}}
      - cargo sweep {{if .DRY}}--dry-run {{end}}--installed
      - df -h . | tail -1

  clean:incremental:
    desc: Drop every incremental cache under target/ (biggest quick win, next build is a bit slower)
    cmds:
      - du -sh target/*/incremental target/*/*/incremental 2>/dev/null || true
      - rm -rf target/*/incremental target/*/*/incremental
      - df -h . | tail -1

  clean:size:
    desc: Remove the oldest target/ artifacts until it fits under MAX (default 60GB) — DRY=1 to preview
    deps: [tools:sweep]
    cmds:
      - cargo sweep {{if .DRY}}--dry-run {{end}}--maxsize {{.MAX | default "60GB"}}
      - du -sh target
