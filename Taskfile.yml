version: '3'

env:
  FRONT_DIST: crates/pnex-frontend/dist
  DX_OUT: target/dx/pnex-frontend

includes:
  # Tâches propres au firmware (image Docker pio-builder, requirements) —
  # `task firmware:build-docker`, `task firmware:gen-requirements`.
  # dir explicite : docker build doit avoir firmware/ comme context.
  firmware:
    taskfile: ./firmware/Taskfile.yml
    dir: ./firmware

# Firmware convergé dans le monorepo (firmware/) + toolchain épinglée sur
# son venv quand il existe (sinon `pio` du PATH — installation
# potentiellement divergente : cf. docs/observations.md O7). Utilisée par
# dev:backend et les tâches fw:*.
vars:
  FW_DIR: firmware
  PIO_CMD:
    sh: test -x "firmware/.venv/bin/pio" && echo "firmware/.venv/bin/pio" || echo pio
  ESPTOOL_CMD:
    sh: test -x "firmware/.venv/bin/esptool" && echo "firmware/.venv/bin/esptool" || echo esptool

tasks:
  default:
    desc: Aperçu des tâches
    cmds:
      - task --list

  # ---------- Build ----------

  build:frontend:
    desc: Build le front Dioxus (wasm, release) et le copie dans crates/pnex-frontend/dist
    deps: [css:build, js:build]
    sources:
      - crates/pnex-frontend/src/**/*
      - crates/pnex-frontend/assets/**/*
      - crates/pnex-frontend/Dioxus.toml
      - crates/pnex-core/src/**/*
    generates:
      - "{{.FRONT_DIST}}/**/*"
    cmds:
      # Vide la sortie dx (les assets hashés des builds précédents s'y accumulent)
      - rm -rf {{.DX_OUT}}/release/web/public
      - cd crates/pnex-frontend && dx build --platform web --release
      - rm -rf {{.FRONT_DIST}}
      - cp -r {{.DX_OUT}}/release/web/public {{.FRONT_DIST}}

  # ---------- CSS (Tailwind v4) ----------

  css:build:
    desc: Génère crates/pnex-frontend/assets/tailwind.css (requis avant tout build dx)
    dir: crates/pnex-frontend
    cmds:
      - npm run css:build

  css:ensure:
    desc: Garantit l'existence de assets/tailwind.css (stub) — la macro asset!() l'exige à la compilation
    cmds:
      # Le CSS réel est gitignoré (généré par css:build) : sans ce stub, tout
      # fresh clone casse sur cargo check/test/clippy (asset! ne trouve pas le
      # fichier). Le dossier assets/ n'existe pas non plus dans un clone frais
      # (aucun fichier tracké). N'écrase jamais le CSS réel s'il existe.
      - mkdir -p crates/pnex-frontend/assets
      - test -f crates/pnex-frontend/assets/tailwind.css || printf '/* Stub — CSS reel genere par task css:build (npm) */\n' > crates/pnex-frontend/assets/tailwind.css

  css:watch:
    desc: Regénère le CSS Tailwind à la volée (à lancer à côté de dev:hot)
    dir: crates/pnex-frontend
    cmds:
      - npm run css:watch

  # ---------- JS (flash navigateur esptool-js) ----------

  js:build:
    desc: Bundle assets/flasher.js (glue esptool-js, esbuild IIFE — requis avant tout build dx)
    dir: crates/pnex-frontend
    cmds:
      - npm run js:build

  js:ensure:
    desc: Garantit l'existence de assets/flasher.js (stub) — la macro asset!() l'exige à la compilation
    cmds:
      # Même garde que css:ensure : le bundle réel est gitignoré (généré par
      # js:build) et sans stub tout fresh clone casse sur cargo check/test.
      # N'écrase jamais le bundle réel s'il existe.
      - mkdir -p crates/pnex-frontend/assets
      - test -f crates/pnex-frontend/assets/flasher.js || printf '/* Stub — bundle reel genere par task js:build (npm) */\n' > crates/pnex-frontend/assets/flasher.js

  build:
    desc: Build complet (front + workspace natif)
    deps: [build:frontend]
    cmds:
      - cargo build --workspace

  check:
    desc: cargo check natif + wasm32 (garde-fou « jamais de rouge »)
    deps: [css:ensure, js:ensure]
    cmds:
      - cargo check --workspace
      - cargo check -p pnex-core -p pnex-frontend --target wasm32-unknown-unknown

  test:
    desc: Tests du workspace
    deps: [css:ensure, js:ensure]
    cmds:
      - cargo test --workspace

  # ---------- Dev ----------

  dev:
    desc: Front debug + serveur Loco avec worker de builds (http://localhost:5150)
    deps: [dev:frontend]
    cmds:
      - task: dev:backend

  dev:frontend:
    desc: Build debug du front vers crates/pnex-frontend/dist (pour serving Loco)
    deps: [css:build, js:build]
    sources:
      - crates/pnex-frontend/src/**/*
      - crates/pnex-frontend/assets/**/*
      - crates/pnex-frontend/Dioxus.toml
      - crates/pnex-core/src/**/*
    generates:
      - "{{.FRONT_DIST}}/**/*"
    cmds:
      - rm -rf {{.DX_OUT}}/debug/web/public
      - cd crates/pnex-frontend && dx build --platform web
      - rm -rf {{.FRONT_DIST}}
      - cp -r {{.DX_OUT}}/debug/web/public {{.FRONT_DIST}}

  dev:backend:
    desc: Démarre le backend Loco (serveur + worker de builds — cible utilisée par task dev)
    # Toolchain épinglée via les vars globales PIO_CMD/ESPTOOL_CMD (partagée
    # avec les tâches fw:* de debug USB).
    env:
      PNEX_PIO_CMD: "{{.PIO_CMD}}"
      PNEX_ESPTOOL_CMD: "{{.ESPTOOL_CMD}}"
    cmds:
      - cd crates/pnex-backend && cargo run --bin pnex-server -- start --server-and-worker

  dev:backend:server-only:
    desc: Backend Loco serveur seul (sans worker — la queue pg_loco_queue n'est pas drivée)
    cmds:
      - cd crates/pnex-backend && cargo run --bin pnex-server -- start

  dev:hot:
    desc: Dev front hot-reload (dx :5151 + Tailwind watch) — API Loco sur :5150 à part
    deps: [css:watch]
    cmds:
      - task: dev:hot:dx

  dev:hot:dx:
    desc: dx serve avec hot-reload, API pointée sur le backend Loco (:5150)
    env:
      # En dev hot le front est servi par dx (:5151), pas par Loco : l'URL de
      # base de l'API devient explicite (seam cf. api/config.rs). CORS dev
      # côté Loco cf. config/development.yaml.
      PNEX_API_BASE_URL: http://localhost:5150
    cmds:
      - cd crates/pnex-frontend && dx serve --platform web --port 5151

  # ---------- Firmware IoT (debug USB) ----------
  # Les identifiants WiFi/HOST/TOKEN/DEVICE_ID sont compilés dans le firmware
  # (build_flags -D … de platformio.ini) : « les paramètres sont ok » côté
  # serveur ne dit rien de l'image réellement flashée. Le monitor série le
  # révèle au boot ([WiFi] Connecting to <ssid>) — cf.
  # docs/architecture/firmware-build.md §2.1.

  fw:ports:
    desc: Liste les ports série USB (identifier l'ESP — /dev/ttyUSB0, /dev/ttyACM0…)
    cmds:
      - "{{.PIO_CMD}} device list"

  fw:monitor:
    desc: Monitor série de l'ESP branché en USB (115200 + filtres de platformio.ini) — ex. task fw:monitor FIRMWARE=4_chan_relay PORT=/dev/ttyUSB0
    dir: "{{.FW_DIR}}/{{.FIRMWARE}}"
    vars:
      FIRMWARE: soil_sensor
    cmds:
      - "{{.PIO_CMD}} device monitor{{if .PORT}} --port {{.PORT}}{{end}}"

  fw:flash:
    desc: Recompile + flash USB puis monitor — identifiants passés en env (WIFI_SSID, WIFI_PASSWORD, HOST, TOKEN, DEVICE_ID, ENCRYPTION_KEY — les 6 en base64, WS_SSL true/false)
    dir: "{{.FW_DIR}}/{{.FIRMWARE}}"
    vars:
      FIRMWARE: soil_sensor
    cmds:
      - |
        missing=0
        for v in WIFI_SSID WIFI_PASSWORD HOST TOKEN DEVICE_ID ENCRYPTION_KEY; do
          eval "val=\${$v}"
          [ -n "$val" ] || { echo "MANQUANT : $v"; missing=1; }
        done
        if [ "$missing" -ne 0 ]; then
          echo "Les identifiants sont compilés dans le firmware ; sans eux l'SSID est vide et le WiFi ne se connecte jamais."
          echo "Les 6 variables sont en BASE64 (un SSID littéral avec espaces casserait le flag -D). Exemple :"
          echo '  export WIFI_SSID=$(echo -n "Chez Shan" | base64) WIFI_PASSWORD=$(echo -n <mdp> | base64)'
          echo '  export HOST=$(echo -n dev1.pnex.io | base64) TOKEN=$(echo -n <token> | base64) DEVICE_ID=$(echo -n <device_id> | base64)'
          echo '  export ENCRYPTION_KEY=$(psql "postgres://pnex:pnex@localhost:5432/pnex" -t -A -c "SELECT encryption_key FROM device_tokens WHERE device_registry_id=(SELECT id FROM device_registries WHERE device_id='"'"'<device_id>'"'"') AND is_active")'
          echo '  export WS_SSL=false  # ws:// en local, true pour wss://'
          echo 'Sans ENCRYPTION_KEY, les frames partent en clair et le serveur les rejette (device jamais actif).'
          exit 1
        fi
        {{.PIO_CMD}} run --target upload
        {{.PIO_CMD}} device monitor
  # ---------- Base de données ----------

  db:up:
    desc: Démarre PostgreSQL 18 + Keycloak 26 (docker compose)
    cmds:
      - docker compose up -d

  db:down:
    desc: Stoppe les conteneurs (données conservées dans le volume)
    cmds:
      - docker compose stop

  db:migrate:
    desc: Applique les migrations SeaORM (développement)
    cmds:
      - cd crates/pnex-backend && cargo loco db migrate

  db:entities:
    desc: Régénère les entities SeaORM depuis le schéma (après migration)
    cmds:
      - cd crates/pnex-backend && cargo loco db entities

  db:seed:
    desc: Seed idempotent du catalogue global (fixtures YAML Django)
    cmds:
      - cd crates/pnex-backend && cargo loco task seed

  db:reset:
    desc: "Recrée la base from scratch : drop, migrate, seed"
    cmds:
      - |
        docker exec pnex-postgres psql -U pnex -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'pnex' AND pid <> pg_backend_pid()" || true
        docker exec pnex-postgres psql -U pnex -d postgres -c "DROP DATABASE IF EXISTS pnex" -c "CREATE DATABASE pnex"
      - task: db:migrate
      - task: db:seed

  # ---------- Qualité ----------

  lint:
    desc: Clippy sur tout le workspace
    deps: [css:ensure]
    cmds:
      - cargo clippy --workspace -- -D warnings
