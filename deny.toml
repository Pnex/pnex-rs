# cargo-deny — dependency gate (CI job `deny`, `task security:deps`).
# Policy: docs/architecture/security.md §5. Every `ignore` entry carries the
# reason it is not exploitable here and is re-checked at each security audit.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # rsa (Marvin, timing on PKCS#1 v1.5 decryption) via loco-rs → jsonwebtoken.
    # We only verify RS256 signatures with Rauthy's public keys, and sqlx-mysql
    # encrypts a password with the server's public key: no private-key operation
    # (the Marvin timing attack needs one) runs in the process. MySQL connectors
    # also require TLS, so that path is never taken (connectors.md D792). No fixed
    # release upstream.
    { id = "RUSTSEC-2023-0071", reason = "public-key operations only, MySQL under TLS, no fix upstream" },
    # Unmaintained, no vulnerability, no maintained drop-in upstream.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained (edgelinkd / flow nodes)" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr unmaintained (edgelinkd / flow nodes)" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill unmaintained (starlark)" },
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained (starlark)" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained (starlark)" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained (simba / augurs)" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained (async-imap 0.12, its latest release)" },
    # unsafe-libyaml only via loco-rs (serde_yaml_ng: operator config files) and
    # rrgen (code generator). Our own YAML parsing, incl. user-uploaded ontology
    # packs, uses serde-saphyr (safe Rust).
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained (loco-rs config / rrgen), no untrusted input" },
    # crypto-bigint 0.5.5 (timing branches in constant-time arithmetic, fixed
    # in 0.7.6 only) comes through jsonwebtoken 10 → p256 / p384 0.13. We only
    # verify RS256 tokens with Rauthy's public key: the elliptic-curve code
    # never runs on a secret. Drop when jsonwebtoken moves to the next
    # RustCrypto curves.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via jsonwebtoken EC curves, unused on secrets (RS256 verify only)" },
    # libsqlite3-sys 0.30 (bundled SQLite < 3.54: stale page-cache bytes when a
    # crafted -wal file sits next to the database), only in pnex-mirror, which
    # opens the mirror file it writes itself; the server links no SQLite since
    # loco-rs 1.3. The fixed 0.39 cannot be locked: sqlx-sqlite 0.9, an
    # optional dependency of sqlx, still caps it below 0.38 and cargo checks
    # `links` across optional dependencies. Drop when sqlx allows 0.39.
    { id = "RUSTSEC-2026-0459", reason = "SQLite wal page-size bug: no SQLite file from a less trusted party is opened; sqlx pins 0.30" },
    # zip < 9 flaws in `extract()` (SUID bits, symlink escape and permissions,
    # abort on a large symlink), same zip 2 in the same build script (SEC-42).
    { id = "RUSTSEC-2026-0367", reason = "zip 2 in sherpa-onnx-sys build script only (SEC-42)" },
    { id = "RUSTSEC-2026-0368", reason = "zip 2 in sherpa-onnx-sys build script only (SEC-42)" },
    { id = "RUSTSEC-2026-0369", reason = "zip 2 in sherpa-onnx-sys build script only (SEC-42)" },
    { id = "RUSTSEC-2026-0429", reason = "zip 2 in sherpa-onnx-sys build script only (SEC-42)" },
    # quick-xml 0.39 in object_store 0.13, pinned by DataFusion 55: it parses the
    # answers of our own S3, never a user file. Remove when DataFusion moves to
    # object_store 0.14, which fixes it (data-pipelines.md §9.8).
    { id = "RUSTSEC-2026-0194", reason = "quick-xml in object_store 0.13, S3 answers only" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml in object_store 0.13, S3 answers only" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained (unic-langid macros, build time)" },
]

[bans]
multiple-versions = "allow"

[sources]
# Only crates.io; vendored forks go through `path =` (vendor/patches).
unknown-registry = "deny"
unknown-git = "deny"
