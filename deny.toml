# cargo-deny — dependency gate (CI job `deny`, `task security:deps`).
# Policy: docs/architecture/security.md §5. Every `ignore` entry carries the
# reason it is not exploitable here and is re-checked at each security audit.

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # rsa (Marvin, timing on PKCS#1 v1.5 decryption) via loco-rs → jsonwebtoken.
    # We only verify RS256 signatures with Rauthy's public keys: no private-key
    # operation runs in the process. No fixed release upstream.
    { id = "RUSTSEC-2023-0071", reason = "public-key verification only, no fix upstream" },
    # Unmaintained, no vulnerability, no maintained drop-in upstream.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained (edgelinkd / flow nodes)" },
    { id = "RUSTSEC-2026-0215", reason = "smallstr unmaintained (edgelinkd / flow nodes)" },
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill unmaintained (starlark)" },
    { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained (starlark)" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained (starlark)" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained (simba / augurs)" },
    # unsafe-libyaml only via loco-rs (serde_yaml_ng: operator config files) and
    # rrgen (code generator). Our own YAML parsing, incl. user-uploaded ontology
    # packs, uses serde-saphyr (safe Rust).
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained (loco-rs config / rrgen), no untrusted input" },
    # zip < 9 extraction flaws (SUID bits kept, symlinks escaping the target,
    # permissions applied through symlinks): all in `extract()` to disk. Our
    # own code is on zip 9; what remains is zip 8.6 via calamine 0.36.1 (xlsx
    # read in memory, never extracted to disk). Drop when calamine moves to 9.
    { id = "RUSTSEC-2026-0367", reason = "zip 8 via calamine, extract() never called (SEC-42)" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8 via calamine, extract() never called (SEC-42)" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8 via calamine, extract() never called (SEC-42)" },
    # crypto-bigint 0.5.5 (timing branches in constant-time arithmetic, fixed
    # in 0.7.6 only) comes through jsonwebtoken 10 → p256 / p384 0.13. We only
    # verify RS256 tokens with Rauthy's public key: the elliptic-curve code
    # never runs on a secret. Drop when jsonwebtoken moves to the next
    # RustCrypto curves.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 via jsonwebtoken EC curves, unused on secrets (RS256 verify only)" },
    # zstd 0.13 / zstd-safe 7 (stream state reused, Vec length, legacy frame
    # memory) only through zip 2 in the build script of sherpa-onnx-sys 1.13,
    # which unpacks sherpa's own release archive: never linked in a binary,
    # never fed untrusted data. Our runtime zstd is 0.14.3 / 8.2. Drop when
    # sherpa-onnx moves to 2.x (zip 9).
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 in sherpa-onnx-sys build script only (SEC-54)" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 in sherpa-onnx-sys build script only (SEC-54)" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 in sherpa-onnx-sys build script only (SEC-54)" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained (unic-langid macros, build time)" },
]

[bans]
multiple-versions = "allow"

[sources]
# Only crates.io; vendored forks go through `path =` (vendor/patches).
unknown-registry = "deny"
unknown-git = "deny"
