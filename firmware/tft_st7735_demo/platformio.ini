; Standalone demo: ESP32-WROOM (devkit) + 1.77" SPI TFT (ST7735, 160x128).
[env:esp32-wroom-tft]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; CP2102 drop packets at 921600 on this setup
upload_speed = 115200
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit GFX Library@^1.12.2
