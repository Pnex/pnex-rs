; Generic ESP32-CAM firmware (AI-Thinker, OV2640 + 4 MB PSRAM) — the
; generic_esp32 pin_slave profile plus the PneX camera module
; (camera-video.md D77). Built per device by the server builder, exactly
; like generic_esp32 (contract docs/architecture/firmware-build.md §2.1).
; Manual build: PNEX_PIO_BOARD=esp32cam PNEX_BOARD_NAME=esp32cam-ai-thinker
; plus the usual env (see generic_esp32/platformio.ini).
[env:esp32cam]
platform = espressif32
; Frozen board of the device (migration 000029), injected by the builder.
board = ${sysenv.PNEX_PIO_BOARD}
framework = arduino
monitor_speed = 115200
; Two 1.9 MB OTA slots: default.csv (1.3 MB) is too tight for camera + TLS
; + screens (D77).
board_build.partitions = min_spiffs.csv
build_flags =
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -D HOST=\"${sysenv.HOST}\"
    -D TOKEN=\"${sysenv.TOKEN}\"
    -D DEVICE_ID=\"${sysenv.DEVICE_ID}\"
    -D ENCRYPTION_KEY=\"${sysenv.ENCRYPTION_KEY}\"
    ; Root pinned for wss/https (base64 PEM, pnex_tls) — empty = never connects.
    -D PNEX_CA_CERT=\"${sysenv.PNEX_CA_CERT}\"
    ; Ed25519 public key (hex) of the server signing OTA images (SEC-18).
    -D PNEX_OTA_PUBKEY=\"${sysenv.PNEX_OTA_PUBKEY}\"
    ; TLS client certificate + key of this device, base64 PEM (D153).
    -D PNEX_CLIENT_CERT=\"${sysenv.PNEX_CLIENT_CERT}\"
    -D PNEX_CLIENT_KEY=\"${sysenv.PNEX_CLIENT_KEY}\"
    ; Announce identity (lib PneX) — board declared to the server (variant).
    -D PNEX_BOARD_NAME=\"${sysenv.PNEX_BOARD_NAME}\"
    ; Firmware version (OTA): stamped by the builder (build record id).
    -D PNEX_FW_VERSION=\"${sysenv.PNEX_FW_VERSION}\"
    ; OTA support: consumes ServerMsg::OtaAvailable, announces the `ota` cap.
    -D PNEX_OTA_ENABLE=1
    ; Camera module (pnex_camera.cpp): esp_camera + second WS /ws/camera,
    ; announces the `camera` cap, consumes ServerMsg::CameraConfig.
    -D PNEX_CAMERA_ENABLE=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Debug screen — the 9 vars are ALWAYS pushed by the builder (kind gates
    ; 0/1, role pins gpio or -1). The AI-Thinker profile declares no screen,
    ; so they stay 0/-1 in practice.
    -D PNEX_SCREEN_SSD1306=${sysenv.PNEX_SCREEN_SSD1306}
    -D PNEX_SCREEN_ST7735=${sysenv.PNEX_SCREEN_ST7735}
    -D PNEX_SCREEN_SDA=${sysenv.PNEX_SCREEN_SDA}
    -D PNEX_SCREEN_SCL=${sysenv.PNEX_SCREEN_SCL}
    -D PNEX_SCREEN_SCK=${sysenv.PNEX_SCREEN_SCK}
    -D PNEX_SCREEN_MOSI=${sysenv.PNEX_SCREEN_MOSI}
    -D PNEX_SCREEN_CS=${sysenv.PNEX_SCREEN_CS}
    -D PNEX_SCREEN_DC=${sysenv.PNEX_SCREEN_DC}
    -D PNEX_SCREEN_RST=${sysenv.PNEX_SCREEN_RST}
lib_extra_dirs =
    ../common_libs
    ../lib
lib_deps =
    SPI
    Update
    Wire
    densaugeo/base64@^1.4.0
    bblanchon/ArduinoJson@^7.0.4
    olikraus/U8g2@^2.35.19
    adafruit/Adafruit GFX Library@^1.12.2
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
