; PneX pin self-test bench firmware (D122, docs/architecture/pin-selftest.md).
; Offline: no WiFi/server/device config. Driven by firmware/hil/pnex_hil.py,
; which sets PNEX_PIO_BOARD / PNEX_BOARD_NAME from the catalog board and
; picks the env from its SoC. Manual build:
;   PNEX_PIO_BOARD=nodemcuv2 PNEX_BOARD_NAME=esp8266 uv run pio run -d selftest -e esp8266

[selftest]
build_flags =
    -D PNEX_TEST_MODE=1
    -D PNEX_BOARD_NAME=\"${sysenv.PNEX_BOARD_NAME}\"
    -D PNEX_FW_VERSION=\"selftest\"
lib_extra_dirs =
    ../common_libs
    ../lib
lib_deps =
    SPI
    Wire
    densaugeo/base64@^1.4.0
    bblanchon/ArduinoJson@^7.0.4
    olikraus/U8g2@^2.35.19
    adafruit/Adafruit GFX Library@^1.12.2
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4

[env:esp8266]
platform = espressif8266
board = ${sysenv.PNEX_PIO_BOARD}
framework = arduino
monitor_speed = 115200
build_flags = ${selftest.build_flags}
lib_extra_dirs = ${selftest.lib_extra_dirs}
lib_deps = ${selftest.lib_deps}

[env:esp32]
platform = espressif32
board = ${sysenv.PNEX_PIO_BOARD}
framework = arduino
monitor_speed = 115200
build_flags = ${selftest.build_flags}
lib_extra_dirs = ${selftest.lib_extra_dirs}
lib_deps =
    ${selftest.lib_deps}
    Update

[env:esp32c3]
platform = espressif32
board = ${sysenv.PNEX_PIO_BOARD}
framework = arduino
monitor_speed = 115200
; Console on the native USB-CDC port (same as generic_esp32c3).
build_flags =
    ${selftest.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_extra_dirs = ${selftest.lib_extra_dirs}
lib_deps =
    ${selftest.lib_deps}
    Update

[env:esp32s3]
platform = espressif32
board = ${sysenv.PNEX_PIO_BOARD}
framework = arduino
monitor_speed = 115200
; Console on the native USB-CDC port (same as generic_esp32s3).
build_flags =
    ${selftest.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_extra_dirs = ${selftest.lib_extra_dirs}
lib_deps =
    ${selftest.lib_deps}
    Update

[env:esp32c6]
; The C6 needs Arduino core 3.x (ESP-IDF 5): pioarduino platform, pinned.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = ${sysenv.PNEX_PIO_BOARD}
framework = arduino
monitor_speed = 115200
; Console on the native USB-CDC port (same as generic_esp32c6).
build_flags =
    ${selftest.build_flags}
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
lib_extra_dirs = ${selftest.lib_extra_dirs}
lib_deps =
    ${selftest.lib_deps}
    Update
