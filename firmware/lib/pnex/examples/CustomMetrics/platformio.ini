; PneX custom firmware example (custom metrics + commands, D87/D88).
; Inside PneX the firmware IDE generates this project (board, secrets as
; b64 defines, pinned catalog libraries) — this copy is for manual builds.
; The library resolves locally through lib_extra_dirs.
[env:custom_metrics]
platform = espressif8266   ; espressif32 for ESP32 / ESP32-C3 / ESP32-S3
board = nodemcuv2          ; the PIO id of YOUR board (esp32dev, …)
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../..
; build_flags (generated by PneX with your values):
; build_flags =
;     -D WIFI_SSID="<b64>"
;     -D WIFI_PASSWORD="<b64>"
;     -D HOST="<b64>"
;     -D TOKEN="<b64>"
;     -D DEVICE_ID="<b64>"
;     -D ENCRYPTION_KEY="<b64>"
;     -D WS_SSL="true"
lib_deps =
    SPI
    Wire
    bblanchon/ArduinoJson@^7.0.4
    densaugeo/base64@^1.4.0
