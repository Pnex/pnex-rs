; Exemple « device custom » PNeX (Tier 2) — projet complet copié-collable.
; En production, l'UI PNeX génère ce fichier avec vos secrets préremplis
; (defines b64 — contrat docs/architecture/firmware-build.md §2.1) et le
; lib_deps du registre :
;     lib_deps = Pnex/PneX@^1.0.0
;
; Ici (dans le monorepo), la lib est résolue en local via lib_extra_dirs.
[env:custom_device]
platform = espressif8266   ; espressif32 pour ESP32 / ESP32-C3
board = nodemcuv2          ; l'id PIO de VOTRE carte (esp32dev, seeed_xiao_esp32c3, …)
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../..
; build_flags (générés par l'UI avec vos valeurs) :
; build_flags =
;     -D WIFI_SSID="<b64>"
;     -D WIFI_PASSWORD="<b64>"
;     -D HOST="<b64>"
;     -D TOKEN="<b64>"
;     -D DEVICE_ID="<b64>"
;     -D ENCRYPTION_KEY="<b64>"
;     -D WS_SSL="true"
;     -D ARDUINO_USB_CDC_ON_BOOT=1   ; ESP32-C3 only (log sur USB)
;     -D ARDUINO_USB_MODE=1          ; ESP32-C3 only
lib_deps =
    SPI
    Wire
    bblanchon/ArduinoJson@^7.0.4
    gilmaimon/ArduinoWebsockets@^0.5.4
    densaugeo/base64@^1.4.0
