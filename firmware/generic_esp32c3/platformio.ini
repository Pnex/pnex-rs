[env:esp32c3]
platform = espressif32
; Board de la variante figée du device (migration 000029) — injectée par le
; builder via PNEX_PIO_BOARD. Build manuel : `PNEX_PIO_BOARD=seeed_xiao_esp32c3
; PNEX_BOARD_NAME=xiao_esp32c3 pio run`.
board = ${sysenv.PNEX_PIO_BOARD}
framework = arduino
monitor_speed = 115200
; Décision 2026-09-02 : le « générique » est compilé PAR DEVICE — config
; (WiFi/hôte/token/device_id) injectée en env du sous-process `pio run`
; (base64 via child_env, parité generic_esp8266/soil_sensor). Plus de
; secteur PNEXCFG1.
build_flags =
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -D HOST=\"${sysenv.HOST}\"
    -D TOKEN=\"${sysenv.TOKEN}\"
    -D DEVICE_ID=\"${sysenv.DEVICE_ID}\"
    -D ENCRYPTION_KEY=\"${sysenv.ENCRYPTION_KEY}\"
    -D WS_SSL=\"${sysenv.WS_SSL}\"
    ; Root pinned for wss/https (base64 PEM, pnex_tls) — injected by the
    ; builder from the TLS edge (D70); empty = setInsecure.
    -D PNEX_CA_CERT=\"${sysenv.PNEX_CA_CERT}\"
    ; Ed25519 public key (hex) of the server signing OTA images (SEC-18).
    -D PNEX_OTA_PUBKEY=\"${sysenv.PNEX_OTA_PUBKEY}\"
    ; TLS client certificate + key of this device, base64 PEM (D153).
    -D PNEX_CLIENT_CERT=\"${sysenv.PNEX_CLIENT_CERT}\"
    -D PNEX_CLIENT_KEY=\"${sysenv.PNEX_CLIENT_KEY}\"
    ; USB-CDC sur le port USB-JTAG/serial natif (ttyACM0) — sinon Serial
    ; part sur UART0 (pads D6/D7) et le moniteur USB reste muet.
    ; NB variante : une carte C3 avec pont UART (pas d'USB natif) garde
    ; ARDUINO_USB_CDC_ON_BOOT=1 → Serial muet sur ce pont ; à traiter au
    ; cas par cas si une telle variante C3 rejoint le catalogue.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    ; Identité announce (lib PneX) — board déclaré au serveur (variante).
    -D PNEX_BOARD_NAME=\"${sysenv.PNEX_BOARD_NAME}\"
    ; Firmware version (OTA): stamped by the builder (build record id),
    ; announced back by the device — also the versioned OTA artifact key.
    -D PNEX_FW_VERSION=\"${sysenv.PNEX_FW_VERSION}\"
    ; OTA support: consumes ServerMsg::OtaAvailable and announces the
    ; `ota` admission cap (server gates the OTA API on it).
    -D PNEX_OTA_ENABLE=1
    ; Debug screen (per-device choice) — the 9 vars are ALWAYS pushed by the
    ; builder (kind gates 0/1, role pins gpio or -1). Manual build example:
    ; PNEX_SCREEN_SSD1306=1 PNEX_SCREEN_SDA=4 PNEX_SCREEN_SCL=5 (others 0/-1).
    -D PNEX_SCREEN_SSD1306=${sysenv.PNEX_SCREEN_SSD1306}
    -D PNEX_SCREEN_ST7735=${sysenv.PNEX_SCREEN_ST7735}
    -D PNEX_SCREEN_SDA=${sysenv.PNEX_SCREEN_SDA}
    -D PNEX_SCREEN_SCL=${sysenv.PNEX_SCREEN_SCL}
    -D PNEX_SCREEN_SCK=${sysenv.PNEX_SCREEN_SCK}
    -D PNEX_SCREEN_MOSI=${sysenv.PNEX_SCREEN_MOSI}
    -D PNEX_SCREEN_CS=${sysenv.PNEX_SCREEN_CS}
    -D PNEX_SCREEN_DC=${sysenv.PNEX_SCREEN_DC}
    -D PNEX_SCREEN_RST=${sysenv.PNEX_SCREEN_RST}
lib_extra_dirs =
    ../common_libs
    ../lib
lib_deps =
    SPI
    Update
    Wire
    densaugeo/base64@^1.4.0
    bblanchon/ArduinoJson@^7.0.4
    olikraus/U8g2@^2.35.19
    adafruit/Adafruit GFX Library@^1.12.2
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
