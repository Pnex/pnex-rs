; Test of the C++ mirror pnex-core-cpp on the HOST (no hardware) — golden
; vectors Rust = C++ (D20 §6, edge-model.md §3 rule 2). The reference lives
; in crates/pnex-core/src/control.rs; the vectors are generated by
; crates/pnex-core/tests/golden_vectors.rs (artefact: goldens.h).
;
;   uv run pio test -d core-cpp-tests -e native
;
[env:native]
platform = native
test_framework = unity
lib_extra_dirs = ../common_libs
; The crypto glue depends on Arduino (pnex_crypto.cpp) — out of reach of
; the host: the test builds the portable Noise link (pnex_noise.cpp,
; monocypher) from lib/pnex/src through -I.
lib_ignore = crypto
build_flags =
    -I../common_libs/pnex-core-cpp
    -I../lib/pnex/src
    ; Unity compiles without doubles by default (UNITY_EXCLUDE_DOUBLE) —
    ; the PID vectors compare duty/integrals in f64.
    -DUNITY_INCLUDE_DOUBLE
