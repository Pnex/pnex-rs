; Test du miroir C++ pnex-core-cpp sur l'HÔTE (pas de matériel) — golden
; vectors Rust = C++ (D20 §6, edge-model.md §3 règle 2). La référence vit
; dans crates/pnex-core/src/control.rs ; les vecteurs sont générés par
; crates/pnex-core/tests/golden_vectors.rs (artefact : goldens.h).
;
;   uv run pio test -d core-cpp-tests -e native
;
[env:native]
platform = native
test_framework = unity
lib_extra_dirs = ../common_libs
; The crypto glue depends on Arduino (pnex_crypto.cpp) — out of reach of
; the host: the test builds the portable Noise link (pnex_noise.cpp,
; monocypher) from lib/pnex/src through -I.
lib_ignore = crypto
build_flags =
    -I../common_libs/pnex-core-cpp
    -I../lib/pnex/src
    ; Unity compile sans les doubles par défaut (UNITY_EXCLUDE_DOUBLE) —
    ; les vecteurs PID comparent des duty/intégrales en f64.
    -DUNITY_INCLUDE_DOUBLE
