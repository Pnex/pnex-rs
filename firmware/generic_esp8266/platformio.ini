[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; B0.1 : AUCUNE config device au build — le .bin générique compile une fois,
; la config (WiFi/hôte/token/device_id) vit dans le secteur PNEXCFG1 flashé
; à 0x200000 (pnex_firmware_builder::config_sector, brick0.md §5).
lib_extra_dirs = ../common_libs
lib_deps =
    SPI
    Wire
    densaugeo/base64@^1.4.0
    gilmaimon/ArduinoWebsockets@^0.5.4
    bblanchon/ArduinoJson@^7.0.4
