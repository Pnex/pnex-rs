[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags =
    -D WIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -D WIFI_PASSWORD=\"${sysenv.WIFI_PASSWORD}\"
    -D HOST=\"${sysenv.HOST}\"
    -D TOKEN=\"${sysenv.TOKEN}\"
    -D DEVICE_ID=\"${sysenv.DEVICE_ID}\"
    -D ENCRYPTION_KEY=\"${sysenv.ENCRYPTION_KEY}\"
    ; Root pinned for wss (base64 PEM, pnex_tls) and TLS client identity
    ; of this device (D153), injected by the builder.
    -D PNEX_CA_CERT=\"${sysenv.PNEX_CA_CERT}\"
    -D PNEX_CLIENT_CERT=\"${sysenv.PNEX_CLIENT_CERT}\"
    -D PNEX_CLIENT_KEY=\"${sysenv.PNEX_CLIENT_KEY}\"
lib_extra_dirs =
    ../common_libs
    ../lib
lib_deps =
    SPI
    Wire
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.4
    densaugeo/base64@^1.4.0
    olikraus/U8g2@^2.36.12
    ; transitif lib PneX (Pnex.h inclut ArduinoJson) — LDF ne résout pas
    ; les deps manifeste d'une lib trouvée via lib_extra_dirs.
    bblanchon/ArduinoJson@^7.0.4
