; OLED dev bench — NodeMCU V3 OLED (SDA=D6/12, SCL=D5/14).
; Drives pnex_screen with a scripted pnex_status scenario (no WiFi, no
; server) to iterate on the 0.96" layout: `pio run -t upload -t monitor`.
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags =
    -D PNEX_SCREEN_SSD1306=1
    -D PNEX_SCREEN_ST7735=0
    -D PNEX_SCREEN_SDA=12
    -D PNEX_SCREEN_SCL=14
lib_extra_dirs =
    ../common_libs
    ../lib
lib_deps =
    SPI
    Wire
    densaugeo/base64@^1.4.0
    gilmaimon/ArduinoWebsockets@^0.5.4
    bblanchon/ArduinoJson@^7.0.4
    olikraus/U8g2@^2.35.19
    adafruit/Adafruit GFX Library@^1.12.2
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
