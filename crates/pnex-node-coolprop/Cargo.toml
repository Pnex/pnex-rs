[package]
name = "pnex-node-coolprop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PNEX flow node — in-process thermophysical properties (pnex-coolprop / CoolProp v8)"

[dependencies]
pnex-core = { workspace = true }
# In-process CoolProp: linked by this node crate → pnex-flow-runtime (mode B:
# never in pnex-backend... except as a "calculation lib" outside the engine —
# the rule applies to edgelinkd and the node crates).
pnex-coolprop = { workspace = true }
edgelink-core = { path = "../../vendor/edgelinkd/crates/core", default-features = false, features = ["core", "js"] }
edgelink-macro = { path = "../../vendor/edgelinkd/crates/macro" }
# Only for the factory's Option<&config::Config> type — same features as edgelink-core
config = { version = "0.15", default-features = false, features = ["convert-case", "toml"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["time"] }
async-trait = "0.1"
tokio-util = "0.7"
log = "0.4"
smallvec = "1"
# The `#[flow_node]` macro emits an unqualified `inventory::submit!` — direct dependency required
inventory = "0.3"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
