[package]
name = "pnex-node-predict"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flow nodes PNeX — anomaly scoring and forecasting on telemetry series (augurs)"

[dependencies]
pnex-core = { workspace = true }
edgelink-core = { path = "../../vendor/edgelinkd/crates/core", default-features = false, features = ["core", "js"] }
edgelink-macro = { path = "../../vendor/edgelinkd/crates/macro" }
# Only for the Option<&config::Config> factory type — same features as edgelink-core
config = { version = "0.15", default-features = false, features = ["convert-case", "toml"] }
# Time-series toolkit (Grafana, MIT OR Apache-2.0): AutoETS + MSTL. BOCPD is
# in-house (algo.rs): the `changepoint` feature drags argmin/peroxide/bincode 1.
augurs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Series history persistence (survives redeploys / restarts).
redis = { workspace = true }
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
async-trait = "0.1"
tokio-util = "0.7"
log = "0.4"
smallvec = "1"
# The `#[flow_node]` macro emits unqualified `inventory::submit!` — direct dep required
inventory = "0.3"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
