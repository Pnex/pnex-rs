[package]
name = "pnex-stitcher"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stitches a ring of guided photos into a 2:1 equirectangular — pure Rust, no OpenCV (Take 360 v1)"

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# No rayon: the global pool deadlocks on Android devices (see render.rs)
# and at 1024 px the serial render takes ~1-2 s.
thiserror = { workspace = true }
# 3×3 rotation solve (Horn, Cholesky) for model-based pose refinement.
nalgebra = { version = "0.35", optional = true, default-features = false, features = ["std"] }
# Native ONNX inference (SuperPoint + LightGlue) — feature `pose-model`
# SERVER ONLY: the Android device keeps the crate without native deps (the
# frontend compiles pnex-stitcher without features, Legacy pipeline).
ort = { version = "=2.0.0-rc.13", optional = true }

[features]
pose-model = ["dep:ort", "dep:nalgebra"]

[dev-dependencies]
# Host re-stitch of a real capture (examples/restitch.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[example]]
name = "probe_model"
required-features = ["pose-model"]

[[example]]
name = "probe_pair"
required-features = ["pose-model"]

[[example]]
name = "audit_poses"
required-features = ["pose-model"]
