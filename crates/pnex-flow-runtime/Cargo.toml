[package]
name = "pnex-flow-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PNEX ETL flow runtime — edgelink-core + PNEX nodes, headless, supervised by pnex-server (D18)"

[[bin]]
name = "pnex-flow-runtime"
path = "src/main.rs"

[dependencies]
pnex-core = { workspace = true }
pnex-node-device = { workspace = true }
pnex-node-display = { workspace = true }
pnex-node-value = { workspace = true }
pnex-node-control = { workspace = true }
pnex-node-ui-control = { workspace = true }
pnex-node-weather = { workspace = true }
pnex-node-coolprop = { workspace = true }
pnex-node-notify = { workspace = true }
pnex-node-http-fetch = { workspace = true }
pnex-node-camera = { workspace = true }
pnex-node-events = { workspace = true }
pnex-node-vision = { workspace = true }
pnex-node-memory = { workspace = true }
pnex-node-predict = { workspace = true }
pnex-node-starlark = { workspace = true }
edgelink-core = { path = "../../vendor/edgelinkd/crates/core", default-features = false, features = ["core", "js"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
rquickjs = { version = "0.11", default-features = false, features = ["futures"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync"] }
log = "0.4"
# Hash of the tabs (reload diff) and of the artifact (flow_rev process health).
sha2 = "0.10"
hex = "0.4"

# armv7: rquickjs-sys ships no pre-generated bindings (aarch64 does) —
# bindgen generation on the fly (libclang required on the build machine).
[target.'cfg(target_arch = "arm")'.dependencies]
rquickjs-sys = { version = "0.11", features = ["bindgen"] }

[dev-dependencies]
# Sends SIGUSR1/SIGINT to the child process in the E2E tests
libc = "0.2"
# Camera E2E: publishes frames on the Valkey frame bus.
redis = { workspace = true }
# Control-source E2E: random control ids.
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
