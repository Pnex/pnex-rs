[package]
name = "pnex-flow-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime de flows ETL PNEX — edgelink-core + nœuds PNEX, headless, supervisé par pnex-server (D18)"

[[bin]]
name = "pnex-flow-runtime"
path = "src/main.rs"

[dependencies]
pnex-node-sql = { workspace = true }
edgelink-core = { path = "../../vendor/edgelinkd/crates/core", default-features = false, features = ["core", "js"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "time", "fs"] }
tokio-util = "0.7"
log = "0.4"

[dev-dependencies]
# Envoi de SIGUSR1/SIGINT au process enfant dans les tests E2E
libc = "0.2"
