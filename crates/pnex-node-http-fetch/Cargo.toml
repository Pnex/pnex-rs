[package]
name = "pnex-node-http-fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PNEX flow node — configurable HTTP client request (C1a): GET/POST, headers, basic/bearer/key auth, direct proxy or scraping provider"

[dependencies]
pnex-core = { workspace = true, features = ["egress"] }
edgelink-core = { path = "../../vendor/edgelinkd/crates/core", default-features = false, features = ["core", "js"] }
edgelink-macro = { path = "../../vendor/edgelinkd/crates/macro" }
# Only for the factory's Option<&config::Config> type — same features as edgelink-core
config = { version = "0.15", default-features = false, features = ["convert-case", "toml"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
async-trait = "0.1"
tokio-util = "0.7"
log = "0.4"
# The `#[flow_node]` macro emits an unqualified `inventory::submit!` — direct dependency required
inventory = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
