[package]
name = "pnex-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PNeX audio recorder (call-recording.md R1): tray utility, sign-in, capture on/off, 5 s speech-to-text check against the server"

[[bin]]
name = "pnex-recorder"
path = "src/main.rs"

[dependencies]
pnex-core = { workspace = true }
pnex-api-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-i18n = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "time"] }
# Local date in the name of a recording.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Microphone capture on WASAPI / CoreAudio / ALSA (Apache-2.0).
cpal = "0.16"
hound = "3.5"
# Calls are sent as Ogg/Opus (~14 MB per hour instead of 230 MB of WAV):
# libopus built from source by cmake (BSD-3-Clause), Ogg muxing (BSD-3-Clause).
opus = "0.4"
ogg = "0.9"
# Decodes the PNeX mark for the tray and window icons.
png = "0.17"
# Fingerprint of a self-hosted root CA before it is pinned.
sha2 = "0.10"
base64 = "0.22"
# Browser sign-in: PKCE verifier entropy and the system browser (vendored patch).
getrandom = "0.2"
webbrowser = "1"

# Linux e2e only (feature `e2e`): turns on the vendored wry patch that lets
# WebKitWebDriver drive the window (and only with PNEX_E2E_AUTOMATION set).
[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.53", default-features = false, optional = true }
# Call capture on PulseAudio / PipeWire (pipewire-pulse): microphone and the
# monitor of the output, plus the list of apps recording (MIT OR Apache-2.0;
# links the system libpulse).
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

# Call detection on Windows: the microphone consent registry (MIT OR Apache-2.0).
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[features]
e2e = ["wry/pnex-automation"]
