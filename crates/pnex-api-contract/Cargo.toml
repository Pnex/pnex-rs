[package]
name = "pnex-api-contract"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PNEX app ↔ server interoperability contract — contract version + ServerInfo DTO (serde only, wasm-safe)"

[features]
# OpenAPI schemas of the DTOs — backend only, never the wasm frontend.
openapi = ["dep:utoipa"]

[dependencies]
serde = { workspace = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
