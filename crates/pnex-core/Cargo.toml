[package]
name = "pnex-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Types partagés PNEX — compile en natif + wasm32, aucune dépendance native hors features optionnelles"

[features]
# Normalisation des labels de mesures (deunicode) — backend + runtime de
# flows uniquement ; le front wasm n'en a pas besoin (il affiche le label
# brut, la clé payload passe par sanitize_key sans dep).
naming = ["dep:deunicode"]
# Messages prompb (remote-write OpenObserve) — backend + pnex-node-device.
prompb = ["dep:prost"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
deunicode = { version = "1", optional = true }
prost = { version = "0.13", optional = true }

[dev-dependencies]
# roundtrip serde du graphe + projection flows.json.
serde_json = { workspace = true }
