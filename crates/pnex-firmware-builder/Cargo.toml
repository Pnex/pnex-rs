[package]
name = "pnex-firmware-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Orchestration des builds firmware (shell-out toolchain PlatformIO/esptool) — Phase 6"

[dependencies]
thiserror = { workspace = true }
async-trait = "0.1"
base64 = "0.22"
include_dir = "0.7"
tokio = { version = "1.45", default-features = false, features = [
  "process",
  "time",
  "fs",
] }
tracing = "0.1"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1.45", default-features = false, features = [
  "rt",
  "macros",
] }
