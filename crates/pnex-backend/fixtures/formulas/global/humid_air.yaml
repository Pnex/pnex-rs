# Global Humid Air (Psychrometric) Formulas
# These formulas use CoolProp HAPropsSI for psychrometric property calculations
# Users can import these formulas and configure their own data sources

- global_id: "humid_air_enthalpy_dry_air_v1"
  name: "Enthalpy of Moist Air (per kg dry air)"
  version: 1
  category: "humid_air"
  tags: ["enthalpy", "psychrometric", "humid_air", "coolprop", "hvac"]
  description: "Calculate specific enthalpy of moist air per kg dry air using CoolProp HAPropsSI: h = HAPropsSI('H', 'T', dry_bulb_temp, 'P', pressure, 'R', relative_humidity)"
  expression: "HAPropsSI('H', 'T', dry_bulb_temp, 'P', pressure, 'R', relative_humidity)"
  result_unit: "J/kg dry air"
  formula_type: "fluid_property"
  data_sources:
    - variable_name: "dry_bulb_temp"
      measurement_name: "temperature"
      suggested_unit: "K"
      description: "Dry bulb temperature in Kelvin"
    - variable_name: "pressure"
      measurement_name: "pressure"
      suggested_unit: "Pa"
      description: "Pressure in Pascal (default: 101325 Pa for atmospheric)"
    - variable_name: "relative_humidity"
      measurement_name: "relative_humidity"
      suggested_unit: ""
      description: "Relative humidity as fraction (0.0 to 1.0)"

