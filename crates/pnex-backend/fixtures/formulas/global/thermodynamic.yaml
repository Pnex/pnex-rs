# Global Thermodynamic Formulas
# These formulas use CoolProp for fluid property calculations
# Users can import these formulas and configure their own data sources

- global_id: "enthalpy_calculation_v1"
  name: "Enthalpy (h) - Water"
  version: 1
  category: "thermodynamic"
  tags: ["enthalpy", "fluid", "thermodynamic", "coolprop", "water"]
  description: "Calculate specific enthalpy of Water using CoolProp: h = PropsSI('H', 'T', temperature, 'P', pressure, 'Water'). Users can change 'Water' to any fluid from the fluid catalog."
  expression: "PropsSI('H', 'T', temperature, 'P', pressure, 'Water')"
  result_unit: "J/kg"
  formula_type: "fluid_property"
  data_sources:
    - variable_name: "temperature"
      measurement_name: "temperature"
      suggested_unit: "K"
      description: "Temperature in Kelvin"
    - variable_name: "pressure"
      measurement_name: "pressure"
      suggested_unit: "Pa"
      description: "Pressure in Pascal"

