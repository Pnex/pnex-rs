# Brick 0 — profils board v2 ESP32 DevKit V1 (DOIT) : 30 pins (row
# esp32-wroom-32), 36 pins (row esp32-devkit-v1-36p) et variante TFT
# ST7735 (row esp32-devkit-tft-st7735 — câblage réel de
# firmware/tft_st7735_demo : SCK 18, MOSI 23, CS 5, DC 2 (strapping,
# Hi-Z au reset), RST 4, 160x128).
# Flash 6-11 présentes sur le header du 36p : listées pour l'affichage,
# EXCLUSES à l'admission par les chip-caps (admission_pins).
- board_name: esp32-wroom-32
  profile:
    board: esp32-devkit-v1-30p
    name: "ESP32 DevKit V1 (DOIT, 30 pins)"
    chip_label: "ESP-WROOM-32"
    layout: { kind: dual_inline, per_side: 15, size_mm: { w: 28, l: 55 } }
    # Écrans EXTERNES au choix par device (un seul actif) : OLED I2C sur
    # 21/22 (Wire par défaut), TFT SPI VSPI (18/23/5/2/4 — câblage prouvé
    # de tft_st7735_demo, DC 2 = strapping Hi-Z au reset). Activé → pins
    # réservées (serveur + éditeur).
    peripherals:
      screens:
        - name: "OLED 0.96\""
          kind: ssd1306
          bus: i2c
          pins: { sda: 21, scl: 22 }
          addr: "0x3C"
          size_px: [128, 64]
        - name: "TFT 1.77\""
          kind: st7735
          bus: spi
          pins: { sck: 18, mosi: 23, cs: 5, dc: 2, rst: 4 }
          size_px: [160, 128]
    pins:
      # côté gauche (USB → antenne)
      - { label: EN, gpio: null, kind: en, pos: { side: right, index: 14 } }
      - { label: VP, gpio: 36, kind: gpio, pos: { side: right, index: 13 } }
      - { label: VN, gpio: 39, kind: gpio, pos: { side: right, index: 12 } }
      - { label: D34, gpio: 34, kind: gpio, pos: { side: right, index: 11 } }
      - { label: D35, gpio: 35, kind: gpio, pos: { side: right, index: 10 } }
      - { label: D32, gpio: 32, kind: gpio, pos: { side: right, index: 9 } }
      - { label: D33, gpio: 33, kind: gpio, pos: { side: right, index: 8 } }
      - { label: D25, gpio: 25, kind: gpio, pos: { side: right, index: 7 } }
      - { label: D26, gpio: 26, kind: gpio, pos: { side: right, index: 6 } }
      - { label: D27, gpio: 27, kind: gpio, pos: { side: right, index: 5 } }
      - { label: D14, gpio: 14, kind: gpio, pos: { side: right, index: 4 } }
      - { label: D12, gpio: 12, kind: gpio, pos: { side: right, index: 3 } }
      - { label: D13, gpio: 13, kind: gpio, pos: { side: right, index: 2 } }
      - { label: GND, gpio: null, kind: gnd, pos: { side: right, index: 1 } }
      - { label: VIN, gpio: null, kind: power, pos: { side: right, index: 0 } }
      # côté droit (USB → antenne)
      - { label: D23, gpio: 23, kind: gpio, pos: { side: left, index: 14 } }
      - { label: D22, gpio: 22, kind: gpio, pos: { side: left, index: 13 } }
      - { label: TX0, gpio: 1, kind: gpio, pos: { side: left, index: 12 } }
      - { label: RX0, gpio: 3, kind: gpio, pos: { side: left, index: 11 } }
      - { label: D21, gpio: 21, kind: gpio, pos: { side: left, index: 10 } }
      - { label: D19, gpio: 19, kind: gpio, pos: { side: left, index: 9 } }
      - { label: D18, gpio: 18, kind: gpio, pos: { side: left, index: 8 } }
      - { label: D5, gpio: 5, kind: gpio, pos: { side: left, index: 7 } }
      - { label: TX2, gpio: 17, kind: gpio, pos: { side: left, index: 6 } }
      - { label: RX2, gpio: 16, kind: gpio, pos: { side: left, index: 5 } }
      - { label: D4, gpio: 4, kind: gpio, pos: { side: left, index: 4 } }
      - { label: D2, gpio: 2, kind: gpio, pos: { side: left, index: 3 } }
      - { label: D15, gpio: 15, kind: gpio, pos: { side: left, index: 2 } }
      - { label: GND, gpio: null, kind: gnd, pos: { side: left, index: 1 } }
      - { label: "3V3", gpio: null, kind: power, pos: { side: left, index: 0 } }

- board_name: esp32-devkit-v1-36p
  profile:
    board: esp32-devkit-v1-36p
    name: "ESP32 DevKit V1 (DOIT, 36 pins)"
    chip_label: "ESP-WROOM-32"
    layout: { kind: dual_inline, per_side: 18, size_mm: { w: 28, l: 57 } }
    # Écrans EXTERNES au choix par device (un seul actif) : OLED I2C sur
    # 21/22 (Wire par défaut), TFT SPI VSPI (18/23/5/2/4 — câblage prouvé
    # de tft_st7735_demo, DC 2 = strapping Hi-Z au reset). Activé → pins
    # réservées (serveur + éditeur).
    peripherals:
      screens:
        - name: "OLED 0.96\""
          kind: ssd1306
          bus: i2c
          pins: { sda: 21, scl: 22 }
          addr: "0x3C"
          size_px: [128, 64]
