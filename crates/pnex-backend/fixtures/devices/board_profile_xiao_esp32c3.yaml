# Brick 0 — profil board v2 Seeed XIAO ESP32-C3 (migration 000029).
# Pinout XIAO ESP32C3 (wiki Seeed) : D0–D10 ; D0–D2 = ADC1 (analog_in
# activable en UI), D3 (GPIO5 = ADC2) digital only (chip-caps : ADC2 cassé
# avec WiFi), D4/D5 = I2C, D6/D7 = UART0, D8/D9 = strapping boot-HIGH
# (safe_state: low refusé en digital_out). fn/flags restent en CODE.
- board_name: esp32-c3
  profile:
    board: xiao_esp32c3
    name: "Seeed XIAO ESP32-C3"
    chip_label: "ESP32-C3"
    layout: { kind: dual_inline, per_side: 7, size_mm: { w: 17.8, l: 21 } }
    # Écrans EXTERNES au choix par device (un seul actif) : OLED I2C sur
    # D4/D5 (6/7, Wire XIAO), TFT SPI sur D8/D10 + D1/D2/D3 (SCK 8 = pin
    # strapping boot-HIGH, OK en idle SCK ; CS 3, DC 4, RST 5). Activé →
    # pins réservées (serveur + éditeur).
    peripherals:
      screens:
        - name: "OLED 0.96\""
          kind: ssd1306
          bus: i2c
          pins: { sda: 6, scl: 7 }
          addr: "0x3C"
          size_px: [128, 64]
        - name: "TFT 1.77\""
          kind: st7735
          bus: spi
          pins: { sck: 8, mosi: 10, cs: 3, dc: 4, rst: 5 }
          size_px: [160, 128]
    pins:
      # côté gauche (USB → antenne)
      - { label: D0, gpio: 2, kind: gpio, pos: { side: right, index: 6 } }
      - { label: D1, gpio: 3, kind: gpio, pos: { side: right, index: 5 } }
      - { label: D2, gpio: 4, kind: gpio, pos: { side: right, index: 4 } }
      - { label: D3, gpio: 5, kind: gpio, pos: { side: right, index: 3 } }
      - { label: D4, gpio: 6, kind: gpio, pos: { side: right, index: 2 } }
      - { label: D5, gpio: 7, kind: gpio, pos: { side: right, index: 1 } }
      - { label: D6, gpio: 21, kind: gpio, pos: { side: right, index: 0 } }
      # côté droit (USB → antenne)
      - { label: "5V", gpio: null, kind: power, pos: { side: left, index: 6 } }
      - { label: GND, gpio: null, kind: gnd, pos: { side: left, index: 5 } }
      - { label: "3V3", gpio: null, kind: power, pos: { side: left, index: 4 } }
      - { label: D10, gpio: 10, kind: gpio, pos: { side: left, index: 3 } }
      - { label: D9, gpio: 9, kind: gpio, pos: { side: left, index: 2 } }
      - { label: D8, gpio: 8, kind: gpio, pos: { side: left, index: 1 } }
      - { label: D7, gpio: 20, kind: gpio, pos: { side: left, index: 0 } }
