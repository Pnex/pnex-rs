# Brick 0 — profil board v2 ESP32-S3 DevKitC-1. Pin map simplifiée (31
# pins utiles, GPIO48 omis) ; les positions SVG ne prétendent pas à la
# topologie physique exacte — à affiner à la première photo réelle.
# fn/flags (ADC, strapping…) restent en CODE (caps.rs) — jamais dupliqués
# ici (B0.6).
#
# Écrans EXTERNES au choix par device (un seul actif) : OLED I2C sur 8/9
# (convention Arduino S3 : Wire 8/9), TFT SPI FSPI (SCK 12, MOSI 11, CS 10
# — conventions Arduino FSPI ; DC 13, RST 14). Activé → pins réservées
# (serveur + éditeur).
- board_name: esp32-s3
  profile:
    board: esp32-s3-devkitc-1
    name: "ESP32-S3 DevKitC-1"
    chip_label: "ESP32-S3"
    layout: { kind: dual_inline, per_side: 16, size_mm: { w: 28, l: 60 } }
    peripherals:
      screens:
        - name: "OLED 0.96\""
          kind: ssd1306
          bus: i2c
          pins: { sda: 8, scl: 9 }
          addr: "0x3C"
          size_px: [128, 64]
        - name: "TFT 1.77\""
          kind: st7735
          bus: spi
          pins: { sck: 12, mosi: 11, cs: 10, dc: 13, rst: 14 }
          size_px: [160, 128]
    pins:
      # côté gauche (USB → antenne)
      - { label: EN, gpio: null, kind: en, pos: { side: right, index: 15 } }
      - { label: D4, gpio: 4, kind: gpio, pos: { side: right, index: 14 } }
      - { label: D0, gpio: 0, kind: gpio, pos: { side: right, index: 13 },
          note: "strapping boot-HIGH (safe_state: low refused as output)" }
      - { label: D45, gpio: 45, kind: gpio, pos: { side: right, index: 12 },
          note: "strapping boot-HIGH (safe_state: low refused as output)" }
      - { label: D46, gpio: 46, kind: gpio, pos: { side: right, index: 11 },
          note: "input-only + strapping (pas de sortie, pas de pull-up)" }
      - { label: D1, gpio: 1, kind: gpio, pos: { side: right, index: 10 },
          note: "ADC1" }
      - { label: D2, gpio: 2, kind: gpio, pos: { side: right, index: 9 },
          note: "ADC1" }
      - { label: D3, gpio: 3, kind: gpio, pos: { side: right, index: 8 },
          note: "strapping boot-HIGH (safe_state: low refused as output)" }
      - { label: D42, gpio: 42, kind: gpio, pos: { side: right, index: 7 } }
      - { label: D41, gpio: 41, kind: gpio, pos: { side: right, index: 6 } }
      - { label: D40, gpio: 40, kind: gpio, pos: { side: right, index: 5 } }
      - { label: D39, gpio: 39, kind: gpio, pos: { side: right, index: 4 } }
      - { label: D38, gpio: 38, kind: gpio, pos: { side: right, index: 3 } }
      - { label: D47, gpio: 47, kind: gpio, pos: { side: right, index: 2 } }
      - { label: GND, gpio: null, kind: gnd, pos: { side: right, index: 1 } }
      - { label: 5V, gpio: null, kind: power, pos: { side: right, index: 0 } }
      # côté droit (USB → antenne)
      - { label: "3V3", gpio: null, kind: power, pos: { side: left, index: 15 } }
      - { label: D21, gpio: 21, kind: gpio, pos: { side: left, index: 14 } }
      - { label: D18, gpio: 18, kind: gpio, pos: { side: left, index: 13 } }
      - { label: D17, gpio: 17, kind: gpio, pos: { side: left, index: 12 } }
      - { label: D16, gpio: 16, kind: gpio, pos: { side: left, index: 11 } }
      - { label: D15, gpio: 15, kind: gpio, pos: { side: left, index: 10 } }
      - { label: D14, gpio: 14, kind: gpio, pos: { side: left, index: 9 },
          note: "TFT RST quand le TFT est choisi" }
      - { label: D13, gpio: 13, kind: gpio, pos: { side: left, index: 8 },
          note: "TFT DC quand le TFT est choisi" }
      - { label: D12, gpio: 12, kind: gpio, pos: { side: left, index: 7 },
          note: "TFT SCK quand le TFT est choisi" }
      - { label: D11, gpio: 11, kind: gpio, pos: { side: left, index: 6 },
          note: "TFT MOSI quand le TFT est choisi" }
      - { label: D10, gpio: 10, kind: gpio, pos: { side: left, index: 5 },
          note: "TFT CS quand le TFT est choisi" }
      - { label: D9, gpio: 9, kind: gpio, pos: { side: left, index: 4 },
          note: "OLED SCL quand l'OLED est choisi" }
      - { label: D8, gpio: 8, kind: gpio, pos: { side: left, index: 3 },
          note: "OLED SDA quand l'OLED est choisi" }
      - { label: D7, gpio: 7, kind: gpio, pos: { side: left, index: 2 } }
      - { label: D6, gpio: 6, kind: gpio, pos: { side: left, index: 1 } }
      - { label: D5, gpio: 5, kind: gpio, pos: { side: left, index: 0 } }
