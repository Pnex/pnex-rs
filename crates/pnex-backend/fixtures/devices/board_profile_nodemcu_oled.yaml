# Brick 0 — profil board v2 NodeMCU + OLED 0.96" SSD1306 (I2C). Écran
# SOUDÉ sur la carte → `builtin: true` : FORCÉ actif pour tout device sur
# cette variante (réserves GPIO4/5 permanentes, désactivation refusée 400,
# picker UI verrouillé). Le build passe -D PNEX_SCREEN_SSD1306=1.
- board_name: nodemcu_oled
  profile:
    board: nodemcu_oled
    name: "NodeMCU + OLED 0.96\""
    chip_label: "ESP-12E"
    layout: { kind: dual_inline, per_side: 8, size_mm: { w: 30, l: 58 } }
    peripherals:
      screens:
        - name: "OLED 0.96\""
          kind: ssd1306
          bus: i2c
          pins: { sda: 4, scl: 5 }
          addr: "0x3C"
          size_px: [128, 64]
          builtin: true
    pins:
      # côté gauche (USB → antenne)
      - { label: A0, gpio: 17, kind: gpio, pos: { side: right, index: 7 },
          note: "ADC channel — wire id 17 (no physical GPIO 17)" }
      - { label: D0, gpio: 16, kind: gpio, pos: { side: right, index: 6 },
          note: "no PWM nor pull-up (pulldown only)" }
      - { label: D5, gpio: 14, kind: gpio, pos: { side: right, index: 5 } }
      - { label: D6, gpio: 12, kind: gpio, pos: { side: right, index: 4 } }
      - { label: D7, gpio: 13, kind: gpio, pos: { side: right, index: 3 } }
      - { label: D8, gpio: 15, kind: gpio, pos: { side: right, index: 2 } }
      - { label: RX, gpio: 3, kind: gpio, pos: { side: right, index: 1 } }
      - { label: TX, gpio: 1, kind: gpio, pos: { side: right, index: 0 } }
      # côté droit (USB → antenne)
      - { label: "3V3", gpio: null, kind: power, pos: { side: left, index: 7 } }
      - { label: GND, gpio: null, kind: gnd, pos: { side: left, index: 6 } }
      - { label: D1, gpio: 5, kind: gpio, pos: { side: left, index: 5 },
          note: "I2C screen SCL (soldered, always reserved)" }
      - { label: D2, gpio: 4, kind: gpio, pos: { side: left, index: 4 },
          note: "I2C screen SDA (soldered, always reserved)" }
      - { label: D3, gpio: 0, kind: gpio, pos: { side: left, index: 3 } }
      - { label: D4, gpio: 2, kind: gpio, pos: { side: left, index: 2 },
          note: "LED onboard" }
      - { label: EN, gpio: null, kind: en, pos: { side: left, index: 1 } }
      - { label: VIN, gpio: null, kind: power, pos: { side: left, index: 0 } }
