# Generic/Custom devices for dynamic data publication
- name: custom_device
  pretty_name: Custom Device (Dynamic)
  revision: 1.0.0
  device_type_name: mixed
  capabilities_names: []  # No predefined capabilities - allows dynamic measurements
  board_name: generic
  device_doc_url: "/docs/DYNAMIC_DEVICES.md"
  prestashop_product_id: 201
  prestashop_buy_url: "http://example.com/custom"
