# Brick 0 — profil board v2 NodeMCU V3 (LoLin, 30 broches 15+15, CH340G
# USB-C) + OLED 0.96" SOUDÉ (SSD1315, compatible ssd1306, addr 0x3C).
# Carte chinoise générique (module ideaspark ESP8266MOD, fiche produit
# « CH340G ESP-12F TYPE-C », photo 2026-09-20) : silkscreen « VU », « EN
# RST », rangée S = pins flash de l'ESP-12F. Écran FORCÉ (`builtin: true`)
# sur le câblage NON STANDARD de cette famille : SDA = D6 (GPIO12), SCL =
# D5 (GPIO14) — confirmé de tête par l'utilisateur + forums (arduino.cc,
# sensor.community) ; PAS le couple D2/D1 des shields OLED externes. Le
# build passe -D PNEX_SCREEN_SSD1306=1. Les 6 pins flash (SK/S0/SC/S1/S2/
# S3 = GPIO 6/7/11/8/9/10) sont AFFICHÉES mais EXCLUES à l'admission
# (chip-caps) — ne jamais câbler (crash flash). Orientation : vue de face,
# USB en haut, antenne en bas (photo 1) ; la fiche produit (antenne à
# gauche) se lit en miroir.
- board_name: nodemcu_v3_oled
  profile:
    board: nodemcu_v3_oled
    name: "NodeMCU V3 + OLED 0.96\""
    chip_label: "ESP-12F"
    layout: { kind: dual_inline, per_side: 15, size_mm: { w: 31, l: 58 } }
    peripherals:
      screens:
        - name: "OLED 0.96\""
          kind: ssd1306
          bus: i2c
          pins: { sda: 12, scl: 14 }
          addr: "0x3C"
          size_px: [128, 64]
          builtin: true
    pins:
      # côté gauche (USB → antenne, haut → bas) — rangée D
      - { label: "3V", gpio: null, kind: power, pos: { side: left, index: 0 } }
      - { label: G, gpio: null, kind: gnd, pos: { side: left, index: 1 } }
      - { label: TX, gpio: 1, kind: gpio, pos: { side: left, index: 2 },
          note: "console UART" }
      - { label: RX, gpio: 3, kind: gpio, pos: { side: left, index: 3 },
          note: "console UART" }
      - { label: D8, gpio: 15, kind: gpio, pos: { side: left, index: 4 },
          note: "strapping boot-LOW (pulldown) — CS HSPI" }
      - { label: D7, gpio: 13, kind: gpio, pos: { side: left, index: 5 } }
      - { label: D6, gpio: 12, kind: gpio, pos: { side: left, index: 6 },
          note: "I2C screen SDA (soldered, always reserved)" }
      - { label: D5, gpio: 14, kind: gpio, pos: { side: left, index: 7 },
          note: "I2C screen SCL (soldered, always reserved)" }
      - { label: G, gpio: null, kind: gnd, pos: { side: left, index: 8 } }
      - { label: "3V", gpio: null, kind: power, pos: { side: left, index: 9 } }
      - { label: D4, gpio: 2, kind: gpio, pos: { side: left, index: 10 },
          note: "strapping boot-HIGH — LED onboard" }
      - { label: D3, gpio: 0, kind: gpio, pos: { side: left, index: 11 },
          note: "strapping — bouton FLASH sur la carte" }
      - { label: D2, gpio: 4, kind: gpio, pos: { side: left, index: 12 } }
      - { label: D1, gpio: 5, kind: gpio, pos: { side: left, index: 13 } }
      - { label: D0, gpio: 16, kind: gpio, pos: { side: left, index: 14 },
          note: "no PWM nor pull-up (pulldown only)" }
      # côté droit (USB → antenne, haut → bas) — rangée A0/S
      - { label: VIN, gpio: null, kind: power, pos: { side: right, index: 0 } }
      - { label: G, gpio: null, kind: gnd, pos: { side: right, index: 1 } }
      - { label: RST, gpio: null, kind: en, pos: { side: right, index: 2 } }
      - { label: EN, gpio: null, kind: en, pos: { side: right, index: 3 } }
      - { label: "3V", gpio: null, kind: power, pos: { side: right, index: 4 } }
      - { label: G, gpio: null, kind: gnd, pos: { side: right, index: 5 } }
      - { label: SK, gpio: 6, kind: gpio, pos: { side: right, index: 6 },
          note: "flash SPI (SCLK) — excluded from admission, never wire it" }
      - { label: S0, gpio: 7, kind: gpio, pos: { side: right, index: 7 },
          note: "flash SPI (SDD0) — excluded from admission, never wire it" }
      - { label: SC, gpio: 11, kind: gpio, pos: { side: right, index: 8 },
          note: "flash SPI (SDCMD) — excluded from admission, never wire it" }
      - { label: S1, gpio: 8, kind: gpio, pos: { side: right, index: 9 },
          note: "flash SPI (SDD1) — excluded from admission, never wire it" }
      - { label: S2, gpio: 9, kind: gpio, pos: { side: right, index: 10 },
          note: "flash SPI (SDD2) — excluded from admission, never wire it" }
      - { label: S3, gpio: 10, kind: gpio, pos: { side: right, index: 11 },
          note: "flash SPI (SDD3) — excluded from admission, never wire it" }
      - { label: VU, gpio: null, kind: power, pos: { side: right, index: 12 },
          note: "5 V USB" }
      - { label: G, gpio: null, kind: gnd, pos: { side: right, index: 13 } }
      - { label: A0, gpio: 17, kind: gpio, pos: { side: right, index: 14 },
          note: "ADC channel — wire id 17 (no physical GPIO 17)" }
