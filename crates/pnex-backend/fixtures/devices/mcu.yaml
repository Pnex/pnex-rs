# Boards MCU — une row = une VARIANTE physique (migration 000029 : la
# variante est figée sur le device à l'enregistrement, le modèle garde le
# défaut). `details` est rempli par les fixtures board_profile_*.yaml
# (profil v2 : géométrie + pins + périphériques). `pio_board` = id
# PlatformIO injecté au build (`board = ${sysenv.PNEX_PIO_BOARD}`).
- name: "esp8266"
  soc: "esp8266"
  pretty_name: "NodeMCU ESP8266 (v1.0)"
  pio_board: "nodemcuv2"

- name: "nodemcu_oled"
  soc: "esp8266"
  pretty_name: "NodeMCU + OLED 0.96\" (I2C)"
  pio_board: "nodemcuv2"

- name: "esp32-c3"
  soc: "esp32-c3"
  pretty_name: "Seeed XIAO ESP32-C3"
  pio_board: "seeed_xiao_esp32c3"

- name: "esp32-wroom-32"
  soc: "esp32"
  pretty_name: "ESP32 DevKit V1 (DOIT, 30 pins)"
  pio_board: "esp32dev"

- name: "esp32-devkit-v1-36p"
  soc: "esp32"
  pretty_name: "ESP32 DevKit V1 (DOIT, 36 pins)"
  pio_board: "esp32dev"

- name: "esp32-devkit-tft-st7735"
  soc: "esp32"
  pretty_name: "ESP32 DevKit V1 + TFT 1.77\" (ST7735)"
  pio_board: "esp32dev"

- name: "esp32-s3"
  soc: "esp32-s3"
  pretty_name: "ESP32-S3 DevKitC-1"
  pio_board: "esp32-s3-devkitc-1"

- name: "esp32-devkitc-v4-38p"
  soc: "esp32"
  pretty_name: "ESP32 DevKitC V4 (38 pins)"
  pio_board: "esp32dev"

- name: "esp32-devkit-38p-txd"
  soc: "esp32"
  pretty_name: "ESP32 DevKit 38 pins (TXD/RXD)"
  pio_board: "esp32dev"

- name: "nodemcu_v3_oled"
  soc: "esp8266"
  pretty_name: "NodeMCU V3 + OLED 0.96\" (soldered, CH340G)"
  pio_board: "nodemcuv2"

# AI-Thinker ESP32-CAM (OV2640 + PSRAM) — generic camera firmware
# (camera-video.md D77); profile in board_profile_esp32cam.yaml.
- name: "esp32cam-ai-thinker"
  soc: "esp32"
  pretty_name: "AI-Thinker ESP32-CAM (OV2640)"
  pio_board: "esp32cam"
