# Country pack "French companies" (partner-watch.md D304–D306,
# account-mapping.md D343): the French specifics on top of the worldwide
# `entreprises` pack. A legal unit carries its SIREN and its French codes,
# an establishment its SIRET; the shared fields (country, NACE activity,
# headcount range, status, dates) are filled from them by the import.
# The NACE class is the NAF code without its letter (`62.01Z` → `62.01`);
# the headcount range comes from the INSEE band (`NN` = not published).
# Since 1.1.0 an establishment carries its own headcount (the register
# publishes it per SIRET): targeting works at site level.
# Since 2.0.0 the shared fields, `etablissement_de`, `dirige` and the
# `groupe` hierarchy belong to `entreprises` (handed over on upgrade).
# The company register import queries each known SIREN (weekly once a
# recurrence is set on it): legal unit fields, head office and matching
# establishments on the map, officers and holdings. Only known legal units
# are enriched; a mandate that ended is not closed by it (incremental).
key: entreprises_fr
name: French companies
names: {fr: "Entreprises françaises"}
version: "2.0.0"
requires: [entreprises]
description: SIRENE legal units, establishments on the map and officers by mandate, synchronized from the public company registers.
descriptions: {fr: "Unités légales SIRENE, établissements sur la carte et dirigeants par mandat, synchronisés depuis les registres publics des entreprises."}
extends:
  - type: organization
    properties:
      - { key: siren, name: SIREN, names: {fr: "SIREN"}, kind: text, max_len: 9, unique: true }
      - { key: forme_juridique, name: Legal form, names: {fr: "Forme juridique"}, kind: text, max_len: 255 }
      - { key: naf, name: NAF code, names: {fr: "Code NAF"}, kind: text, max_len: 8, indexed: true }
      - { key: effectif_tranche, name: Headcount band, names: {fr: "Tranche d'effectif"}, kind: text, max_len: 8 }
      - { key: nda, name: Training declaration number, names: {fr: "Numéro de déclaration d'activité"}, kind: text, max_len: 11, indexed: true }
      - { key: qualiopi, name: Qualiopi, names: {fr: "Qualiopi"}, kind: bool }
      - { key: qualiopi_categories, name: Qualiopi categories, names: {fr: "Catégories Qualiopi"}, kind: text, max_len: 255 }
      - { key: qualiopi_maj, name: Qualiopi data of, names: {fr: "Donnée Qualiopi du"}, kind: date }
  - type: map_pin
    properties:
      - { key: siret, name: SIRET, names: {fr: "SIRET"}, kind: text, max_len: 14, unique: true }
      - { key: effectif_tranche, name: Headcount band, names: {fr: "Tranche d'effectif"}, kind: text, max_len: 8 }
imports:
  - name: Company register (SIRENE)
    source: api
    source_url: "https://recherche-entreprises.api.gouv.fr/search?per_page=1"
    max_pages: 200
    mapping:
      key: recherche_entreprises
      name: Company register
      names: {fr: "Recherche d'entreprises"}
      format: json
      rows: results
      per_object: { type: organization, property: siren, param: q }
      objects:
        - as: ul
          type: organization
          key: siren
          create: false
          update: true
          missing: skip
          properties:
            siren: siren
            forme_juridique: nature_juridique
            naf: activite_principale
            etat_administratif: { from: etat_administratif, convert: [{ enum: { A: actif, C: cesse } }] }
            date_creation: date_creation
            date_cessation: date_fermeture
            effectif_tranche: tranche_effectif_salarie
            effectif_min: { from: tranche_effectif_salarie, convert: [&effectif_min { enum: { NN: "", "00": "0", "01": "1", "02": "3", "03": "6", "11": "10", "12": "20", "21": "50", "22": "100", "31": "200", "32": "250", "41": "500", "42": "1000", "51": "2000", "52": "5000", "53": "10000" } }] }
            effectif_max: { from: tranche_effectif_salarie, convert: [&effectif_max { enum: { NN: "", "00": "0", "01": "2", "02": "5", "03": "9", "11": "19", "12": "49", "21": "99", "22": "199", "31": "249", "32": "499", "41": "999", "42": "1999", "51": "4999", "52": "9999", "53": "" } }] }
            pays: { value: FR }
            code_activite: { from: activite_principale, convert: ["left:5"] }
            qualiopi: complements.est_qualiopi
        - as: siege
          type: map_pin
          key: siret
          title: nom_complet
          location: { lat: siege.latitude, lon: siege.longitude }
          properties:
            siret: siege.siret
            siege: { value: true }
            etat_administratif: { from: siege.etat_administratif, convert: [{ enum: { A: actif, F: ferme } }] }
            effectif_tranche: siege.tranche_effectif_salarie
            effectif_min: { from: siege.tranche_effectif_salarie, convert: [*effectif_min] }
            effectif_max: { from: siege.tranche_effectif_salarie, convert: [*effectif_max] }
        - as: etab
          type: map_pin
          key: siret
          each: matching_etablissements
          title: ^nom_complet
          location: { lat: latitude, lon: longitude }
          properties:
            siret: siret
            siege: est_siege
            etat_administratif: { from: etat_administratif, convert: [{ enum: { A: actif, F: ferme } }] }
            effectif_tranche: tranche_effectif_salarie
            effectif_min: { from: tranche_effectif_salarie, convert: [*effectif_min] }
            effectif_max: { from: tranche_effectif_salarie, convert: [*effectif_max] }
        - as: personne
          type: person
          key: identifiant_registre
          each: dirigeants
          when: { from: type_dirigeant, equals: personne physique }
          title: { concat: [prenoms, nom] }
          properties:
            identifiant_registre: { concat: [nom, prenoms, date_de_naissance], sep: "|", convert: [upper] }
        - as: holding
          type: organization
          key: siren
          each: dirigeants
          when: { from: type_dirigeant, equals: personne morale }
          title: denomination
          properties:
            siren: siren
      links:
        - { type: etablissement_de, from: siege, to: ul }
        - { type: etablissement_de, from: etab, to: ul }
        - type: dirige
          from: personne
          to: ul
          attributes: &mandate
            role:
              from: qualite
              convert:
                - lower
                - enum:
                    "président": president
                    "président de sas": president
                    "directeur général": directeur_general
                    "directeur général délégué": dg_delegue
                    "gérant": gerant
                    "co-gérant": gerant
                    "administrateur": administrateur
                    "membre du directoire": membre_directoire
                    "*": autre
            qualite: qualite
            source: { value: "recherche-entreprises.api.gouv.fr" }
        - type: dirige
          from: holding
          to: ul
          attributes: *mandate
