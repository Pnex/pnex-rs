# Country pack "B2B account mapping, France" (account-mapping.md D337,
# D343): what the account mapping needs from French registers. It joins
# `entreprises_fr` (SIREN, the register) and `prospection_b2b` (account
# status), so neither has to know the other.
# Target list: one API import per saved search of the company register
# (its filters in the URL: NAF codes, headcount bands, département…), paged
# up to the register's 10,000 results. New SIRENs enter as `cible`; an
# existing account keeps its status. The latest revenue the company
# published fills `ca_dernier` (its year stays in the register). The search gives the legal unit and
# its head office, not the other sites: the register import of
# `entreprises_fr` brings them, company by company.
# The shipped URL is an example (manufacturing, 100 employees and more,
# active): edit it to the org's ideal customer before running.
# Legal announcements (D335, BODACC): for each followed account (client,
# prospect, cible), the announcements of the register of commerce (sales,
# changes, openings, insolvency proceedings; account filings left out)
# become commercial signals linked to the account, `a_valider` when first
# seen and never reset after a human decided.
# Trade-show and association lists (D337): a file of participants (name,
# position, company, city) becomes list contacts; a flow finds each
# company's SIREN (`org_resolve`), creates the company and proposes the
# contact's attachment to it (to validate); an ambiguous company keeps its
# candidates for a human. A list contact is not a person of the graph: it
# becomes one only when someone works the lead.
key: prospection_fr
name: B2B account mapping, France
names: {fr: "Cartographie commerciale, France"}
version: "1.2.0"
requires: [entreprises_fr, prospection_b2b]
description: "French target lists from the company register: a saved search becomes accounts to target, without touching the status of known accounts."
descriptions: {fr: "Listes de ciblage françaises depuis le registre des entreprises : une recherche enregistrée devient des comptes à cibler, sans toucher au statut des comptes connus."}
types:
  - key: contact_liste
    name: List contact
    names: {fr: "Contact de liste"}
    icon: user
    properties:
      - { key: cle, name: Key, names: {fr: "Clé"}, kind: text, max_len: 600, required: true, unique: true }
      - { key: liste, name: List, names: {fr: "Liste"}, kind: text, max_len: 255, indexed: true }
      - { key: poste, name: Position, names: {fr: "Poste"}, kind: text, max_len: 255 }
      - { key: societe, name: Company as written, names: {fr: "Société (telle qu'écrite)"}, kind: text, max_len: 255 }
      - { key: ville, name: City, names: {fr: "Ville"}, kind: text, max_len: 255 }
      - { key: code_postal, name: Postcode, names: {fr: "Code postal"}, kind: text, max_len: 10 }
      - { key: email, name: E-mail, names: {fr: "E-mail"}, kind: text, max_len: 254 }
      - key: persona
        name: Persona
        names: {fr: "Persona"}
        kind: enum
        values: [decideur, champion, sponsor, prescripteur, acheteur, utilisateur, technique, autre]
        labels: {decideur: {fr: "Décideur", en: "Decision maker"}, champion: {fr: "Champion", en: "Champion"}, sponsor: {fr: "Sponsor", en: "Sponsor"}, prescripteur: {fr: "Prescripteur", en: "Influencer"}, acheteur: {fr: "Acheteur", en: "Buyer"}, utilisateur: {fr: "Utilisateur", en: "User"}, technique: {fr: "Technique", en: "Technical"}, autre: {fr: "Autre", en: "Other"}}
      - key: rapprochement
        name: Company found
        names: {fr: "Société retrouvée"}
        kind: enum
        values: [trouve, a_revoir, introuvable]
        labels: {trouve: {fr: "Trouvée", en: "Found"}, a_revoir: {fr: "À revoir", en: "To review"}, introuvable: {fr: "Introuvable", en: "Not found"}}
        colors: { trouve: green, a_revoir: amber, introuvable: gray }
        indexed: true
      - { key: siren_trouve, name: SIREN found, names: {fr: "SIREN retrouvé"}, kind: text, max_len: 9 }
      - { key: candidats, name: Candidates, names: {fr: "Candidats"}, kind: text, max_len: 2000 }
link_types:
  - key: contact_de
    name: is a contact at
    names: {fr: "est un contact chez"}
    inverse_name: has as list contact
    inverse_names: {fr: "a pour contact de liste"}
    from_types: [contact_liste]
    to_types: [organization]
    one_target: true
imports:
  - name: Trade show or association list (file)
    source: file
    mapping:
      key: liste_salon
      name: Trade show or association list
      names: {fr: "Liste de salon ou d'association"}
      objects:
        - as: contact
          type: contact_liste
          key: cle
          title: nom
          properties:
            cle: { concat: [liste, nom, societe], sep: "|" }
            liste: liste
            poste: poste
            societe: societe
            ville: ville
            code_postal: code_postal
            email: { from: email, convert: [email] }
  - name: Target list (company register search)
    source: api
    source_url: "https://recherche-entreprises.api.gouv.fr/search?section_activite_principale=C&tranche_effectif_salarie=22,31,32,41,42,51,52,53&etat_administratif=A&per_page=25"
    max_pages: 400
    mapping:
      key: liste_ciblage
      name: Target list
      names: {fr: "Liste de ciblage"}
      format: json
      rows: results
      page_param: page
      objects:
        - as: ul
          type: organization
          key: siren
          title: nom_complet
          defaults: { statut_compte: cible }
          properties:
            siren: siren
            forme_juridique: nature_juridique
            naf: activite_principale
            etat_administratif: { from: etat_administratif, convert: [{ enum: { A: actif, C: cesse } }] }
            date_creation: date_creation
            effectif_tranche: tranche_effectif_salarie
            effectif_min: { from: tranche_effectif_salarie, convert: [&effectif_min { enum: { NN: "", "00": "0", "01": "1", "02": "3", "03": "6", "11": "10", "12": "20", "21": "50", "22": "100", "31": "200", "32": "250", "41": "500", "42": "1000", "51": "2000", "52": "5000", "53": "10000" } }] }
            effectif_max: { from: tranche_effectif_salarie, convert: [&effectif_max { enum: { NN: "", "00": "0", "01": "2", "02": "5", "03": "9", "11": "19", "12": "49", "21": "99", "22": "199", "31": "249", "32": "499", "41": "999", "42": "1999", "51": "4999", "52": "9999", "53": "" } }] }
            pays: { value: FR }
            code_activite: { from: activite_principale, convert: ["left:5"] }
            ca_dernier: { from: finances.@last.ca, convert: ["money:EUR"] }
        - as: siege
          type: map_pin
          key: siret
          title: nom_complet
          location: { lat: siege.latitude, lon: siege.longitude }
          properties:
            siret: siege.siret
            siege: { value: true }
            etat_administratif: { from: siege.etat_administratif, convert: [{ enum: { A: actif, F: ferme } }] }
            effectif_tranche: siege.tranche_effectif_salarie
            effectif_min: { from: siege.tranche_effectif_salarie, convert: [*effectif_min] }
            effectif_max: { from: siege.tranche_effectif_salarie, convert: [*effectif_max] }
      links:
        - { type: etablissement_de, from: siege, to: ul }
  - name: Legal announcements (BODACC)
    source: api
    source_url: "https://bodacc-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/annonces-commerciales/records?where=registre%3D%22{value}%22%20and%20familleavis!%3D%22dpc%22&order_by=dateparution%20desc&limit=20"
    max_pages: 200
    mapping:
      key: bodacc
      name: Legal announcements
      names: {fr: "Annonces légales (BODACC)"}
      format: json
      rows: results
      per_object:
        type: organization
        property: siren
        only: { property: statut_compte, values: [client, prospect, cible] }
      objects:
        - as: ul
          type: organization
          key: siren
          create: false
          missing: skip
          properties:
            siren: { from: registre.0, convert: [digits] }
        - as: sig
          type: signal_commercial
          key: cle
          title: { concat: [commercant, familleavis_lib], sep: " · " }
          needs: ul
          defaults: { etat: a_valider }
          properties:
            cle: id
            kind: { from: familleavis, convert: [{ enum: { creation: nouvel_etablissement, radiation: fermeture_etablissement, "*": annonce_legale } }] }
            theme: familleavis
            resume: { concat: [familleavis_lib, typeavis_lib], sep: " — " }
            date: dateparution
            source_url: url_complete
        - as: sig_modif
          type: signal_commercial
          key: cle
          when: { from: familleavis, equals: modification }
          needs: ul
          properties:
            cle: id
            extrait: { from: modificationsgenerales, convert: [json, "field:descriptif"] }
        - as: sig_jugement
          type: signal_commercial
          key: cle
          when: { from: familleavis, equals: collective }
          needs: ul
          properties:
            cle: id
            extrait: { from: jugement, convert: [json, "field:nature"] }
        - as: sig_acte
          type: signal_commercial
          key: cle
          when: { from: familleavis, equals: immatriculation }
          needs: ul
          properties:
            cle: id
            extrait: { from: acte, convert: [json, "field:descriptif"] }
      links:
        - { type: signal_sur, from: sig, to: ul }
functions:
  - name: pl_preparer
    language: starlark
    description: The company of a list contact, as org_resolve asks it.
    code: |
      # The contact travels with the lookup (msg.contact).
      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          return {
              "payload": {"name": p.get("societe", ""), "city": p.get("ville", ""),
                          "postcode": p.get("code_postal", "")},
              "contact": {"id": o["id"], "title": o["title"]},
          }
  - name: pl_trouve
    language: starlark
    description: A company found for a list contact, and the contact marked.
    code: |
      # @output societe any "The company to create or update, by SIREN"
      # @output contact any "The contact, marked found"
      def handle(inputs, msg):
          p = msg["payload"]
          best = p["candidates"][0]
          return [
              {"payload": {"siren": best["siren"], "pays": "FR"}, "title": best["name"]},
              {"payload": {"rapprochement": "trouve", "siren_trouve": best["siren"]},
               "object_id": msg["contact"]["id"]},
          ]
  - name: pl_revoir
    language: starlark
    description: An ambiguous or unknown company, its candidates kept for a human.
    code: |
      def handle(inputs, msg):
          c = msg["payload"].get("candidates", [])
          lines = [x["name"] + " (" + x["siren"] + ", " + x.get("city", "") + ", " + str(x["score"]) + ")" for x in c]
          return {
              "payload": {"rapprochement": "a_revoir" if lines else "introuvable",
                          "candidats": "\n".join(lines)},
              "object_id": msg["contact"]["id"],
          }
  - name: pl_lien
    language: starlark
    description: Proposed attachment of the list contact to the company found.
    code: |
      def handle(inputs, msg):
          return {"payload": {"source_id": msg["contact"]["id"], "target_id": msg["object"]["id"],
                              "attributes": {}}}
flows:
  - name: "Prospection · list contacts to companies"
    note: "Every 15 minutes, up to 100 list contacts not looked up yet get their company's SIREN from the company register (org_resolve): a clear match creates the company and proposes the contact's attachment on the To validate page; an ambiguous one keeps its candidates on the contact (Company found: a_revoir). Deploy after importing a list."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "*/15 * * * *" }, outputs: [{ port: 0, targets: [todo] }] }
        - id: todo
          kind: ontology_query
          config:
            object_type: contact_liste
            filters: [{ key: rapprochement, op: missing }]
            limit: 100
          outputs: [{ port: 0, targets: [ask] }]
        - { id: ask, kind: pnex_function, config: { function_name: pl_preparer, language: starlark }, outputs: [{ port: 0, targets: [resolve] }] }
        - { id: resolve, kind: org_resolve, outputs: [{ port: 0, targets: [found] }, { port: 1, targets: [review] }] }
        - { id: found, kind: pnex_function, config: { function_name: pl_trouve, language: starlark }, outputs: [{ port: 0, targets: [company] }, { port: 1, targets: [mark] }] }
        - { id: company, kind: object_upsert, config: { object_type: organization, key: siren }, outputs: [{ port: 0, targets: [link] }] }
        - { id: link, kind: pnex_function, config: { function_name: pl_lien, language: starlark }, outputs: [{ port: 0, targets: [attach] }] }
        - { id: attach, kind: link_upsert, config: { link_type: contact_de, skip_closed: true, propose: true } }
        - { id: review, kind: pnex_function, config: { function_name: pl_revoir, language: starlark }, outputs: [{ port: 0, targets: [mark] }] }
        - { id: mark, kind: object_upsert, config: { object_type: contact_liste, key: id } }
