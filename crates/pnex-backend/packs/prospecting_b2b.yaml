# Business pack "B2B account mapping" (crm.md D329–D343): an
# account is the `organization` of the worldwide companies pack (any
# country; country packs add their registers), extended
# with its commercial status and coverage; no "company" or "account" type
# next to it (D304), so the graph stays one.
# `subsidiary_of` (group structure, D331) moved to the `companies` pack
# (1.1.0): it is not specific to selling.
# `last_revenue` is the latest known revenue and `revenue_year` its fiscal
# year: the core has no per-year scalar property (D178 temporal = O2
# series or events), past years stay in the object history.
# `persona` is the role in the buying committee, not a job title (the
# title stays on `employs.position`). Several people may follow one account,
# each with the role the org gives it (`follows_account.role`, free text).
# Coverage and white space are computed at read time (D330), never stored:
# the commercial group sums the users and lists the nodes without a
# contact or a customer status. Statuses carry a colour (D339) for the map,
# the hierarchy and the graph.
# Target score (D336): the pack ships the scoring function and its flow,
# never a criterion. Criteria are objects of the org (`targeting_criterion`:
# property, operator, value, points), so the profile of an ideal customer
# stays the org's data; the score is explained line by line in
# `score_detail`. Organizations only: sites are system objects a flow does
# not write, the explorer filters them on their own headcount.
# Account news (D539): the press feed of the France layer writes news items
# of the `watch` pack, to validate; a flow, with the org's LLM, gives them a
# topic of the org's list or dismisses those about something else.
# `press_names` holds the other names of a company in the press,
# comma-separated.
# Commercial signals (D335): something that moved on an account, kept with
# where it came from and the words quoted. `kind` says how it was detected
# (closed list), `topic` what it is about (the org's own list). A signal
# from a model is always `to_validate`; a human retains or dismisses it. The
# daily digest flow prepares one text of the new signals: add the org's
# notification node on its first port, then deploy.
# Watched pages (D335, news, careers, competitors' offers): a crawl of the
# page with a `record` into `watched_page` keeps its text and flags it when
# the text changed; a flow asks the org's LLM which topic of the org's list
# the page announces and writes a `page_changed` signal (to validate)
# about the account, quoting the sentence.
# Page templates (D340) are filled from the account they are opened on
# (placeholders of `page_render`): account plan, competitor sheet, meeting
# preparation. A snapshot of the day, then free text.
# Personal data (D341, crm.md D442–D447): the persona of a person is
# `personal`; `opposed_on` records an objection (prospecting flows
# skip the person); the legal basis shown on a person and the retention
# period of the erasure queue are settings of the org.
# Meetings: a `meeting` with an account, its participants (ours and
# theirs), its recording (a media: transcription and summary with a focus
# are the media analyses), its debrief page, and the criteria of the org's
# sales playbook it covered (`coaching_criterion`, the org's own list). The
# coaching reads per criterion how many meetings covered it: aggregates of
# the team's practice, never a score of a person. A meeting read from a
# mail invitation (crm pack) is keyed by the invitation's iCalendar UID
# (`invitation_uid`): an update moves it, a cancellation marks it.
# List contacts (D337): a file of trade-show or association participants
# (columns list, name, job_title, company, city, postal_code, email)
# becomes list contacts, not persons of the graph: one becomes a person
# only when someone works the lead. Matching a contact to its company
# (`registry_id`, `matching`, `candidates`, `contact_of`) is done by a
# country layer (`prospecting_b2b_fr` for France); nothing here is French.
# Since 2.0.0 every identifier is English (breaking).
# Since 3.0.0 the `personal` classification value and the flow names are English (breaking).
# Since 3.6.0 the settings of the person match (D788).
# Since 3.7.0 a person has a unique `profile_url`, the key of the network
# export import (one person per profile, an objection keeps them out, D610).
# Since 4.0.0 press news are `news_item` objects of the `watch` pack, linked
# by `item_about`; the signal kind `press` stays only for older signals.
# Since 4.0.0 `connections_keep_label` chooses the organizations whose
# people are kept from a contact's connections (D976, renumbered in 4.1.0).
# Since 4.2.0 a captured profile or employee list is a document linked by
# `captured_text`, kept by the pack's navigation pipelines (D996).
# Since 4.6.0 a contact's connections are read by the pipeline
# `connections_capture_linkedin` (D976, PE5.4).
key: prospecting_b2b
name: B2B account mapping
names: {fr: "Cartographie commerciale"}
version: "4.6.0"
requires: [companies, web_presence, watch]
description: "Accounts as a dated network: group and subsidiaries, sites with their commercial status, contacts by persona, who recommended whom. Questions: which subsidiaries of this group have no contact yet? Who follows this account? Which sites are customers?"
descriptions: {fr: "Les comptes vus comme un réseau daté : groupe et filiales, sites avec leur statut commercial, contacts par persona, qui a recommandé qui. Questions : quelles filiales de ce groupe n'ont encore aucun contact ? Qui suit ce compte ? Quels sites sont clients ?"}
settings:
  - key: legal_basis
    name: Legal basis
    names: {fr: "Base légale"}
    description: Legal basis of the processing of the contacts' personal data, shown on a person (D341).
    descriptions: {fr: "Base légale du traitement des données personnelles des contacts, affichée sur une personne (D341)."}
    kind: text
    default: legitimate_interest_b2b_prospecting
  - key: retention_months
    name: Retention (months)
    names: {fr: "Durée de conservation (mois)"}
    description: A person with no change, link or capture for this many months is proposed for erasure (D341).
    descriptions: {fr: "Une personne sans modification, lien ni capture depuis ce nombre de mois est proposée à l'effacement (D341)."}
    kind: number
    default: 36
    min: 6
    max: 120
  - key: match_write_threshold
    name: Score that attaches a profile
    names: {fr: "Score qui rattache un profil"}
    description: From this score a network profile found for a person is attached to them without a human (D788), by the flow "Prospecting · score profiles"; a job change is always proposed instead.
    descriptions: {fr: "À partir de ce score, un profil trouvé pour une personne lui est rattaché sans validation humaine (D788), par le flow « Prospecting · score profiles » ; un changement d'emploi est toujours proposé."}
    kind: number
    default: 80
    min: 1
    max: 100
  - key: match_propose_threshold
    name: Score that proposes a profile
    names: {fr: "Score qui propose un profil"}
    description: From this score (and below the attaching one) a profile found for a person waits in To validate; below, it is dropped.
    descriptions: {fr: "À partir de ce score (et sous celui qui rattache), un profil trouvé pour une personne attend dans « À valider » ; en dessous, il est écarté."}
    kind: number
    default: 40
    min: 1
    max: 100
  - key: connections_keep_label
    name: Organizations whose people are kept from a contact's connections
    names: {fr: "Organisations dont on garde les personnes du réseau d'un contact"}
    description: "Label (name, or name:value) of the organizations whose employees are kept when a contact's LinkedIn connections are explored (D976); everyone else is counted, never written. Empty keeps nobody."
    descriptions: {fr: "Étiquette (nom, ou nom:valeur) des organisations dont on garde les salariés quand on explore les relations LinkedIn d'un contact (D976) ; les autres sont comptés, jamais enregistrés. Vide : personne n'est gardé."}
    kind: text
    default: ""
  - key: match_retry_days
    name: Days before searching someone again
    names: {fr: "Jours avant de rechercher à nouveau une personne"}
    description: A person searched without a match is searched again after this many days.
    descriptions: {fr: "Une personne recherchée sans résultat est recherchée à nouveau après ce nombre de jours."}
    kind: number
    default: 90
    min: 1
    max: 365
extends:
  - type: organization
    properties:
      - key: account_status
        name: Account status
        names: {fr: "Statut du compte"}
        kind: enum
        values: [customer, prospect, target, former_customer, competitor, partner, excluded]
        labels: {customer: {fr: "Client", en: "Customer"}, prospect: {fr: "Prospect", en: "Prospect"}, target: {fr: "Cible", en: "Target"}, former_customer: {fr: "Ancien client", en: "Former customer"}, competitor: {fr: "Concurrent", en: "Competitor"}, partner: {fr: "Partenaire", en: "Partner"}, excluded: {fr: "Exclu", en: "Excluded"}}
        colors: { customer: green, prospect: amber, target: blue, former_customer: gray, competitor: red, partner: violet, excluded: gray }
        indexed: true
      - { key: current_users, name: Current users, names: {fr: "Utilisateurs actuels"}, kind: number, min: 0 }
      - { key: potential_users, name: Potential users, names: {fr: "Utilisateurs potentiels"}, kind: number, min: 0 }
      - { key: last_revenue, name: Latest revenue, names: {fr: "Dernier chiffre d'affaires"}, kind: money }
      - { key: revenue_year, name: Revenue fiscal year, names: {fr: "Exercice du chiffre d'affaires"}, kind: number, min: 1900, max: 2100 }
      - { key: target_score, name: Target score, names: {fr: "Score de ciblage"}, kind: number, indexed: true }
      - { key: score_detail, name: Score detail, names: {fr: "Détail du score"}, kind: text, max_len: 4000 }
      - { key: scored_on, name: Scored on, names: {fr: "Score calculé le"}, kind: date }
      - { key: press_names, name: Other names in the press, names: {fr: "Autres noms dans la presse"}, kind: text, max_len: 500 }
      # Folded name of a company created from what a profile states, not from a
      # register (D999): finds it again for the next person who works there.
      - { key: name_key, name: Name key, names: {fr: "Clé de nom"}, kind: text, max_len: 255, unique: true, indexed: true }
      # Captured employee list not read yet (D779): a document id, set by the server.
      - { key: people_to_read, name: Employee list to read, names: {fr: "Liste des salariés à lire"}, kind: text, max_len: 64 }
  - type: map_pin
    properties:
      - key: establishment_status
        name: Establishment status
        names: {fr: "Statut de l'établissement"}
        kind: enum
        values: [customer, prospect, not_covered]
        labels: {customer: {fr: "Client", en: "Customer"}, prospect: {fr: "Prospect", en: "Prospect"}, not_covered: {fr: "Non couvert", en: "Not covered"}}
        colors: { customer: green, prospect: amber, not_covered: gray }
        indexed: true
      - { key: current_users, name: Current users, names: {fr: "Utilisateurs actuels"}, kind: number, min: 0 }
  - type: person
    properties:
      # What a captured profile says (D538), read by a flow: a person's
      # own page, kept as what it said, never a verified fact.
      - { key: profile_to_read, name: Captured text to read, names: {fr: "Texte capturé à lire"}, kind: text, max_len: 64 }
      - { key: profile_position, name: Position on the profile, names: {fr: "Poste sur le profil"}, kind: text, max_len: 255, classification: personal }
      - { key: profile_company, name: Company on the profile, names: {fr: "Société sur le profil"}, kind: text, max_len: 255, classification: personal }
      - { key: profile_read_on, name: Profile read on, names: {fr: "Profil lu le"}, kind: date }
      # One person per network profile: the key of the export import.
      - { key: profile_url, name: Profile URL, names: {fr: "URL du profil"}, kind: text, max_len: 2048, unique: true, classification: personal, contact_point: true }
      - { key: profile_city, name: City on the profile, names: {fr: "Ville sur le profil"}, kind: text, max_len: 255, classification: personal }
      # Set once a country layer looked up the employer named by the profile.
      - { key: employer_looked_up, name: Employer looked up, names: {fr: "Employeur recherché"}, kind: bool, indexed: true }
      - key: persona
        name: Persona
        names: {fr: "Persona"}
        kind: enum
        values: [decision_maker, champion, sponsor, influencer, buyer, user, technical, other]
        labels: {decision_maker: {fr: "Décideur", en: "Decision maker"}, champion: {fr: "Champion", en: "Champion"}, sponsor: {fr: "Sponsor", en: "Sponsor"}, influencer: {fr: "Prescripteur", en: "Influencer"}, buyer: {fr: "Acheteur", en: "Buyer"}, user: {fr: "Utilisateur", en: "User"}, technical: {fr: "Technique", en: "Technical"}, other: {fr: "Autre", en: "Other"}}
        indexed: true
        classification: personal
      - { key: review_on, name: Review on, names: {fr: "À revoir le"}, kind: date }
      - { key: opposed_on, name: Objected on, names: {fr: "Opposition le"}, kind: date, indexed: true }
      # Profile search (D788, D999): written by the pack's flows only.
      - key: match_state
        name: Profile search
        names: {fr: "Recherche de profil"}
        kind: enum
        values: [searching, proposed, found, not_found, no_company]
        labels: {searching: {fr: "En cours", en: "Searching"}, proposed: {fr: "À valider", en: "To validate"}, found: {fr: "Trouvé", en: "Found"}, not_found: {fr: "Introuvable", en: "Not found"}, no_company: {fr: "Sans société", en: "No company"}}
        colors: { searching: blue, proposed: amber, found: green, not_found: gray, no_company: gray }
        indexed: true
      - { key: match_step, name: Search query, names: {fr: "Requête de recherche"}, kind: number, min: 0 }
      - { key: match_subject, name: Search subject, names: {fr: "Sujet de la recherche"}, kind: text, max_len: 4000 }
      - { key: match_pending, name: Profiles to validate, names: {fr: "Profils à valider"}, kind: text, max_len: 4000, classification: personal }
      - { key: match_next_on, name: Search again on, names: {fr: "Rechercher à nouveau le"}, kind: date, indexed: true }
      # Document of the last search not scored yet: an id, set by the pipeline.
      - { key: match_to_score, name: Search to score, names: {fr: "Recherche à évaluer"}, kind: text, max_len: 64 }
    actions:
      - key: find_profile
        name: Find the LinkedIn profile
        names: {fr: "Chercher le profil LinkedIn"}
link_types:
  - key: captured_text
    name: has as captured text
    names: {fr: "a pour texte capturé"}
    inverse_name: is the captured text of
    inverse_names: {fr: "est le texte capturé de"}
    from_types: [person, organization]
    to_types: [media_asset]
  - key: recommended
    name: recommends
    names: {fr: "recommande"}
    inverse_name: is recommended by
    inverse_names: {fr: "est recommandé par"}
    from_types: [person]
    to_types: [person, organization]
    attributes:
      - { key: date, name: Date, names: {fr: "Date"}, kind: date }
      - { key: context, name: Context, names: {fr: "Contexte"}, kind: text, max_len: 1000 }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 1000 }
  - key: follows_account
    name: follows the account
    names: {fr: "suit le compte"}
    inverse_name: is followed by
    inverse_names: {fr: "est suivi par"}
    from_types: [person]
    to_types: [organization]
    attributes:
      - { key: role, name: Role, names: {fr: "Rôle"}, kind: text, max_len: 255 }
  - key: signal_about
    name: is about
    names: {fr: "porte sur"}
    inverse_name: has as signal
    inverse_names: {fr: "a pour signal"}
    from_types: [sales_signal]
    to_types: [organization, map_pin, person]
  - key: page_about
    name: is a page about
    names: {fr: "est une page sur"}
    inverse_name: has as page
    inverse_names: {fr: "a pour page"}
    from_types: [doc]
    to_types: [organization, meeting]
  - key: takes_part_in
    name: takes part in
    names: {fr: "participe à"}
    inverse_name: has as participant
    inverse_names: {fr: "a pour participant"}
    from_types: [person]
    to_types: [meeting]
    # A meeting concerns everyone in it: an erasure proposes it, a person decides.
    propose_erase_targets: true
    attributes:
      - key: side
        name: Side
        names: {fr: "Côté"}
        kind: enum
        values: [internal, customer]
        labels: {internal: {fr: "Interne", en: "Internal"}, customer: {fr: "Client", en: "Customer"}}
  - key: meeting_with
    name: is a meeting with
    names: {fr: "est un rendez-vous avec"}
    inverse_name: has as meeting
    inverse_names: {fr: "a pour rendez-vous"}
    from_types: [meeting]
    to_types: [organization, map_pin]
  - key: recording_of
    name: is the recording of
    names: {fr: "est l'enregistrement de"}
    inverse_name: has as recording
    inverse_names: {fr: "a pour enregistrement"}
    from_types: [media_asset]
    to_types: [meeting]
  - key: covered
    name: covered
    names: {fr: "a abordé"}
    inverse_name: was covered in
    inverse_names: {fr: "abordé lors de"}
    from_types: [meeting]
    to_types: [coaching_criterion]
    attributes:
      - { key: comment, name: Comment, names: {fr: "Commentaire"}, kind: text, max_len: 1000 }
  - key: uses_solution
    name: uses the solution of
    names: {fr: "utilise la solution de"}
    inverse_name: is the solution of
    inverse_names: {fr: "équipe"}
    from_types: [organization, map_pin]
    to_types: [organization]
    attributes:
      - { key: since, name: Since, names: {fr: "Depuis"}, kind: date }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 1000 }
  - key: contact_of
    name: is a contact at
    names: {fr: "est un contact chez"}
    inverse_name: has as list contact
    inverse_names: {fr: "a pour contact de liste"}
    from_types: [list_contact]
    to_types: [organization]
    one_target: true
hierarchies:
  - key: sales_group
    name: Commercial group
    names: {fr: "Groupe commercial"}
    steps:
      - { link: subsidiary_of, inverse: true }
      - { link: owns }
      - { link: establishment_of, inverse: true }
    # Coverage (D330): users summed, a node with a contact or a customer
    # status is covered, the others are the account's white space.
    sums: [current_users, potential_users]
    coverage:
      links: [employs]
      values: { establishment_status: [customer], account_status: [customer] }
    # Contacts by persona and signals still open across the group (D330).
    tallies:
      - { link: employs, by: persona }
      - { link: signal_about, only: { state: [to_validate, retained] } }
  # Coaching: from a playbook criterion, the meetings that covered it and
  # their accounts; the band counts them by status.
  - key: coaching
    name: Coaching
    names: {fr: "Coaching"}
    steps:
      - { link: covered, inverse: true }
      - { link: meeting_with }
types:
  - key: watched_page
    name: Watched page
    names: {fr: "Page suivie"}
    icon: newspaper
    properties:
      - { key: url, name: URL, names: {fr: "URL"}, kind: text, max_len: 2048, required: true, unique: true }
      - { key: text, name: Text, names: {fr: "Texte"}, kind: text, max_len: 20000 }
      - { key: changed, name: Changed, names: {fr: "Modifiée"}, kind: bool, indexed: true }
      - { key: account, name: Account (id), names: {fr: "Compte (id)"}, kind: text, max_len: 36 }
      - { key: last_seen, name: Last seen, names: {fr: "Vue la dernière fois"}, kind: date_time }
  - key: meeting
    name: Meeting
    names: {fr: "Rendez-vous"}
    icon: user
    # The title and purpose come from an invitation and may name people (D610).
    title_classification: personal
    properties:
      - { key: date, name: Date, names: {fr: "Date"}, kind: date_time, indexed: true }
      - { key: purpose, name: Purpose, names: {fr: "Objet"}, kind: text, max_len: 500, classification: personal }
      - key: status
        name: Status
        names: {fr: "Statut"}
        kind: enum
        values: [planned, held, cancelled]
        labels: {planned: {fr: "Prévu", en: "Planned"}, held: {fr: "Tenu", en: "Held"}, cancelled: {fr: "Annulé", en: "Cancelled"}}
        colors: { planned: blue, held: green, cancelled: gray }
        indexed: true
      - { key: place, name: Place, names: {fr: "Lieu"}, kind: text, max_len: 255, classification: personal }
      - { key: next_step, name: Next step, names: {fr: "Suite donnée"}, kind: text, max_len: 2000, classification: personal }
      # Not personal on purpose: it survives an erasure so an update of the same
      # invitation hits the erased meeting, refused, instead of recreating it.
      # To review if an organizer's calendar puts an address in its UIDs.
      - { key: invitation_uid, name: Invitation id, names: {fr: "Identifiant de l'invitation"}, kind: text, max_len: 1024, unique: true }
  - key: coaching_criterion
    name: Playbook criterion
    names: {fr: "Critère du playbook"}
    icon: tag
    properties:
      - { key: description, name: Description, names: {fr: "Description"}, kind: text, max_len: 2000 }
      - key: persona
        name: Persona
        names: {fr: "Persona"}
        kind: enum
        values: [decision_maker, champion, sponsor, influencer, buyer, user, technical, other]
        labels: {decision_maker: {fr: "Décideur", en: "Decision maker"}, champion: {fr: "Champion", en: "Champion"}, sponsor: {fr: "Sponsor", en: "Sponsor"}, influencer: {fr: "Prescripteur", en: "Influencer"}, buyer: {fr: "Acheteur", en: "Buyer"}, user: {fr: "Utilisateur", en: "User"}, technical: {fr: "Technique", en: "Technical"}, other: {fr: "Autre", en: "Other"}}
      - { key: active, name: Active, names: {fr: "Actif"}, kind: bool }
  - key: sales_signal
    name: Commercial signal
    names: {fr: "Signal commercial"}
    icon: flag
    properties:
      - { key: ref, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, required: true, unique: true }
      - key: kind
        name: Detected by
        names: {fr: "Détecté par"}
        kind: enum
        values: [new_establishment, establishment_closure, executive_change, legal_notice, page_changed, job_change, press, other]
        labels: {new_establishment: {fr: "Nouvel établissement", en: "New site"}, establishment_closure: {fr: "Fermeture d'établissement", en: "Site closed"}, executive_change: {fr: "Changement de dirigeant", en: "New executive"}, legal_notice: {fr: "Annonce légale", en: "Legal notice"}, page_changed: {fr: "Page modifiée", en: "Page changed"}, job_change: {fr: "Changement de poste", en: "Job change"}, press: {fr: "Presse", en: "Press"}, other: {fr: "Autre", en: "Other"}}
        required: true
        indexed: true
      - { key: topic, name: Theme, names: {fr: "Thème"}, kind: text, max_len: 64, indexed: true }
      - { key: summary, name: Summary, names: {fr: "Résumé"}, kind: text, max_len: 1000 }
      - { key: excerpt, name: Quoted excerpt, names: {fr: "Extrait cité"}, kind: text, max_len: 4000 }
      - { key: date, name: Date, names: {fr: "Date"}, kind: date, indexed: true }
      - { key: source_url, name: Source, names: {fr: "Source"}, kind: url }
      - { key: lang, name: Language of the source, names: {fr: "Langue de la source"}, kind: text, max_len: 8 }
      - { key: credit, name: Collected through, names: {fr: "Collecté via"}, kind: text, max_len: 255 }
      - { key: tone, name: Tone of the article, names: {fr: "Tonalité de l'article"}, kind: number }
      - key: state
        name: State
        names: {fr: "État"}
        kind: enum
        values: [to_validate, retained, dismissed]
        labels: {to_validate: {fr: "À valider", en: "To validate"}, retained: {fr: "Retenu", en: "Kept"}, dismissed: {fr: "Écarté", en: "Dismissed"}}
        colors: { to_validate: amber, retained: green, dismissed: gray }
        indexed: true
      - { key: notified_on, name: Notified on, names: {fr: "Notifié le"}, kind: date }
  - key: targeting_criterion
    name: Targeting criterion
    names: {fr: "Critère de ciblage"}
    icon: tag
    properties:
      - key: property
        name: Property
        names: {fr: "Propriété"}
        kind: text
        max_len: 64
        required: true
      - key: operator
        name: Operator
        names: {fr: "Opérateur"}
        kind: enum
        values: [equals, one_of, starts_with, at_least, at_most, filled]
        labels: {equals: {fr: "Égal à", en: "Equals"}, one_of: {fr: "Parmi", en: "One of"}, starts_with: {fr: "Commence par", en: "Starts with"}, at_least: {fr: "Au moins", en: "At least"}, at_most: {fr: "Au plus", en: "At most"}, filled: {fr: "Renseigné", en: "Filled in"}}
        required: true
      - { key: value, name: Value, names: {fr: "Valeur"}, kind: text, max_len: 1000 }
      - { key: points, name: Points, names: {fr: "Points"}, kind: number, required: true }
      - { key: active, name: Active, names: {fr: "Actif"}, kind: bool }
