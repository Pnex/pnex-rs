  - name: pn_topic
    language: starlark
    description: "The model's answer about a news item: its topic, or dismissed when it is about something else."
    code: |
      # The org's topics (D335): edit this list to the org's own, the
      # prompt of the LLM node names the same keys.
      TOPICS = ["new_site", "investment", "hiring", "new_line", "takeover", "results",
                "restructuring", "management", "contract", "partnership", "new_offer", "incident"]

      def handle(inputs, msg):
          lines = [l.strip() for l in msg["payload"].get("text", "").strip().split("\n") if l.strip()]
          topic = lines[0].strip("`*. ").lower() if lines else "none"
          # Only an explicit none dismisses: an answer off the list may still
          # be real news, it stays for a human.
          if topic == "none":
              return {"payload": {"topic": "none", "state": "dismissed"}, "object_id": msg["signal"]}
          if topic not in TOPICS:
              return {"payload": {"topic": "other"}, "object_id": msg["signal"]}
          return {"payload": {"topic": topic}, "object_id": msg["signal"]}
