pipeline_functions:
  # A LinkedIn people results page read without a model (D785, D998): each
  # person's block ("<name> • <degree>", headline, place) paired with the
  # profile link bearing their name. Checked on the live page 2026-11-18.
  - name: person_match_collect
    language: starlark
    description: Results of a person search that bear the person's name (rows person_id, step, query, words, name, text of each extract → one bundle per person).
    code: |
      FOLD = {"à": "a", "â": "a", "ä": "a", "á": "a", "ã": "a", "å": "a", "ç": "c",
              "é": "e", "è": "e", "ê": "e", "ë": "e", "í": "i", "ì": "i", "î": "i",
              "ï": "i", "ñ": "n", "ó": "o", "ò": "o", "ô": "o", "ö": "o", "õ": "o",
              "ø": "o", "ú": "u", "ù": "u", "û": "u", "ü": "u", "ý": "y", "ÿ": "y",
              "œ": "oe", "æ": "ae", "ß": "ss"}
      # Degree marks after a name in LinkedIn's people results (fr, en).
      DEGREES = ["1er", "2e", "3e et +", "3e", "1st", "2nd", "3rd", "3rd+"]
      # Buttons of a result card, never a headline or a place.
      ACTIONS = ["Message", "Se connecter", "Suivre", "En attente", "Connect", "Follow", "Pending"]

      def words(text):
          out = []
          cur = ""
          for c in (text or "").lower().elems():
              c = FOLD.get(c, c)
              if c.isalnum():
                  cur += c
              elif cur:
                  out.append(cur)
                  cur = ""
          if cur:
              out.append(cur)
          return out

      # The canonical address of a profile link, None for anything else.
      def profile_url(link):
          at = (link or "").find("linkedin.com/in/")
          if at < 0:
              return None
          slug = link[at + len("linkedin.com/in/"):].split("?")[0].split("#")[0].split("/")[0].lower()
          if slug == "" or len(slug) > 100:
              return None
          for c in slug.elems():
              if not (c.isalnum() or c in "-_%"):
                  return None
          return "https://www.linkedin.com/in/" + slug

      # The people of a results page, in page order: name, headline, place. A
      # person starts at "<name> • <degree>" (or the name on the line before the mark).
      def people_of(text):
          lines = [l.strip() for l in (text or "").split("\n")]
          lines = [l for l in lines if l]
          out = []
          for i in range(len(lines)):
              l = lines[i]
              if "•" not in l:
                  continue
              head = l.split("•")[0].strip()
              mark = l.split("•")[-1].strip()
              if mark not in DEGREES:
                  continue
              name = head if head else (lines[i - 1] if i > 0 else "")
              rest = lines[i + 1:i + 3]
              headline = rest[0] if len(rest) > 0 else ""
              place = rest[1] if len(rest) > 1 else ""
              if headline in ACTIONS:
                  headline, place = "", ""
              if place in ACTIONS:
                  place = ""
              if headline == "--":
                  headline = ""
              if name:
                  out.append({"name": name, "headline": headline, "place": place})
          return out

      # Each person paired with the profile link whose text is their name, in order.
      def with_links(people, cards):
          by_name = {}
          used = []
          for c in cards:
              url = profile_url(c.get("link"))
              t = (c.get("card") or "").strip()
              if url == None or t == "" or "•" in t or url in used:
                  continue
              used.append(url)
              by_name.setdefault(t, []).append(url)
          out = []
          for p in people:
              urls = by_name.get(p["name"]) or []
              if urls:
                  out.append(dict(p, url = urls.pop(0)))
          return out

      # A headline segment that reads as a company name: three words at most, each
      # capitalized, none a word of a role ("Business Partnering", "Biomethane investor").
      ROLE_WORDS = ["investor", "talent", "partnering", "consultant", "consulting", "advisor",
                    "freelance", "coach", "mentor", "recruiter", "recruitment", "expert", "founder",
                    "engineer", "manager", "student", "speaker", "author", "entrepreneur", "passionate"]

      def looks_like_company(segment):
          ws = segment.strip().split(" ")
          if not ws or len(ws) > 3:
              return False
          for w in ws:
              if not w or not (w[0].isupper() or w[0].isdigit()) or w.lower() in ROLE_WORDS:
                  return False
          return True

      # The position and the company a headline states, "" when it names none
      # ("Plant manager at Example", "Chef chez X", "Engineer | Acme", "CEO de Acme").
      def employer(headline):
          h = (headline or "").strip()
          for sep in [" chez ", " at ", " @ ", " @"]:
              at = h.rfind(sep)
              if at > 0:
                  company = h[at + len(sep):].split("|")[0].split(" - ")[0].split(",")[0].split(" and ")[0].split(" et ")[0].strip(" .")
                  return h[:at].strip(), company[:120]
          if "|" in h:
              parts = [x.strip() for x in h.split("|")]
              if len(parts) >= 2 and looks_like_company(parts[1]):
                  return parts[0], parts[1][:120]
          at = h.rfind(" de ")
          if at > 0:
              tail = h[at + 4:].strip(" .")
              if tail and " " not in tail and tail[0].isupper():
                  return h[:at].strip(), tail[:120]
          return h, ""

      CANDIDATES = 5
      CARD_MAX = 1000

      def handle(rows):
          by_person = {}
          for r in rows:
              p = by_person.setdefault(r.get("person_id"), {"row": r, "extracts": {}})
              if r.get("name"):
                  p["extracts"][r.get("name")] = r.get("text") or ""
          out = []
          for p in by_person.values():
              r = p["row"]
              name = words(r.get("words"))
              cards = json.decode(p["extracts"].get("results") or "[]")
              found = with_links(people_of(p["extracts"].get("text")), cards)
              kept = []
              for c in found[:CANDIDATES]:
                  theirs = words(c["name"])
                  # Minimisation (D998): only someone bearing the person's name is kept.
                  if name and all([w in theirs for w in name]):
                      card = "\n".join([c["name"], c["headline"], c["place"]])[:CARD_MAX]
                      kept.append({"url": c["url"], "name": c["name"], "headline": c["headline"],
                                   "place": c["place"], "card": card, "profile": ""})
              bundle = json.encode({"query": r.get("query"), "step": int(r.get("step") or 0), "candidates": kept})
              out.append({"person_id": r.get("person_id"), "step": str(r.get("step")),
                          "query": r.get("query") or "", "bundle": bundle,
                          "kept_urls": " ".join([k["url"] for k in kept])})
          return out
