  - name: ppl_read
    language: starlark
    description: "The model's lines about an employee list: one list contact per person named, and the organization marked read."
    outputs:
      - {name: people, ty: any, desc: "The people named, as list contacts"}
      - {name: read, ty: any, desc: "The organization, marked read"}
    code: |
      # One line per person: "<full name> | <position>" (D779).
      def handle(inputs, msg):
          org = msg["org"]
          title = msg.get("org_title", "")
          people = []
          seen = {}
          for line in msg["payload"].get("text", "").split("\n"):
              parts = [x.strip().strip("`*\"-").strip() for x in line.split("|")]
              name = parts[0][:255] if parts else ""
              if len(name) < 3 or name.lower() in ["none", "unknown"] or name.lower() in seen:
                  continue
              seen[name.lower()] = True
              job = parts[1][:255] if len(parts) > 1 and parts[1].lower() not in ["none", "unknown"] else ""
              people.append({"name": name, "properties": {
                  "ref": ("linkedin|" + org + "|" + name.lower())[:600],
                  "list": ("LinkedIn · " + title)[:255],
                  "job_title": job,
                  "company": title[:255],
                  "matching": "found",
              }})
              if len(people) >= 200:
                  break
          read = {"payload": {"people_to_read": ""}, "object_id": org}
          if not people:
              return [None, read]
          return [{"payload": people, "org": org, "org_title": title}, read]
