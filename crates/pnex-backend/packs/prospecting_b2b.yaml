  - name: pm_pick
    language: starlark
    description: "A person of a target or prospect account due for a search: no LinkedIn profile yet, no objection, no search running, its retry date passed."
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          if p.get("opposed_on") or p.get("match_state") in ["searching", "proposed"]:
              return None
          # Read from the member's own connections: the address is known already.
          if "linkedin.com/in/" in (p.get("profile_url") or ""):
              return None
          due = p.get("match_next_on") or ""
          if due and due > msg.get("today", ""):
              return None
          for l in (msg.get("links") or {}).get("uses_identifier") or []:
              value = ((l.get("other") or {}).get("properties") or {}).get("value") or ""
              if "linkedin.com/in/" in value:
                  return None
          return {"payload": {}, "person_id": msg["object"]["id"], "manual": False}
  - name: pm_employer
    language: starlark
    description: The current employer of the person to search (latest open employs link); a person with no company is marked so.
    outputs:
      - {name: employer, ty: any, desc: "The person and the id of their employer"}
      - {name: state, ty: any, desc: "The person marked without a company"}
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          if p.get("opposed_on"):
              return None
          links = msg.get("links") or {}
          # A profile address already known (a connection read, an export) needs
          # no automatic search; a member may still ask for one.
          if not msg.get("manual") and "linkedin.com/in/" in (p.get("profile_url") or ""):
              return None
          if not msg.get("manual"):
              for l in links.get("uses_identifier") or []:
                  value = ((l.get("other") or {}).get("properties") or {}).get("value") or ""
                  if "linkedin.com/in/" in value:
                      return None
          jobs = [l for l in links.get("employs") or [] if l.get("direction") == "in"]
          if not jobs:
              return [None, {"payload": {"match_state": "no_company"}, "object_id": msg["object"]["id"]}]
          job = sorted(jobs, key = lambda l: l.get("valid_from") or "")[-1]
          return [{"payload": {}, "person_id": msg["object"]["id"], "person_name": msg["object"]["title"],
                   "org_id": job["other"]["id"]}, None]
  - name: pm_subject
    language: starlark
    description: "What a profile must say to be the person (folded name, company and group names, site cities) and the ladder of queries, from the graph as it is now; the first query asked."
    code: |
      FOLD = {"à": "a", "â": "a", "ä": "a", "á": "a", "ã": "a", "å": "a", "ç": "c",
              "é": "e", "è": "e", "ê": "e", "ë": "e", "í": "i", "ì": "i", "î": "i",
              "ï": "i", "ñ": "n", "ó": "o", "ò": "o", "ô": "o", "ö": "o", "õ": "o",
              "ø": "o", "ú": "u", "ù": "u", "û": "u", "ü": "u", "ý": "y", "ÿ": "y",
              "œ": "oe", "æ": "ae", "ß": "ss"}
      LEGAL_FORMS = ["sa", "sas", "sasu", "sarl", "eurl", "sca", "scs", "snc", "sci", "inc", "llc",
                     "ltd", "limited", "gmbh", "ag", "bv", "nv", "spa", "srl", "plc", "corp",
                     "corporation", "co"]
      QUERIES_MAX = 5
      QUERY_MAX = 120

      def words(text):
          out = []
          cur = ""
          for c in (text or "").lower().elems():
              c = FOLD.get(c, c)
              if c.isalnum():
                  cur += c
              elif cur:
                  out.append(cur)
                  cur = ""
          if cur:
              out.append(cur)
          return out

      # A company name as typed in a search bar: legal forms and brackets dropped.
      def company_words(name):
          cut = (name or "").split("(")[0].split("[")[0]
          return [w for w in words(cut) if w not in LEGAL_FORMS]

      def is_arrondissement(w):
          for end in ["eme", "er", "e"]:
              if w.endswith(end) and len(w) > len(end) and w[:len(w) - len(end)].isdigit():
                  return True
          return False

      # City of a French register address: the words after the postal code.
      def city_of(address):
          ws = words(address)
          at = -1
          for i in range(len(ws)):
              if len(ws[i]) == 5 and ws[i].isdigit():
                  at = i
          if at < 0:
              return ""
          city = [w for w in ws[at + 1:] if not is_arrondissement(w) and w != "cedex" and not w.isdigit()]
          return " ".join(city)

      def handle(inputs, msg):
          name = words(msg.get("person_name"))
          if not name:
              return None
          org = msg["payload"]
          names = [msg["object"]["title"]]
          for key in ["press_names", "aliases"]:
              more = org.get(key) or ""
              for sep in [";", "|", "\n"]:
                  more = more.replace(sep, ",")
              names += [n.strip() for n in more.split(",") if n.strip()]
          links = msg.get("links") or {}
          # Parent first, then subsidiaries: the names a profile may carry.
          group = sorted(links.get("subsidiary_of") or [], key = lambda l: 0 if l.get("direction") == "out" else 1)
          groups = [(l.get("other") or {}).get("title") or "" for l in group][:5]
          sites = [l for l in links.get("establishment_of") or [] if l.get("direction") == "in"]
          sites = sorted(sites, key = lambda l: 0 if ((l.get("other") or {}).get("properties") or {}).get("head_office") else 1)
          cities = []
          for l in sites:
              c = city_of(((l.get("other") or {}).get("properties") or {}).get("address"))
              if c and c not in cities:
                  cities.append(c)
          cities = cities[:3]
          orgs = [w for w in [company_words(n) for n in names] if w]
          grps = [w for w in [company_words(n) for n in groups] if w]
          full = " ".join(name)
          queries = []
          for ws in orgs + grps:
              q = (full + " " + " ".join(ws))[:QUERY_MAX]
              if q not in queries and len(queries) < QUERIES_MAX:
                  queries.append(q)
          if cities:
              q = (full + " " + cities[0])[:QUERY_MAX]
              if q not in queries and len(queries) < QUERIES_MAX:
                  queries.append(q)
          # The name alone always ends the ladder.
          if full not in queries:
              if len(queries) == QUERIES_MAX:
                  queries.pop()
              queries.append(full)
          subject = {"name": name, "orgs": orgs, "groups": grps, "cities": [words(c) for c in cities],
                     "queries": queries}
          return {"payload": {"person_id": msg["person_id"], "query": queries[0], "step": "0", "words": full},
                  "person_id": msg["person_id"], "subject": json.encode(subject), "step": 0}
  - name: pm_asked
    language: starlark
    description: A search asked of the pipeline, written on the person (state, query, subject, next search date).
    code: |
      def days(y, m, d):
          y = y - 1 if m <= 2 else y
          era = y // 400
          yoe = y - era * 400
          mp = m + 9 if m <= 2 else m - 3
          doy = (153 * mp + 2) // 5 + d - 1
          return era * 146097 + yoe * 365 + yoe // 4 - yoe // 100 + doy - 719468

      def date_of(z):
          z += 719468
          era = z // 146097
          doe = z - era * 146097
          yoe = (doe - doe // 1460 + doe // 36524 - doe // 146096) // 365
          doy = doe - (365 * yoe + yoe // 4 - yoe // 100)
          mp = (5 * doy + 2) // 153
          d = doy - (153 * mp + 2) // 5 + 1
          m = mp + 3 if mp < 10 else mp - 9
          y = yoe + era * 400 + (1 if m <= 2 else 0)
          return "-".join([str(y), ("0" + str(m))[-2:], ("0" + str(d))[-2:]])

      def handle(inputs, msg):
          today = msg.get("today") or ""
          props = {"match_state": "searching", "match_step": msg.get("step", 0)}
          if msg.get("subject"):
              props["match_subject"] = msg["subject"]
              props["match_pending"] = ""
          if len(today) == 10:
              t = today.split("-")
              retry = int(pack_setting("prospecting_b2b.match_retry_days", 90))
              props["match_next_on"] = date_of(days(int(t[0]), int(t[1]), int(t[2])) + retry)
          return {"payload": props, "object_id": msg["person_id"]}
  - name: pm_doc
    language: starlark
    description: A person whose last search came back, its document asked for.
    code: |
      def handle(inputs, msg):
          doc = msg["payload"].get("match_to_score") or ""
          if not doc:
              return None
          return {"payload": {"media_id": doc}, "person": msg["object"], "person_props": msg["payload"],
                  "person_links": msg.get("links") or {}}
  - name: pm_decide
    language: starlark
    description: "Scores the profiles a search kept (name 30, current company 50, past 25, group 15, city 10): the best above the attaching score is captured, the plausible ones proposed, else the next query is asked."
    outputs:
      - {name: attach, ty: any, desc: "The profile to capture onto the person"}
      - {name: propose, ty: any, desc: "The plausible profiles, to validate"}
      - {name: next, ty: any, desc: "The next query of the ladder"}
      - {name: state, ty: any, desc: "The search state on the person"}
    code: |
      HEADER = 600

      def padded(ws):
          return " " + " ".join(ws) + " "

      def has(hay, phrase):
          return len(phrase) > 0 and padded(phrase) in hay

      def words(text):
          out = []
          cur = ""
          for c in (text or "").lower().elems():
              if c.isalnum():
                  cur += c
              elif cur:
                  out.append(cur)
                  cur = ""
          if cur:
              out.append(cur)
          return out

      FOLD = {"à": "a", "â": "a", "ä": "a", "á": "a", "ã": "a", "å": "a", "ç": "c",
              "é": "e", "è": "e", "ê": "e", "ë": "e", "í": "i", "ì": "i", "î": "i",
              "ï": "i", "ñ": "n", "ó": "o", "ò": "o", "ô": "o", "ö": "o", "õ": "o",
              "ø": "o", "ú": "u", "ù": "u", "û": "u", "ü": "u", "ý": "y", "ÿ": "y",
              "œ": "oe", "æ": "ae", "ß": "ss"}

      def folded(text):
          return "".join([FOLD.get(c, c) for c in (text or "").lower().elems()])

      # shortcut: the current position is told from the text after the name
      # (the header), not from the dated history; upgrade once the navigation
      # extracts the positions by selectors.
      def score(s, text):
          t = words(folded(text))
          name = s.get("name") or []
          out = {"total": 0, "detail": [], "left": False}
          if not name or not t:
              return out
          full = padded(t)
          at = full.find(padded(name))
          if at >= 0:
              header = full[at:at + HEADER] + " "
              out["total"] += 30
              out["detail"].append("name")
          elif all([(" " + w + " ") in full for w in name]):
              header = full[:HEADER] + " "
              out["total"] += 10
              out["detail"].append("name_partial")
          else:
              return out
          orgs = s.get("orgs") or []
          current = [o for o in orgs if has(header, o)]
          past = [o for o in orgs if has(full, o)]
          groups = [g for g in (s.get("groups") or []) if has(header, g)]
          if current:
              out["total"] += 50
              out["detail"].append("current_company:" + " ".join(current[0]))
          elif past:
              out["total"] += 25
              out["left"] = True
              out["detail"].append("past_company:" + " ".join(past[0]))
          elif groups:
              out["total"] += 15
              out["detail"].append("group:" + " ".join(groups[0]))
          cities = [c for c in (s.get("cities") or []) if has(header, c)]
          if cities:
              out["total"] += 10
              out["detail"].append("city:" + " ".join(cities[0]))
          out["total"] = min(out["total"], 100)
          return out

      # A headline segment that reads as a company name: three words at most, each
      # capitalized, none a word of a role ("Business Partnering", "Biomethane investor").
      ROLE_WORDS = ["investor", "talent", "partnering", "consultant", "consulting", "advisor",
                    "freelance", "coach", "mentor", "recruiter", "recruitment", "expert", "founder",
                    "engineer", "manager", "student", "speaker", "author", "entrepreneur", "passionate"]

      def looks_like_company(segment):
          ws = segment.strip().split(" ")
          if not ws or len(ws) > 3:
              return False
          for w in ws:
              if not w or not (w[0].isupper() or w[0].isdigit()) or w.lower() in ROLE_WORDS:
                  return False
          return True

      # The position and the company a headline states (see linkedin_connections).
      def employer(headline):
          h = (headline or "").strip()
          for sep in [" chez ", " at ", " @ ", " @"]:
              at = h.rfind(sep)
              if at > 0:
                  company = h[at + len(sep):].split("|")[0].split(" - ")[0].split(",")[0].split(" and ")[0].split(" et ")[0].strip(" .")
                  return h[:at].strip(), company[:120]
          if "|" in h:
              parts = [x.strip() for x in h.split("|")]
              if len(parts) >= 2 and looks_like_company(parts[1]):
                  return parts[0], parts[1][:120]
          at = h.rfind(" de ")
          if at > 0:
              tail = h[at + 4:].strip(" .")
              if tail and " " not in tail and tail[0].isupper():
                  return h[:at].strip(), tail[:120]
          return h, ""

      def handle(inputs, msg):
          person = msg["person"]
          props = msg.get("person_props") or {}
          s = json.decode(props.get("match_subject") or "{}")
          bundle = json.decode(msg["payload"].get("text") or "{}")
          step = int(bundle.get("step") or 0)
          write_at = int(pack_setting("prospecting_b2b.match_write_threshold", 80))
          propose_at = min(int(pack_setting("prospecting_b2b.match_propose_threshold", 40)), write_at)
          known = []
          for l in (msg.get("person_links") or {}).get("uses_identifier") or []:
              known.append(((l.get("other") or {}).get("properties") or {}).get("value") or "")
          scored = []
          already = False
          for c in bundle.get("candidates") or []:
              if c.get("url") in known:
                  already = True
                  continue
              sc = score(s, (c.get("card") or "") + "\n" + (c.get("profile") or ""))
              scored.append({"url": c["url"], "score": sc["total"], "detail": sc["detail"], "left": sc["left"],
                             "headline": c.get("headline") or "", "place": c.get("place") or ""})
          scored = sorted(scored, key = lambda c: -c["score"])
          state = {"match_to_score": ""}
          done = {"payload": state, "object_id": person["id"]}
          best = [c for c in scored if c["score"] >= write_at and not c["left"]]
          if best:
              url = best[0]["url"]
              state["match_state"] = "found"
              state["match_pending"] = ""
              # What the attached profile states: the flow "employers from
              # profiles" assigns the company.
              position, company = employer(best[0]["headline"])
              state["profile_position"] = position[:255]
              if company:
                  state["profile_company"] = company[:255]
              if best[0]["place"]:
                  state["profile_city"] = best[0]["place"][:255]
              capture = {"payload": {"url": url, "person_id": person["id"], "path": url[url.find("/in/"):]}}
              return [capture, None, None, done]
          plausible = [c for c in scored if c["score"] >= propose_at]
          # The search found again a profile the person already has: still found.
          if already and not plausible:
              state["match_state"] = "found"
              return [None, None, None, done]
          if plausible:
              state["match_state"] = "proposed"
              state["match_pending"] = " ".join([c["url"] for c in plausible])
              rows = [{"url": c["url"], "person_id": person["id"], "score": c["score"],
                       "evidence": json.encode({"url": c["url"], "score": c["score"], "detail": c["detail"],
                                                "left_company": c["left"], "query": step})}
                      for c in plausible]
              return [None, {"payload": rows}, None, done]
          queries = s.get("queries") or []
          if step + 1 < len(queries):
              state["match_state"] = "searching"
              state["match_step"] = step + 1
              row = {"person_id": person["id"], "query": queries[step + 1], "step": str(step + 1),
                     "words": " ".join(s.get("name") or [])}
              return [None, None, {"payload": row}, done]
          state["match_state"] = "not_found"
          return [None, None, None, done]
  - name: pm_event
    language: starlark
    description: A decided proposal of a profile for a person, kept on the message before the reads.
    code: |
      def handle(inputs, msg):
          e = msg["payload"]
          return {"payload": {}, "person_id": e["object_id"], "decision": e.get("action"),
                  "identifier_id": e.get("other_id") or ""}
  - name: pm_event_url
    language: starlark
    description: The address of the decided profile.
    code: |
      def handle(inputs, msg):
          return {"payload": {}, "url": msg["payload"].get("value") or ""}
  - name: pm_follow
    language: starlark
    description: "Follows a human decision on a proposed profile: accepted, it is captured onto the person; once every proposal of the search is rejected, the next query is asked."
    outputs:
      - {name: capture, ty: any, desc: "The accepted profile to capture"}
      - {name: next, ty: any, desc: "The next query of the ladder"}
      - {name: state, ty: any, desc: "The search state on the person"}
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          person = msg["object"]["id"]
          url = msg.get("url") or ""
          pending = [u for u in (p.get("match_pending") or "").split(" ") if u]
          if p.get("match_state") != "proposed" or url not in pending:
              return None
          if msg.get("decision") == "accepted":
              capture = {"payload": {"url": url, "person_id": person, "path": url[url.find("/in/"):]}}
              return [capture, None, {"payload": {"match_state": "found", "match_pending": ""}, "object_id": person}]
          rest = [u for u in pending if u != url]
          if rest:
              return [None, None, {"payload": {"match_pending": " ".join(rest)}, "object_id": person}]
          s = json.decode(p.get("match_subject") or "{}")
          queries = s.get("queries") or []
          step = int(p.get("match_step") or 0)
          if step + 1 < len(queries):
              row = {"person_id": person, "query": queries[step + 1], "step": str(step + 1),
                     "words": " ".join(s.get("name") or [])}
              state = {"match_state": "searching", "match_step": step + 1, "match_pending": ""}
              return [None, {"payload": row}, {"payload": state, "object_id": person}]
          return [None, None, {"payload": {"match_state": "not_found", "match_pending": ""}, "object_id": person}]
  - name: emp_pick
    language: starlark
    description: "A person whose profile states a company: the company to find or create by its folded name, unless they already work there."
    code: |
      FOLD = {"à": "a", "â": "a", "ä": "a", "á": "a", "ã": "a", "å": "a", "ç": "c",
              "é": "e", "è": "e", "ê": "e", "ë": "e", "í": "i", "ì": "i", "î": "i",
              "ï": "i", "ñ": "n", "ó": "o", "ò": "o", "ô": "o", "ö": "o", "õ": "o",
              "ø": "o", "ú": "u", "ù": "u", "û": "u", "ü": "u", "ý": "y", "ÿ": "y",
              "œ": "oe", "æ": "ae", "ß": "ss"}
      LEGAL_FORMS = ["sa", "sas", "sasu", "sarl", "eurl", "sca", "scs", "snc", "sci", "inc", "llc",
                     "ltd", "limited", "gmbh", "ag", "bv", "nv", "spa", "srl", "plc", "corp",
                     "corporation", "co"]

      def key_of(name):
          out = []
          cur = ""
          for c in (name or "").split("(")[0].lower().elems():
              c = FOLD.get(c, c)
              if c.isalnum():
                  cur += c
              elif cur:
                  out.append(cur)
                  cur = ""
          if cur:
              out.append(cur)
          return " ".join([w for w in out if w not in LEGAL_FORMS])

      def handle(inputs, msg):
          p = msg["payload"]
          company = (p.get("profile_company") or "").strip()
          key = key_of(company)
          # An objection stops everything about the person (D341).
          if p.get("opposed_on") or not key:
              return None
          for l in (msg.get("links") or {}).get("employs") or []:
              other = l.get("other") or {}
              if l.get("direction") == "in" and (key_of(other.get("title")) == key or
                                                 (other.get("properties") or {}).get("name_key") == key):
                  return None
          return {"payload": {"name_key": key}, "title": company, "person": msg["object"]["id"],
                  "position": p.get("profile_position") or ""}
  - name: emp_link
    language: starlark
    description: The person attached to the company their profile states, with their position.
    code: |
      def handle(inputs, msg):
          o = msg.get("object")
          if not o:
              return None
          attributes = {"position": msg["position"]} if msg.get("position") else {}
          return {"payload": {"source_id": o["id"], "target_id": msg["person"], "attributes": attributes}}
  - name: mc_pages
    language: starlark
    description: "The pages of the member's first-degree connections to read, 50 by message (LinkedIn shows 100 at most)."
    code: |
      PAGES = 100
      BATCH = 50

      def handle(inputs, msg):
          rows = [{"page": str(n), "network": "F"} for n in range(1, PAGES + 1)]
          return {"payload": [rows[i:i + BATCH] for i in range(0, len(rows), BATCH)]}
flows:
  - name: "Prospecting · captured employee lists"
    note: "Every hour, up to 5 organizations whose employee list was captured by a person (Capture employees, on the organization's page) are read by the organization's LLM: each person the page names becomes a list contact (name, position) and is proposed as a contact at that company on the To validate page. Someone who objected at that company is never brought back. It follows no link of the network and opens no profile. Needs an AI provider."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "40 * * * *" }, outputs: [{ port: 0, targets: [todo] }] }
        - id: todo
          kind: ontology_query
          config:
            object_type: organization
            filters:
              - { key: people_to_read, op: exists }
              - { key: people_to_read, op: ne, value: "" }
            limit: 5
          outputs: [{ port: 0, targets: [ask] }]
        - { id: ask, kind: pnex_function, config: { function_name: ppl_ask, language: starlark }, outputs: [{ port: 0, targets: [doc] }] }
        - { id: doc, kind: document_text, outputs: [{ port: 0, targets: [read] }] }
        - id: read
          kind: llm_text
          config:
            data_field: text
            max_chars: 12000
            prompt: "This is the text of a company's employee list page on a professional network. Write one line per person the page lists as working at the company, exactly '<full name> | <current position>', and nothing else. Skip the viewer's own name, ads, suggestions, and anyone not listed as an employee. Write none for a position the page does not give. Never guess or complete a name. If the page lists nobody, write none."
          outputs: [{ port: 0, targets: [parse] }]
        - { id: parse, kind: pnex_function, config: { function_name: ppl_read, language: starlark }, outputs: [{ port: 0, targets: [each] }, { port: 1, targets: [mark] }] }
        - { id: mark, kind: object_upsert, config: { object_type: organization, key: id } }
        - { id: each, kind: json_split, config: { auto: false }, outputs: [{ port: 0, targets: [one] }] }
        - { id: one, kind: pnex_function, config: { function_name: ppl_one, language: starlark }, outputs: [{ port: 0, targets: [contact] }] }
        - { id: contact, kind: object_upsert, config: { object_type: list_contact, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [link] }] }
        - { id: link, kind: pnex_function, config: { function_name: ppl_link, language: starlark }, outputs: [{ port: 0, targets: [attach] }] }
        - { id: attach, kind: link_upsert, config: { link_type: contact_of, skip_closed: true, propose: true } }
  - name: "Prospecting · watched pages to signals"
    note: "Every hour, up to 50 watched pages whose text changed are read by the organization's LLM: a page announcing a topic of the list (new site, investment, hiring, ramp-up, takeover, retirements, quality problem, multi-site, in-house school, new offer, prices) becomes a commercial signal about the account, to validate, quoting the sentence. Edit the topics in the function ps_signal and in the prompt together. Watch a page with a site crawl whose record writes type watched_page (url, text, changed → changed, link_to → account). Needs an AI provider."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 * * * *" }, outputs: [{ port: 0, targets: [changed] }] }
        - id: changed
          kind: ontology_query
          config:
            object_type: watched_page
            filters: [{ key: changed, op: eq, value: true }]
            limit: 50
          outputs: [{ port: 0, targets: [prep] }]
        - { id: prep, kind: pnex_function, config: { function_name: ps_prepare, language: starlark }, outputs: [{ port: 0, targets: [read] }] }
        - id: read
          kind: llm_text
          config:
            data_field: text
            max_chars: 600
            prompt: "This is the text of a company web page (news, careers, offers). If it announces one of these topics, answer on the first line with the topic key only, then on the second line quote word for word the sentence that says it. Otherwise answer only: none. Topics: new_site (a new plant, site or establishment), investment (an investment), hiring (a hiring wave), new_line (a new production line or a ramp-up), takeover (a takeover or a merger), retirements (retirements, generational change), quality (a quality problem or a recall), multi_site (a multi-site rollout), school (an in-house school or academy), new_offer (a new product or service), prices (prices or plans)."
          outputs: [{ port: 0, targets: [decide] }]
        - { id: decide, kind: pnex_function, config: { function_name: ps_signal, language: starlark }, outputs: [{ port: 0, targets: [signal] }, { port: 1, targets: [done] }] }
        - { id: signal, kind: object_upsert, config: { object_type: sales_signal, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [about] }] }
        - { id: about, kind: pnex_function, config: { function_name: ps_link, language: starlark }, outputs: [{ port: 0, targets: [linked] }] }
        - { id: linked, kind: link_upsert, config: { link_type: signal_about } }
        - { id: done, kind: object_upsert, config: { object_type: watched_page, key: id } }
  - name: "Prospecting · news to topics"
    note: "Every hour, up to 50 news items not yet read go to the organization's LLM with their account: a topic of the list goes on the item, an article about something else (a namesake, a passing mention) is dismissed. A human still retains or dismisses the others. Needs an AI provider."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "10 * * * *" }, outputs: [{ port: 0, targets: [unread] }] }
        - id: unread
          kind: ontology_query
          config:
            object_type: news_item
            filters:
              - { key: state, op: eq, value: to_validate }
              - { key: topic, op: missing }
            with_links: [item_about]
            limit: 50
          outputs: [{ port: 0, targets: [prep] }]
        - { id: prep, kind: pnex_function, config: { function_name: pn_prepare, language: starlark }, outputs: [{ port: 0, targets: [read] }] }
        - id: read
          kind: llm_text
          config:
            data_field: text
            max_chars: 200
            prompt: "This is a press headline found for a company (the account). If it is really about that company and announces one of these topics, answer with the topic key only: new_site, investment, hiring, new_line, takeover, results, restructuring, management, contract (won or competed for), partnership, new_offer, incident (a cyberattack, strike, accident, recall or crisis hitting the company). Otherwise (a namesake, a passing mention, another subject), answer none."
          outputs: [{ port: 0, targets: [topic] }]
        - { id: topic, kind: pnex_function, config: { function_name: pn_topic, language: starlark }, outputs: [{ port: 0, targets: [done] }] }
        - { id: done, kind: object_upsert, config: { object_type: news_item, key: id } }
  - name: "Prospecting · signals digest"
    note: "Each morning the commercial signals not yet notified make one digest (payload.text, payload.count), then are marked notified. Add a JSON Split node on the digest port with the keys trigger and text, then your Notification node (a template with a 'text' variable): the split's trigger port on its trigger row, its text port on its text row. Wired straight to the digest port, the trigger reads no boolean and nothing is sent. Then deploy."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 7 * * *" }, outputs: [{ port: 0, targets: [new] }] }
        - id: new
          kind: ontology_query
          config:
            object_type: sales_signal
            filters: [{ key: notified_on, op: missing }]
            limit: 200
            output: array
          outputs: [{ port: 0, targets: [digest] }]
        - { id: digest, kind: pnex_function, config: { function_name: pb_digest, language: starlark }, outputs: [{ port: 1, targets: [each] }] }
        - id: each
          kind: ontology_query
          config:
            object_type: sales_signal
            filters: [{ key: notified_on, op: missing }]
            limit: 200
          outputs: [{ port: 0, targets: [mark] }]
        - { id: mark, kind: pnex_function, config: { function_name: pb_mark_notified, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: sales_signal, key: id } }
  - name: "Prospecting · target score"
    note: "Every 15 minutes, up to 500 organizations not scored today get their target score from the org's active targeting criteria (objects 'Targeting criterion': property, operator, value, points). Add criteria first, then deploy. A large list is covered over the day."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "*/15 * * * *" }, outputs: [{ port: 0, targets: [crit] }] }
        - id: crit
          kind: ontology_query
          config:
            object_type: targeting_criterion
            limit: 200
            output: array
          outputs: [{ port: 0, targets: [keep] }]
        - { id: keep, kind: pnex_function, config: { function_name: pb_criteria, language: starlark }, outputs: [{ port: 0, targets: [orgs] }] }
        - id: orgs
          kind: ontology_query
          config:
            object_type: organization
            filters: [{ key: scored_on, op: ne, value: "$today" }]
            limit: 500
          outputs: [{ port: 0, targets: [score] }]
        - { id: score, kind: pnex_function, config: { function_name: pb_score, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: organization, key: id } }
  - name: "Prospecting · identify people"
    note: "Finds the LinkedIn profile of a person (D788, D999): when a member clicks Find the LinkedIn profile on the person's page, when the person's employer changes, and every hour for the people of target and prospect accounts with no profile yet. The search is built from the graph as it is now (name, company and group names, site cities) and asked of the pipeline Person search (LinkedIn), which runs in the browser agent of whoever deploys this flow: deploy it from the account whose LinkedIn session should search. 20 searches a day by default (node Search). The flow Prospecting · score profiles reads what comes back."
    graph:
      nodes:
        - { id: act, kind: action_trigger, config: { object_type: person, action: find_profile }, outputs: [{ port: 0, targets: [from_act] }] }
        - { id: from_act, kind: pnex_function, config: { function_name: pm_from_action, language: starlark }, outputs: [{ port: 0, targets: [person] }] }
        - { id: moved, kind: ontology_trigger, config: { object_type: person, on: [link], link_types: [employs], skip_own: true }, outputs: [{ port: 0, targets: [from_move] }] }
        - { id: from_move, kind: pnex_function, config: { function_name: pm_from_change, language: starlark }, outputs: [{ port: 0, targets: [person] }] }
        - { id: tick, kind: inject, config: { cron: "25 * * * *" }, outputs: [{ port: 0, targets: [due] }] }
        - id: due
          kind: ontology_query
          config:
            object_type: organization
            filters: [{ key: account_status, op: in, value: [target, prospect] }]
            traverse: [{ link_type: employs, direction: out }]
            with_links: [uses_identifier]
            limit: 50
          outputs: [{ port: 0, targets: [pick] }]
        - { id: pick, kind: pnex_function, config: { function_name: pm_pick, language: starlark }, outputs: [{ port: 0, targets: [person] }] }
        - id: person
          kind: ontology_query
          config:
            object_type: person
            filters: [{ key: id, op: eq, value: "$msg.person_id" }]
            with_links: [employs, uses_identifier]
            limit: 1
          outputs: [{ port: 0, targets: [employer] }]
        - { id: employer, kind: pnex_function, config: { function_name: pm_employer, language: starlark }, outputs: [{ port: 0, targets: [company] }, { port: 1, targets: [state] }] }
        - id: company
          kind: ontology_query
          config:
            object_type: organization
            filters: [{ key: id, op: eq, value: "$msg.org_id" }]
            with_links: [subsidiary_of, establishment_of]
            limit: 1
          outputs: [{ port: 0, targets: [subject] }]
        - { id: subject, kind: pnex_function, config: { function_name: pm_subject, language: starlark }, outputs: [{ port: 0, targets: [search] }] }
        - { id: search, kind: pipeline_ask, config: { pipeline: prospecting_b2b/person_match_linkedin, per_day: 20 }, outputs: [{ port: 0, targets: [asked] }] }
        - { id: asked, kind: pnex_function, config: { function_name: pm_asked, language: starlark }, outputs: [{ port: 0, targets: [state] }] }
        - { id: state, kind: object_upsert, config: { object_type: person, key: id } }
  - name: "Prospecting · score profiles"
    note: "Scores the profiles a person search brought back, as soon as they arrive (D999): name 30, current company 50, past company 25, group 15, city 10. The best above the attaching score (setting) is captured onto the person by the pipeline Profile capture (LinkedIn); the plausible ones wait in To validate; otherwise the next query of the ladder is asked. Thresholds: settings of the pack. Deploy it from the same account as Prospecting · identify people."
    graph:
      nodes:
        - { id: back, kind: ontology_trigger, config: { object_type: person, properties: [match_to_score], skip_own: true }, outputs: [{ port: 0, targets: [person] }] }
        - id: person
          kind: ontology_query
          config:
            object_type: person
            filters: [{ key: id, op: eq, value: "$msg.payload.object_id" }]
            with_links: [uses_identifier]
            limit: 1
          outputs: [{ port: 0, targets: [ask] }]
        - { id: ask, kind: pnex_function, config: { function_name: pm_doc, language: starlark }, outputs: [{ port: 0, targets: [doc] }] }
        - { id: doc, kind: document_text, outputs: [{ port: 0, targets: [decide] }] }
        - { id: decide, kind: pnex_function, config: { function_name: pm_decide, language: starlark }, outputs: [{ port: 0, targets: [capture] }, { port: 1, targets: [propose] }, { port: 2, targets: [next] }, { port: 3, targets: [state] }] }
        - { id: capture, kind: pipeline_ask, config: { pipeline: prospecting_b2b/profile_capture_linkedin, per_day: 20 } }
        - { id: next, kind: pipeline_ask, config: { pipeline: prospecting_b2b/person_match_linkedin, per_day: 20 } }
        - { id: propose, kind: pipeline_ask, config: { pipeline: prospecting_b2b/person_match_propose, per_day: 100 } }
        - { id: state, kind: object_upsert, config: { object_type: person, key: id } }
  - name: "Prospecting · follow decisions"
    note: "Follows what a human decides on a proposed LinkedIn profile (D999): accepted, the profile is captured onto the person; once every profile proposed by a search is rejected, the next query of the ladder is asked. Deploy it from the same account as Prospecting · identify people."
    graph:
      nodes:
        - { id: decided, kind: ontology_trigger, config: { object_type: person, on: [proposal], link_types: [uses_identifier] }, outputs: [{ port: 0, targets: [event] }] }
        - { id: event, kind: pnex_function, config: { function_name: pm_event, language: starlark }, outputs: [{ port: 0, targets: [account] }] }
        - id: account
          kind: ontology_query
          config:
            object_type: identifier
            filters: [{ key: id, op: eq, value: "$msg.identifier_id" }]
            limit: 1
          outputs: [{ port: 0, targets: [url] }]
        - { id: url, kind: pnex_function, config: { function_name: pm_event_url, language: starlark }, outputs: [{ port: 0, targets: [person] }] }
        - id: person
          kind: ontology_query
          config:
            object_type: person
            filters: [{ key: id, op: eq, value: "$msg.person_id" }]
            limit: 1
          outputs: [{ port: 0, targets: [follow] }]
        - { id: follow, kind: pnex_function, config: { function_name: pm_follow, language: starlark }, outputs: [{ port: 0, targets: [capture] }, { port: 1, targets: [next] }, { port: 2, targets: [state] }] }
        - { id: capture, kind: pipeline_ask, config: { pipeline: prospecting_b2b/profile_capture_linkedin, per_day: 20 } }
        - { id: next, kind: pipeline_ask, config: { pipeline: prospecting_b2b/person_match_linkedin, per_day: 20 } }
        - { id: state, kind: object_upsert, config: { object_type: person, key: id } }
  - name: "Prospecting · employers from profiles"
    note: "Assigns each person to the company their LinkedIn profile states (D999): as soon as a person's Company on the profile changes (a connection read, a profile found), the company is found again by its folded name or created, even when it is in no register, and the person attached to it with their position. Someone who objected is left alone. No LLM."
    graph:
      nodes:
        - { id: changed, kind: ontology_trigger, config: { object_type: person, properties: [profile_company] }, outputs: [{ port: 0, targets: [person] }] }
        - id: person
          kind: ontology_query
          config:
            object_type: person
            filters: [{ key: id, op: eq, value: "$msg.payload.object_id" }]
            with_links: [employs]
            limit: 1
          outputs: [{ port: 0, targets: [pick] }]
        - { id: pick, kind: pnex_function, config: { function_name: emp_pick, language: starlark }, outputs: [{ port: 0, targets: [company] }] }
        - { id: company, kind: object_upsert, config: { object_type: organization, key: name_key, skip_existing: true }, outputs: [{ port: 0, targets: [link] }] }
        - { id: link, kind: pnex_function, config: { function_name: emp_link, language: starlark }, outputs: [{ port: 0, targets: [attach] }] }
        - { id: attach, kind: link_upsert, config: { link_type: employs, skip_closed: true } }
  - name: "Prospecting · my LinkedIn connections"
    note: "Reads the deployer's own LinkedIn connections (first-degree people results, 10 a page) in their browser agent: each one becomes a person keyed by their profile address, with the position and company their headline states; the flow Prospecting · employers from profiles assigns the company. Runs once at deploy, then every morning; LinkedIn shows 100 pages at most (1,000 people), 50 pages a day here. Deploy it from the account whose LinkedIn network should be read."
    graph:
      nodes:
        - { id: now, kind: inject, config: { once_delay_secs: 20 }, outputs: [{ port: 0, targets: [pages] }] }
        - { id: daily, kind: inject, config: { cron: "0 8 * * *" }, outputs: [{ port: 0, targets: [pages] }] }
        - { id: pages, kind: pnex_function, config: { function_name: mc_pages, language: starlark }, outputs: [{ port: 0, targets: [each] }] }
        - { id: each, kind: json_split, config: { auto: false }, outputs: [{ port: 0, targets: [ask] }] }
        - { id: ask, kind: pipeline_ask, config: { pipeline: prospecting_b2b/my_connections_linkedin, per_day: 50 } }
