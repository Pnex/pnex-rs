functions:
  - name: pb_criteria
    language: starlark
    description: Keeps the org's active targeting criteria on the message for the scoring that follows.
    code: |
      # The criteria (an array query) travel with the message: the next
      # query sends one message per organization, each carrying them.
      def handle(inputs, msg):
          return {"payload": {}, "criteria": msg["payload"]}
  - name: pb_score
    language: starlark
    description: "Target score of an organization: the points of each matching criterion, explained line by line (D336)."
    code: |
      # Target score (D336): generic, it holds no criterion. Each criterion
      # of msg.criteria ({title, properties: {property, operator, value,
      # points}}) that the organization meets adds its points (negative
      # points exclude). Lists in `value` are comma-separated.
      def number(v):
          if type(v) == "dict":
              v = v.get("amount")
          if type(v) in ("int", "float"):
              return float(v)
          if type(v) == "string" and v.strip():
              t = v.strip().replace(",", ".")
              ok = len(t) > 0
              for c in t.elems():
                  if not (c.isdigit() or c in ".-"):
                      ok = False
              if ok:
                  return float(t)
          return None

      def text(v):
          if v == None:
              return ""
          if type(v) == "bool":
              return "true" if v else "false"
          if type(v) in ("int", "float"):
              f = float(v)
              return str(int(f)) if f == int(f) else str(f)
          return str(v)

      def meets(c, v):
          op = c.get("operator", "")
          want = c.get("value", "") or ""
          items = [w.strip() for w in want.split(",") if w.strip()]
          if op == "filled":
              return text(v) != ""
          if op == "equals":
              return text(v) == want.strip()
          if op == "one_of":
              return text(v) in items
          if op == "starts_with":
              return any([text(v).startswith(w) for w in items])
          n = number(v)
          w = number(want)
          if n == None or w == None:
              return False
          if op == "at_least":
              return n >= w
          if op == "at_most":
              return n <= w
          return False

      def handle(inputs, msg):
          p = msg["payload"]
          total = 0
          lines = []
          for c in msg.get("criteria", []):
              props = c.get("properties", {})
              if props.get("active") == False:
                  continue
              if meets(props, p.get(props.get("property", ""))):
                  pts = int(number(props.get("points", 0)) or 0)
                  total += pts
                  sign = "+" if pts >= 0 else ""
                  lines.append(c.get("title", props.get("property", "")) + ": " + sign + str(pts))
          return {
              "payload": {
                  "target_score": total,
                  "score_detail": "\n".join(lines),
                  "scored_on": msg.get("today", ""),
              },
              "object_id": msg["object"]["id"],
          }
  - name: pb_digest
    language: starlark
    description: One text of the new commercial signals, for the org's notification node.
    code: |
      # Daily digest (D335): one line per new signal, newest first.
      # @output digest any "The digest (payload.text), when there is a new signal"
      # @output mark any "Then mark them notified"
      def handle(inputs, msg):
          rows = msg["payload"]
          if len(rows) == 0:
              return None
          rows = sorted(rows, key = lambda r: r["properties"].get("date", ""), reverse = True)
          lines = []
          for r in rows:
              p = r["properties"]
              lines.append("- " + p.get("date", "") + " " + r["title"] + ": " + p.get("summary", ""))
          return [
              {"payload": {"trigger": True, "count": len(rows), "text": "\n".join(lines)}},
              {"payload": {}},
          ]
  - name: ps_prepare
    language: starlark
    description: A changed watched page, its text for the model and the page kept aside.
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          return {"payload": {"text": p.get("text", "")},
                  "page": {"id": msg["object"]["id"], "url": p.get("url", ""),
                           "title": msg["object"]["title"], "account": p.get("account", "")}}
  - name: ps_signal
    language: starlark
    description: "The model's answer about a watched page: a signal when it names a topic of the list, and the page cleared."
    code: |
      # The org's topics (D335): edit this list to the org's own, the
      # prompt of the LLM node names the same keys.
      # @output signal any "A signal about the account (to validate)"
      # @output read any "The page, marked read"
      TOPICS = ["new_site", "investment", "hiring", "new_line", "takeover",
                "retirements", "quality", "multi_site", "school", "new_offer", "prices"]

      def handle(inputs, msg):
          page = msg.get("page", {})
          lines = [l.strip() for l in msg["payload"].get("text", "").strip().split("\n") if l.strip()]
          topic = lines[0].strip("`*. ").lower() if lines else "none"
          read = {"payload": {"changed": False}, "object_id": page.get("id")}
          if topic not in TOPICS or not page.get("account"):
              return [None, read]
          quote = lines[1][:4000] if len(lines) > 1 else ""
          day = msg.get("today", "")
          signal = {
              "payload": {
                  "ref": "page:" + page.get("url", "") + ":" + day,
                  "kind": "page_changed",
                  "topic": topic,
                  "summary": page.get("title", ""),
                  "excerpt": quote,
                  "date": day,
                  "source_url": page.get("url", ""),
                  "state": "to_validate",
              },
              "title": topic.replace("_", " ") + " · " + page.get("title", ""),
          }
          return [signal, read]
  - name: ps_link
    language: starlark
    description: Link payload from the signal just written to the account of the page.
    code: |
      def handle(inputs, msg):
          return {"payload": {"source_id": msg["object"]["id"], "target_id": msg["page"]["account"]}}
  - name: pb_mark_notified
    language: starlark
    description: Marks a signal notified today.
    code: |
      def handle(inputs, msg):
          return {"payload": {"notified_on": msg.get("today", "")}, "object_id": msg["object"]["id"]}
flows:
  - name: "Prospecting · watched pages to signals"
    note: "Every hour, up to 50 watched pages whose text changed are read by the organization's LLM: a page announcing a topic of the list (new site, investment, hiring, ramp-up, takeover, retirements, quality problem, multi-site, in-house school, new offer, prices) becomes a commercial signal about the account, to validate, quoting the sentence. Edit the topics in the function ps_signal and in the prompt together. Watch a page with a site crawl whose record writes type watched_page (url, text, changed → changed, link_to → account). Needs an AI provider."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 * * * *" }, outputs: [{ port: 0, targets: [changed] }] }
        - id: changed
          kind: ontology_query
          config:
            object_type: watched_page
            filters: [{ key: changed, op: eq, value: true }]
            limit: 50
          outputs: [{ port: 0, targets: [prep] }]
        - { id: prep, kind: pnex_function, config: { function_name: ps_prepare, language: starlark }, outputs: [{ port: 0, targets: [read] }] }
        - id: read
          kind: llm_text
          config:
            data_field: text
            max_chars: 600
            prompt: "This is the text of a company web page (news, careers, offers). If it announces one of these topics, answer on the first line with the topic key only, then on the second line quote word for word the sentence that says it. Otherwise answer only: none. Topics: new_site (a new plant, site or establishment), investment (an investment), hiring (a hiring wave), new_line (a new production line or a ramp-up), takeover (a takeover or a merger), retirements (retirements, generational change), quality (a quality problem or a recall), multi_site (a multi-site rollout), school (an in-house school or academy), new_offer (a new product or service), prices (prices or plans)."
          outputs: [{ port: 0, targets: [decide] }]
        - { id: decide, kind: pnex_function, config: { function_name: ps_signal, language: starlark }, outputs: [{ port: 0, targets: [signal] }, { port: 1, targets: [done] }] }
        - { id: signal, kind: object_upsert, config: { object_type: sales_signal, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [about] }] }
        - { id: about, kind: pnex_function, config: { function_name: ps_link, language: starlark }, outputs: [{ port: 0, targets: [linked] }] }
        - { id: linked, kind: link_upsert, config: { link_type: signal_about } }
        - { id: done, kind: object_upsert, config: { object_type: watched_page, key: id } }
  - name: "Prospecting · signals digest"
    note: "Each morning the commercial signals not yet notified make one digest (payload.text, payload.count), then are marked notified. Add your Notification node on the digest port (template with a 'text' variable, trigger = payload.trigger), then deploy."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 7 * * *" }, outputs: [{ port: 0, targets: [new] }] }
        - id: new
          kind: ontology_query
          config:
            object_type: sales_signal
            filters: [{ key: notified_on, op: missing }]
            limit: 200
            output: array
          outputs: [{ port: 0, targets: [digest] }]
        - { id: digest, kind: pnex_function, config: { function_name: pb_digest, language: starlark }, outputs: [{ port: 1, targets: [each] }] }
        - id: each
          kind: ontology_query
          config:
            object_type: sales_signal
            filters: [{ key: notified_on, op: missing }]
            limit: 200
          outputs: [{ port: 0, targets: [mark] }]
        - { id: mark, kind: pnex_function, config: { function_name: pb_mark_notified, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: sales_signal, key: id } }
  - name: "Prospecting · target score"
    note: "Every 15 minutes, up to 500 organizations not scored today get their target score from the org's active targeting criteria (objects 'Targeting criterion': property, operator, value, points). Add criteria first, then deploy. A large list is covered over the day."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "*/15 * * * *" }, outputs: [{ port: 0, targets: [crit] }] }
        - id: crit
          kind: ontology_query
          config:
            object_type: targeting_criterion
            limit: 200
            output: array
          outputs: [{ port: 0, targets: [keep] }]
        - { id: keep, kind: pnex_function, config: { function_name: pb_criteria, language: starlark }, outputs: [{ port: 0, targets: [orgs] }] }
        - id: orgs
          kind: ontology_query
          config:
            object_type: organization
            filters: [{ key: scored_on, op: ne, value: "$today" }]
            limit: 500
          outputs: [{ port: 0, targets: [score] }]
        - { id: score, kind: pnex_function, config: { function_name: pb_score, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: organization, key: id } }
