# Business pack "B2B account mapping" (account-mapping.md D329–D343): an
# account is the `organization` of the worldwide companies pack (any
# country; country packs add their registers), extended
# with its commercial status and coverage; no "company" or "account" type
# next to it (D304), so the graph stays one.
# `subsidiary_of` (group structure, D331) moved to the `companies` pack
# (1.1.0): it is not specific to selling.
# `last_revenue` is the latest known revenue and `revenue_year` its fiscal
# year: the core has no per-year scalar property (D178 temporal = O2
# series or events), past years stay in the object history.
# `persona` is the role in the buying committee, not a job title (the
# title stays on `employs.position`). Several people may follow one account,
# each with the role the org gives it (`follows_account.role`, free text).
# Coverage and white space are computed at read time (D330), never stored:
# the commercial group sums the users and lists the nodes without a
# contact or a customer status. Statuses carry a colour (D339) for the map,
# the hierarchy and the graph.
# Target score (D336): the pack ships the scoring function and its flow,
# never a criterion. Criteria are objects of the org (`targeting_criterion`:
# property, operator, value, points), so the profile of an ideal customer
# stays the org's data; the score is explained line by line in
# `score_detail`. Organizations only: sites are system objects a flow does
# not write, the explorer filters them on their own headcount.
# Commercial signals (D335): something that moved on an account, kept with
# where it came from and the words quoted. `kind` says how it was detected
# (closed list), `topic` what it is about (the org's own list). A signal
# from a model is always `to_validate`; a human retains or dismisses it. The
# daily digest flow prepares one text of the new signals: add the org's
# notification node on its first port, then deploy.
# Watched pages (D335, news, careers, competitors' offers): a crawl of the
# page with a `record` into `watched_page` keeps its text and flags it when
# the text changed; a flow asks the org's LLM which topic of the org's list
# the page announces and writes a `page_changed` signal (to validate)
# about the account, quoting the sentence.
# Page templates (D340) are filled from the account they are opened on
# (placeholders of `page_render`): account plan, competitor sheet, meeting
# preparation. A snapshot of the day, then free text.
# Personal data (D341, crm.md D442–D447): the persona of a person is
# `personal`; `opposed_on` records an objection (prospecting flows
# skip the person); the legal basis shown on a person and the retention
# period of the erasure queue are settings of the org.
# Meetings: a `meeting` with an account, its participants (ours and
# theirs), its recording (a media: transcription and summary with a focus
# are the media analyses), its debrief page, and the criteria of the org's
# sales playbook it covered (`coaching_criterion`, the org's own list). The
# coaching reads per criterion how many meetings covered it: aggregates of
# the team's practice, never a score of a person. A meeting read from a
# mail invitation (crm pack) is keyed by the invitation's iCalendar UID
# (`invitation_uid`): an update moves it, a cancellation marks it.
# List contacts (D337): a file of trade-show or association participants
# (columns list, name, job_title, company, city, postal_code, email)
# becomes list contacts, not persons of the graph: one becomes a person
# only when someone works the lead. Matching a contact to its company
# (`registry_id`, `matching`, `candidates`, `contact_of`) is done by a
# country layer (`prospecting_b2b_fr` for France); nothing here is French.
# Since 2.0.0 every identifier is English (breaking).
# Since 3.0.0 the `personal` classification value and the flow names are English (breaking).
key: prospecting_b2b
name: B2B account mapping
names: {fr: "Cartographie commerciale"}
version: "3.0.0"
requires: [companies, web_presence]
description: "Accounts as a dated network: group and subsidiaries, sites with their commercial status, contacts by persona, who recommended whom. Questions: which subsidiaries of this group have no contact yet? Who follows this account? Which sites are customers?"
descriptions: {fr: "Les comptes vus comme un réseau daté : groupe et filiales, sites avec leur statut commercial, contacts par persona, qui a recommandé qui. Questions : quelles filiales de ce groupe n'ont encore aucun contact ? Qui suit ce compte ? Quels sites sont clients ?"}
settings:
  - key: legal_basis
    name: Legal basis
    names: {fr: "Base légale"}
    description: Legal basis of the processing of the contacts' personal data, shown on a person (D341).
    descriptions: {fr: "Base légale du traitement des données personnelles des contacts, affichée sur une personne (D341)."}
    kind: text
    default: legitimate_interest_b2b_prospecting
  - key: retention_months
    name: Retention (months)
    names: {fr: "Durée de conservation (mois)"}
    description: A person with no change, link or capture for this many months is proposed for erasure (D341).
    descriptions: {fr: "Une personne sans modification, lien ni capture depuis ce nombre de mois est proposée à l'effacement (D341)."}
    kind: number
    default: 36
    min: 6
    max: 120
extends:
  - type: organization
    properties:
      - key: account_status
        name: Account status
        names: {fr: "Statut du compte"}
        kind: enum
        values: [customer, prospect, target, former_customer, competitor, partner, excluded]
        labels: {customer: {fr: "Client", en: "Customer"}, prospect: {fr: "Prospect", en: "Prospect"}, target: {fr: "Cible", en: "Target"}, former_customer: {fr: "Ancien client", en: "Former customer"}, competitor: {fr: "Concurrent", en: "Competitor"}, partner: {fr: "Partenaire", en: "Partner"}, excluded: {fr: "Exclu", en: "Excluded"}}
        colors: { customer: green, prospect: amber, target: blue, former_customer: gray, competitor: red, partner: violet, excluded: gray }
        indexed: true
      - { key: current_users, name: Current users, names: {fr: "Utilisateurs actuels"}, kind: number, min: 0 }
      - { key: potential_users, name: Potential users, names: {fr: "Utilisateurs potentiels"}, kind: number, min: 0 }
      - { key: last_revenue, name: Latest revenue, names: {fr: "Dernier chiffre d'affaires"}, kind: money }
      - { key: revenue_year, name: Revenue fiscal year, names: {fr: "Exercice du chiffre d'affaires"}, kind: number, min: 1900, max: 2100 }
      - { key: target_score, name: Target score, names: {fr: "Score de ciblage"}, kind: number, indexed: true }
      - { key: score_detail, name: Score detail, names: {fr: "Détail du score"}, kind: text, max_len: 4000 }
      - { key: scored_on, name: Scored on, names: {fr: "Score calculé le"}, kind: date }
  - type: map_pin
    properties:
      - key: establishment_status
        name: Establishment status
        names: {fr: "Statut de l'établissement"}
        kind: enum
        values: [customer, prospect, not_covered]
        labels: {customer: {fr: "Client", en: "Customer"}, prospect: {fr: "Prospect", en: "Prospect"}, not_covered: {fr: "Non couvert", en: "Not covered"}}
        colors: { customer: green, prospect: amber, not_covered: gray }
        indexed: true
      - { key: current_users, name: Current users, names: {fr: "Utilisateurs actuels"}, kind: number, min: 0 }
  - type: person
    properties:
      - key: persona
        name: Persona
        names: {fr: "Persona"}
        kind: enum
        values: [decision_maker, champion, sponsor, influencer, buyer, user, technical, other]
        labels: {decision_maker: {fr: "Décideur", en: "Decision maker"}, champion: {fr: "Champion", en: "Champion"}, sponsor: {fr: "Sponsor", en: "Sponsor"}, influencer: {fr: "Prescripteur", en: "Influencer"}, buyer: {fr: "Acheteur", en: "Buyer"}, user: {fr: "Utilisateur", en: "User"}, technical: {fr: "Technique", en: "Technical"}, other: {fr: "Autre", en: "Other"}}
        indexed: true
        classification: personal
      - { key: review_on, name: Review on, names: {fr: "À revoir le"}, kind: date }
      - { key: opposed_on, name: Objected on, names: {fr: "Opposition le"}, kind: date, indexed: true }
