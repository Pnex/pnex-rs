# Reference pack "Companies" (account-mapping.md D343): what a company is
# in every country. A legal unit is the `organization` of the investigation
# pack, extended with fields every register has in some form; an
# establishment is a `map_pin` tied to its legal unit by `establishment_of`;
# officers are `person` or `organization` linked by the temporal `manages`
# (mandate dates = link validity).
# Country specifics (register keys, local codes, the register import) live
# in one pack per country that requires this one (`companies_fr` first).
# A country pack fills the shared fields from its own: the activity code is
# a NACE Rev.2 class (`62.01`, the European base of national codes) and the
# headcount a number range, so targeting and scores work across countries.
# A company of a country without its pack is still described here, by hand,
# by a file or by the worldwide sources (LEI, Wikidata).
# Personal data is minimized (partner-watch.md D304): officers carry their
# name, the role on the link and a register key that merges the same
# officer across companies; no full birth date, no personal address.
# Hierarchy (partner-watch.md D305): a tree computed on links (several
# parents allowed), never containment.
# Since 1.1.0 the group structure lives here (account-mapping.md D331):
# `subsidiary_of` carries a control or consolidation relation as open sources
# give it, without a share (`owns` stays for known holdings). Several
# targets are allowed on purpose: a direct and an ultimate parent, or two
# sources that disagree, live side by side with their provenance. Since
# 1.2.0 a link from a community source is a proposal (proposals.md D375):
# it enters the graph once a human accepts it.
# Since 2.0.0 every identifier is English (breaking).
key: companies
name: Companies
names: {fr: "Entreprises"}
version: "2.0.0"
requires: [investigation]
description: Legal units of any country, their establishments on the map and their officers by mandate; country packs add the local registers.
descriptions: {fr: "Unités légales de tout pays, leurs établissements sur la carte et leurs dirigeants par mandat ; les packs par pays ajoutent les registres locaux."}
extends:
  - type: organization
    properties:
      - { key: country, name: Country (ISO 3166-1), names: {fr: "Pays (ISO 3166-1)"}, kind: text, max_len: 2, indexed: true }
      - { key: lei, name: LEI, names: {fr: "LEI"}, kind: text, max_len: 20, unique: true }
      - { key: activity_code, name: Activity (NACE Rev.2), names: {fr: "Activité (NACE rév. 2)"}, kind: text, max_len: 8, indexed: true }
      - key: administrative_state
        name: Administrative status
        names: {fr: "État administratif"}
        kind: enum
        values: [active, ceased]
        labels: {active: {fr: "Actif", en: "Active"}, ceased: {fr: "Cessé", en: "Ceased"}}
        indexed: true
      - { key: created_on, name: Created on, names: {fr: "Créée le"}, kind: date }
      - { key: ceased_on, name: Ceased on, names: {fr: "Cessée le"}, kind: date }
      - { key: headcount_min, name: Headcount from, names: {fr: "Effectif à partir de"}, kind: number, min: 0 }
      - { key: headcount_max, name: Headcount up to, names: {fr: "Effectif jusqu'à"}, kind: number, min: 0 }
  - type: person
    properties:
      - { key: registry_id, name: Register key, names: {fr: "Clé au registre"}, kind: text, max_len: 300, unique: true }
  - type: map_pin
    properties:
      - { key: head_office, name: Head office, names: {fr: "Siège"}, kind: bool }
      - key: administrative_state
        name: Administrative status
        names: {fr: "État administratif"}
        kind: enum
        values: [active, closed]
        labels: {active: {fr: "Actif", en: "Active"}, closed: {fr: "Fermé", en: "Closed"}}
        indexed: true
      - { key: trade_name, name: Trade name, names: {fr: "Enseigne"}, kind: text, max_len: 255 }
      - { key: headcount_min, name: Headcount from, names: {fr: "Effectif à partir de"}, kind: number, min: 0 }
      - { key: headcount_max, name: Headcount up to, names: {fr: "Effectif jusqu'à"}, kind: number, min: 0 }
link_types:
  - key: establishment_of
    name: is an establishment of
    names: {fr: "est un établissement de"}
    inverse_name: has as establishment
    inverse_names: {fr: "a pour établissement"}
    from_types: [map_pin]
    to_types: [organization]
    one_target: true
  - key: manages
    name: directs
    names: {fr: "dirige"}
    inverse_name: is directed by
    inverse_names: {fr: "est dirigée par"}
    from_types: [person, organization]
    to_types: [organization]
    attributes:
      - key: role
        name: Role
        names: {fr: "Rôle"}
        kind: enum
        values: [president, ceo, deputy_ceo, manager, director, board_member, other]
        labels: {president: {fr: "Président", en: "Chair"}, ceo: {fr: "Directeur général", en: "CEO"}, deputy_ceo: {fr: "Directeur général délégué", en: "Deputy CEO"}, manager: {fr: "Gérant", en: "Manager"}, director: {fr: "Administrateur", en: "Board member"}, board_member: {fr: "Membre du directoire", en: "Executive board member"}, other: {fr: "Autre", en: "Other"}}
      - { key: capacity, name: Registry title, names: {fr: "Qualité au registre"}, kind: text, max_len: 255 }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 1000 }
      - { key: retrieved_on, name: Retrieved on, names: {fr: "Consulté le"}, kind: date }
  - key: subsidiary_of
    name: is a subsidiary of
    names: {fr: "est une filiale de"}
    inverse_name: has as subsidiary
    inverse_names: {fr: "a pour filiale"}
    from_types: [organization]
    to_types: [organization]
    attributes:
      - key: nature
        name: Nature
        names: {fr: "Nature"}
        kind: enum
        values: [direct_consolidation, ultimate_consolidation, declared, wikidata, manual_entry]
        labels: {direct_consolidation: {fr: "Consolidation directe", en: "Direct consolidation"}, ultimate_consolidation: {fr: "Consolidation ultime", en: "Ultimate consolidation"}, declared: {fr: "Déclarée", en: "Declared"}, wikidata: {fr: "Wikidata", en: "Wikidata"}, manual_entry: {fr: "Saisie", en: "Entered"}}
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 1000 }
      - { key: retrieved_on, name: Retrieved on, names: {fr: "Consulté le"}, kind: date }
hierarchies:
  - key: group
    name: Group
    names: {fr: "Groupe"}
    steps:
      - { link: owns }
      - { link: establishment_of, inverse: true }
      - { link: manages, inverse: true }
