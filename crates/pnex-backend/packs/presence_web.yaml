# Reference pack "Web presence" (web-presence.md D363): the website of an
# organization, found, checked and confirmed before anything crawls it.
# It takes `site_web` and `a_pour_site` over from `quali_watch` (same keys,
# same direction; `hands_over`, no data moved).
# A candidate website is an `a_pour_site` link with a status: `propose`
# waits for a human, `confirme` is crawled (D307), `rejete` is a closed link
# a flow never reopens (`link_upsert` `skip_closed`, D362). The link keeps
# what proved it (SIREN, training declaration number, address found on the
# site), the model's opinion when one was asked, where the candidate came
# from and who validated it (display name, never an identifier, R4).
# The identification flow (D365) ships as a draft: each night it takes up
# to 50 organizations never searched, tries the domain of their e-mails,
# then the web search, visits up to three candidates, scores what the site
# says (SIREN, declaration number, name) and writes: 80 and more
# `confirme`, 40 to 79 `propose` for a human (page « Sites à valider »),
# below 40 nothing. A rejected site is never proposed again.
key: presence_web
name: Web presence
names: {fr: "Présence web"}
version: "1.0.0"
requires: [entreprises]
description: "The website of each organization: candidates found by search or from e-mail domains, checked on the site itself, confirmed by a human before any crawl."
descriptions: {fr: "Le site web de chaque organisation : candidats trouvés par recherche ou par le domaine des e-mails, vérifiés sur le site lui-même, confirmés par un humain avant tout parcours."}
extends:
  - type: organization
    properties:
      - { key: site_recherche_le, name: Website searched on, names: {fr: "Site recherché le"}, kind: date }
types:
  - key: site_web
    name: Website
    names: {fr: "Site web"}
    icon: globe
    may_be_contained_in: [folder]
    properties:
      - { key: url_racine, name: Root URL, names: {fr: "URL racine"}, kind: url, required: true }
      - { key: domaine, name: Domain, names: {fr: "Domaine"}, kind: text, max_len: 255, unique: true }
      - { key: dernier_crawl, name: Last crawl, names: {fr: "Dernier parcours"}, kind: date_time }
      - { key: pages_listees, name: Listed pages, names: {fr: "Pages listées"}, kind: number, min: 0 }
      - { key: pages_pertinentes, name: Relevant pages, names: {fr: "Pages pertinentes"}, kind: number, min: 0 }
      - { key: etat_collecte, name: Collection status, names: {fr: "État de la collecte"}, kind: enum, values: [ok, bloque, inaccessible, vide], indexed: true }
link_types:
  - key: a_pour_site
    name: has as website
    names: {fr: "a pour site"}
    inverse_name: is the website of
    inverse_names: {fr: "est le site de"}
    from_types: [organization]
    to_types: [site_web]
    attributes:
      - key: statut
        name: Status
        names: {fr: "Statut"}
        kind: enum
        values: [propose, confirme, rejete]
        colors: { propose: amber, confirme: green, rejete: red }
      - { key: score, name: Score, names: {fr: "Score"}, kind: number, min: 0, max: 100 }
      - { key: preuve_siren, name: SIREN found on the site, names: {fr: "SIREN trouvé sur le site"}, kind: bool }
      - { key: preuve_nda, name: Declaration number found, names: {fr: "NDA trouvé sur le site"}, kind: bool }
      - { key: preuve_adresse, name: Address found, names: {fr: "Adresse trouvée sur le site"}, kind: bool }
      - { key: avis_llm, name: Model opinion, names: {fr: "Avis du modèle"}, kind: text, max_len: 2000 }
      - { key: requete, name: Query, names: {fr: "Requête"}, kind: text, max_len: 400 }
      - { key: rang, name: Rank, names: {fr: "Rang"}, kind: number, min: 1 }
      - { key: fournisseur, name: Provider, names: {fr: "Fournisseur"}, kind: text, max_len: 255 }
      - key: source
        name: Source
        names: {fr: "Source"}
        kind: enum
        values: [email, recherche, manuel]
      - { key: valide_par, name: Validated by, names: {fr: "Validé par"}, kind: text, max_len: 255 }
functions:
  - name: pw_preparer
    language: starlark
    description: "Website search of an organization: the query, the organization marked as searched, a candidate from the domain of its e-mails."
    code: |
      # D365: free candidates first. An e-mail of the organization on its
      # own domain (not a webmail) names its website; the web search is
      # asked with the organization's name. msg.org travels to the end.
      # @output recherche any "Query for the web search"
      # @output marque any "The organization, marked as searched today"
      # @output courriel any "Candidate from the domain of an e-mail"
      WEBMAIL = ["gmail.com", "googlemail.com", "hotmail.com", "hotmail.fr", "outlook.com",
                 "outlook.fr", "live.com", "live.fr", "msn.com", "yahoo.com", "yahoo.fr",
                 "orange.fr", "wanadoo.fr", "free.fr", "sfr.fr", "neuf.fr", "laposte.net",
                 "icloud.com", "me.com", "gmx.fr", "gmx.com", "aol.com", "bbox.fr",
                 "protonmail.com", "proton.me", "numericable.fr"]

      def domain_of(v):
          if type(v) != "string" or "@" not in v or " " in v.strip():
              return ""
          d = v.strip().lower().split("@")[-1]
          if "." not in d or d in WEBMAIL:
              return ""
          return d

      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          org = {"id": o["id"], "title": o["title"], "siren": p.get("siren", ""), "nda": p.get("nda", "")}
          email = None
          for k in sorted(p.keys()):
              d = domain_of(p[k])
              if d:
                  email = {"payload": {"url": "https://" + d + "/"}, "org": org,
                           "candidat": {"source": "email", "requete": k, "rang": 1, "fournisseur": ""}}
                  break
          return [
              {"payload": o["title"], "org": org},
              {"payload": {"site_recherche_le": msg.get("today", "")}, "object_id": o["id"]},
              email,
          ]
  - name: pw_resultats
    language: starlark
    description: The first three web search results, one candidate each.
    code: |
      # One message per result (three at most), with where it came from.
      # @output c1 any "First result"
      # @output c2 any "Second result"
      # @output c3 any "Third result"
      def handle(inputs, msg):
          p = msg["payload"]
          out = []
          for r in p.get("results", [])[:3]:
              out.append({"payload": {"url": r["url"]},
                          "candidat": {"source": "recherche", "requete": p.get("query", ""),
                                       "rang": r.get("rank", 0), "fournisseur": p.get("provider", "")}})
          return out + [None] * (3 - len(out))
  - name: pw_score
    language: starlark
    description: "Score of a visited candidate (D365): SIREN 60, declaration number 30, own e-mail domain 30, name 10; 80 confirms, 40 proposes."
    code: |
      # Deterministic score of what the site says about itself; the text is
      # data from an unknown site, only searched, never obeyed.
      # @output site any "The website to write, with its link attributes"
      CONFIRM = 80
      PROPOSE = 40

      def digits(t):
          return "".join([c for c in t.elems() if c.isdigit()])

      def origin(u):
          parts = u.split("/")
          return parts[0] + "//" + parts[2] if len(parts) > 2 else u

      def handle(inputs, msg):
          p = msg["payload"]
          org = msg.get("org", {})
          cand = msg.get("candidat", {})
          text = (p.get("legal_text", "") + " " + p.get("text", "") + " " + p.get("title", ""))
          nums = digits(text)
          siren = org.get("siren", "") or ""
          nda = org.get("nda", "") or ""
          proof_siren = len(siren) == 9 and siren in nums
          proof_nda = len(nda) == 11 and nda in nums
          upper = text.upper()
          words = [w for w in org.get("title", "").upper().replace("-", " ").split(" ") if len(w) > 2]
          named = len(words) > 0 and len([w for w in words if w in upper]) * 2 >= len(words)
          score = 0
          if proof_siren:
              score += 60
          if proof_nda:
              score += 30
          if cand.get("source") == "email":
              score += 30
          if named:
              score += 10
          score = min(score, 100)
          if score < PROPOSE:
              return None
          root = origin(p.get("final_url", "") or p.get("url", ""))
          host = root.split("//")[-1].split(":")[0]
          if host.startswith("www."):
              host = host[4:]
          return [{
              "payload": {"url_racine": root + "/", "domaine": host},
              "title": host,
              "lien": {
                  "statut": "confirme" if score >= CONFIRM else "propose",
                  "score": score,
                  "preuve_siren": proof_siren,
                  "preuve_nda": proof_nda,
                  "preuve_adresse": False,
                  "requete": cand.get("requete", ""),
                  "rang": cand.get("rang", 0) or 1,
                  "fournisseur": cand.get("fournisseur", ""),
                  "source": cand.get("source", "recherche"),
              },
          }]
  - name: pw_lien
    language: starlark
    description: Link payload from the organization to the website just written.
    code: |
      def handle(inputs, msg):
          return {"payload": {"source_id": msg["org"]["id"], "target_id": msg["object"]["id"],
                              "attributes": msg.get("lien", {})}}
flows:
  - name: "Web presence · find websites"
    note: "Each night, up to 50 organizations never searched get website candidates: the domain of their e-mails first, then the org's web search (three results), each visited once (page and legal notice) and scored on what it says (SIREN, declaration number, name). 80 and more is confirmed, 40 to 79 waits on the page « Sites à valider », less is dropped; a rejected site is never proposed again. Needs a web search provider (Organisation page). Each run costs up to 50 searches and 200 visits."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 4 * * *" }, outputs: [{ port: 0, targets: [orgs] }] }
        - id: orgs
          kind: ontology_query
          config:
            object_type: organization
            filters: [{ key: site_recherche_le, op: missing }]
            limit: 50
          outputs: [{ port: 0, targets: [prep] }]
        - id: prep
          kind: pnex_function
          config: { function_name: pw_preparer, language: starlark }
          outputs: [{ port: 0, targets: [search] }, { port: 1, targets: [mark] }, { port: 2, targets: [visit] }]
        - { id: mark, kind: object_upsert, config: { object_type: organization, key: id } }
        - { id: search, kind: web_search, config: { limit: 3, country: fr, lang: fr }, outputs: [{ port: 0, targets: [results] }] }
        - id: results
          kind: pnex_function
          config: { function_name: pw_resultats, language: starlark }
          outputs: [{ port: 0, targets: [visit] }, { port: 1, targets: [visit] }, { port: 2, targets: [visit] }]
        - { id: visit, kind: web_visit, outputs: [{ port: 0, targets: [score] }] }
        - { id: score, kind: pnex_function, config: { function_name: pw_score, language: starlark }, outputs: [{ port: 0, targets: [site] }] }
        - { id: site, kind: object_upsert, config: { object_type: site_web, key: domaine }, outputs: [{ port: 0, targets: [link] }] }
        - { id: link, kind: pnex_function, config: { function_name: pw_lien, language: starlark }, outputs: [{ port: 0, targets: [linked] }] }
        - { id: linked, kind: link_upsert, config: { link_type: a_pour_site, skip_closed: true } }
