# Pack "Agent operations" (agents.md D708, D761): the durable facts of the agent
# fabric, installed on first use. An environment and an agent are objects; each run that
# ended is an object, linked to its agent and its environment; each file a run took or left
# is an object, linked to the run that produced it and the runs that read it. This answers
# "which run produced this file, and which ones read it". Steps and lines stay in O2.
# Since 1.2.0 (D1055) the ticket a chain works on is an object too, whatever its tracker
# (Jira, GitLab, GitHub): its runs, its merge requests and its comments link to it.
key: agent_ops
name: Agent operations
names: {fr: "Opérations des agents"}
version: "1.2.0"
description: Environments, agents, their runs, the files those runs took and left, the tickets they work on and their merge requests.
descriptions: {fr: "Les environnements, les agents, leurs exécutions, les fichiers que ces exécutions ont pris et laissés, les tickets qu'elles traitent et leurs demandes de fusion."}
types:
  - key: agent_environment
    name: Agent environment
    names: {fr: "Environnement d'agent"}
    icon: box
    properties:
      - { key: environment_id, name: Environment id, names: {fr: "Identifiant de l'environnement"}, kind: text, max_len: 64, required: true, unique: true, indexed: true }
      - { key: environment_name, name: Name, names: {fr: "Nom"}, kind: text, max_len: 200 }
  - key: hosted_agent
    name: Agent
    names: {fr: "Agent"}
    icon: sparkles
    properties:
      - { key: agent_id, name: Agent id, names: {fr: "Identifiant de l'agent"}, kind: text, max_len: 64, required: true, unique: true, indexed: true }
      - { key: agent_name, name: Name, names: {fr: "Nom"}, kind: text, max_len: 200 }
  - key: agent_run
    name: Run
    names: {fr: "Exécution"}
    icon: play
    properties:
      - { key: run_id, name: Run id, names: {fr: "Identifiant de l'exécution"}, kind: text, max_len: 64, required: true, unique: true, indexed: true }
      - { key: outcome, name: Outcome, names: {fr: "Issue"}, kind: text, max_len: 32, indexed: true }
      - { key: image, name: Image, names: {fr: "Image"}, kind: text, max_len: 600 }
      - { key: agent_version, name: Agent version, names: {fr: "Version de l'agent"}, kind: number }
      - { key: llm_calls, name: Model calls, names: {fr: "Appels au modèle"}, kind: number }
      - { key: input_tokens, name: Input tokens, names: {fr: "Jetons d'entrée"}, kind: number }
      - { key: output_tokens, name: Output tokens, names: {fr: "Jetons de sortie"}, kind: number }
      - { key: error, name: Error, names: {fr: "Erreur"}, kind: text, max_len: 100 }
      - { key: started_at, name: Started at, names: {fr: "Début"}, kind: date_time, indexed: true }
      - { key: finished_at, name: Finished at, names: {fr: "Fin"}, kind: date_time }
      - { key: duration_s, name: Duration, names: {fr: "Durée"}, kind: number, unit: s }
  - key: agent_file
    name: Run file
    names: {fr: "Fichier d'exécution"}
    icon: file
    properties:
      - { key: artifact_id, name: File id, names: {fr: "Identifiant du fichier"}, kind: text, max_len: 64, required: true, unique: true, indexed: true }
      - { key: file_name, name: Name, names: {fr: "Nom"}, kind: text, max_len: 100 }
      - { key: sha256, name: SHA-256, names: {fr: "SHA-256"}, kind: text, max_len: 80, indexed: true }
      - { key: size, name: Size, names: {fr: "Taille"}, kind: number }
      - { key: file_state, name: State, names: {fr: "État"}, kind: text, max_len: 16 }
  - key: agent_merge_request
    name: Merge request
    names: {fr: "Demande de fusion"}
    icon: workflow
    properties:
      - { key: url, name: URL, names: {fr: "URL"}, kind: text, max_len: 600, required: true, unique: true, indexed: true }
      - { key: branch, name: Branch, names: {fr: "Branche"}, kind: text, max_len: 255, indexed: true }
  # A ticket of any tracker; its page identifies it (D1055). A flow that reads the tracker
  # keeps the state, the type and the agent step up to date.
  - key: work_item
    name: Ticket
    names: {fr: "Ticket"}
    icon: flag
    times: {event_property: opened_at}
    properties:
      - { key: url, name: URL, names: {fr: "URL"}, kind: text, max_len: 600, required: true, unique: true, indexed: true }
      - { key: ref, name: Reference, names: {fr: "Référence"}, kind: text, max_len: 64, indexed: true }
      - key: state
        name: State
        names: {fr: "État"}
        kind: enum
        values: [opened, closed]
        labels: {opened: {fr: "Ouvert", en: "Open"}, closed: {fr: "Fermé", en: "Closed"}}
      - key: work_type
        name: Type
        names: {fr: "Type"}
        kind: enum
        values: [story, bug, task, unknown]
        labels: {story: {fr: "Story", en: "Story"}, bug: {fr: "Bug", en: "Bug"}, task: {fr: "Tâche", en: "Task"}, unknown: {fr: "Non défini", en: "Not set"}}
      - key: workflow
        name: Agent step
        names: {fr: "Étape agent"}
        kind: enum
        values: [none, dev, needs_info, doing, review, rework]
        labels: {none: {fr: "Aucune", en: "None"}, dev: {fr: "À développer", en: "To develop"}, needs_info: {fr: "Infos à compléter", en: "Needs information"}, doing: {fr: "En cours", en: "In progress"}, review: {fr: "À relire", en: "To review"}, rework: {fr: "À reprendre", en: "To rework"}}
        history:
          entered_on: workflow_since
          funnel: [dev, doing, review]
      - { key: workflow_since, name: Step since, names: {fr: "Étape depuis"}, kind: date }
      - { key: labels_text, name: Labels, names: {fr: "Étiquettes"}, kind: text, max_len: 1000 }
      - { key: opened_at, name: Opened at, names: {fr: "Ouvert le"}, kind: date_time, indexed: true }
  - key: work_item_comment
    name: Ticket comment
    names: {fr: "Commentaire de ticket"}
    icon: file-text
    times: {event_property: commented_at}
    properties:
      - { key: ref, name: Reference, names: {fr: "Référence"}, kind: text, max_len: 200, required: true, unique: true, indexed: true }
      - { key: author, name: Author, names: {fr: "Auteur"}, kind: text, max_len: 200, classification: personal }
      - { key: by_agent, name: Written by an agent, names: {fr: "Écrit par un agent"}, kind: bool }
      - { key: body, name: Text, names: {fr: "Texte"}, kind: text, max_len: 20000 }
      - { key: commented_at, name: Written at, names: {fr: "Écrit le"}, kind: date_time, indexed: true }
link_types:
  - key: run_of_agent
    name: is a run of
    names: {fr: "est une exécution de"}
    inverse_name: ran
    inverse_names: {fr: "a exécuté"}
    from_types: [agent_run]
    to_types: [hosted_agent]
  - key: run_in_environment
    name: ran in
    names: {fr: "a tourné dans"}
    inverse_name: hosted
    inverse_names: {fr: "a accueilli"}
    from_types: [agent_run]
    to_types: [agent_environment]
  - key: file_produced_by
    name: was produced by
    names: {fr: "a été produit par"}
    inverse_name: produced
    inverse_names: {fr: "a produit"}
    from_types: [agent_file]
    to_types: [agent_run]
  - key: run_read_file
    name: read
    names: {fr: "a lu"}
    inverse_name: was read by
    inverse_names: {fr: "a été lu par"}
    from_types: [agent_run]
    to_types: [agent_file]
  - key: merge_request_of_run
    name: was opened by
    names: {fr: "a été ouverte par"}
    inverse_name: opened
    inverse_names: {fr: "a ouvert"}
    from_types: [agent_merge_request]
    to_types: [agent_run]
  - key: run_works_on
    name: works on
    names: {fr: "traite"}
    inverse_name: is worked on by
    inverse_names: {fr: "est traité par"}
    from_types: [agent_run]
    to_types: [work_item]
    one_target: true
  - key: merge_request_for
    name: is for
    names: {fr: "est pour"}
    inverse_name: has as merge request
    inverse_names: {fr: "a pour demande de fusion"}
    from_types: [agent_merge_request]
    to_types: [work_item]
    one_target: true
  - key: comment_on_work_item
    name: comments
    names: {fr: "commente"}
    inverse_name: is commented by
    inverse_names: {fr: "est commenté par"}
    from_types: [work_item_comment]
    to_types: [work_item]
    one_target: true
