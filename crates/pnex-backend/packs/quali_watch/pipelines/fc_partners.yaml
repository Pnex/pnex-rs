# The partners of the active certifications the org holds: every
# certification of the export brings ~397k partner rows, the active ones
# ~141k (2026-10-29).
key: fc_partners
name: France Compétences partners
hosts: [www.data.gouv.fr, static.data.gouv.fr]
steps:
  - fetch: { as: catalogue, url: "https://www.data.gouv.fr/api/1/datasets/5eebbc067a14b6fecc9c9976/" }
  - extract:
      as: export
      from: catalogue
      json: /resources
      where: { title: "export-fiches-csv-*.zip" }
      latest_by: last_modified
  - fetch: { as: zip, for_each: export, url: "{{url}}", skip_if_unchanged: true }
  - unpack: { as: files, from: zip, entries: ["*Partenaires*.csv"] }
  - read:
      as: rows
      from: files
      format: csv
      delimiter: ";"
      columns:
        - { name: Numero_Fiche, type: text, optional: true }
        - { name: Nom_Partenaire, type: text, optional: true }
        - { name: Siret_Partenaire, type: text, optional: true }
        - { name: Habilitation_Partenaire, type: text, optional: true }
  - enumerate:
      as: certs
      cross: [{ as: code, objects: { type: certification, property: code, only: { status: [active] } } }]
  - sql:
      as: kept
      sql: |
        SELECT r.* FROM rows AS r WHERE upper(trim(r.Numero_Fiche)) IN (SELECT code FROM certs)
  - write: { from: kept, table: { name: fc_partners, replace: true } }
tests:
  - name: the partners of an active certification
    objects: { "certification.code?status=active": [RS5001] }
    given:
      "https://www.data.gouv.fr/api/1/datasets/5eebbc067a14b6fecc9c9976/": fc_dataset.json
      "https://static.data.gouv.fr/resources/fc/export-fiches-csv-2026-10-20.zip": fc_export.zip
    expect:
      kept:
        rows: 1
        contains:
          - { Numero_Fiche: RS5001, Nom_Partenaire: PARTENAIRE A, Habilitation_Partenaire: HABILITATION_FORMER }
