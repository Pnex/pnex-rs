# France Compétences open data (data.gouv.fr, the newest export-fiches-csv
# zip): the certifiers of the setting `certifiers` (SIRET, compared as
# digits) and their certifications; an empty setting keeps every row.
key: fc_certifiers
name: France Compétences certifiers
hosts: [www.data.gouv.fr, static.data.gouv.fr]
steps:
  - fetch: { as: catalogue, url: "https://www.data.gouv.fr/api/1/datasets/5eebbc067a14b6fecc9c9976/" }
  - extract:
      as: export
      from: catalogue
      json: /resources
      where: { title: "export-fiches-csv-*.zip" }
      latest_by: last_modified
  - fetch: { as: zip, for_each: export, url: "{{url}}", skip_if_unchanged: true }
  - unpack: { as: files, from: zip, entries: ["*Certificateurs*.csv"] }
  - read:
      as: rows
      from: files
      format: csv
      delimiter: ";"
      columns:
        - { name: Numero_Fiche, type: text, optional: true }
        - { name: Siret_Certificateur, type: text, optional: true }
        - { name: Nom_Certificateur, type: text, optional: true }
  - enumerate: { as: wanted, cross: [{ as: siret, setting: quali_watch.certifiers }] }
  - sql:
      as: kept
      sql: |
        SELECT r.* FROM rows AS r
        WHERE NOT EXISTS (SELECT 1 FROM wanted)
           OR digits(r.Siret_Certificateur) IN (SELECT digits(siret) FROM wanted)
  - write: { from: kept, table: { name: fc_certifiers, replace: true } }
tests:
  - name: the certifier of the setting only
    settings: { quali_watch.certifiers: "802 594 887 00019" }
    given:
      "https://www.data.gouv.fr/api/1/datasets/5eebbc067a14b6fecc9c9976/": fc_dataset.json
      "https://static.data.gouv.fr/resources/fc/export-fiches-csv-2026-10-20.zip": fc_export.zip
    expect:
      kept:
        rows: 1
        contains:
          - { Numero_Fiche: RS5001, Nom_Certificateur: TELEPILOTE }
  - name: an empty setting keeps every certifier
    given:
      "https://www.data.gouv.fr/api/1/datasets/5eebbc067a14b6fecc9c9976/": fc_dataset.json
      "https://static.data.gouv.fr/resources/fc/export-fiches-csv-2026-10-20.zip": fc_export.zip
    expect:
      kept: { rows: 2 }
