# The register's record of each company of the network: linked to a
# certification of the org's setting.
key: qw_company_search
name: Company register (network)
hosts: [recherche-entreprises.api.gouv.fr]
steps:
  - enumerate: { as: rows, cross: [{ as: siren, objects: { type: organization, property: siren, linked: [accredited_for, holds], codes: { setting: quali_watch.certifications, property: code } } }] }
  - fetch:
      as: answer
      for_each: rows
      url: "https://recherche-entreprises.api.gouv.fr/search"
      params: { per_page: "1", q: "{{siren}}" }
      every: 150ms
      missing_is_empty: true
  - read:
      as: found
      from: answer
      format: json
      records: /results
      columns:
        - { name: queried, value: "{{siren}}" }
        - { name: record, at: "/", type: json }
  - write: { from: found, table: { name: qw_company_search, replace: true } }
tests:
  - name: the records of one object
    objects: { "organization.siren?linked=accredited_for,holds?code~quali_watch.certifications": ["552100554"] }
    given:
      "https://recherche-entreprises.api.gouv.fr/search?per_page=1&q=552100554": sirene_network.json
    expect:
      found:
        rows: 1
