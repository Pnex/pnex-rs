# The skill blocks of the certifications the org holds.
key: fc_blocks
name: France Compétences skill blocks
hosts: [www.data.gouv.fr, static.data.gouv.fr]
steps:
  - fetch: { as: catalogue, url: "https://www.data.gouv.fr/api/1/datasets/5eebbc067a14b6fecc9c9976/" }
  - extract:
      as: export
      from: catalogue
      json: /resources
      where: { title: "export-fiches-csv-*.zip" }
      latest_by: last_modified
  - fetch: { as: zip, for_each: export, url: "{{url}}", skip_if_unchanged: true }
  - unpack: { as: files, from: zip, entries: ["*Blocs_De_Comp*.csv"] }
  - read:
      as: rows
      from: files
      format: csv
      delimiter: ";"
      columns:
        - { name: Numero_Fiche, type: text, optional: true }
        - { name: Bloc_Competences_Code, type: text, optional: true }
        - { name: Bloc_Competences_Libelle, type: text, optional: true }
  - enumerate: { as: certs, cross: [{ as: code, objects: { type: certification, property: code } }] }
  - sql:
      as: kept
      sql: |
        SELECT r.* FROM rows AS r WHERE upper(trim(r.Numero_Fiche)) IN (SELECT code FROM certs)
  - write: { from: kept, table: { name: fc_blocks, replace: true } }
tests:
  - name: the blocks of the org's certifications
    objects: { certification.code: [RS5001] }
    given:
      "https://www.data.gouv.fr/api/1/datasets/5eebbc067a14b6fecc9c9976/": fc_dataset.json
      "https://static.data.gouv.fr/resources/fc/export-fiches-csv-2026-10-20.zip": fc_export.zip
    expect:
      kept:
        rows: 1
        contains:
          - { Bloc_Competences_Code: RS5001BC01, Bloc_Competences_Libelle: Piloter un drone }
