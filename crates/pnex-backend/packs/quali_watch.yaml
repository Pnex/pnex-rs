# Business pack "Partner network watch" (partner-watch.md D300–D316, product
# Quali-Watch): a certifier watches the training organizations it accredits.
# Nothing of it enters the core (D190): certifications, observed pages, CPF
# offers, rules, findings, procedures and reminders are pack types.
# The certifier itself is an `organization` of the org, linked to its
# certifications by `porte`.
# A finding produced by an LLM rule is never confirmed on its own (D316):
# it is `a_valider`, quotes its excerpt word for word and keeps where it
# was found (`constate_dans.locator`) and the rule version.
# Reminders follow the D314 pattern: a procedure carries its level and next
# due date, a daily flow sends the next reminder and moves the procedure on;
# levels needing a human create an `a_valider` reminder that the
# `valider_envoi` action sends.
# The partner network import reads the certifier's sheet (one row per
# partner × certification, pnex-quali-watch/import-excel.md) as a snapshot:
# a row gone closes its accreditation, nothing is deleted.
# France Compétences open data (ingestion.md D317–D322) arrives through the
# "Ingestion France Compétences" flow: the daily zip of data.gouv.fr is
# resolved, downloaded, extracted, inspected, filtered (the client
# certifier's SIRET, then the certifications it holds) and imported by
# fc_certificateurs, fc_fiches and fc_partenaires (a partner gone from the
# open data closes its accreditation); the SIRENE import then enriches the
# organizations. Accreditations are linked at SIREN level (Q-I2 open).
# The same night run reads the content of the sheets: RNCP skill blocks
# (fc_blocs, CSV of the same zip) and, from the RS XML export, each
# competency of a sheet (one per paragraph of CAPACITES_ATTESTEES, keyed
# RS0101-C3), objectives, prerequisites, jury, graduates, and the state of
# each accreditation (fc_rs_xml). The XML <ACTIF> is not trusted: the sheet
# status comes from the CSV Standard (fc_fiches).
# Programmes (the certifier's reference and each partner's) and their
# modules are compared competency by competency through `couvre`: the
# cross-table is a computed view, not a type (pnex-quali-watch PRD §5.7).
# Rules and reminders ship as functions and flow models (D316): created at
# install when the org has none of that name, as drafts, never deployed by
# the install (D123). A deterministic rule writes its finding `propose`
# (create only: a reviewed finding is never reset); an LLM rule must write
# `a_valider` with its word-for-word excerpt and locator.
key: quali_watch
name: Partner network watch
names: {fr: "Veille du réseau de partenaires"}
version: "1.2.0"
requires: [entreprises_fr]
extends:
  - type: organization
    properties:
      - { key: contact_conformite_email, name: Compliance contact e-mail, names: {fr: "E-mail du contact conformité"}, kind: text, max_len: 254 }
      - { key: contact_conformite_nom, name: Compliance contact, names: {fr: "Contact conformité"}, kind: text, max_len: 255 }
      - { key: contact_telephone, name: Phone, names: {fr: "Téléphone"}, kind: text, max_len: 64 }
      - { key: charge_reseau_email, name: Network officer e-mail, names: {fr: "E-mail du chargé de réseau"}, kind: text, max_len: 254 }
description: Certifications, partner websites, observed pages with dated proofs, CPF offers, rules, findings and graduated reminders.
descriptions: {fr: "Certifications, sites des partenaires, pages observées avec preuves datées, offres CPF, règles, écarts et relances graduées."}
types:
  - key: certification
    name: Certification
    names: {fr: "Certification"}
    icon: book
    may_be_contained_in: [folder]
    properties:
      - { key: code, name: Code, names: {fr: "Code"}, kind: text, max_len: 16, required: true, unique: true }
      - { key: repertoire, name: Register, names: {fr: "Répertoire"}, kind: enum, values: [rncp, rs], indexed: true }
      - { key: intitule, name: Exact title, names: {fr: "Intitulé exact"}, kind: text, max_len: 500 }
      - { key: niveau, name: Level, names: {fr: "Niveau"}, kind: text, max_len: 32 }
      - { key: date_enregistrement, name: Registered on, names: {fr: "Enregistrée le"}, kind: date }
      - { key: date_echeance, name: Expires on, names: {fr: "Échéance"}, kind: date }
      - { key: statut, name: Status, names: {fr: "Statut"}, kind: enum, values: [actif, inactif, echu], indexed: true }
      - { key: url_fiche, name: Register page, names: {fr: "Fiche du répertoire"}, kind: url }
      - { key: objectifs, name: Objectives and context, names: {fr: "Objectifs et contexte"}, kind: text, max_len: 50000 }
      - { key: prerequis, name: Entry prerequisites, names: {fr: "Prérequis"}, kind: text, max_len: 50000 }
      - { key: jury, name: Jury, names: {fr: "Jury"}, kind: text, max_len: 10000 }
      - { key: nb_certifies, name: Graduates (last year), names: {fr: "Certifiés (dernière année)"}, kind: number, min: 0 }
      # The register gives a title here as often as a link: text.
      - { key: url_description, name: Certifier description, names: {fr: "Descriptif du certificateur"}, kind: text, max_len: 2048 }
  - key: site_web
    name: Website
    names: {fr: "Site web"}
    icon: globe
    may_be_contained_in: [folder]
    properties:
      - { key: url_racine, name: Root URL, names: {fr: "URL racine"}, kind: url, required: true }
      - { key: domaine, name: Domain, names: {fr: "Domaine"}, kind: text, max_len: 255, unique: true }
      - { key: dernier_crawl, name: Last crawl, names: {fr: "Dernier parcours"}, kind: date_time }
      - { key: pages_listees, name: Listed pages, names: {fr: "Pages listées"}, kind: number, min: 0 }
      - { key: pages_pertinentes, name: Relevant pages, names: {fr: "Pages pertinentes"}, kind: number, min: 0 }
      - { key: etat_collecte, name: Collection status, names: {fr: "État de la collecte"}, kind: enum, values: [ok, bloque, inaccessible, vide], indexed: true }
  - key: page_observee
    name: Observed page
    names: {fr: "Page observée"}
    icon: file-text
    may_be_contained_in: [folder]
    properties:
      - { key: url, name: URL, names: {fr: "URL"}, kind: text, max_len: 2048, required: true, unique: true }
      - { key: titre, name: Title, names: {fr: "Titre"}, kind: text, max_len: 500 }
      - { key: premiere_vue, name: First seen, names: {fr: "Vue la première fois"}, kind: date_time }
      - { key: derniere_vue, name: Last seen, names: {fr: "Vue la dernière fois"}, kind: date_time }
      - { key: empreinte_texte, name: Text fingerprint, names: {fr: "Empreinte du texte"}, kind: text, max_len: 64 }
      - { key: pertinente, name: Relevant, names: {fr: "Pertinente"}, kind: bool }
      - { key: codes_cites, name: Codes quoted, names: {fr: "Codes cités"}, kind: text, max_len: 1000 }
      # The registry states (D309), written by the crawl's `record`.
      - { key: etat, name: State, names: {fr: "État"}, kind: enum, values: [listed, relevant, captured, gone], indexed: true }
  - key: offre_cpf
    name: CPF offer
    names: {fr: "Offre CPF"}
    icon: tag
    may_be_contained_in: [folder]
    properties:
      - { key: id_action, name: Action id, names: {fr: "Identifiant de l'action"}, kind: text, max_len: 64, required: true, unique: true }
      - { key: intitule, name: Title, names: {fr: "Intitulé"}, kind: text, max_len: 500 }
      - { key: prix, name: Price, names: {fr: "Prix"}, kind: money }
      - { key: duree_heures, name: Duration, names: {fr: "Durée"}, kind: number, unit: h, min: 0 }
      - { key: ville, name: City, names: {fr: "Ville"}, kind: text, max_len: 255 }
      - { key: modalite, name: Delivery, names: {fr: "Modalité"}, kind: enum, values: [presentiel, distanciel, mixte] }
      - { key: vue_le, name: Seen on, names: {fr: "Vue le"}, kind: date }
  - key: regle
    name: Rule
    names: {fr: "Règle"}
    icon: landmark
    may_be_contained_in: [folder]
    write_role: admin
    properties:
      - { key: code, name: Code, names: {fr: "Code"}, kind: text, max_len: 16, required: true, unique: true }
      - { key: libelle, name: Label, names: {fr: "Libellé"}, kind: text, max_len: 500 }
      - { key: type, name: Kind, names: {fr: "Nature"}, kind: enum, values: [deterministe, llm] }
      - { key: gravite_defaut, name: Default severity, names: {fr: "Gravité par défaut"}, kind: enum, values: [info, mineur, majeur, critique] }
      - { key: reference, name: Legal or contractual reference, names: {fr: "Référence légale ou contractuelle"}, kind: text, max_len: 2000 }
      - { key: version, name: Version, names: {fr: "Version"}, kind: number, min: 1 }
      - { key: active, name: Active, names: {fr: "Active"}, kind: bool }
  - key: ecart
    name: Finding
    names: {fr: "Écart"}
    icon: flag
    may_be_contained_in: [folder]
    properties:
      - { key: cle, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, unique: true }
      - { key: attendu, name: Expected, names: {fr: "Attendu"}, kind: text, max_len: 2000 }
      - { key: constate, name: Observed, names: {fr: "Constaté"}, kind: text, max_len: 2000 }
      - { key: extrait, name: Excerpt (word for word), names: {fr: "Extrait (mot pour mot)"}, kind: text, max_len: 2000 }
      - { key: gravite, name: Severity, names: {fr: "Gravité"}, kind: enum, values: [info, mineur, majeur, critique], indexed: true }
      - key: etat
        name: State
        names: {fr: "État"}
        kind: enum
        values: [propose, a_valider, confirme, en_relance, corrige, clos, rejete]
        required: true
        indexed: true
      - { key: detecte_le, name: Detected on, names: {fr: "Détecté le"}, kind: date_time }
      - { key: regle_version, name: Rule version, names: {fr: "Version de la règle"}, kind: number, min: 1 }
      - { key: confiance, name: Confidence, names: {fr: "Confiance"}, kind: number, min: 0, max: 1 }
    actions:
      - key: valider
        name: Confirm
        names: {fr: "Valider"}
        params:
          - { key: gravite, name: Severity, names: {fr: "Gravité"}, kind: enum, values: [info, mineur, majeur, critique] }
          - { key: commentaire, name: Comment, names: {fr: "Commentaire"}, kind: text, max_len: 2000 }
      - key: rejeter
        name: Reject
        names: {fr: "Rejeter"}
        confirm: true
        params:
          - { key: motif, name: Reason, names: {fr: "Motif"}, kind: enum, values: [faux_positif, hors_perimetre, accepte_par_le_client], required: true }
          - { key: commentaire, name: Comment, names: {fr: "Commentaire"}, kind: text, max_len: 2000 }
      - key: reverifier
        name: Check again
        names: {fr: "Revérifier"}
  - key: procedure
    name: Procedure
    names: {fr: "Procédure"}
    icon: workflow
    may_be_contained_in: [folder]
    properties:
      - { key: niveau, name: Level, names: {fr: "Niveau"}, kind: enum, values: [aucun, r1, r2, r3, r4, retrait_propose], indexed: true }
      - { key: etat, name: State, names: {fr: "État"}, kind: enum, values: [ouverte, en_attente_validation, suspendue, close], required: true, indexed: true }
      - { key: prochaine_echeance, name: Next due date, names: {fr: "Prochaine échéance"}, kind: date, indexed: true }
      - { key: ouverte_le, name: Opened on, names: {fr: "Ouverte le"}, kind: date }
      - { key: close_le, name: Closed on, names: {fr: "Close le"}, kind: date }
      - { key: motif_cloture, name: Closing reason, names: {fr: "Motif de clôture"}, kind: enum, values: [corrige, retrait_effectue, fin_partenariat] }
      - { key: contact_email, name: Compliance contact, names: {fr: "Contact conformité"}, kind: text, max_len: 254 }
      - { key: copie_email, name: Copy to, names: {fr: "Copie à"}, kind: text, max_len: 254 }
    actions:
      - key: valider_envoi
        name: Approve sending
        names: {fr: "Valider l'envoi"}
        confirm: true
        params:
          - { key: relance_id, name: Reminder, names: {fr: "Relance"}, kind: ref, to_type: relance, required: true }
          - { key: texte_modifie, name: Edited text, names: {fr: "Texte modifié"}, kind: text, max_len: 4000 }
      - key: envoyer_maintenant
        name: Send now
        names: {fr: "Envoyer maintenant"}
        confirm: true
        params:
          - { key: niveau, name: Level, names: {fr: "Niveau"}, kind: enum, values: [r1, r2, r3, r4], required: true }
      - key: suspendre
        name: Suspend
        names: {fr: "Suspendre"}
        params:
          - { key: jusqu_au, name: Until, names: {fr: "Jusqu'au"}, kind: date }
          - { key: motif, name: Reason, names: {fr: "Motif"}, kind: text, max_len: 500, required: true }
      - key: reprendre
        name: Resume
        names: {fr: "Reprendre"}
        params:
          - { key: motif, name: Reason, names: {fr: "Motif"}, kind: text, max_len: 500 }
      - key: marquer_corrige
        name: Mark as fixed
        names: {fr: "Marquer corrigé"}
        params:
          - { key: source, name: Reported by, names: {fr: "Signalé par"}, kind: enum, values: [partenaire, client], required: true }
      - key: clore
        name: Close
        names: {fr: "Clore"}
        confirm: true
        params:
          - { key: motif, name: Reason, names: {fr: "Motif"}, kind: enum, values: [corrige, retrait_effectue, fin_partenariat], required: true }
  - key: relance
    name: Reminder
    names: {fr: "Relance"}
    icon: newspaper
    may_be_contained_in: [folder]
    properties:
      - { key: cle, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, unique: true }
      - { key: niveau, name: Level, names: {fr: "Niveau"}, kind: enum, values: [r1, r2, r3, r4, retrait_propose], required: true }
      - { key: envoyee_le, name: Sent on, names: {fr: "Envoyée le"}, kind: date_time }
      - { key: destinataire, name: Recipient, names: {fr: "Destinataire"}, kind: text, max_len: 254 }
      - { key: modele, name: Template, names: {fr: "Modèle"}, kind: text, max_len: 255 }
      - { key: etat, name: State, names: {fr: "État"}, kind: enum, values: [a_valider, envoyee, echec], required: true, indexed: true }
      - { key: texte_modifie, name: Edited text, names: {fr: "Texte modifié"}, kind: text, max_len: 4000 }
      - { key: lien_corrige_ouvert_le, name: Fix link opened on, names: {fr: "Lien « corrigé » ouvert le"}, kind: date_time }
  - key: competence
    name: Competency
    names: {fr: "Compétence"}
    icon: cube
    may_be_contained_in: [folder]
    properties:
      - { key: cle, name: Key, names: {fr: "Clé"}, kind: text, max_len: 64, required: true, unique: true }
      - { key: rang, name: Rank, names: {fr: "Rang"}, kind: number, min: 0 }
      - { key: libelle, name: Official wording, names: {fr: "Libellé officiel"}, kind: text, max_len: 10000 }
      - { key: nature, name: Kind, names: {fr: "Nature"}, kind: enum, values: [competence, bloc], indexed: true }
  - key: programme
    name: Programme
    names: {fr: "Programme"}
    icon: layers
    may_be_contained_in: [folder]
    properties:
      - { key: cle, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, required: true, unique: true }
      - { key: role, name: Role, names: {fr: "Rôle"}, kind: enum, values: [reference, partenaire], indexed: true }
      - { key: version, name: Version, names: {fr: "Version"}, kind: number, min: 1 }
      - { key: source_url, name: Source, names: {fr: "Source"}, kind: url }
      - { key: format, name: Delivery, names: {fr: "Modalité"}, kind: enum, values: [presentiel, distanciel, mixte] }
      - { key: heures_synchrones, name: Live hours, names: {fr: "Heures synchrones"}, kind: number, unit: h, min: 0 }
      - { key: heures_preparation, name: Preparation hours, names: {fr: "Heures de préparation"}, kind: number, unit: h, min: 0 }
      - { key: heures_total, name: Total hours, names: {fr: "Heures au total"}, kind: number, unit: h, min: 0 }
      - { key: recu_le, name: Received on, names: {fr: "Reçu le"}, kind: date }
  - key: module
    name: Module
    names: {fr: "Module"}
    icon: file-text
    may_be_contained_in: [folder]
    properties:
      - { key: cle, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, required: true, unique: true }
      - { key: rang, name: Rank, names: {fr: "Rang"}, kind: number, min: 0 }
      - { key: titre, name: Title, names: {fr: "Titre"}, kind: text, max_len: 500 }
      - { key: heures, name: Hours, names: {fr: "Heures"}, kind: number, unit: h, min: 0 }
      - { key: contenu, name: Content, names: {fr: "Contenu"}, kind: text, max_len: 20000 }
      - { key: cas_pratique, name: Case study, names: {fr: "Cas pratique"}, kind: text, max_len: 4000 }
      - { key: livrable, name: Deliverable, names: {fr: "Livrable"}, kind: text, max_len: 2000 }
link_types:
  - key: porte
    name: holds
    names: {fr: "porte"}
    inverse_name: is held by
    inverse_names: {fr: "est portée par"}
    from_types: [organization]
    to_types: [certification]
  - key: habilite_pour
    name: is accredited for
    names: {fr: "est habilité pour"}
    inverse_name: accredits
    inverse_names: {fr: "habilite"}
    from_types: [organization]
    to_types: [certification]
    attributes:
      - { key: perimetre, name: Scope, names: {fr: "Périmètre"}, kind: enum, values: [preparation, evaluation, les_deux] }
      - { key: declaree_fc, name: Declared to France Compétences, names: {fr: "Déclarée à France Compétences"}, kind: bool }
      - { key: reference_convention, name: Agreement reference, names: {fr: "Référence de la convention"}, kind: text, max_len: 255 }
      - { key: date_fin, name: Accredited until, names: {fr: "Habilité jusqu'au"}, kind: date }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 255 }
      - { key: etat_fc, name: France Compétences state, names: {fr: "État France Compétences"}, kind: enum, values: [actif, inactif] }
      - { key: date_actif, name: Active since, names: {fr: "Actif depuis"}, kind: date }
      - { key: date_etat, name: State changed on, names: {fr: "État modifié le"}, kind: date }
  - key: a_pour_site
    name: has as website
    names: {fr: "a pour site"}
    inverse_name: is the website of
    inverse_names: {fr: "est le site de"}
    from_types: [organization]
    to_types: [site_web]
  - key: page_de
    name: is a page of
    names: {fr: "est une page de"}
    inverse_name: has as page
    inverse_names: {fr: "a pour page"}
    from_types: [page_observee]
    to_types: [site_web]
    one_target: true
  - key: prouve_par
    name: is proven by
    names: {fr: "est prouvée par"}
    inverse_name: proves
    inverse_names: {fr: "prouve"}
    from_types: [page_observee]
    to_types: [media_asset]
    attributes:
      - { key: captured_at, name: Captured at, names: {fr: "Capturée le"}, kind: date_time }
      - { key: sha256_manifest, name: Manifest SHA-256, names: {fr: "SHA-256 du manifeste"}, kind: text, max_len: 64 }
      - { key: kind, name: Part, names: {fr: "Partie"}, kind: enum, values: [capture, html, text] }
  - key: offre_de
    name: is an offer of
    names: {fr: "est une offre de"}
    inverse_name: offers
    inverse_names: {fr: "propose"}
    from_types: [offre_cpf]
    to_types: [organization]
    one_target: true
    attributes:
      - { key: rapproche_par, name: Matched by, names: {fr: "Rapprochée par"}, kind: enum, values: [siret, nda, nom] }
  - key: porte_sur
    name: is about
    names: {fr: "porte sur"}
    inverse_name: is the subject of
    inverse_names: {fr: "fait l'objet de"}
    from_types: [offre_cpf]
    to_types: [certification]
  - key: concerne
    name: concerns
    names: {fr: "concerne"}
    inverse_name: is concerned by
    inverse_names: {fr: "est concerné par"}
    from_types: [ecart]
    to_types: [organization]
    one_target: true
  - key: sur
    name: bears on
    names: {fr: "porte sur la certification"}
    inverse_name: has as finding
    inverse_names: {fr: "a pour écart"}
    from_types: [ecart]
    to_types: [certification]
  - key: constate_dans
    name: is observed in
    names: {fr: "est constaté dans"}
    inverse_name: shows
    inverse_names: {fr: "montre"}
    from_types: [ecart]
    to_types: [page_observee, offre_cpf, media_asset, programme, module]
    attributes:
      - { key: locator, name: Locator, names: {fr: "Repère"}, kind: text, max_len: 255 }
  - key: selon
    name: follows the rule
    names: {fr: "selon la règle"}
    inverse_name: produced
    inverse_names: {fr: "a produit"}
    from_types: [ecart]
    to_types: [regle]
    one_target: true
  - key: traite_par
    name: is handled by
    names: {fr: "est traité par"}
    inverse_name: handles
    inverse_names: {fr: "traite"}
    from_types: [ecart]
    to_types: [procedure]
  - key: procedure_de
    name: is a procedure of
    names: {fr: "est une procédure de"}
    inverse_name: has as procedure
    inverse_names: {fr: "a pour procédure"}
    from_types: [procedure]
    to_types: [organization]
    one_target: true
  - key: relance_de
    name: is a reminder of
    names: {fr: "est une relance de"}
    inverse_name: has as reminder
    inverse_names: {fr: "a pour relance"}
    from_types: [relance]
    to_types: [procedure]
    one_target: true
  - key: competence_de
    name: is a competency of
    names: {fr: "est une compétence de"}
    inverse_name: has as competency
    inverse_names: {fr: "a pour compétence"}
    from_types: [competence]
    to_types: [certification]
    one_target: true
  - key: programme_pour
    name: prepares for
    names: {fr: "prépare à"}
    inverse_name: is prepared by
    inverse_names: {fr: "est préparée par"}
    from_types: [programme]
    to_types: [certification]
    one_target: true
  - key: programme_de
    name: is a programme of
    names: {fr: "est un programme de"}
    inverse_name: has as programme
    inverse_names: {fr: "a pour programme"}
    from_types: [programme]
    to_types: [organization]
    one_target: true
  - key: module_de
    name: is a module of
    names: {fr: "est un module de"}
    inverse_name: has as module
    inverse_names: {fr: "a pour module"}
    from_types: [module]
    to_types: [programme]
    one_target: true
  - key: couvre
    name: covers
    names: {fr: "couvre"}
    inverse_name: is covered by
    inverse_names: {fr: "est couverte par"}
    from_types: [module]
    to_types: [competence]
    attributes:
      - { key: rapproche_par, name: Matched by, names: {fr: "Rapproché par"}, kind: enum, values: [code_cite, intitule, llm, humain] }
      - { key: extrait, name: Excerpt (word for word), names: {fr: "Extrait (mot pour mot)"}, kind: text, max_len: 2000 }
      - { key: confiance, name: Confidence, names: {fr: "Confiance"}, kind: number, min: 0, max: 1 }
      - { key: valide, name: Validated, names: {fr: "Validé"}, kind: bool }
hierarchies:
  - key: reseau
    name: Network
    names: {fr: "Réseau"}
    steps:
      - { link: habilite_pour, inverse: true }
      - { link: a_pour_site }
      - { link: page_de, inverse: true }
imports:
  - name: Partner network (sheet)
    source: file
    mode: snapshot
    mapping:
      key: reseau_partenaires
      name: Partner network
      names: {fr: "Réseau des partenaires"}
      objects:
        - as: org
          type: organization
          key: siren
          title: raison_sociale
          properties:
            siren: { from: siret, convert: [digits, luhn, "left:9"] }
            nda: { from: nda, convert: [digits] }
            contact_conformite_email: { from: contact_conformite_email, convert: [email] }
            contact_conformite_nom: contact_conformite_nom
            contact_telephone: contact_telephone
            charge_reseau_email: { from: charge_reseau_email, convert: [email] }
        - as: cert
          type: certification
          key: code
          create: false
          properties:
            code: { from: code_certification, convert: [trim, upper] }
        - as: site
          type: site_web
          key: domaine
          each: { from: site_web, convert: ["split:;"] }
          properties:
            url_racine: { from: ".", convert: [url_origin] }
            domaine: { from: ".", convert: [domain] }
      links:
        - type: habilite_pour
          from: org
          to: cert
          valid_from: { from: date_debut_habilitation, convert: ["date:%d/%m/%Y"] }
          attributes:
            perimetre: perimetre
            declaree_fc: { from: declaree_france_competences, convert: [{ enum: { oui: "true", non: "false" } }] }
            reference_convention: reference_convention
            date_fin: { from: date_fin_habilitation, convert: ["date:%d/%m/%Y"] }
            source: { value: "import" }
        - { type: a_pour_site, from: org, to: site }
  - name: France Compétences · certifiers
    source: file
    mode: incremental
    mapping:
      key: fc_certificateurs
      name: France Compétences certifiers
      names: {fr: "Certificateurs France Compétences"}
      format: csv
      delimiter: ";"
      objects:
        - as: org
          type: organization
          key: siren
          title: { from: Nom_Certificateur, convert: [trim] }
          properties:
            siren: { from: Siret_Certificateur, convert: [digits, luhn, "left:9"] }
        - as: cert
          type: certification
          key: code
          properties:
            code: { from: Numero_Fiche, convert: [trim, upper] }
            repertoire: { from: Numero_Fiche, convert: [trim, upper, "left:2", { enum: { RN: rncp, RS: rs } }] }
      links:
        - { type: porte, from: org, to: cert, close_missing: false }
  - name: France Compétences · sheets
    source: file
    mode: incremental
    mapping:
      key: fc_fiches
      name: France Compétences sheets
      names: {fr: "Fiches France Compétences"}
      format: csv
      delimiter: ";"
      objects:
        - as: cert
          type: certification
          key: code
          create: false
          update: true
          missing: skip
          properties:
            code: { from: Numero_Fiche, convert: [trim, upper] }
            intitule: { from: Intitule, convert: [trim] }
            niveau: { from: Nomenclature_Europe_Niveau, convert: [trim] }
            # RS sheets leave Date_Effet empty: Date_Decision then.
            date_enregistrement: { concat: [Date_Effet, Date_Decision], sep: "|", convert: ["before:|", "date:%d/%m/%Y"] }
            date_echeance: { from: Date_Fin_Enregistrement, convert: ["date:%d/%m/%Y"] }
            statut: { from: Actif, convert: [{ enum: { ACTIVE: actif, INACTIVE: inactif } }] }
  - name: France Compétences · partners
    source: file
    mode: snapshot
    mapping:
      key: fc_partenaires
      name: France Compétences partners
      names: {fr: "Partenaires France Compétences"}
      format: csv
      delimiter: ";"
      objects:
        - as: org
          type: organization
          key: siren
          title: { from: Nom_Partenaire, convert: [trim] }
          properties:
            siren: { from: Siret_Partenaire, convert: [digits, luhn, "left:9"] }
        - as: cert
          type: certification
          key: code
          create: false
          properties:
            code: { from: Numero_Fiche, convert: [trim, upper] }
      links:
        - type: habilite_pour
          from: org
          to: cert
          attributes:
            perimetre: { from: Habilitation_Partenaire, convert: [{ enum: { HABILITATION_ORGA_FORM: les_deux, HABILITATION_FORMER: preparation, HABILITATION_ORGANISER: evaluation } }] }
            declaree_fc: { value: true }
            source: { value: france_competences }
          # Several SIRET of one SIREN with different scopes: both.
          on_conflict: { perimetre: les_deux }
  - name: France Compétences · skill blocks
    source: file
    mode: snapshot
    mapping:
      key: fc_blocs
      name: France Compétences skill blocks
      names: {fr: "Blocs de compétences France Compétences"}
      format: csv
      delimiter: ";"
      objects:
        - as: cert
          type: certification
          key: code
          create: false
          properties:
            code: { from: Numero_Fiche, convert: [trim, upper] }
        - as: bloc
          type: competence
          key: cle
          title: { from: Bloc_Competences_Libelle, convert: [trim] }
          close_missing: true
          properties:
            cle: { from: Bloc_Competences_Code, convert: [trim, upper] }
            rang: { from: Bloc_Competences_Code, convert: [trim, upper, "after:BC", digits] }
            libelle: { from: Bloc_Competences_Libelle, convert: [trim] }
            nature: { value: bloc }
      links:
        - { type: competence_de, from: bloc, to: cert }
  - name: France Compétences · RS sheets (XML)
    source: file
    mode: snapshot
    mapping:
      key: fc_rs_xml
      name: France Compétences RS sheets
      names: {fr: "Fiches RS France Compétences (XML)"}
      format: xml
      rows: FICHES/FICHE
      objects:
        # The whole register is read: only the org's certifications are
        # enriched, their competencies created (`needs`).
        - as: cert
          type: certification
          key: code
          create: false
          update: true
          missing: skip
          properties:
            code: { from: NUMERO_FICHE, convert: [trim, upper] }
            objectifs: { from: OBJECTIFS_CONTEXTE, convert: [trim] }
            prerequis: { from: PREREQUIS_ENTREE_FORMATION, convert: [trim] }
            # The first jury described, whatever the access route.
            jury: { concat: [SI_JURY_FC.COMPOSITION, SI_JURY_FI.COMPOSITION, SI_JURY_VAE.COMPOSITION, SI_JURY_CQ.COMPOSITION, SI_JURY_CL.COMPOSITION], sep: "|", convert: ["before:|"] }
            # The latest year: the register lists them in no set order.
            nb_certifies: { from: STATISTIQUES_PROMOTIONS.STATISTIQUES_PROMOTION, convert: ["max_by:ANNEE", "field:NOMBRE_CERTIFIES"] }
            url_description: { from: LIEN_URL_DESCRIPTION, convert: [trim] }
        - as: comp
          type: competence
          key: cle
          needs: cert
          close_missing: true
          # One competency per paragraph (runs of 3 blanks or more).
          each: { from: CAPACITES_ATTESTEES, convert: ["split_spaces:3"] }
          title: "."
          properties:
            cle: { concat: ["^NUMERO_FICHE", "#"], sep: "-C", convert: [upper] }
            rang: "#"
            libelle: "."
            nature: { value: competence }
        - as: org
          type: organization
          key: siren
          create: false
          missing: skip
          each: PARTENAIRES.PARTENAIRE
          properties:
            siren: { from: SIRET_PARTENAIRE, convert: [digits, "left:9"] }
      links:
        - { type: competence_de, from: comp, to: cert }
        # Only completes the accreditations fc_partenaires opened.
        - type: habilite_pour
          from: org
          to: cert
          create: false
          close_missing: false
          attributes:
            etat_fc: { from: ETAT_HABILITATION, convert: [trim, { enum: { Actif: actif, Inactif: inactif } }] }
            date_actif: { from: DATE_ACTIF, convert: ["date:%d/%m/%Y"] }
            date_etat: { from: DATE_DERNIERE_MODIFICATION_ETAT, convert: ["date:%d/%m/%Y"] }
          # Several SIRET of one SIREN: active when one of them is.
          on_conflict: { etat_fc: actif }
functions:
  - name: qw_relance_suivante
    language: starlark
    description: Next reminder of an open procedure whose due date passed (r1 to r4 every 15 days, r3 and r4 wait for a human).
    code: |
      # Next reminder of an open procedure whose due date passed (D314):
      # r1, r2, r3, r4 every 15 days; r3 and r4 wait for a human
      # (`a_valider`, sent by the `valider_envoi` action).
      # @output procedure any "The procedure moved on (object write by id)"
      # @output relance any "The reminder (object write by its key)"

      STEPS = ["aucun", "r1", "r2", "r3", "r4"]
      HUMAN = ["r3", "r4"]
      DELAY_DAYS = 15

      def num(s):
          return int(s.lstrip("0") or "0")

      def days(date):
          y = num(date[0:4])
          m = num(date[5:7])
          d = num(date[8:10])
          if m <= 2:
              y = y - 1
          era = y // 400
          yoe = y - era * 400
          mp = (m + 9) % 12
          doy = (153 * mp + 2) // 5 + d - 1
          doe = yoe * 365 + yoe // 4 - yoe // 100 + doy
          return era * 146097 + doe - 719468

      def pad(n, w):
          s = str(n)
          return "0" * (w - len(s)) + s

      def date(z):
          z = z + 719468
          era = z // 146097
          doe = z - era * 146097
          yoe = (doe - doe // 1460 + doe // 36524 - doe // 146096) // 365
          y = yoe + era * 400
          doy = doe - (365 * yoe + yoe // 4 - yoe // 100)
          mp = (5 * doy + 2) // 153
          d = doy - (153 * mp + 2) // 5 + 1
          m = mp + 3 if mp < 10 else mp - 9
          if m <= 2:
              y = y + 1
          return pad(y, 4) + "-" + pad(m, 2) + "-" + pad(d, 2)

      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          level = p.get("niveau", "aucun")
          if level not in STEPS or level == "r4":
              return None
          nxt = STEPS[STEPS.index(level) + 1]
          human = nxt in HUMAN
          today = msg.get("today", p.get("prochaine_echeance", "1970-01-01"))
          procedure = {
              "payload": {
                  "niveau": nxt,
                  "prochaine_echeance": date(days(today) + DELAY_DAYS),
                  "etat": "en_attente_validation" if human else "ouverte",
              },
              "object_id": o["id"],
              "expected_version": o["version"],
          }
          relance = {
              "payload": {
                  "cle": o["id"] + ":" + nxt,
                  "niveau": nxt,
                  "etat": "a_valider" if human else "envoyee",
                  "envoyee_le": "" if human else msg.get("now", ""),
                  "destinataire": p.get("contact_email", ""),
              },
              "title": o["title"] + " · " + nxt,
              "procedure_id": o["id"],
          }
          return [procedure, relance]
  - name: qw_regle_adm_01
    language: starlark
    description: "ADM-01: a partner whose legal unit ceased, as a finding to review."
    code: |
      # ADM-01: a partner whose legal unit ceased (company register) while it
      # may still be accredited. Deterministic rule: the finding is
      # `propose`, with the rule version (D316).
      RULE = "ADM-01"
      VERSION = 1

      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          ceased = p.get("date_cessation", "")
          return {
              "payload": {
                  "cle": RULE + ":" + p.get("siren", o["id"]),
                  "attendu": "Partenaire en activité",
                  "constate": "Unité légale cessée" + (" le " + ceased if ceased else ""),
                  "gravite": "critique",
                  "etat": "propose",
                  "detecte_le": msg.get("now", ""),
                  "regle_version": VERSION,
              },
              "title": RULE + " · " + o["title"],
              "organization_id": o["id"],
          }
  - name: qw_lien
    language: starlark
    description: Link payload from the object just written to the procedure or organization the message names.
    code: |
      # Link payload: the object just written (msg.object) → the object the
      # message names (msg.procedure_id, else msg.organization_id).
      def handle(inputs, msg):
          target = msg.get("procedure_id", msg.get("organization_id", ""))
          return {"payload": {"source_id": msg["object"]["id"], "target_id": target}}
flows:
  - name: "Quali-Watch · reminders"
    note: "Each morning the procedures whose due date passed move to the next reminder. For the automatic levels, add a Notification node after the reminder write (e-mail channel allowing recipients from flows, recipient field: destinataire, report PDF attached), then deploy."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 6 * * *" }, outputs: [{ port: 0, targets: [due] }] }
        - id: due
          kind: ontology_query
          config:
            object_type: procedure
            filters:
              - { key: prochaine_echeance, op: lte, value: "$today" }
              - { key: etat, op: eq, value: ouverte }
            limit: 500
          outputs: [{ port: 0, targets: [next] }]
        - id: next
          kind: pnex_function
          config: { function_name: qw_relance_suivante, language: starlark }
          outputs: [{ port: 0, targets: [proc] }, { port: 1, targets: [rel] }]
        - { id: proc, kind: object_upsert, config: { object_type: procedure, key: id } }
        - { id: rel, kind: object_upsert, config: { object_type: relance, key: cle, skip_existing: true }, outputs: [{ port: 0, targets: [link] }] }
        - { id: link, kind: pnex_function, config: { function_name: qw_lien, language: starlark }, outputs: [{ port: 0, targets: [linked] }] }
        - { id: linked, kind: link_upsert, config: { link_type: relance_de } }
  - name: "Quali-Watch · rule ADM-01"
    note: "Each morning the ceased partners become findings to review (create only), linked to their organization."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 5 * * *" }, outputs: [{ port: 0, targets: [ceased] }] }
        - id: ceased
          kind: ontology_query
          config:
            object_type: organization
            filters: [{ key: etat_administratif, op: eq, value: cesse }]
            limit: 500
          outputs: [{ port: 0, targets: [rule] }]
        - { id: rule, kind: pnex_function, config: { function_name: qw_regle_adm_01, language: starlark }, outputs: [{ port: 0, targets: [finding] }] }
        - { id: finding, kind: object_upsert, config: { object_type: ecart, key: cle, skip_existing: true }, outputs: [{ port: 0, targets: [link] }] }
        - { id: link, kind: pnex_function, config: { function_name: qw_lien, language: starlark }, outputs: [{ port: 0, targets: [linked] }] }
        - { id: linked, kind: link_upsert, config: { link_type: concerne } }
  - name: "Ingestion France Compétences"
    note: "Each night the France Compétences open data (data.gouv.fr) is downloaded, inspected and imported: your certifications, their sheets and skill blocks, then their partners with their accreditation scope; the new organizations are then enriched from the company register; last, the RS sheets (XML) give each certification its competencies, objectives, prerequisites and jury, and each accreditation its France Compétences state. Before deploying, put your certifier's SIRET in the values of the « Certificateurs » row filter. Each step shows what it read and produced in its panel."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "30 3 * * *" }, outputs: [{ port: 0, targets: [resolve] }] }
        - { id: resolve, kind: ingest, config: { step: source_resolve, mode: datagouv, dataset: 5eebbc067a14b6fecc9c9976, resource_match: "export-fiches-csv-*.zip" }, outputs: [{ port: 0, targets: [download] }] }
        # Unchanged CSV zip: the RS sheets may still have changed.
        - { id: download, kind: ingest, config: { step: file_download }, outputs: [{ port: 0, targets: [extract] }, { port: 2, targets: [resolve_rs] }] }
        - { id: extract, kind: ingest, config: { step: archive_extract, entries: ["*Certificateurs*.csv", "*Standard*.csv", "*Partenaires*.csv", "*Blocs_De_Comp*.csv"] }, outputs: [{ port: 0, targets: [inspect_c] }] }
        - { id: inspect_c, kind: ingest, config: { step: table_inspect, entry: "*Certificateurs*.csv", expected_columns: [Numero_Fiche, Siret_Certificateur, Nom_Certificateur] }, outputs: [{ port: 0, targets: [filter_c] }] }
        - { id: filter_c, kind: ingest, config: { step: rows_filter, entry: "*Certificateurs*.csv", column: Siret_Certificateur, op: in, values: [], convert: [digits] }, outputs: [{ port: 0, targets: [import_c] }] }
        - { id: import_c, kind: ingest, config: { step: ontology_import, import_name: "France Compétences · certifiers", action: apply }, outputs: [{ port: 0, targets: [inspect_s] }] }
        - { id: inspect_s, kind: ingest, config: { step: table_inspect, entry: "*Standard*.csv", expected_columns: [Numero_Fiche, Intitule, Nomenclature_Europe_Niveau, Date_Decision, Date_Fin_Enregistrement, Date_Effet, Actif] }, outputs: [{ port: 0, targets: [filter_s] }] }
        - { id: filter_s, kind: ingest, config: { step: rows_filter, entry: "*Standard*.csv", column: Numero_Fiche, op: in_objects, object_type: certification, property: code, convert: [trim, upper] }, outputs: [{ port: 0, targets: [import_s] }] }
        - { id: import_s, kind: ingest, config: { step: ontology_import, import_name: "France Compétences · sheets", action: apply }, outputs: [{ port: 0, targets: [inspect_b] }] }
        - { id: inspect_b, kind: ingest, config: { step: table_inspect, entry: "*Blocs_De_Comp*.csv", expected_columns: [Numero_Fiche, Bloc_Competences_Code, Bloc_Competences_Libelle] }, outputs: [{ port: 0, targets: [filter_b] }] }
        - { id: filter_b, kind: ingest, config: { step: rows_filter, entry: "*Blocs_De_Comp*.csv", column: Numero_Fiche, op: in_objects, object_type: certification, property: code, convert: [trim, upper] }, outputs: [{ port: 0, targets: [import_b] }] }
        - { id: import_b, kind: ingest, config: { step: ontology_import, import_name: "France Compétences · skill blocks", action: apply }, outputs: [{ port: 0, targets: [inspect_p] }] }
        - { id: inspect_p, kind: ingest, config: { step: table_inspect, entry: "*Partenaires*.csv", expected_columns: [Numero_Fiche, Nom_Partenaire, Siret_Partenaire, Habilitation_Partenaire] }, outputs: [{ port: 0, targets: [filter_p] }] }
        - { id: filter_p, kind: ingest, config: { step: rows_filter, entry: "*Partenaires*.csv", column: Numero_Fiche, op: in_objects, object_type: certification, property: code, convert: [trim, upper] }, outputs: [{ port: 0, targets: [import_p] }] }
        - { id: import_p, kind: ingest, config: { step: ontology_import, import_name: "France Compétences · partners", action: apply }, outputs: [{ port: 0, targets: [enrich] }] }
        - { id: enrich, kind: ingest, config: { step: ontology_import, import_name: "Company register (SIRENE)", action: apply }, outputs: [{ port: 0, targets: [resolve_rs] }] }
        - { id: resolve_rs, kind: ingest, config: { step: source_resolve, mode: datagouv, dataset: 5eebbc067a14b6fecc9c9976, resource_match: "export-fiches-rs-v4-1-*.zip" }, outputs: [{ port: 0, targets: [download_rs] }] }
        - { id: download_rs, kind: ingest, config: { step: file_download }, outputs: [{ port: 0, targets: [extract_rs] }, { port: 2, targets: [cleanup] }] }
        - { id: extract_rs, kind: ingest, config: { step: archive_extract, entries: ["*.xml"] }, outputs: [{ port: 0, targets: [import_rs] }] }
        - { id: import_rs, kind: ingest, config: { step: ontology_import, entry: "*.xml", import_name: "France Compétences · RS sheets (XML)", action: apply }, outputs: [{ port: 0, targets: [cleanup] }] }
        - { id: cleanup, kind: ingest, config: { step: staging_cleanup } }
page_templates:
  - key: constat_ecart
    name: Finding report
    names: {fr: "Constat d'écart"}
    description: One finding, its proof and what is expected.
    descriptions: {fr: "Un écart, sa preuve et ce qui est attendu."}
    body: |
      # Constat d'écart

      ## Partenaire

      Raison sociale, SIREN, certification concernée.

      ## Règle

      Code, libellé, référence légale ou contractuelle, version de la règle.

      ## Attendu

      Ce que la règle demande.

      ## Constaté

      Ce que la page publiée montre, avec l'extrait cité mot pour mot.

      ## Preuve

      - Adresse de la page
      - Capture pleine page et horodatage du serveur
      - Empreinte SHA-256 du manifeste et rang dans la chaîne des preuves
  - key: rapport_partenaire
    name: Partner report
    names: {fr: "Rapport partenaire"}
    description: State, findings and reminders of one partner.
    descriptions: {fr: "État, écarts et relances d'un partenaire."}
    body: |
      # Rapport partenaire

      ## Identité

      SIREN, établissements, dirigeants, numéro de déclaration d'activité, Qualiopi.

      ## Habilitations

      Certifications, périmètre, dates.

      ## Écarts

      - Ouverts
      - Clos

      ## Relances

      Niveau, date d'envoi, destinataire, suite donnée.

      ## Contrôles

      Dates des parcours du site et des synchronisations.
