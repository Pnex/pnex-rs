            qualiopi_apprenticeship: { from: certifications_actionsdeformationparapprentissage, convert: [{ enum: { "true": "true", "*": "false" } }] }
            qualiopi_updated: { from: informationsdeclarees_datedernieredeclaration, convert: ["date:%d/%m/%Y"] }
  - name: CPF catalogue · RS certifications
    source: api
    source_url: "https://opendata.caissedesdepots.fr/api/explore/v2.1/catalog/datasets/moncompteformation_catalogueformation/exports/json?refine=type_referentiel:RS&refine=code_inventaire:{value}"
    max_pages: 200
    mapping:
