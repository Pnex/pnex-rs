# Business pack "Partner network watch" (partner-watch.md D300–D316, product
# Quali-Watch): a certifier watches the training organizations it accredits.
# Nothing of it enters the core (D190): certifications, observed pages, CPF
# offers, rules, findings, procedures and reminders are pack types.
# The certifier itself is an `organization` of the org, linked to its
# certifications by `porte`.
# A finding produced by an LLM rule is never confirmed on its own (D316):
# it is `a_valider`, quotes its excerpt word for word and keeps where it
# was found (`constate_dans.locator`) and the rule version.
# Reminders follow the D314 pattern: a procedure carries its level and next
# due date, a daily flow sends the next reminder and moves the procedure on;
# levels needing a human create an `a_valider` reminder that the
# `valider_envoi` action sends.
# The partner network import reads the certifier's sheet (one row per
# partner × certification, pnex-quali-watch/import-excel.md) as a snapshot:
# a row gone closes its accreditation, nothing is deleted. Open data syncs
# (France Compétences, CPF catalogue, DGEFP list) wait for their data
# dictionaries to be checked (PRD Q1).
# Rules and reminders ship as functions and flow models (D316): created at
# install when the org has none of that name, as drafts, never deployed by
# the install (D123). A deterministic rule writes its finding `propose`
# (create only: a reviewed finding is never reset); an LLM rule must write
# `a_valider` with its word-for-word excerpt and locator.
key: quali_watch
name: Partner network watch
names: {fr: "Veille du réseau de partenaires"}
version: "1.0.0"
requires: [entreprises_fr]
extends:
  - type: organization
    properties:
      - { key: contact_conformite_email, name: Compliance contact e-mail, names: {fr: "E-mail du contact conformité"}, kind: text, max_len: 254 }
      - { key: contact_conformite_nom, name: Compliance contact, names: {fr: "Contact conformité"}, kind: text, max_len: 255 }
      - { key: contact_telephone, name: Phone, names: {fr: "Téléphone"}, kind: text, max_len: 64 }
      - { key: charge_reseau_email, name: Network officer e-mail, names: {fr: "E-mail du chargé de réseau"}, kind: text, max_len: 254 }
description: Certifications, partner websites, observed pages with dated proofs, CPF offers, rules, findings and graduated reminders.
descriptions: {fr: "Certifications, sites des partenaires, pages observées avec preuves datées, offres CPF, règles, écarts et relances graduées."}
types:
  - key: certification
    name: Certification
    names: {fr: "Certification"}
    icon: book
    may_be_contained_in: [folder]
    properties:
      - { key: code, name: Code, names: {fr: "Code"}, kind: text, max_len: 16, required: true, unique: true }
      - { key: repertoire, name: Register, names: {fr: "Répertoire"}, kind: enum, values: [rncp, rs], indexed: true }
      - { key: intitule, name: Exact title, names: {fr: "Intitulé exact"}, kind: text, max_len: 500 }
      - { key: niveau, name: Level, names: {fr: "Niveau"}, kind: text, max_len: 32 }
      - { key: date_enregistrement, name: Registered on, names: {fr: "Enregistrée le"}, kind: date }
      - { key: date_echeance, name: Expires on, names: {fr: "Échéance"}, kind: date }
      - { key: statut, name: Status, names: {fr: "Statut"}, kind: enum, values: [actif, inactif, echu], indexed: true }
      - { key: url_fiche, name: Register page, names: {fr: "Fiche du répertoire"}, kind: url }
  - key: site_web
    name: Website
    names: {fr: "Site web"}
    icon: globe
    may_be_contained_in: [folder]
    properties:
      - { key: url_racine, name: Root URL, names: {fr: "URL racine"}, kind: url, required: true }
      - { key: domaine, name: Domain, names: {fr: "Domaine"}, kind: text, max_len: 255, unique: true }
      - { key: dernier_crawl, name: Last crawl, names: {fr: "Dernier parcours"}, kind: date_time }
      - { key: pages_listees, name: Listed pages, names: {fr: "Pages listées"}, kind: number, min: 0 }
      - { key: pages_pertinentes, name: Relevant pages, names: {fr: "Pages pertinentes"}, kind: number, min: 0 }
      - { key: etat_collecte, name: Collection status, names: {fr: "État de la collecte"}, kind: enum, values: [ok, bloque, inaccessible, vide], indexed: true }
  - key: page_observee
    name: Observed page
    names: {fr: "Page observée"}
    icon: file-text
    may_be_contained_in: [folder]
    properties:
      - { key: url, name: URL, names: {fr: "URL"}, kind: text, max_len: 2048, required: true, unique: true }
      - { key: titre, name: Title, names: {fr: "Titre"}, kind: text, max_len: 500 }
      - { key: premiere_vue, name: First seen, names: {fr: "Vue la première fois"}, kind: date_time }
      - { key: derniere_vue, name: Last seen, names: {fr: "Vue la dernière fois"}, kind: date_time }
      - { key: empreinte_texte, name: Text fingerprint, names: {fr: "Empreinte du texte"}, kind: text, max_len: 64 }
      - { key: pertinente, name: Relevant, names: {fr: "Pertinente"}, kind: bool }
      - { key: codes_cites, name: Codes quoted, names: {fr: "Codes cités"}, kind: text, max_len: 1000 }
      # The registry states (D309), written by the crawl's `record`.
      - { key: etat, name: State, names: {fr: "État"}, kind: enum, values: [listed, relevant, captured, gone], indexed: true }
  - key: offre_cpf
    name: CPF offer
    names: {fr: "Offre CPF"}
    icon: tag
    may_be_contained_in: [folder]
    properties:
      - { key: id_action, name: Action id, names: {fr: "Identifiant de l'action"}, kind: text, max_len: 64, required: true, unique: true }
      - { key: intitule, name: Title, names: {fr: "Intitulé"}, kind: text, max_len: 500 }
      - { key: prix, name: Price, names: {fr: "Prix"}, kind: money }
      - { key: duree_heures, name: Duration, names: {fr: "Durée"}, kind: number, unit: h, min: 0 }
      - { key: ville, name: City, names: {fr: "Ville"}, kind: text, max_len: 255 }
      - { key: modalite, name: Delivery, names: {fr: "Modalité"}, kind: enum, values: [presentiel, distanciel, mixte] }
      - { key: vue_le, name: Seen on, names: {fr: "Vue le"}, kind: date }
  - key: regle
    name: Rule
    names: {fr: "Règle"}
    icon: landmark
    may_be_contained_in: [folder]
    write_role: admin
    properties:
      - { key: code, name: Code, names: {fr: "Code"}, kind: text, max_len: 16, required: true, unique: true }
      - { key: libelle, name: Label, names: {fr: "Libellé"}, kind: text, max_len: 500 }
      - { key: type, name: Kind, names: {fr: "Nature"}, kind: enum, values: [deterministe, llm] }
      - { key: gravite_defaut, name: Default severity, names: {fr: "Gravité par défaut"}, kind: enum, values: [info, mineur, majeur, critique] }
      - { key: reference, name: Legal or contractual reference, names: {fr: "Référence légale ou contractuelle"}, kind: text, max_len: 2000 }
      - { key: version, name: Version, names: {fr: "Version"}, kind: number, min: 1 }
      - { key: active, name: Active, names: {fr: "Active"}, kind: bool }
  - key: ecart
    name: Finding
    names: {fr: "Écart"}
    icon: flag
    may_be_contained_in: [folder]
    properties:
      - { key: cle, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, unique: true }
      - { key: attendu, name: Expected, names: {fr: "Attendu"}, kind: text, max_len: 2000 }
      - { key: constate, name: Observed, names: {fr: "Constaté"}, kind: text, max_len: 2000 }
      - { key: extrait, name: Excerpt (word for word), names: {fr: "Extrait (mot pour mot)"}, kind: text, max_len: 2000 }
      - { key: gravite, name: Severity, names: {fr: "Gravité"}, kind: enum, values: [info, mineur, majeur, critique], indexed: true }
      - key: etat
        name: State
        names: {fr: "État"}
        kind: enum
        values: [propose, a_valider, confirme, en_relance, corrige, clos, rejete]
        required: true
        indexed: true
      - { key: detecte_le, name: Detected on, names: {fr: "Détecté le"}, kind: date_time }
      - { key: regle_version, name: Rule version, names: {fr: "Version de la règle"}, kind: number, min: 1 }
      - { key: confiance, name: Confidence, names: {fr: "Confiance"}, kind: number, min: 0, max: 1 }
    actions:
      - key: valider
        name: Confirm
        names: {fr: "Valider"}
        params:
          - { key: gravite, name: Severity, names: {fr: "Gravité"}, kind: enum, values: [info, mineur, majeur, critique] }
          - { key: commentaire, name: Comment, names: {fr: "Commentaire"}, kind: text, max_len: 2000 }
      - key: rejeter
        name: Reject
        names: {fr: "Rejeter"}
        confirm: true
        params:
          - { key: motif, name: Reason, names: {fr: "Motif"}, kind: enum, values: [faux_positif, hors_perimetre, accepte_par_le_client], required: true }
          - { key: commentaire, name: Comment, names: {fr: "Commentaire"}, kind: text, max_len: 2000 }
      - key: reverifier
        name: Check again
        names: {fr: "Revérifier"}
  - key: procedure
    name: Procedure
    names: {fr: "Procédure"}
    icon: workflow
    may_be_contained_in: [folder]
    properties:
      - { key: niveau, name: Level, names: {fr: "Niveau"}, kind: enum, values: [aucun, r1, r2, r3, r4, retrait_propose], indexed: true }
      - { key: etat, name: State, names: {fr: "État"}, kind: enum, values: [ouverte, en_attente_validation, suspendue, close], required: true, indexed: true }
      - { key: prochaine_echeance, name: Next due date, names: {fr: "Prochaine échéance"}, kind: date, indexed: true }
      - { key: ouverte_le, name: Opened on, names: {fr: "Ouverte le"}, kind: date }
      - { key: close_le, name: Closed on, names: {fr: "Close le"}, kind: date }
      - { key: motif_cloture, name: Closing reason, names: {fr: "Motif de clôture"}, kind: enum, values: [corrige, retrait_effectue, fin_partenariat] }
      - { key: contact_email, name: Compliance contact, names: {fr: "Contact conformité"}, kind: text, max_len: 254 }
      - { key: copie_email, name: Copy to, names: {fr: "Copie à"}, kind: text, max_len: 254 }
    actions:
      - key: valider_envoi
        name: Approve sending
        names: {fr: "Valider l'envoi"}
        confirm: true
        params:
          - { key: relance_id, name: Reminder, names: {fr: "Relance"}, kind: ref, to_type: relance, required: true }
          - { key: texte_modifie, name: Edited text, names: {fr: "Texte modifié"}, kind: text, max_len: 4000 }
      - key: envoyer_maintenant
        name: Send now
        names: {fr: "Envoyer maintenant"}
        confirm: true
        params:
          - { key: niveau, name: Level, names: {fr: "Niveau"}, kind: enum, values: [r1, r2, r3, r4], required: true }
      - key: suspendre
        name: Suspend
        names: {fr: "Suspendre"}
        params:
          - { key: jusqu_au, name: Until, names: {fr: "Jusqu'au"}, kind: date }
          - { key: motif, name: Reason, names: {fr: "Motif"}, kind: text, max_len: 500, required: true }
      - key: reprendre
        name: Resume
        names: {fr: "Reprendre"}
        params:
          - { key: motif, name: Reason, names: {fr: "Motif"}, kind: text, max_len: 500 }
      - key: marquer_corrige
        name: Mark as fixed
        names: {fr: "Marquer corrigé"}
        params:
          - { key: source, name: Reported by, names: {fr: "Signalé par"}, kind: enum, values: [partenaire, client], required: true }
      - key: clore
        name: Close
        names: {fr: "Clore"}
        confirm: true
        params:
          - { key: motif, name: Reason, names: {fr: "Motif"}, kind: enum, values: [corrige, retrait_effectue, fin_partenariat], required: true }
  - key: relance
    name: Reminder
    names: {fr: "Relance"}
    icon: newspaper
    may_be_contained_in: [folder]
    properties:
      - { key: cle, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, unique: true }
      - { key: niveau, name: Level, names: {fr: "Niveau"}, kind: enum, values: [r1, r2, r3, r4, retrait_propose], required: true }
      - { key: envoyee_le, name: Sent on, names: {fr: "Envoyée le"}, kind: date_time }
      - { key: destinataire, name: Recipient, names: {fr: "Destinataire"}, kind: text, max_len: 254 }
      - { key: modele, name: Template, names: {fr: "Modèle"}, kind: text, max_len: 255 }
      - { key: etat, name: State, names: {fr: "État"}, kind: enum, values: [a_valider, envoyee, echec], required: true, indexed: true }
      - { key: texte_modifie, name: Edited text, names: {fr: "Texte modifié"}, kind: text, max_len: 4000 }
      - { key: lien_corrige_ouvert_le, name: Fix link opened on, names: {fr: "Lien « corrigé » ouvert le"}, kind: date_time }
link_types:
