    name: holds
    names: {fr: "porte"}
    inverse_name: is held by
    inverse_names: {fr: "est portée par"}
    from_types: [organization]
    to_types: [certification]
  - key: habilite_pour
    name: is accredited for
    names: {fr: "est habilité pour"}
    inverse_name: accredits
    inverse_names: {fr: "habilite"}
    from_types: [organization]
    to_types: [certification]
    attributes:
      - { key: perimetre, name: Scope, names: {fr: "Périmètre"}, kind: enum, values: [preparation, evaluation, les_deux] }
      - { key: declaree_fc, name: Declared to France Compétences, names: {fr: "Déclarée à France Compétences"}, kind: bool }
      - { key: reference_convention, name: Agreement reference, names: {fr: "Référence de la convention"}, kind: text, max_len: 255 }
      - { key: date_fin, name: Accredited until, names: {fr: "Habilité jusqu'au"}, kind: date }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 255 }
  - key: a_pour_site
    name: has as website
    names: {fr: "a pour site"}
    inverse_name: is the website of
    inverse_names: {fr: "est le site de"}
    from_types: [organization]
    to_types: [site_web]
  - key: page_de
    name: is a page of
    names: {fr: "est une page de"}
    inverse_name: has as page
    inverse_names: {fr: "a pour page"}
    from_types: [page_observee]
    to_types: [site_web]
    one_target: true
  - key: prouve_par
    name: is proven by
    names: {fr: "est prouvée par"}
    inverse_name: proves
    inverse_names: {fr: "prouve"}
    from_types: [page_observee]
    to_types: [media_asset]
    attributes:
