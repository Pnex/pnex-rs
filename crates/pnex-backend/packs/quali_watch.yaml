functions:
  - name: qw_next_reminder
    language: starlark
    description: Next reminder of an open procedure whose due date passed (r1 to r4 every 15 days, r3 and r4 wait for a human).
    code: |
      # Next reminder of an open procedure whose due date passed (D314):
      # r1, r2, r3, r4 every 15 days; r3 and r4 wait for a human
      # (`to_validate`, sent by the `approve_send` action).
      # @output procedure any "The procedure moved on (object write by id)"
      # @output reminder any "The reminder (object write by its key)"

      STEPS = ["none", "r1", "r2", "r3", "r4"]
      HUMAN = ["r3", "r4"]
      DELAY_DAYS = 15

      def num(s):
          return int(s.lstrip("0") or "0")

      def days(date):
          y = num(date[0:4])
          m = num(date[5:7])
          d = num(date[8:10])
          if m <= 2:
              y = y - 1
          era = y // 400
          yoe = y - era * 400
          mp = (m + 9) % 12
          doy = (153 * mp + 2) // 5 + d - 1
          doe = yoe * 365 + yoe // 4 - yoe // 100 + doy
          return era * 146097 + doe - 719468

      def pad(n, w):
          s = str(n)
          return "0" * (w - len(s)) + s

      def date(z):
          z = z + 719468
          era = z // 146097
          doe = z - era * 146097
          yoe = (doe - doe // 1460 + doe // 36524 - doe // 146096) // 365
          y = yoe + era * 400
          doy = doe - (365 * yoe + yoe // 4 - yoe // 100)
          mp = (5 * doy + 2) // 153
          d = doy - (153 * mp + 2) // 5 + 1
          m = mp + 3 if mp < 10 else mp - 9
          if m <= 2:
              y = y + 1
          return pad(y, 4) + "-" + pad(m, 2) + "-" + pad(d, 2)

      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          level = p.get("level", "none")
          if level not in STEPS or level == "r4":
              return None
          nxt = STEPS[STEPS.index(level) + 1]
          human = nxt in HUMAN
          today = msg.get("today", p.get("next_due", "1970-01-01"))
          procedure = {
              "payload": {
                  "level": nxt,
                  "next_due": date(days(today) + DELAY_DAYS),
                  "state": "awaiting_validation" if human else "open",
              },
              "object_id": o["id"],
              "expected_version": o["version"],
          }
          reminder = {
              "payload": {
                  "ref": o["id"] + ":" + nxt,
                  "level": nxt,
                  "state": "to_validate" if human else "sent",
                  "sent_on": "" if human else msg.get("now", ""),
                  "recipient": p.get("contact_email", ""),
              },
              "title": o["title"] + " · " + nxt,
              "procedure_id": o["id"],
          }
          return [procedure, reminder]
  - name: qw_rule_adm_01
    language: starlark
    description: "ADM-01: a partner whose legal unit ceased, as a finding to review."
    code: |
      # ADM-01: a partner whose legal unit ceased (company register) while it
      # may still be accredited. Deterministic rule: the finding is
      # `proposed`, with the rule version (D316).
      RULE = "ADM-01"
      VERSION = 1

      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          ceased = p.get("ceased_on", "")
          return {
              "payload": {
                  "ref": RULE + ":" + p.get("siren", o["id"]),
                  "expected": "Partner in business",
                  "observed": "Legal unit ceased" + (" on " + ceased if ceased else ""),
                  "severity": "critical",
                  "state": "proposed",
                  "detected_on": msg.get("now", ""),
                  "rule_version": VERSION,
              },
              "title": RULE + " · " + o["title"],
              "organization_id": o["id"],
          }
  - name: qw_link
    language: starlark
    description: Link payload from the object just written to the procedure or organization the message names.
    code: |
      # Link payload: the object just written (msg.object) → the object the
      # message names (msg.procedure_id, else msg.organization_id).
      def handle(inputs, msg):
          target = msg.get("procedure_id", msg.get("organization_id", ""))
          return {"payload": {"source_id": msg["object"]["id"], "target_id": target}}
  - name: qw_network_rules
    language: starlark
    description: "Registry rules of the network: ADM-01, ADM-02, CPF-01, CPF-02, CPF-03, REG-01, REG-02 (findings to review)."
    code: |
      # Registry rules of the network (network-check.md D410): ADM-01, ADM-02,
      # CPF-01, CPF-02, CPF-03, REG-01 and REG-02, from one message holding the
      # org's certifications with their accreditations (accredited_for), offers
      # (about) and certifiers (holds). Registry facts: findings `proposed`.
      # @output findings any "The findings, as a list (split them one per message)"
      FOLD = {"à": "a", "â": "a", "ä": "a", "á": "a", "é": "e", "è": "e", "ê": "e", "ë": "e",
              "î": "i", "ï": "i", "ô": "o", "ö": "o", "ù": "u", "û": "u", "ü": "u", "ç": "c",
              "œ": "oe", "æ": "ae", "’": "'"}
      PUNCT = [",", ".", ";", ":", "!", "?", "(", ")", "[", "]", "«", "»", "\"", "/", "-", "–", "—", "_", "'", "&", "+", "*", "|", " "]

      def fold(s):
          s = s.lower()
          for k, v in FOLD.items():
              s = s.replace(k, v)
          return s

      def norm(s):
          s = fold(s)
          for c in PUNCT:
              s = s.replace(c, " ")
          return " ".join(s.split())

      def setting_list(key):
          raw = pack_setting(key, "") or ""
          return [x.strip().upper() for x in raw.replace(";", ",").split(",") if x.strip()]

      def active(code):
          return code not in setting_list("quali_watch.disabled_rules")

      def finding(rule, severity, state, key, title, expected, observed, quote, targets, now):
          return {
              "props": {
                  "ref": (rule + ":" + key)[:255],
                  "expected": expected[:2000],
                  "observed": observed[:2000],
                  "excerpt": quote[:2000],
                  "severity": severity,
                  "state": state,
                  "detected_on": now,
                  "rule_version": VERSION,
              },
              "title": (rule + " · " + title)[:250],
              "link_targets": targets,
          }

      VERSION = 1

      def links(row, key):
          return [l for l in row.get("links", {}).get(key, []) if l.get("direction") == "in"]

      def watched(rows):
          codes = setting_list("quali_watch.certifications")
          out = []
          for r in rows:
              code = (r["properties"].get("code", "") or "").upper()
              if codes:
                  if code in codes:
                      out.append(r)
              elif links(r, "holds"):
                  out.append(r)
          return out

      def handle(inputs, msg):
          now = msg.get("now", "")
          today = msg.get("today", now[:10])
          found = []
          for cert in watched(msg.get("payload", []) or []):
              cp = cert["properties"]
              code = (cp.get("code", "") or "").upper()
              certifiers = {}
              for l in links(cert, "holds"):
                  certifiers[l["other"]["properties"].get("siren", "") or ""] = True
              habs = {}
              for l in links(cert, "accredited_for"):
                  org = l["other"]
                  siren = org["properties"].get("siren", "") or ""
                  if siren:
                      habs[siren] = {"org": org, "a": l.get("attributes", {}) or {}}
              for siren, h in habs.items():
                  org, a = h["org"], h["a"]
                  op = org["properties"]
                  targets = {"concerns": org["id"], "finding_on": cert["id"]}
                  name = org["title"] + " · " + code
                  if active("ADM-01") and op.get("administrative_state", "") == "ceased":
                      ceased = op.get("ceased_on", "") or ""
                      found.append(finding("ADM-01", "critical", "proposed", siren + ":" + code, name,
                          "Partner in business", "Legal unit ceased" + (" on " + ceased if ceased else "") + ", accreditation open",
                          "", targets, now))
                  if active("ADM-02") and op.get("qualiopi_updated", "") and op.get("qualiopi") != True:
                      found.append(finding("ADM-02", "critical", "proposed", siren, org["title"],
                          "Qualiopi certification for training actions",
                          "Missing from the public list of training organizations (DGEFP, " + op.get("qualiopi_updated", "") + ")",
                          op.get("qualiopi_categories", "") or "", {"concerns": org["id"]}, now))
                  if active("REG-01") and a.get("declared_fc") != True:
                      found.append(finding("REG-01", "info", "proposed", siren + ":" + code, name,
                          "Accreditation declared to France Compétences",
                          "Accreditation known (" + (a.get("source", "") or "customer") + ") missing from the France Compétences open data",
                          "", targets, now))
              for l in links(cert, "offer_for"):
                  offer = l["other"]
                  pp = offer["properties"]
                  siren = (pp.get("siret", "") or "")[:9]
                  if not siren or siren in certifiers:
                      continue
                  seen = pp.get("seen_on", "") or today
                  targets = {"concerns": "", "finding_on": cert["id"], "observed_in": offer["id"]}
                  label = offer["title"] + " · " + code
                  quote = (pp.get("official_title", "") or "") + " · " + (pp.get("siret", "") or "")
                  h = habs.get(siren)
                  if h == None:
                      if active("CPF-01"):
                          found.append(finding("CPF-01", "critical", "proposed", siren + ":" + code + ":" + (pp.get("id_action", "") or ""), label,
                              "CPF offer by an organization accredited for " + code,
                              "Organization (SIREN " + siren + ") without an open accreditation for " + code,
                              quote, targets, now))
                      continue
                  targets["concerns"] = h["org"]["id"]
                  a = h["a"]
                  if active("CPF-02") and a.get("scope", "") == "assessment":
                      found.append(finding("CPF-02", "major", "proposed", siren + ":" + code + ":" + (pp.get("id_action", "") or ""), label,
                          "Preparation for " + code + " within the accreditation scope",
                          "Accredited to run the assessment only, training offered on the CPF",
                          quote, targets, now))
                  end = a.get("ends_on", "") or ""
                  if active("CPF-03") and end and end < seen:
                      found.append(finding("CPF-03", "critical", "proposed", siren + ":" + code + ":" + (pp.get("id_action", "") or ""), label,
                          "No CPF offer after the accreditation end (" + end + ")",
                          "Offer seen in the catalogue on " + seen, quote, targets, now))
                  if active("REG-02") and a.get("fc_state", "") == "inactive":
                      found.append(finding("REG-02", "critical", "proposed", siren + ":" + code, label,
                          "No activity on an inactive accreditation",
                          "Accreditation inactive at France Compétences" + (" since " + a.get("state_date", "") if a.get("state_date", "") else "") + ", CPF offer seen on " + seen,
                          quote, targets, now))
          return {"findings": found}
  - name: qw_context
    language: starlark
    description: The certifications watched, their exact titles and certifiers, for the website rules.
    code: |
      # The certifications watched, with their exact title and their
      # certifiers' names, kept in msg.network for the website rules.
      def setting_list(key):
          raw = pack_setting(key, "") or ""
          return [x.strip().upper() for x in raw.replace(";", ",").split(",") if x.strip()]

      def handle(inputs, msg):
          codes = setting_list("quali_watch.certifications")
          network = {}
          for r in msg.get("payload", []) or []:
              p = r["properties"]
              code = (p.get("code", "") or "").upper()
              holders = [l for l in r.get("links", {}).get("holds", []) if l.get("direction") == "in"]
              if (codes and code not in codes) or (not codes and not holders):
                  continue
              network[code] = {
                  "id": r["id"],
                  "official_title": p.get("official_title", "") or "",
                  "status": p.get("status", "") or "",
                  "certifiers": [l["other"]["title"] for l in holders],
              }
          return {"payload": {}, "network": network}
  - name: qw_targets
    language: starlark
    description: One crawl target per partner with a confirmed website, with what makes a page relevant.
    code: |
      # One crawl target per partner of the network that has a confirmed
      # website: its url, what makes a page relevant (codes, exact titles,
      # certifiers' names, CPF words), the website to hang pages on, and the
      # partner with its accreditations for the rules.
      CPF = ["mon compte formation", "moncompteformation", "eligible au cpf", "eligible cpf", "financable cpf", "financable par le cpf"]

      def handle(inputs, msg):
          network = msg.get("network", {}) or {}
          l = msg.get("links", {}) or {}
          sites = [s for s in l.get("has_website", []) if s.get("direction") == "out"]
          if not sites or not network:
              return None
          # shortcut: the first website of a partner only; split per site when
          # partners with several websites show up.
          site = sites[0]["other"]
          url = site["properties"].get("root_url", "") or ("https://" + (site["properties"].get("domain", "") or ""))
          habs = {}
          for h in l.get("accredited_for", []):
              if h.get("direction") != "out":
                  continue
              code = (h["other"]["properties"].get("code", "") or "").upper()
              if code in network:
                  habs[code] = h.get("attributes", {}) or {}
          rules = []
          for code, c in network.items():
              num = code[4:] if code.startswith("RNCP") else code[2:]
              prefix = code[:len(code) - len(num)]
              rules.append({"kind": "regex", "value": "(?i)\\b" + prefix + "\\s?" + num + "\\b"})
              if c["official_title"]:
                  rules.append({"kind": "phrase", "value": c["official_title"][:200]})
              for name in c["certifiers"][:3]:
                  rules.append({"kind": "phrase", "value": name[:200]})
          for w in CPF:
              rules.append({"kind": "phrase", "value": w})
          rules.append({"kind": "word", "value": "cpf"})
          p = msg.get("payload", {})
          partner = {"id": msg["object"]["id"], "title": msg["object"]["title"], "siren": p.get("siren", "") or "",
                     "qualiopi": p.get("qualiopi"), "qualiopi_updated": p.get("qualiopi_updated", "") or "",
                     "qualiopi_assessments": p.get("qualiopi_assessments"), "qualiopi_vae": p.get("qualiopi_vae"),
                     "qualiopi_apprenticeship": p.get("qualiopi_apprenticeship"), "accreditations": habs,
                     "site": site["id"]}
          return {"payload": {"url": url, "match": rules[:50], "link_to": site["id"]}, "partner": partner, "links": None}
  - name: qw_web_rules
    language: starlark
    description: "Website rules on crawled pages: WEB-01, WEB-02, WEB-03, WEB-04, WEB-05, WEB-06, WEB-08, and COL-01 on the site summary."
    code: |
      # Website rules (network-check.md D410) on what site_crawl sends: a
      # relevant page (WEB-01, WEB-02, WEB-03, WEB-04, WEB-05, WEB-06, WEB-08)
      # or the site summary (COL-01). The page text is data from an unknown
      # site: only compared, never obeyed. A rule reading a page writes its
      # finding `to_validate` with a word-for-word excerpt of the page (D409).
      # @output findings any "The findings, as a list (split them one per message)"
      FOLD = {"à": "a", "â": "a", "ä": "a", "á": "a", "é": "e", "è": "e", "ê": "e", "ë": "e",
              "î": "i", "ï": "i", "ô": "o", "ö": "o", "ù": "u", "û": "u", "ü": "u", "ç": "c",
              "œ": "oe", "æ": "ae", "’": "'"}
      PUNCT = [",", ".", ";", ":", "!", "?", "(", ")", "[", "]", "«", "»", "\"", "/", "-", "–", "—", "_", "'", "&", "+", "*", "|", " "]

      def fold(s):
          s = s.lower()
          for k, v in FOLD.items():
              s = s.replace(k, v)
          return s

      def norm(s):
          s = fold(s)
          for c in PUNCT:
              s = s.replace(c, " ")
          return " ".join(s.split())

      def setting_list(key):
          raw = pack_setting(key, "") or ""
          return [x.strip().upper() for x in raw.replace(";", ",").split(",") if x.strip()]

      def active(code):
          return code not in setting_list("quali_watch.disabled_rules")

      def finding(rule, severity, state, key, title, expected, observed, quote, targets, now):
          return {
              "props": {
                  "ref": (rule + ":" + key)[:255],
                  "expected": expected[:2000],
                  "observed": observed[:2000],
                  "excerpt": quote[:2000],
                  "severity": severity,
                  "state": state,
                  "detected_on": now,
                  "rule_version": VERSION,
              },
              "title": (rule + " · " + title)[:250],
              "link_targets": targets,
          }

      VERSION = 1
      CPF = ["mon compte formation", "moncompteformation", "eligible au cpf", "eligible cpf", "financable cpf", "financable par le cpf", "finance par le cpf", "eligible au compte personnel de formation"]
      PROMISES = ["formation gratuite", "100 gratuit", "totalement gratuit", "entierement gratuit", "sans reste a charge", "cadeau", "carte cadeau", "bon d achat", "offert pour toute inscription", "offerte pour toute inscription", "tablette offerte", "ordinateur offert"]
      # Explicit claims of a Qualiopi action category only: "apprentissage"
      # alone is the everyday word for learning, never a claim (expert
      # review 2026-10-27: "l'apprentissage des apprenants").
      # shortcut: phrases written from the rule's wording, not from the
      # Qualiopi mark charter / RNQ reading guide; take them from that
      # reference text once provided.
      QUALIOPI_CATS = [
          ("qualiopi_assessments", ["bilan de competences", "bilans de competences"], "skills assessments"),
          ("qualiopi_vae", ["validation des acquis de l experience", "vae"], "VAE"),
          ("qualiopi_apprenticeship", ["contrat d apprentissage", "contrats d apprentissage", "formation par apprentissage",
                                      "formations par apprentissage", "actions de formation par apprentissage",
                                      "centre de formation d apprentis", "cfa", "alternance"], "apprenticeship"),
      ]

      def codes_in(tokens):
          out = {}
          n = len(tokens)
          for i in range(n):
              t = tokens[i]
              if t in ("rs", "rncp") and i + 1 < n and tokens[i + 1].isdigit():
                  out[(t + tokens[i + 1]).upper()] = True
              elif t.startswith("rncp") and t[4:].isdigit():
                  out[t.upper()] = True
              elif t.startswith("rs") and len(t) > 2 and t[2:].isdigit():
                  out[t.upper()] = True
          return out

      def at(text, needles):
          lower = text.lower()
          for n in needles:
              i = lower.find(n.lower())
              if i >= 0:
                  return i
          return -1

      def excerpt(text, i):
          if i < 0:
              return text[:300].strip()
          return text[max(0, i - 150):i + 250].strip()

      def code_needles(code):
          num = code[4:] if code.startswith("RNCP") else code[2:]
          prefix = code[:len(code) - len(num)]
          return [prefix + num, prefix + " " + num, prefix + " " + num, prefix + "-" + num]

      def any_in(padded, words):
          for w in words:
              if (" " + w + " ") in padded:
                  return True
          return False

      def first_in(padded, words):
          for w in words:
              if (" " + w + " ") in padded:
                  return w
          return ""

      def at_phrase(text, phrase):
          # Where a normalized phrase sits in the raw text: fold and blank the
          # punctuation one character for one, so the index still points at
          # the raw text (œ/æ shift it by one, within the excerpt margin).
          s = text.lower()
          for k, v in FOLD.items():
              if len(v) == 1:
                  s = s.replace(k, v)
          for c in PUNCT + ["\n", "\t", "\r"]:
              s = s.replace(c, " ")
          i = (" " + s + " ").find(" " + phrase + " ")
          return i if i >= 0 else at(text, [phrase])

      def summary(msg, p):
          if not active("COL-01"):
              return []
          partner = msg.get("partner", {}) or {}
          why = ""
          if p.get("blocked"):
              why = "Crawl stopped (" + p["blocked"] + ") after " + str(p.get("pages", 0)) + " page(s)"
          elif not p.get("relevant"):
              why = str(p.get("pages", 0)) + " page(s) read, none relevant"
          if not why:
              return []
          return [finding("COL-01", "info", "proposed", (partner.get("siren", "") or "") + ":" + p.get("url", ""),
              partner.get("title", "") + " · " + p.get("url", ""), "Readable website with at least one relevant page",
              why, "", {"concerns": partner.get("id", "")}, msg.get("now", ""))]

      def handle(inputs, msg):
          p = msg.get("payload", {}) or {}
          if "mission_id" in p:
              return {"findings": summary(msg, p)}
          text = p.get("text", "") or ""
          if not text:
              return None
          now = msg.get("now", "")
          today = msg.get("today", now[:10])
          partner = msg.get("partner", {}) or {}
          network = msg.get("network", {}) or {}
          habs = partner.get("accreditations", {}) or {}
          padded = " " + norm(text) + " "
          tokens = padded.split()
          cited = codes_in(tokens)
          cpf = any_in(padded, CPF) or " cpf " in padded
          page = p.get("page_id", "") or p.get("url", "")
          found = []
          # By default a certifier only checks what concerns its own
          # certifications: a page citing none of them writes no WEB finding.
          ours = [False]
          whole_site = pack_setting("quali_watch.whole_site", False) == True
          def add(rule, severity, code, expected, observed, i, cert_id):
              if not active(rule):
                  return
              targets = {"concerns": partner.get("id", ""), "finding_on": cert_id, "observed_in": p.get("object_id", "") or ""}
              found.append(finding(rule, severity, "to_validate", (partner.get("siren", "") or "") + ":" + code + ":" + page,
                  partner.get("title", "") + " · " + code, expected, observed + " (" + p.get("url", "") + ")",
                  excerpt(text, i), targets, now))
          for code, c in network.items():
              title = norm(c.get("official_title", ""))
              has_code = code in cited
              has_title = len(title) > 3 and (" " + title + " ") in padded
              if not has_code and not has_title:
                  continue
              ours[0] = True
              i_code = at(text, code_needles(code))
              h = habs.get(code)
              end = (h or {}).get("ends_on", "") or ""
              accredited = h != None and (h.get("fc_state", "") or "") != "inactive" and not (end and end < today)
              if has_code and not accredited:
                  why = "no open accreditation" if h == None else ("accreditation inactive at France Compétences" if h.get("fc_state", "") == "inactive" else "accreditation ended on " + end)
                  add("WEB-08", "critical", code, "No offer of " + code + " without an active accreditation", "Page presenting " + code + ": " + why, i_code, c["id"])
              if cpf and (not accredited or c.get("status", "") not in ("", "active")):
                  add("WEB-04", "critical", code, code + " presented as CPF eligible only by an accredited organization, on an active sheet",
                      "CPF mentioned on a page about " + code + (" (sheet " + c.get("status", "") + ")" if c.get("status", "") not in ("", "active") else " without an active accreditation"),
                      at(text, ["mon compte formation", "cpf"]), c["id"])
              if has_title and not has_code:
                  others = [k for k in cited.keys() if k != code]
                  if others:
                      add("WEB-02", "major", code, "Code " + code + " quoted with the title", "Title quoted with another code: " + ", ".join(others[:3]), at(text, code_needles(others[0])), c["id"])
                  else:
                      add("WEB-02", "major", code, "Code " + code + " quoted with the title", "Title quoted without the sheet code", at(text, [c.get("official_title", "")[:40]]), c["id"])
              if has_code and not has_title and title:
                  add("WEB-01", "major", code, "Exact title: \"" + c.get("official_title", "") + "\"", "Code quoted without the exact title of the sheet", i_code, c["id"])
              if has_code and c.get("certifiers"):
                  named = [n for n in c["certifiers"] if len(norm(n)) > 2 and (" " + norm(n) + " ") in padded]
                  if not named:
                      add("WEB-03", "major", code, "Certifier named: " + ", ".join(c["certifiers"][:2]), "Code quoted without the certifier name", i_code, c["id"])
          if not (ours[0] or whole_site):
              return {"findings": found}
          if cited or cpf:
              for w in PROMISES:
                  if (" " + w + " ") in padded:
                      add("WEB-05", "critical", "promise", "No promise or benefit in exchange for enrolling", "Mention \"" + w + "\"", at(text, [w, w.replace(" ", "")]), "")
                      break
          if " qualiopi " in padded and partner.get("qualiopi_updated"):
              for key, words, label in QUALIOPI_CATS:
                  claim = first_in(padded, words) if partner.get(key) != True else ""
                  if claim:
                      add("WEB-06", "minor", "qualiopi-" + key, "Qualiopi shown for the certified categories only",
                          "Qualiopi shown with the category \"" + label + "\" (mention \"" + claim + "\"), not certified (DGEFP " + partner.get("qualiopi_updated", "") + ")",
                          at_phrase(text, claim), "")
                      break
          return {"findings": found}
  - name: qw_finding
    language: starlark
    description: One finding of a rule list, as the message the finding write takes.
    code: |
      # One finding of a rule's list as the message object_upsert writes:
      # properties, title, and the links to open once written.
      def handle(inputs, msg):
          e = msg.get("payload", {}) or {}
          if not e.get("props"):
              return None
          return {"payload": e["props"], "title": e.get("title", ""), "link_targets": e.get("link_targets", {}),
                  "object": None, "object_id": None, "links": None}
  - name: qw_links
    language: starlark
    description: Links of a finding just written to its partner, certification and evidence.
    code: |
      # Links of the finding just written: to its partner, its certification
      # and where it was seen (page or CPF offer); an absent end stays silent.
      # @output concerns any "Finding → organization"
      # @output finding_on any "Finding → certification"
      # @output observed_in any "Finding → page or offer"
      def handle(inputs, msg):
          o = msg.get("object", {}) or {}
          l = msg.get("link_targets", {}) or {}
          if not o.get("id"):
              return None
          out = {}
          for k in ["concerns", "finding_on", "observed_in"]:
              if l.get(k, ""):
                  out[k] = {"source_id": o["id"], "target_id": l[k]}
          return out
flows:
  - name: "Quali-Watch · reminders"
    note: "Each morning the procedures whose due date passed move to the next reminder. For the automatic levels, add a Notification node after the reminder write (e-mail channel allowing recipients from flows, recipient field: recipient, report PDF attached), then deploy."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 6 * * *" }, outputs: [{ port: 0, targets: [due] }] }
        - id: due
          kind: ontology_query
          config:
            object_type: procedure
            filters:
              - { key: next_due, op: lte, value: "$today" }
              - { key: state, op: eq, value: open }
            limit: 500
          outputs: [{ port: 0, targets: [next] }]
        - id: next
          kind: pnex_function
          config: { function_name: qw_next_reminder, language: starlark }
          outputs: [{ port: 0, targets: [proc] }, { port: 1, targets: [rel] }]
        - { id: proc, kind: object_upsert, config: { object_type: procedure, key: id } }
        - { id: rel, kind: object_upsert, config: { object_type: reminder, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [link] }] }
        - { id: link, kind: pnex_function, config: { function_name: qw_link, language: starlark }, outputs: [{ port: 0, targets: [linked] }] }
        - { id: linked, kind: link_upsert, config: { link_type: reminder_of } }
  - name: "Quali-Watch · rule ADM-01"
    note: "Each morning the ceased partners become findings to review (create only), linked to their organization."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 5 * * *" }, outputs: [{ port: 0, targets: [ceased] }] }
        - id: ceased
          kind: ontology_query
          config:
            object_type: organization
            filters: [{ key: administrative_state, op: eq, value: ceased }]
            limit: 500
          outputs: [{ port: 0, targets: [rule] }]
        - { id: rule, kind: pnex_function, config: { function_name: qw_rule_adm_01, language: starlark }, outputs: [{ port: 0, targets: [finding] }] }
        - { id: finding, kind: object_upsert, config: { object_type: finding, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [link] }] }
        - { id: link, kind: pnex_function, config: { function_name: qw_link, language: starlark }, outputs: [{ port: 0, targets: [linked] }] }
        - { id: linked, kind: link_upsert, config: { link_type: concerns } }
  - name: "Quali-Watch · network rules"
    note: "Each morning the registry facts of your network become findings to review, created once and never reset: ceased partner (ADM-01), Qualiopi missing (ADM-02), CPF offer by a non-accredited organization (CPF-01), out of scope (CPF-02), after the accreditation end (CPF-03), accreditation unknown to France Compétences (REG-01), inactive accreditation still selling (REG-02). Run the network imports first (company register, DGEFP, CPF catalogue). Replaces « rule ADM-01 »: deploy one of the two."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "30 5 * * *" }, outputs: [{ port: 0, targets: [net] }] }
        - id: net
          kind: ontology_query
          config: { object_type: certification, filters: [{ key: code, op: in, value: "$setting.quali_watch.certifications" }], limit: 500, output: array, with_links: [accredited_for, offer_for, holds] }
          outputs: [{ port: 0, targets: [rules] }]
        - { id: rules, kind: pnex_function, config: { function_name: qw_network_rules, language: starlark }, outputs: [{ port: 0, targets: [split] }] }
        - { id: split, kind: json_split, config: { keys: [], auto: false }, outputs: [{ port: 0, targets: [one] }] }
        - { id: one, kind: pnex_function, config: { function_name: qw_finding, language: starlark }, outputs: [{ port: 0, targets: [finding] }] }
        - { id: finding, kind: object_upsert, config: { object_type: finding, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [links] }] }
        - { id: links, kind: pnex_function, config: { function_name: qw_links, language: starlark }, outputs: [{ port: 0, targets: [l_org] }, { port: 1, targets: [l_cert] }, { port: 2, targets: [l_seen] }] }
        - { id: l_org, kind: link_upsert, config: { link_type: concerns } }
        - { id: l_cert, kind: link_upsert, config: { link_type: finding_on } }
        - { id: l_seen, kind: link_upsert, config: { link_type: observed_in } }
  - name: "Quali-Watch · website check"
    note: "Each Sunday night the confirmed website of each partner is walked on the server (robots.txt obeyed, 2 s a page, 200 pages at most): pages citing your codes, exact titles, certifier names or the CPF are kept as observed pages with a sealed proof, then checked: exact title (WEB-01), code (WEB-02), certifier named (WEB-03), CPF eligibility (WEB-04), forbidden promises (WEB-05), Qualiopi category (WEB-06), accreditation still active (WEB-08), and a site with nothing relevant (COL-01). Findings read on a page are to validate, with their excerpt word for word. Find the websites first (Web presence · find websites)."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 2 * * 0" }, outputs: [{ port: 0, targets: [certs] }] }
        - id: certs
          kind: ontology_query
          config: { object_type: certification, filters: [{ key: code, op: in, value: "$setting.quali_watch.certifications" }], limit: 500, output: array, with_links: [holds] }
          outputs: [{ port: 0, targets: [context] }]
        - { id: context, kind: pnex_function, config: { function_name: qw_context, language: starlark }, outputs: [{ port: 0, targets: [partners] }] }
        - id: partners
          kind: ontology_query
          config: { object_type: certification, filters: [{ key: code, op: in, value: "$setting.quali_watch.certifications" }], limit: 500, traverse: [{ link_type: accredited_for, direction: in }], with_links: [has_website, accredited_for] }
          outputs: [{ port: 0, targets: [targets] }]
        - { id: targets, kind: pnex_function, config: { function_name: qw_targets, language: starlark }, outputs: [{ port: 0, targets: [crawl] }] }
        - id: crawl
          kind: site_crawl
          config:
            max_pages: 200
            record:
              type: observed_page
              properties: { url: url, title: heading, first_seen: first_seen, last_seen: last_seen, text_hash: text_fingerprint, relevant: relevant, state: state }
              link_type: page_of
              proof_link: proven_by
          outputs: [{ port: 0, targets: [rules] }, { port: 1, targets: [rules] }]
        - { id: rules, kind: pnex_function, config: { function_name: qw_web_rules, language: starlark }, outputs: [{ port: 0, targets: [split] }] }
        - { id: split, kind: json_split, config: { keys: [], auto: false }, outputs: [{ port: 0, targets: [one] }] }
        - { id: one, kind: pnex_function, config: { function_name: qw_finding, language: starlark }, outputs: [{ port: 0, targets: [finding] }] }
        - { id: finding, kind: object_upsert, config: { object_type: finding, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [links] }] }
        - { id: links, kind: pnex_function, config: { function_name: qw_links, language: starlark }, outputs: [{ port: 0, targets: [l_org] }, { port: 1, targets: [l_cert] }, { port: 2, targets: [l_seen] }] }
        - { id: l_org, kind: link_upsert, config: { link_type: concerns } }
        - { id: l_cert, kind: link_upsert, config: { link_type: finding_on } }
        - { id: l_seen, kind: link_upsert, config: { link_type: observed_in } }
page_templates:
  - key: finding_report
    name: Finding report
    names: {fr: "Constat d'écart"}
    description: One finding, its proof and what is expected.
    descriptions: {fr: "Un écart, sa preuve et ce qui est attendu."}
    body: |
      # Finding report

      ## Partner

      Company name, SIREN, certification concerned.

      ## Rule

      Code, wording, legal or contractual reference, version of the rule.

      ## Expected

      What the rule requires.

      ## Observed

      What the published page shows, with the excerpt quoted word for word.

      ## Proof

      - Address of the page
      - Full-page capture and server timestamp
      - SHA-256 fingerprint of the manifest and rank in the proof chain
    bodies:
      fr: |
        # Constat d'écart

        ## Partenaire

        Raison sociale, SIREN, certification concernée.

        ## Règle

        Code, libellé, référence légale ou contractuelle, version de la règle.

        ## Attendu

        Ce que la règle demande.

        ## Constaté

        Ce que la page publiée montre, avec l'extrait cité mot pour mot.

        ## Preuve

        - Adresse de la page
        - Capture pleine page et horodatage du serveur
        - Empreinte SHA-256 du manifeste et rang dans la chaîne des preuves
  - key: partner_report
    name: Partner report
    names: {fr: "Rapport partenaire"}
    description: State, findings and reminders of one partner.
    descriptions: {fr: "État, écarts et relances d'un partenaire."}
    body: |
      # Partner report

      ## Identity

      SIREN, establishments, officers, training declaration number, Qualiopi.

      ## Accreditations

      Certifications, scope, dates.

      ## Findings

      - Open
      - Closed

      ## Reminders

      Level, date sent, recipient, follow-up.

      ## Checks

      Dates of the site crawls and of the synchronizations.
    bodies:
      fr: |
        # Rapport partenaire

        ## Identité

        SIREN, établissements, dirigeants, numéro de déclaration d'activité, Qualiopi.

        ## Habilitations

        Certifications, périmètre, dates.

        ## Écarts

        - Ouverts
        - Clos

        ## Relances

        Niveau, date d'envoi, destinataire, suite donnée.

        ## Contrôles

        Dates des parcours du site et des synchronisations.
