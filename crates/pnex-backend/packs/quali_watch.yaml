hierarchies:
  - key: network
    name: Network
    names: {fr: "Réseau"}
    steps:
      - { link: accredited_for, inverse: true }
      - { link: has_website }
      - { link: page_of, inverse: true }
imports:
  - name: Partner network (sheet)
    source: file
    mode: snapshot
    mapping:
      key: partner_network
      name: Partner network
      names: {fr: "Réseau des partenaires"}
      objects:
        - as: org
          type: organization
          key: siren
          title: raison_sociale
          properties:
            siren: { from: siret, convert: [digits, "left:9", luhn] }
            nda: { from: nda, convert: [digits] }
            compliance_contact_email: { from: contact_conformite_email, convert: [email] }
            compliance_contact_name: contact_conformite_nom
            contact_phone: contact_telephone
            network_manager_email: { from: charge_reseau_email, convert: [email] }
        - as: cert
          type: certification
          key: code
          create: false
          properties:
            code: { from: code_certification, convert: [trim, upper] }
        - as: site
          type: website
          key: domain
          each: { from: site_web, convert: ["split:;"] }
          properties:
            root_url: { from: ".", convert: [url_origin] }
            domain: { from: ".", convert: [domain] }
      links:
        - type: accredited_for
          from: org
          to: cert
          valid_from: { from: date_debut_habilitation, convert: ["date:%d/%m/%Y"] }
          attributes:
            scope: { from: perimetre, convert: [{ enum: { les_deux: both, preparation: preparation, evaluation: assessment, both: both, assessment: assessment } }] }
            declared_fc: { from: declaree_france_competences, convert: [{ enum: { oui: "true", non: "false" } }] }
            agreement_ref: reference_convention
            ends_on: { from: date_fin_habilitation, convert: ["date:%d/%m/%Y"] }
            source: { value: "import" }
        - { type: has_website, from: org, to: site }
  - name: France Compétences · certifiers
    source: file
    mode: incremental
    recurrence: { start: "2026-01-01", every: 1, unit: day }
    mapping:
      steps:
        - { step: source_resolve, mode: datagouv, dataset: 5eebbc067a14b6fecc9c9976, resource_match: "export-fiches-csv-*.zip" }
        - { step: file_download }
        - { step: archive_extract, entries: ["*Certificateurs*.csv"] }
        - { step: table_inspect, entry: "*Certificateurs*.csv", expected_columns: [Numero_Fiche, Siret_Certificateur, Nom_Certificateur] }
        - { step: rows_filter, entry: "*Certificateurs*.csv", column: Siret_Certificateur, op: in, setting: quali_watch.certifiers, convert: [digits] }
      key: fc_certifiers
      name: France Compétences certifiers
      names: {fr: "Certificateurs France Compétences"}
      format: csv
      delimiter: ";"
      objects:
        - as: org
          type: organization
          key: siren
          title: { from: Nom_Certificateur, convert: [trim] }
          properties:
            siren: { from: Siret_Certificateur, convert: [digits, "left:9", luhn], invalid: skip }
        - as: cert
          type: certification
          key: code
          properties:
            code: { from: Numero_Fiche, convert: [trim, upper] }
            number: { from: Numero_Fiche, convert: [digits] }
            register: { from: Numero_Fiche, convert: [trim, upper, "left:2", { enum: { RN: rncp, RS: rs } }] }
      links:
        - { type: holds, from: org, to: cert, close_missing: false }
  - name: France Compétences · sheets
    source: file
    mode: incremental
    recurrence: { start: "2026-01-01", every: 1, unit: day }
    mapping:
      steps:
        - { step: source_resolve, mode: datagouv, dataset: 5eebbc067a14b6fecc9c9976, resource_match: "export-fiches-csv-*.zip" }
        - { step: file_download }
        - { step: archive_extract, entries: ["*Standard*.csv"] }
        - { step: table_inspect, entry: "*Standard*.csv", expected_columns: [Numero_Fiche, Intitule, Nomenclature_Europe_Niveau, Date_Decision, Date_Fin_Enregistrement, Date_Effet, Actif] }
        - { step: rows_filter, entry: "*Standard*.csv", column: Numero_Fiche, op: in_objects, object_type: certification, property: code, convert: [trim, upper] }
      key: fc_sheets
      name: France Compétences sheets
      names: {fr: "Fiches France Compétences"}
      format: csv
      delimiter: ";"
      objects:
        - as: cert
          type: certification
          key: code
          create: false
          update: true
          missing: skip
          properties:
            code: { from: Numero_Fiche, convert: [trim, upper] }
            number: { from: Numero_Fiche, convert: [digits] }
            official_title: { from: Intitule, convert: [trim], invalid: skip }
            level: { from: Nomenclature_Europe_Niveau, convert: [trim] }
            # RS sheets leave Date_Effet empty: Date_Decision then.
            registered_on: { concat: [Date_Effet, Date_Decision], sep: "|", convert: ["before:|", "date:%d/%m/%Y"] }
            expires_on: { from: Date_Fin_Enregistrement, convert: ["date:%d/%m/%Y"] }
            status: { from: Actif, convert: [{ enum: { ACTIVE: active, INACTIVE: inactive } }] }
  - name: France Compétences · partners
    source: file
    mode: snapshot
    recurrence: { start: "2026-01-01", every: 1, unit: day }
    mapping:
      steps:
        - { step: source_resolve, mode: datagouv, dataset: 5eebbc067a14b6fecc9c9976, resource_match: "export-fiches-csv-*.zip" }
        - { step: file_download }
        - { step: archive_extract, entries: ["*Partenaires*.csv"] }
        - { step: table_inspect, entry: "*Partenaires*.csv", expected_columns: [Numero_Fiche, Nom_Partenaire, Siret_Partenaire, Habilitation_Partenaire] }
        - { step: rows_filter, entry: "*Partenaires*.csv", column: Numero_Fiche, op: in_objects, object_type: certification, property: code, convert: [trim, upper] }
      key: fc_partners
      name: France Compétences partners
      names: {fr: "Partenaires France Compétences"}
      format: csv
      delimiter: ";"
      objects:
        - as: org
          type: organization
          key: siren
          title: { from: Nom_Partenaire, convert: [trim] }
          properties:
            siren: { from: Siret_Partenaire, convert: [digits, "left:9", luhn], invalid: skip }
        - as: cert
          type: certification
          key: code
          create: false
          properties:
            code: { from: Numero_Fiche, convert: [trim, upper] }
      links:
        - type: accredited_for
          from: org
          to: cert
          attributes:
            scope: { from: Habilitation_Partenaire, convert: [{ enum: { HABILITATION_ORGA_FORM: both, HABILITATION_FORMER: preparation, HABILITATION_ORGANISER: assessment } }] }
            declared_fc: { value: true }
            source: { value: france_competences }
          # Several SIRET of one SIREN with different scopes: both.
          on_conflict: { scope: both }
  - name: France Compétences · skill blocks
    source: file
    mode: snapshot
    recurrence: { start: "2026-01-01", every: 1, unit: day }
    mapping:
      steps:
        - { step: source_resolve, mode: datagouv, dataset: 5eebbc067a14b6fecc9c9976, resource_match: "export-fiches-csv-*.zip" }
        - { step: file_download }
        - { step: archive_extract, entries: ["*Blocs_De_Comp*.csv"] }
        - { step: table_inspect, entry: "*Blocs_De_Comp*.csv", expected_columns: [Numero_Fiche, Bloc_Competences_Code, Bloc_Competences_Libelle] }
        - { step: rows_filter, entry: "*Blocs_De_Comp*.csv", column: Numero_Fiche, op: in_objects, object_type: certification, property: code, convert: [trim, upper] }
      key: fc_blocks
      name: France Compétences skill blocks
      names: {fr: "Blocs de compétences France Compétences"}
      format: csv
      delimiter: ";"
      objects:
        - as: cert
          type: certification
          key: code
          create: false
          properties:
            code: { from: Numero_Fiche, convert: [trim, upper] }
        - as: bloc
          type: skill
          key: ref
          title: { from: Bloc_Competences_Libelle, convert: [trim] }
          close_missing: true
          properties:
            ref: { from: Bloc_Competences_Code, convert: [trim, upper] }
            rank: { from: Bloc_Competences_Code, convert: [trim, upper, "after:BC", digits] }
            label: { from: Bloc_Competences_Libelle, convert: [trim] }
            nature: { value: skill_block }
      links:
        - { type: skill_of, from: bloc, to: cert }
  - name: France Compétences · RS sheets (XML)
    source: file
    mode: snapshot
    recurrence: { start: "2026-01-01", every: 1, unit: day }
    mapping:
      steps:
        - { step: source_resolve, mode: datagouv, dataset: 5eebbc067a14b6fecc9c9976, resource_match: "export-fiches-rs-v4-1-*.zip" }
        - { step: file_download }
        - { step: archive_extract, entries: ["*.xml"] }
      key: fc_rs_xml
      name: France Compétences RS sheets
      names: {fr: "Fiches RS France Compétences (XML)"}
      format: xml
      rows: FICHES/FICHE
      objects:
        # The whole register is read: only the org's certifications are
        # enriched, their competencies created (`needs`).
        - as: cert
          type: certification
          key: code
          create: false
          update: true
          missing: skip
          properties:
            code: { from: NUMERO_FICHE, convert: [trim, upper] }
            objectives: { from: OBJECTIFS_CONTEXTE, convert: [trim] }
            prerequisites: { from: PREREQUIS_ENTREE_FORMATION, convert: [trim] }
            # The first jury described, whatever the access route.
            jury: { concat: [SI_JURY_FC.COMPOSITION, SI_JURY_FI.COMPOSITION, SI_JURY_VAE.COMPOSITION, SI_JURY_CQ.COMPOSITION, SI_JURY_CL.COMPOSITION], sep: "|", convert: ["before:|"] }
            # The latest year: the register lists them in no set order.
            certified_count: { from: STATISTIQUES_PROMOTIONS.STATISTIQUES_PROMOTION, convert: ["max_by:ANNEE", "field:NOMBRE_CERTIFIES"] }
            url_description: { from: LIEN_URL_DESCRIPTION, convert: [trim], invalid: skip }
        - as: comp
          type: skill
          key: ref
          needs: cert
          close_missing: true
          # One competency per paragraph (runs of 3 blanks or more).
          each: { from: CAPACITES_ATTESTEES, convert: ["split_spaces:3"] }
          title: "."
          properties:
            ref: { concat: ["^NUMERO_FICHE", "#"], sep: "-C", convert: [upper] }
            rank: "#"
            label: "."
            nature: { value: skill }
        - as: org
          type: organization
          key: siren
          create: false
          missing: skip
          each: PARTENAIRES.PARTENAIRE
          properties:
            siren: { from: SIRET_PARTENAIRE, convert: [digits, "left:9"] }
      links:
        - { type: skill_of, from: comp, to: cert }
        # Only completes the accreditations fc_partners opened.
        - type: accredited_for
          from: org
          to: cert
          create: false
          close_missing: false
          attributes:
            fc_state: { from: ETAT_HABILITATION, convert: [trim, { enum: { Actif: active, Inactif: inactive } }] }
            active_since: { from: DATE_ACTIF, convert: ["date:%d/%m/%Y"] }
            state_date: { from: DATE_DERNIERE_MODIFICATION_ETAT, convert: ["date:%d/%m/%Y"] }
          # Several SIRET of one SIREN: active when one of them is.
          on_conflict: { fc_state: active }
  - name: Company register · network (SIRENE)
    source: api
    source_url: "https://recherche-entreprises.api.gouv.fr/search?per_page=1"
    max_pages: 200
    mapping:
      key: qw_company_search
      name: Company register (network)
      names: {fr: "Recherche d'entreprises (réseau)"}
      format: json
      rows: results
      per_object: { type: organization, property: siren, param: q, linked: [accredited_for, holds], setting: { key: quali_watch.certifications, property: code } }
      objects:
        - as: ul
          type: organization
          key: siren
          create: false
          update: true
          missing: skip
          properties:
            siren: siren
            legal_form: nature_juridique
            naf: activite_principale
            administrative_state: { from: etat_administratif, convert: [{ enum: { A: active, C: ceased } }] }
            created_on: date_creation
            ceased_on: date_fermeture
            headcount_band: tranche_effectif_salarie
            headcount_min: { from: tranche_effectif_salarie, convert: [&qw_headcount_min { enum: { NN: "", "00": "0", "01": "1", "02": "3", "03": "6", "11": "10", "12": "20", "21": "50", "22": "100", "31": "200", "32": "250", "41": "500", "42": "1000", "51": "2000", "52": "5000", "53": "10000" } }] }
            headcount_max: { from: tranche_effectif_salarie, convert: [&qw_headcount_max { enum: { NN: "", "00": "0", "01": "2", "02": "5", "03": "9", "11": "19", "12": "49", "21": "99", "22": "199", "31": "249", "32": "499", "41": "999", "42": "1999", "51": "4999", "52": "9999", "53": "" } }] }
            country: { value: FR }
            activity_code: { from: activite_principale, convert: ["left:5"] }
            qualiopi: complements.est_qualiopi
        - as: siege
          type: map_pin
          key: siret
          title: nom_complet
          location: { lat: siege.latitude, lon: siege.longitude }
          properties:
            siret: siege.siret
            head_office: { value: true }
            administrative_state: { from: siege.etat_administratif, convert: [{ enum: { A: active, F: closed } }] }
            headcount_band: siege.tranche_effectif_salarie
            headcount_min: { from: siege.tranche_effectif_salarie, convert: [*qw_headcount_min] }
            headcount_max: { from: siege.tranche_effectif_salarie, convert: [*qw_headcount_max] }
        - as: etab
          type: map_pin
          key: siret
          each: matching_etablissements
          title: ^nom_complet
          location: { lat: latitude, lon: longitude }
          properties:
            siret: siret
            head_office: est_siege
            administrative_state: { from: etat_administratif, convert: [{ enum: { A: active, F: closed } }] }
            headcount_band: tranche_effectif_salarie
            headcount_min: { from: tranche_effectif_salarie, convert: [*qw_headcount_min] }
            headcount_max: { from: tranche_effectif_salarie, convert: [*qw_headcount_max] }
        - as: personne
          type: person
          key: registry_id
          each: dirigeants
          when: { from: type_dirigeant, equals: personne physique }
          title: { concat: [prenoms, nom] }
          properties:
            registry_id: { concat: [nom, prenoms, date_de_naissance], sep: "|", convert: [upper] }
        - as: holding
          type: organization
          key: siren
          each: dirigeants
          when: { from: type_dirigeant, equals: personne morale }
          title: denomination
          properties:
            siren: siren
      links:
        - { type: establishment_of, from: siege, to: ul }
        - { type: establishment_of, from: etab, to: ul }
        - type: manages
          from: personne
          to: ul
          attributes: &qw_mandate
            role:
              from: qualite
              convert:
                - lower
                - enum:
                    "président": president
                    "président de sas": president
                    "directeur général": ceo
                    "directeur général délégué": deputy_ceo
                    "gérant": manager
                    "co-gérant": manager
                    "administrateur": director
                    "membre du directoire": board_member
                    "*": other
            capacity: qualite
            source: { value: "recherche-entreprises.api.gouv.fr" }
        - type: manages
          from: holding
          to: ul
          attributes: *qw_mandate
  - name: DGEFP · training organizations (network)
