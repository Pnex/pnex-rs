# Since 2.0.0 every identifier is English (breaking).
# Since 1.3.0 `website` and `has_website` belong to `web_presence`
# (web-presence.md D363), taken over on upgrade without moving any data.
# Business pack "Partner network watch" (partner-watch.md D300–D316, product
# Quali-Watch): a certifier watches the training organizations it accredits.
# Nothing of it enters the core (D190): certifications, observed pages, CPF
# offers, rules, findings, procedures and reminders are pack types.
# The certifier itself is an `organization` of the org, linked to its
# certifications by `holds`.
# A finding produced by an LLM rule is never confirmed on its own (D316):
# it is `to_validate`, quotes its excerpt word for word and keeps where it
# was found (`observed_in.locator`) and the rule version.
# Reminders follow the D314 pattern: a procedure carries its level and next
# due date, a daily flow sends the next reminder and moves the procedure on;
# levels needing a human create a `to_validate` reminder that the
# `approve_send` action sends.
# The partner network import reads the certifier's sheet (one row per
# partner × certification, pnex-quali-watch/import-excel.md) as a snapshot:
# a row gone closes its accreditation, nothing is deleted.
# France Compétences open data (ingestion.md D317–D321) arrives through the
# steps of the imports themselves (data-pipelines.md D344, web-presence.md
# D359): each night the zip of data.gouv.fr is resolved, downloaded,
# extracted, inspected, filtered (the certifiers of the `certifiers`
# setting, then the certifications they hold) and imported by
# fc_certifiers, fc_sheets and fc_partners (a partner gone from the
# open data closes its accreditation); the SIRENE import then enriches the
# organizations. Accreditations are linked at SIREN level (Q-I2 open).
# The same night run reads the content of the sheets: RNCP skill blocks
# (fc_blocks, CSV of the same zip) and, from the RS XML export, each
# competency of a sheet (one per paragraph of CAPACITES_ATTESTEES, keyed
# RS0101-C3), objectives, prerequisites, jury, graduates, and the state of
# each accreditation (fc_rs_xml). The XML <ACTIF> is not trusted: the sheet
# status comes from the CSV Standard (fc_sheets).
# Programmes (the certifier's reference and each partner's) and their
# modules are compared competency by competency through `covers`: the
# cross-table is a computed view, not a type (pnex-quali-watch PRD §5.7).
# Rules and reminders ship as functions and flow models (D316): created at
# install when the org has none of that name, as drafts, never deployed by
# the install (D123). A deterministic rule writes its finding `proposed`
# (create only: a reviewed finding is never reset); an LLM rule must write
# `to_validate` with its word-for-word excerpt and locator.
key: quali_watch
name: Partner network watch
names: {fr: "Veille du réseau de partenaires"}
version: "2.0.0"
requires: [companies_fr, web_presence]
extends:
  - type: organization
    properties:
      - { key: compliance_contact_email, name: Compliance contact e-mail, names: {fr: "E-mail du contact conformité"}, kind: text, max_len: 254 }
      - { key: compliance_contact_name, name: Compliance contact, names: {fr: "Contact conformité"}, kind: text, max_len: 255 }
      - { key: contact_phone, name: Phone, names: {fr: "Téléphone"}, kind: text, max_len: 64 }
      - { key: network_manager_email, name: Network officer e-mail, names: {fr: "E-mail du chargé de réseau"}, kind: text, max_len: 254 }
      # Qualiopi categories other than training actions (DGEFP list), for
      # the rule on a Qualiopi mention out of its category.
      - { key: qualiopi_assessments, name: Qualiopi skills assessments, names: {fr: "Qualiopi bilans de compétences"}, kind: bool }
      - { key: qualiopi_vae, name: Qualiopi VAE, names: {fr: "Qualiopi VAE"}, kind: bool }
      - { key: qualiopi_apprenticeship, name: Qualiopi apprenticeship, names: {fr: "Qualiopi apprentissage"}, kind: bool }
description: Certifications, partner websites, observed pages with dated proofs, CPF offers, rules, findings and graduated reminders.
descriptions: {fr: "Certifications, sites des partenaires, pages observées avec preuves datées, offres CPF, règles, écarts et relances graduées."}
settings:
  - key: certifiers
    name: Certifiers followed
    names: {fr: "Certificateurs suivis"}
    description: SIRET of the certifiers whose France Compétences sheets are imported each night, comma-separated; empty = every certifier of the open data.
    descriptions: {fr: "SIRET des certificateurs dont les fiches France Compétences sont importées chaque nuit, séparés par des virgules ; vide = tous les certificateurs de l'open data."}
    kind: text
    default: ""
  - key: certifications
    name: Certifications watched
    names: {fr: "Certifications contrôlées"}
    description: Codes checked by the rules and followed by the network imports (company register, DGEFP, CPF), comma-separated (RS0101, RNCP34567); empty = every certification a certifier of the organization holds.
    descriptions: {fr: "Codes contrôlés par les règles et suivis par les imports réseau (registre des entreprises, DGEFP, CPF), séparés par des virgules (RS0101, RNCP34567) ; vide = toutes les certifications portées par un certificateur de l'organisation."}
    kind: text
    default: ""
  - key: disabled_rules
    name: Rules turned off
    names: {fr: "Règles désactivées"}
    description: Codes of the rules that write no finding, comma-separated (WEB-05, COL-01).
    descriptions: {fr: "Codes des règles qui n'écrivent aucun écart, séparés par des virgules (WEB-05, COL-01)."}
    kind: text
    default: ""
  - key: whole_site
    name: Whole website checked
    names: {fr: "Site entier contrôlé"}
    description: Off, the website rules (WEB-*) only read the pages that cite one of the certifications watched; on, every relevant page of the site (Qualiopi auditor use).
    descriptions: {fr: "Désactivé, les règles du site (WEB-*) ne lisent que les pages qui citent une des certifications contrôlées ; activé, toute page pertinente du site (usage auditeur Qualiopi)."}
    kind: bool
    default: false
types:
  - key: certification
    name: Certification
    names: {fr: "Certification"}
    icon: book
    may_be_contained_in: [folder]
    properties:
      - { key: code, name: Code, names: {fr: "Code"}, kind: text, max_len: 16, required: true, unique: true }
      - { key: register, name: Register, names: {fr: "Répertoire"}, kind: enum, values: [rncp, rs], labels: {rncp: {fr: "RNCP", en: "RNCP"}, rs: {fr: "RS", en: "RS"}}, indexed: true }
      # The register holds titles over 500 characters (2026-10-24 export).
      - { key: official_title, name: Exact title, names: {fr: "Intitulé exact"}, kind: text, max_len: 2000 }
      # Digits of the code (0101): the value the CPF catalogue is queried by.
      - { key: number, name: Number, names: {fr: "Numéro"}, kind: text, max_len: 12 }
      - { key: level, name: Level, names: {fr: "Niveau"}, kind: text, max_len: 32 }
      - { key: registered_on, name: Registered on, names: {fr: "Enregistrée le"}, kind: date }
      - { key: expires_on, name: Expires on, names: {fr: "Échéance"}, kind: date }
      - { key: status, name: Status, names: {fr: "Statut"}, kind: enum, values: [active, inactive, expired], labels: {active: {fr: "Actif", en: "Active"}, inactive: {fr: "Inactif", en: "Inactive"}, expired: {fr: "Échu", en: "Expired"}}, indexed: true }
      - { key: sheet_url, name: Register page, names: {fr: "Fiche du répertoire"}, kind: url }
      - { key: objectives, name: Objectives and context, names: {fr: "Objectifs et contexte"}, kind: text, max_len: 50000 }
      - { key: prerequisites, name: Entry prerequisites, names: {fr: "Prérequis"}, kind: text, max_len: 50000 }
      - { key: jury, name: Jury, names: {fr: "Jury"}, kind: text, max_len: 10000 }
      - { key: certified_count, name: Graduates (last year), names: {fr: "Certifiés (dernière année)"}, kind: number, min: 0 }
      # The register gives a title here as often as a link: text.
      - { key: url_description, name: Certifier description, names: {fr: "Descriptif du certificateur"}, kind: text, max_len: 2048 }
  - key: observed_page
    name: Observed page
    names: {fr: "Page observée"}
    icon: file-text
    may_be_contained_in: [folder]
    properties:
      - { key: url, name: URL, names: {fr: "URL"}, kind: text, max_len: 2048, required: true, unique: true }
      - { key: heading, name: Title, names: {fr: "Titre"}, kind: text, max_len: 500 }
      - { key: first_seen, name: First seen, names: {fr: "Vue la première fois"}, kind: date_time }
      - { key: last_seen, name: Last seen, names: {fr: "Vue la dernière fois"}, kind: date_time }
      - { key: text_fingerprint, name: Text fingerprint, names: {fr: "Empreinte du texte"}, kind: text, max_len: 64 }
      - { key: relevant, name: Relevant, names: {fr: "Pertinente"}, kind: bool }
      - { key: cited_codes, name: Codes quoted, names: {fr: "Codes cités"}, kind: text, max_len: 1000 }
      # The registry states (D309), written by the crawl's `record`.
      - { key: state, name: State, names: {fr: "État"}, kind: enum, values: [listed, relevant, captured, gone], labels: {listed: {fr: "Listée", en: "Listed"}, relevant: {fr: "Pertinente", en: "Relevant"}, captured: {fr: "Capturée", en: "Captured"}, gone: {fr: "Disparue", en: "Gone"}}, indexed: true }
  - key: cpf_offer
    name: CPF offer
    names: {fr: "Offre CPF"}
    icon: tag
    may_be_contained_in: [folder]
    properties:
      - { key: id_action, name: Action id, names: {fr: "Identifiant de l'action"}, kind: text, max_len: 64, required: true, unique: true }
      - { key: official_title, name: Title, names: {fr: "Intitulé"}, kind: text, max_len: 500 }
      - { key: price, name: Price, names: {fr: "Prix"}, kind: money }
      - { key: duration_hours, name: Duration, names: {fr: "Durée"}, kind: number, unit: h, min: 0 }
      - { key: city, name: City, names: {fr: "Ville"}, kind: text, max_len: 255 }
      - { key: delivery_mode, name: Delivery, names: {fr: "Modalité"}, kind: enum, values: [on_site, remote, blended], labels: {on_site: {fr: "Présentiel", en: "On site"}, remote: {fr: "Distanciel", en: "Remote"}, blended: {fr: "Mixte", en: "Blended"}} }
      - { key: seen_on, name: Seen on, names: {fr: "Vue le"}, kind: date }
      - { key: siret, name: SIRET, names: {fr: "SIRET"}, kind: text, max_len: 14 }
      - { key: remote, name: Remote sessions, names: {fr: "Sessions à distance"}, kind: bool }
  - key: compliance_rule
    name: Rule
    names: {fr: "Règle"}
    icon: landmark
    may_be_contained_in: [folder]
    write_role: admin
    properties:
      - { key: code, name: Code, names: {fr: "Code"}, kind: text, max_len: 16, required: true, unique: true }
      - { key: label, name: Label, names: {fr: "Libellé"}, kind: text, max_len: 500 }
      - { key: type, name: Kind, names: {fr: "Nature"}, kind: enum, values: [deterministic, llm], labels: {deterministic: {fr: "Déterministe", en: "Deterministic"}, llm: {fr: "LLM", en: "LLM"}} }
      - { key: default_severity, name: Default severity, names: {fr: "Gravité par défaut"}, kind: enum, values: [info, minor, major, critical], labels: {info: {fr: "Info", en: "Info"}, minor: {fr: "Mineur", en: "Minor"}, major: {fr: "Majeur", en: "Major"}, critical: {fr: "Critique", en: "Critical"}} }
      - { key: reference, name: Legal or contractual reference, names: {fr: "Référence légale ou contractuelle"}, kind: text, max_len: 2000 }
      - { key: version, name: Version, names: {fr: "Version"}, kind: number, min: 1 }
      - { key: active, name: Active, names: {fr: "Active"}, kind: bool }
  - key: finding
    name: Finding
    names: {fr: "Écart"}
    icon: flag
    may_be_contained_in: [folder]
    properties:
      - { key: ref, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, unique: true }
      - { key: expected, name: Expected, names: {fr: "Attendu"}, kind: text, max_len: 2000 }
      - { key: observed, name: Observed, names: {fr: "Constaté"}, kind: text, max_len: 2000 }
      - { key: excerpt, name: Excerpt (word for word), names: {fr: "Extrait (mot pour mot)"}, kind: text, max_len: 2000 }
      - { key: severity, name: Severity, names: {fr: "Gravité"}, kind: enum, values: [info, minor, major, critical], labels: {info: {fr: "Info", en: "Info"}, minor: {fr: "Mineur", en: "Minor"}, major: {fr: "Majeur", en: "Major"}, critical: {fr: "Critique", en: "Critical"}}, indexed: true }
      - key: state
        name: State
        names: {fr: "État"}
        kind: enum
        values: [proposed, to_validate, confirmed, reminding, fixed, closed, rejected]
        labels: {proposed: {fr: "Proposé", en: "Proposed"}, to_validate: {fr: "À valider", en: "To validate"}, confirmed: {fr: "Confirmé", en: "Confirmed"}, reminding: {fr: "En relance", en: "Being chased"}, fixed: {fr: "Corrigé", en: "Fixed"}, closed: {fr: "Clos", en: "Closed"}, rejected: {fr: "Rejeté", en: "Rejected"}}
        required: true
        indexed: true
      - { key: detected_on, name: Detected on, names: {fr: "Détecté le"}, kind: date_time }
      - { key: rule_version, name: Rule version, names: {fr: "Version de la règle"}, kind: number, min: 1 }
      - { key: confidence, name: Confidence, names: {fr: "Confiance"}, kind: number, min: 0, max: 1 }
    actions:
      - key: validate
        name: Confirm
        names: {fr: "Valider"}
        params:
          - { key: severity, name: Severity, names: {fr: "Gravité"}, kind: enum, values: [info, minor, major, critical], labels: {info: {fr: "Info", en: "Info"}, minor: {fr: "Mineur", en: "Minor"}, major: {fr: "Majeur", en: "Major"}, critical: {fr: "Critique", en: "Critical"}} }
          - { key: comment, name: Comment, names: {fr: "Commentaire"}, kind: text, max_len: 2000 }
      - key: reject
        name: Reject
        names: {fr: "Rejeter"}
        confirm: true
        params:
          - { key: reason, name: Reason, names: {fr: "Motif"}, kind: enum, values: [false_positive, out_of_scope, accepted_by_client], labels: {false_positive: {fr: "Faux positif", en: "False positive"}, out_of_scope: {fr: "Hors périmètre", en: "Out of scope"}, accepted_by_client: {fr: "Accepté par le client", en: "Accepted by the customer"}}, required: true }
          - { key: comment, name: Comment, names: {fr: "Commentaire"}, kind: text, max_len: 2000 }
      - key: recheck
        name: Check again
        names: {fr: "Revérifier"}
  - key: procedure
    name: Procedure
    names: {fr: "Procédure"}
    icon: workflow
    may_be_contained_in: [folder]
    properties:
      - { key: level, name: Level, names: {fr: "Niveau"}, kind: enum, values: [none, r1, r2, r3, r4, removal_proposed], labels: {none: {fr: "Aucun", en: "None"}, r1: {fr: "R1", en: "R1"}, r2: {fr: "R2", en: "R2"}, r3: {fr: "R3", en: "R3"}, r4: {fr: "R4", en: "R4"}, removal_proposed: {fr: "Retrait proposé", en: "Withdrawal proposed"}}, indexed: true }
      - { key: state, name: State, names: {fr: "État"}, kind: enum, values: [open, awaiting_validation, suspended, closed], labels: {open: {fr: "Ouverte", en: "Open"}, awaiting_validation: {fr: "En attente de validation", en: "Awaiting validation"}, suspended: {fr: "Suspendue", en: "Suspended"}, closed: {fr: "Close", en: "Closed"}}, required: true, indexed: true }
      - { key: next_due, name: Next due date, names: {fr: "Prochaine échéance"}, kind: date, indexed: true }
      - { key: opened_on, name: Opened on, names: {fr: "Ouverte le"}, kind: date }
      - { key: closed_on, name: Closed on, names: {fr: "Close le"}, kind: date }
      - { key: closing_reason, name: Closing reason, names: {fr: "Motif de clôture"}, kind: enum, values: [fixed, removal_done, partnership_end], labels: {fixed: {fr: "Corrigé", en: "Fixed"}, removal_done: {fr: "Retrait effectué", en: "Withdrawn"}, partnership_end: {fr: "Fin de partenariat", en: "Partnership ended"}} }
      - { key: contact_email, name: Compliance contact, names: {fr: "Contact conformité"}, kind: text, max_len: 254 }
      - { key: email_copy, name: Copy to, names: {fr: "Copie à"}, kind: text, max_len: 254 }
    actions:
      - key: approve_send
        name: Approve sending
        names: {fr: "Valider l'envoi"}
        confirm: true
        params:
          - { key: reminder_id, name: Reminder, names: {fr: "Relance"}, kind: ref, to_type: reminder, required: true }
          - { key: changed_text, name: Edited text, names: {fr: "Texte modifié"}, kind: text, max_len: 4000 }
      - key: send_now
        name: Send now
        names: {fr: "Envoyer maintenant"}
        confirm: true
        params:
          - { key: level, name: Level, names: {fr: "Niveau"}, kind: enum, values: [r1, r2, r3, r4], labels: {r1: {fr: "R1", en: "R1"}, r2: {fr: "R2", en: "R2"}, r3: {fr: "R3", en: "R3"}, r4: {fr: "R4", en: "R4"}}, required: true }
      - key: suspend
        name: Suspend
        names: {fr: "Suspendre"}
        params:
          - { key: until, name: Until, names: {fr: "Jusqu'au"}, kind: date }
          - { key: reason, name: Reason, names: {fr: "Motif"}, kind: text, max_len: 500, required: true }
      - key: resume
        name: Resume
        names: {fr: "Reprendre"}
        params:
          - { key: reason, name: Reason, names: {fr: "Motif"}, kind: text, max_len: 500 }
      - key: mark_fixed
        name: Mark as fixed
        names: {fr: "Marquer corrigé"}
        params:
          - { key: source, name: Reported by, names: {fr: "Signalé par"}, kind: enum, values: [partner, customer], labels: {partner: {fr: "Partenaire", en: "Partner"}, customer: {fr: "Client", en: "Customer"}}, required: true }
      - key: close
        name: Close
        names: {fr: "Clore"}
        confirm: true
        params:
          - { key: reason, name: Reason, names: {fr: "Motif"}, kind: enum, values: [fixed, removal_done, partnership_end], labels: {fixed: {fr: "Corrigé", en: "Fixed"}, removal_done: {fr: "Retrait effectué", en: "Withdrawn"}, partnership_end: {fr: "Fin de partenariat", en: "Partnership ended"}}, required: true }
  - key: reminder
    name: Reminder
    names: {fr: "Relance"}
    icon: newspaper
    may_be_contained_in: [folder]
    properties:
      - { key: ref, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, unique: true }
      - { key: level, name: Level, names: {fr: "Niveau"}, kind: enum, values: [r1, r2, r3, r4, removal_proposed], labels: {r1: {fr: "R1", en: "R1"}, r2: {fr: "R2", en: "R2"}, r3: {fr: "R3", en: "R3"}, r4: {fr: "R4", en: "R4"}, removal_proposed: {fr: "Retrait proposé", en: "Withdrawal proposed"}}, required: true }
      - { key: sent_on, name: Sent on, names: {fr: "Envoyée le"}, kind: date_time }
      - { key: recipient, name: Recipient, names: {fr: "Destinataire"}, kind: text, max_len: 254 }
      - { key: template, name: Template, names: {fr: "Modèle"}, kind: text, max_len: 255 }
      - { key: state, name: State, names: {fr: "État"}, kind: enum, values: [to_validate, sent, failed], labels: {to_validate: {fr: "À valider", en: "To validate"}, sent: {fr: "Envoyée", en: "Sent"}, failed: {fr: "Échec", en: "Failed"}}, required: true, indexed: true }
      - { key: changed_text, name: Edited text, names: {fr: "Texte modifié"}, kind: text, max_len: 4000 }
      - { key: fix_link_opened_on, name: Fix link opened on, names: {fr: "Lien « corrigé » ouvert le"}, kind: date_time }
  - key: skill
    name: Competency
    names: {fr: "Compétence"}
    icon: cube
    may_be_contained_in: [folder]
    properties:
      - { key: ref, name: Key, names: {fr: "Clé"}, kind: text, max_len: 64, required: true, unique: true }
      - { key: rank, name: Rank, names: {fr: "Rang"}, kind: number, min: 0 }
      - { key: label, name: Official wording, names: {fr: "Libellé officiel"}, kind: text, max_len: 10000 }
      - { key: nature, name: Kind, names: {fr: "Nature"}, kind: enum, values: [skill, skill_block], labels: {skill: {fr: "Compétence", en: "Skill"}, skill_block: {fr: "Bloc", en: "Block"}}, indexed: true }
  - key: syllabus
    name: Programme
    names: {fr: "Programme"}
    icon: layers
    may_be_contained_in: [folder]
    properties:
      - { key: ref, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, required: true, unique: true }
      - { key: role, name: Role, names: {fr: "Rôle"}, kind: enum, values: [reference, partner], labels: {reference: {fr: "Référence", en: "Reference"}, partner: {fr: "Partenaire", en: "Partner"}}, indexed: true }
      - { key: version, name: Version, names: {fr: "Version"}, kind: number, min: 1 }
      - { key: source_url, name: Source, names: {fr: "Source"}, kind: url }
      - { key: format, name: Delivery, names: {fr: "Modalité"}, kind: enum, values: [on_site, remote, blended], labels: {on_site: {fr: "Présentiel", en: "On site"}, remote: {fr: "Distanciel", en: "Remote"}, blended: {fr: "Mixte", en: "Blended"}} }
      - { key: live_hours, name: Live hours, names: {fr: "Heures synchrones"}, kind: number, unit: h, min: 0 }
      - { key: prep_hours, name: Preparation hours, names: {fr: "Heures de préparation"}, kind: number, unit: h, min: 0 }
      - { key: total_hours, name: Total hours, names: {fr: "Heures au total"}, kind: number, unit: h, min: 0 }
      - { key: received_on, name: Received on, names: {fr: "Reçu le"}, kind: date }
  - key: module
    name: Module
    names: {fr: "Module"}
    icon: file-text
    may_be_contained_in: [folder]
    properties:
      - { key: ref, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, required: true, unique: true }
      - { key: rank, name: Rank, names: {fr: "Rang"}, kind: number, min: 0 }
      - { key: heading, name: Title, names: {fr: "Titre"}, kind: text, max_len: 500 }
      - { key: hours, name: Hours, names: {fr: "Heures"}, kind: number, unit: h, min: 0 }
      - { key: content, name: Content, names: {fr: "Contenu"}, kind: text, max_len: 20000 }
      - { key: case_study, name: Case study, names: {fr: "Cas pratique"}, kind: text, max_len: 4000 }
      - { key: deliverable, name: Deliverable, names: {fr: "Livrable"}, kind: text, max_len: 2000 }
link_types:
  - key: holds
    name: holds
    names: {fr: "porte"}
    inverse_name: is held by
    inverse_names: {fr: "est portée par"}
    from_types: [organization]
    to_types: [certification]
  - key: accredited_for
    name: is accredited for
    names: {fr: "est habilité pour"}
    inverse_name: accredits
    inverse_names: {fr: "habilite"}
    from_types: [organization]
    to_types: [certification]
    attributes:
      - { key: scope, name: Scope, names: {fr: "Périmètre"}, kind: enum, values: [preparation, assessment, both], labels: {preparation: {fr: "Préparation", en: "Preparation"}, assessment: {fr: "Évaluation", en: "Assessment"}, both: {fr: "Les deux", en: "Both"}} }
      - { key: declared_fc, name: Declared to France Compétences, names: {fr: "Déclarée à France Compétences"}, kind: bool }
      - { key: agreement_ref, name: Agreement reference, names: {fr: "Référence de la convention"}, kind: text, max_len: 255 }
      - { key: ends_on, name: Accredited until, names: {fr: "Habilité jusqu'au"}, kind: date }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 255 }
      - { key: fc_state, name: France Compétences state, names: {fr: "État France Compétences"}, kind: enum, values: [active, inactive], labels: {active: {fr: "Actif", en: "Active"}, inactive: {fr: "Inactif", en: "Inactive"}} }
      - { key: active_since, name: Active since, names: {fr: "Actif depuis"}, kind: date }
