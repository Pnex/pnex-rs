  - sql:
      as: ranges
      sql: >-
        SELECT 'fomc:' || day AS external_id,
          CASE kind WHEN 'projections' THEN 'FOMC decision, with economic projections'
            WHEN 'unscheduled' THEN 'FOMC decision, unscheduled' ELSE 'FOMC decision' END AS label,
          local_to_utc(CAST(day || 'T' || at || ':00' AS TIMESTAMP), 'America/New_York') AS planned_start,
          local_to_utc(CAST(day || 'T' || at || ':00' AS TIMESTAMP), 'America/New_York') + INTERVAL '1 minute' AS planned_end,
          'central_bank_meeting' AS category,
          'https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm' AS source_url
        FROM (SELECT day, kind, '14:00' AS at FROM meetings
              UNION ALL SELECT split_part(entry, ' ', 1) AS day, split_part(entry, ' ', 3) AS kind,
                split_part(entry, ' ', 2) AS at FROM history) AS d
  - write: { from: ranges, time_ranges: {} }
tests:
  - name: the page's decision days and the history, at New York time
    settings: { markets.calendars: "fomc" }
    given:
      "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm": fomccalendars.htm
    expect:
      ranges:
        rows: 105
        contains:
          - { external_id: "fomc:2026-01-28", label: FOMC decision, planned_start: "2026-01-28T19:00:00" }
          - { external_id: "fomc:2026-03-18", label: "FOMC decision, with economic projections", planned_start: "2026-03-18T18:00:00" }
          - { external_id: "fomc:2026-05-01" }
          - { external_id: "fomc:2026-12-09", planned_start: "2026-12-09T19:00:00" }
          - { external_id: "fomc:2027-01-27" }
          - { external_id: "fomc:2009-01-28", planned_start: "2009-01-28T19:15:00" }
          - { external_id: "fomc:2020-03-15", label: "FOMC decision, unscheduled", planned_start: "2020-03-15T21:00:00" }
