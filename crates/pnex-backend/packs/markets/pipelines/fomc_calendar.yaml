# Federal Reserve decisions (markets-research.md D882): the calendar page's
# years, every scheduled statement out at 2 p.m. New York since March 2013,
# and the 2009-2020 statements before the page's years, each at its own
# release time (unscheduled ones marked: they were not known ahead).
# History: federalreserve.gov/monetarypolicy/fomchistoricalYYYY.htm and the
# Board's press release index (release times).
key: fomc_calendar
name: FOMC decision calendar
hosts: [www.federalreserve.gov]
schedule: 24h
steps:
  - enumerate:
      as: calendar
      cross:
        # Only when the org lists this calendar in `markets.calendars`.
        - { as: key, setting: markets.calendars, case: lower, derive: { listed: [["fomc", "yes"]] } }
  - fetch:
      as: page
      for_each: calendar
      url: "https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm"
  - read: { as: lines, from: page, format: lines, columns: [{ name: line, type: text, optional: true }] }
  - call: { as: meetings, from: lines, function: fomc_page }
  # Day, New York time, kind of each statement of 2009-2020.
  - enumerate:
      as: history
      for_each: calendar
      cross:
        - as: entry
          values:
            - "2009-01-28 14:15 scheduled"
            - "2009-03-18 14:15 scheduled"
            - "2009-04-29 14:15 scheduled"
            - "2009-06-24 14:15 scheduled"
