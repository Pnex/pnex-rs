# Probabilities minute by minute of the markets the setting `fine_markets`
# names (slugs), over the last 7 closed days (Q-PM2). Same table as the
# hourly ones, told apart by `fidelity`.
key: prices_fine
name: Prediction market prices (every minute)
hosts: [clob.polymarket.com]
requires: [prediction_markets.fine_markets]
schedule: 15m
steps:
  - enumerate:
      as: days
      track: true
      per_run: 60
      empty: settled
      cross:
        - as: condition_id
          objects:
            type: prediction_market
            property: condition_id
            columns: [tokens, outcomes]
            codes: { setting: prediction_markets.fine_markets, property: slug }
        - { as: day, periods: day, from: "-7d", closed_only: true }
  # One row per outcome token (a market lists them in the same order).
  - sql:
      as: tokens
      sql: |
        WITH d AS (
          SELECT condition_id, tokens, outcomes,
                 CAST(date_part('epoch', CAST(day AS TIMESTAMP)) AS BIGINT) AS start_ts FROM days),
        t AS (
          SELECT condition_id, split_part(tokens, ',', 1) AS token, split_part(outcomes, ',', 1) AS outcome, start_ts FROM d
          UNION ALL SELECT condition_id, split_part(tokens, ',', 2), split_part(outcomes, ',', 2), start_ts FROM d
          UNION ALL SELECT condition_id, split_part(tokens, ',', 3), split_part(outcomes, ',', 3), start_ts FROM d
          UNION ALL SELECT condition_id, split_part(tokens, ',', 4), split_part(outcomes, ',', 4), start_ts FROM d)
        SELECT condition_id, token, outcome, CAST(start_ts AS VARCHAR) AS start_ts,
               CAST(start_ts + 86399 AS VARCHAR) AS end_ts
        FROM t WHERE regexp_like(token, '^[0-9]{1,100}$')
  - fetch:
      as: answers
      for_each: tokens
      url: "https://clob.polymarket.com/prices-history"
      params: { market: "{{token}}", startTs: "{{start_ts}}", endTs: "{{end_ts}}", fidelity: "1" }
      every: 200ms
      proxy: polymarket_proxy
  - read:
      as: prices
      from: answers
      format: json
      records: /history
      skip_invalid: true
      columns:
        - { name: condition_id, value: "{{condition_id}}" }
        - { name: token, value: "{{token}}" }
        - { name: outcome, value: "{{outcome}}" }
        - { name: fidelity, type: integer, value: "1" }
        - { name: ts, at: /t, type: timestamp, format: epoch }
        - { name: price, at: /p, type: float, range: [0, 1] }
  - write: { from: prices, table: { name: prediction_prices } }
tests:
  - name: a fine market, the others left out
    today: "2026-11-17"
    settings: { prediction_markets.fine_markets: "fed-cut-december" }
    objects:
      "prediction_market.condition_id?slug~prediction_markets.fine_markets?columns=tokens,outcomes": ["0x1111111111111111111111111111111111111111111111111111111111111111"]
    extra:
      "prediction_market.condition_id?slug~prediction_markets.fine_markets?columns=tokens,outcomes":
        "0x1111111111111111111111111111111111111111111111111111111111111111": { title: Fed cut in December?, tokens: "123", outcomes: "Yes" }
    given:
      "https://clob.polymarket.com/prices-history?endTs=1794355199&fidelity=1&market=123&startTs=1794268800": polymarket_prices_123.json
      "https://clob.polymarket.com/prices-history?endTs=1794441599&fidelity=1&market=123&startTs=1794355200": polymarket_prices_123.json
      "https://clob.polymarket.com/prices-history?endTs=1794527999&fidelity=1&market=123&startTs=1794441600": polymarket_prices_123.json
      "https://clob.polymarket.com/prices-history?endTs=1794614399&fidelity=1&market=123&startTs=1794528000": polymarket_prices_123.json
      "https://clob.polymarket.com/prices-history?endTs=1794700799&fidelity=1&market=123&startTs=1794614400": polymarket_prices_123.json
      "https://clob.polymarket.com/prices-history?endTs=1794787199&fidelity=1&market=123&startTs=1794700800": polymarket_prices_123.json
      "https://clob.polymarket.com/prices-history?endTs=1794873599&fidelity=1&market=123&startTs=1794787200": polymarket_prices_123.json
    expect:
      days: { rows: 7 }
      prices:
        rows: 14
        contains:
          - { token: "123", fidelity: "1", price: "0.35" }
