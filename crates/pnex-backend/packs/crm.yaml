        labels: {decision_maker: {fr: "Décideur", en: "Decision maker"}, champion: {fr: "Champion", en: "Champion"}, sponsor: {fr: "Sponsor", en: "Sponsor"}, influencer: {fr: "Prescripteur", en: "Influencer"}, buyer: {fr: "Acheteur", en: "Buyer"}, user: {fr: "Utilisateur", en: "User"}, technical: {fr: "Technique", en: "Technical"}, other: {fr: "Autre", en: "Other"}}
        classification: personnelle
  - key: owned_by
    name: is carried by
    names: {fr: "est portée par"}
    inverse_name: carries
    inverse_names: {fr: "porte"}
    from_types: [opportunity]
    to_types: [person]
    one_target: true
  - key: comes_from
    name: comes from
    names: {fr: "est issue de"}
    inverse_name: led to
    inverse_names: {fr: "a donné"}
    from_types: [opportunity]
    to_types: [signal_commercial, meeting]
  - key: meeting_for
    name: is a meeting for
    names: {fr: "est un rendez-vous pour"}
    inverse_name: has as meeting
    inverse_names: {fr: "a pour rendez-vous"}
    from_types: [meeting]
    to_types: [opportunity]
  - key: qualified_on
    name: is qualified on
    names: {fr: "est qualifiée sur"}
    inverse_name: qualifies
    inverse_names: {fr: "qualifie"}
    from_types: [opportunity]
    to_types: [qualification_criterion]
    attributes:
      - key: status
        name: Status
        names: {fr: "Statut"}
        kind: enum
        values: [unknown, partial, valid]
        labels: {unknown: {fr: "Inconnu", en: "Unknown"}, partial: {fr: "Partiel", en: "Partial"}, valid: {fr: "Validé", en: "Valid"}}
        colors: { unknown: gray, partial: amber, valid: green }
      - { key: note, name: Note, names: {fr: "Note"}, kind: text, max_len: 2000 }
  - key: activity_on
    name: is an activity on
    names: {fr: "est une activité sur"}
    inverse_name: has as activity
    inverse_names: {fr: "a pour activité"}
    from_types: [activity]
    to_types: [opportunity, organization, person]
  - key: sheet_of
    name: is the sheet of
    names: {fr: "est la fiche de"}
    inverse_name: has as sheet
    inverse_names: {fr: "a pour fiche"}
