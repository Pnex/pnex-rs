functions:
  - name: crm_cadence_start
    language: starlark
    description: An opportunity entering qualification is marked started, and goes on to the plan unless every person involved objected.
    outputs:
      - {name: mark, ty: any, desc: "The opportunity, marked started today"}
      - {name: plan, ty: any, desc: "The opportunity, carried to the follow-up plan"}
    code: |
      def handle(inputs, msg):
          o = msg["object"]
          links = msg.get("links", {})
          people = [l for l in links.get("involved_in", []) if l.get("direction") == "in"]
          opposed = [l for l in people if l.get("other", {}).get("properties", {}).get("opposed_on")]
          accounts = [l["other"]["title"] for l in links.get("opportunity_with", []) if l.get("direction") == "out"]
          roles = [l.get("attributes", {}).get("role", "") for l in people if l not in opposed]
          mark = {"payload": {"follow_up_started_on": msg.get("today", "")}, "object_id": o["id"]}
          if people and len(opposed) == len(people):
              return [mark, None]
          context = "Account: " + (accounts[0] if accounts else "") + " · contacts: " + ", ".join([r for r in roles if r])
          go = {"payload": {}, "opp": {"id": o["id"], "name": o["title"], "context": context, "day0": msg.get("today", "")}}
          return [mark, go]
  - name: crm_cadence_activity
    language: starlark
    description: "One activity to do for one step of the follow-up plan: due on the start day plus the step's day."
    code: |
      # Civil dates as day numbers (proleptic Gregorian), Starlark has no
      # date type.
      def days_from_civil(y, m, d):
          y = y - 1 if m <= 2 else y
          era = (y if y >= 0 else y - 399) // 400
          yoe = y - era * 400
          mp = (m + 9) % 12
          doy = (153 * mp + 2) // 5 + d - 1
          doe = yoe * 365 + yoe // 4 - yoe // 100 + doy
          return era * 146097 + doe - 719468

      def civil_from_days(z):
          z = z + 719468
          era = (z if z >= 0 else z - 146096) // 146097
          doe = z - era * 146097
          yoe = (doe - doe // 1460 + doe // 36524 - doe // 146096) // 365
          y = yoe + era * 400
          doy = doe - (365 * yoe + yoe // 4 - yoe // 100)
          mp = (5 * doy + 2) // 153
          d = doy - (153 * mp + 2) // 5 + 1
          m = mp + 3 if mp < 10 else mp - 9
          return (y + 1 if m <= 2 else y, m, d)

      def two(n):
          return str(n) if n >= 10 else "0" + str(n)

      def add_days(day, n):
          z = days_from_civil(int(day[0:4]), int(day[5:7]), int(day[8:10])) + n
          y, m, d = civil_from_days(z)
          return str(y) + "-" + two(m) + "-" + two(d)

      def handle(inputs, msg):
          step = msg["payload"]
          if step.get("active") == False:
              return None
          opp = msg["opp"]
          day = int(step.get("day", 0) or 0)
          kind = step.get("kind", "task")
          return {
              "payload": {
                  "ref": "cadence:" + opp["id"] + ":" + msg["object"]["id"],
                  "kind": kind,
                  "state": "to_do",
                  "due_on": add_days(opp["day0"], day),
                  "direction": "outbound",
                  "content": step.get("instruction", ""),
                  "context": opp["context"],
              },
              # The step's own title (the org's words), the kind as a fallback.
              "title": (msg["object"].get("title") or kind.replace("_", " ") + " D" + str(day)) + " · " + opp["name"],
              "step": msg["object"]["id"],
          }
  - name: crm_link
    language: starlark
    description: The links from the activity just written to its opportunity and to its step of the plan.
    outputs:
      - {name: opportunity, ty: any, desc: "Activity is an activity on the opportunity"}
      - {name: step, ty: any, desc: "Activity comes from the step"}
    code: |
      def handle(inputs, msg):
          me = msg["object"]["id"]
          return [{"payload": {"source_id": me, "target_id": msg["opp"]["id"]}},
                  {"payload": {"source_id": me, "target_id": msg["step"]}}]
  - name: crm_reply_prep
    language: starlark
    description: A follow-up done and not answered yet, its opportunity and the moment an answer counts from.
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          opps = [l["other"]["id"] for l in msg.get("links", {}).get("activity_on", [])
                  if l.get("direction") == "out" and l.get("other", {}).get("type") == "opportunity"]
          steps = msg.get("links", {}).get("from_step", [])
          since = p.get("done_at") or p.get("due_on") or ""
          if not opps or not steps or not since:
              return None
          return {"payload": {}, "act": {"id": msg["object"]["id"], "opp": opps[0], "since": since}}
  - name: crm_reply_found
    language: starlark
    description: "A reply is an incoming activity on the same opportunity from the moment the follow-up was done."
    code: |
      def handle(inputs, msg):
          act = msg["act"]
          for row in msg["payload"]:
              p = row.get("properties", {})
              if p.get("direction") == "inbound" and (p.get("done_at") or "") >= act["since"]:
                  return {"payload": {"replied": True}, "object_id": act["id"]}
          return None
  - name: crm_show_figures
    language: starlark
    description: "The figures of a trade show from its opportunities: won amount in the currency of its cost, wins in another currency counted apart, never converted."
    code: |
      def rounded(x, digits):
          return int(x * digits + 0.5) / float(digits)

      def handle(inputs, msg):
          p = msg["payload"]
          opps = [l["other"].get("properties", {}) for l in msg.get("links", {}).get("met_at", [])
                  if l.get("direction") == "in" and l.get("other", {}).get("type") == "opportunity"]
          won = [o for o in opps if o.get("stage") == "won"]
          cost = p.get("cost") or {}
          currency = cost.get("currency") or ""
          amounts = [o["amount"] for o in won if o.get("amount")]
          if not currency and amounts:
              currency = amounts[0].get("currency", "")
          total = 0.0
          for a in amounts:
              if a.get("currency") == currency:
                  total += float(a.get("amount", 0))
          other = len([a for a in amounts if a.get("currency") != currency])
          figures = {
              "opportunities": len(opps),
              "won": len(won),
              "conversion": rounded(len(won) * 100.0 / len(opps), 10) if opps else 0,
              "other_currency_wins": other,
          }
          if currency:
              figures["won_amount"] = {"amount": total, "currency": currency}
          if cost.get("amount"):
              figures["roi"] = rounded(total / float(cost["amount"]), 100)
          # Written only when it changes: no new version every hour.
          if all([p.get(k) == v for k, v in figures.items()]):
              return None
          return {"payload": figures, "object_id": msg["object"]["id"]}
  - name: crm_report
    language: starlark
    description: "A done activity moves the last activity of its opportunity forward, then is marked reported."
    outputs:
      - {name: opportunity, ty: any, desc: "The opportunity, its last activity moved forward"}
      - {name: reported, ty: any, desc: "The activity, marked reported"}
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          at = p.get("done_at") or msg.get("now", "")
          done = {"payload": {"reported": True}, "object_id": msg["object"]["id"]}
          opps = [l["other"] for l in msg.get("links", {}).get("activity_on", [])
                  if l.get("direction") == "out" and l.get("other", {}).get("type") == "opportunity"]
          if not opps:
              return [None, done]
          o = opps[0]
          last = o.get("properties", {}).get("last_activity", "") or ""
          if last >= at:
              return [None, done]
          return [{"payload": {"last_activity": at}, "object_id": o["id"]}, done]
  - name: crm_init
    language: starlark
    description: An opportunity with no activity yet starts counting from now.
    code: |
      def handle(inputs, msg):
          return {"payload": {"last_activity": msg.get("now", "")}, "object_id": msg["object"]["id"]}
  - name: crm_criteria
    language: starlark
    description: Keeps the org's qualification criteria on the message for the opportunities that follow.
    code: |
      def handle(inputs, msg):
          return {"payload": {}, "criteria": msg["payload"]}
  - name: crm_missing
    language: starlark
    description: "The criteria required up to the opportunity's stage that are not valid yet, one per line; written only when they changed."
    code: |
      STAGES = ["discovery", "qualification", "proposal", "negotiation", "won", "lost"]

      def rank(stage):
          return STAGES.index(stage) if stage in STAGES else -1

      def handle(inputs, msg):
          p = msg["payload"]
          stage = rank(p.get("stage", ""))
          valid = [l["other"]["id"] for l in msg.get("links", {}).get("qualified_on", [])
                   if l.get("direction") == "out" and l.get("attributes", {}).get("status") == "valid"]
          rows = sorted(msg.get("criteria", []), key = lambda c: (c["properties"].get("order", 0) or 0, c["title"]))
          missing = []
          for c in rows:
              props = c.get("properties", {})
              if props.get("active") == False:
                  continue
              if rank(props.get("stage", "")) <= stage and c["id"] not in valid:
                  missing.append(c["title"])
          text = "\n".join(missing)
          if text == (p.get("missing_criteria", "") or ""):
              return None
          return {"payload": {"missing_criteria": text}, "object_id": msg["object"]["id"]}
  - name: crm_draft_prep
    language: starlark
    description: An activity to draft, its instruction and context for the model, the activity kept aside.
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          kind = "message on a professional network" if p.get("kind") == "network_message" else "e-mail"
          text = "Kind: " + kind + "\nInstruction: " + (p.get("content", "") or "") + "\nContext: " + (p.get("context", "") or "")
          return {"payload": {"text": text}, "act": {"id": msg["object"]["id"]}}
  - name: crm_draft
    language: starlark
    description: The model's draft written on the activity, to be read and sent by a person.
    code: |
      def handle(inputs, msg):
          text = msg["payload"].get("text", "").strip()
          if not text:
              return None
          return {"payload": {"draft": text[:4000]}, "object_id": msg["act"]["id"]}
  - name: crm_outbox_prep
    language: starlark
    description: A drafted mail activity kept aside, to find the people of its opportunity.
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          return {"payload": {}, "act": {"id": o["id"], "ref": p.get("ref", ""), "title": o.get("title", ""), "draft": p.get("draft", "")}}
  - name: crm_outbox_mail
    language: starlark
    description: "The draft addressed to the e-mail identifiers of the people involved who did not object; without any address the activity is only marked."
    outputs:
      - {name: send, ty: any, desc: "The mail for the outbox"}
      - {name: skip, ty: any, desc: "The activity marked: nobody to write to"}
    code: |
      def handle(inputs, msg):
          act = msg["act"]
          to = []
          for row in msg["payload"]:
              if row.get("properties", {}).get("opposed_on"):
                  continue
              for l in row.get("links", {}).get("uses_identifier", []):
                  i = l.get("other", {}).get("properties", {})
                  v = (i.get("value") or "").strip().lower()
                  if l.get("direction") == "out" and i.get("kind") == "email" and v and v not in to:
                      to.append(v)
          if not to:
              return [None, {"payload": {"outbox_mail": "none"}, "object_id": act["id"]}]
          # The title is "<step> · <opportunity>": the opportunity is the subject.
          subject = act["title"].split(" · ")[-1].strip() or act["title"]
          return [{"payload": {"to": to[:20], "subject": subject, "text": act["draft"], "key": "crm:" + act["ref"]}}, None]
  - name: crm_outbox_mark
    language: starlark
    description: The activity marked with the outbox mail written for it.
    code: |
      def handle(inputs, msg):
          return {"payload": {"outbox_mail": msg["mail"]["id"]}, "object_id": msg["act"]["id"]}
  - name: crm_mail_prep
    language: starlark
    description: "A new mail: its correspondent's address, and whether its sender may be trusted to link it on its own."
    code: |
      # The sender is believed when the receiving server authenticated it
      # (mail.md D458); a forward names its original sender only when the
      # platform trusted it (a member forwarded it, D463).
      def trusted(auth):
          spf, dkim, dmarc = auth.get("spf", "none"), auth.get("dkim", "none"), auth.get("dmarc", "none")
          if dmarc == "pass":
              return True
          if dmarc == "fail":
              return False
          return (spf == "pass" or dkim == "pass") and spf != "fail" and dkim != "fail"

      def handle(inputs, msg):
          m = msg["payload"]
          if m.get("automatic") or m.get("from_pnex"):
              return None
          fwd = m.get("forwarded") or {}
          frm = fwd.get("from") if fwd.get("trusted") else m.get("from")
          addr = ((frm or {}).get("address", "") or "").lower()
          if not addr:
              return None
          text = (m.get("text", "") or "")[:1500]
          return {
              "payload": {},
              "addr": addr,
              "mail": {
                  "name": (frm or {}).get("name", "") or "",
                  "message_id": m.get("message_id", ""),
                  "subject": fwd.get("subject") or m.get("subject", ""),
                  "date": fwd.get("date") or m.get("date") or m.get("received_at", ""),
                  "text": text,
                  "trusted": trusted(m.get("auth", {})),
              },
          }
  - name: crm_mail_lead
    language: starlark
    description: "The lead of a mail from an unknown, authenticated sender, keyed by the address: one lead per sender. The mail's text is data, kept as the lead's message and never acted on."
    code: |
      def handle(inputs, msg):
          mail = msg["mail"]
          # A known person is followed by the mails received flow; a forged
          # sender must not be able to fill the list of leads.
          if msg["payload"] or not mail.get("trusted"):
              return None
          addr = msg["addr"]
          subject = mail.get("subject", "") or ""
          payload = {
              "ref": "mail:" + addr,
              "status": "new",
              "source": "inbound",
              "source_detail": subject[:255],
              "email": addr,
              "message": mail.get("text", ""),
          }
          name = mail.get("name", "")
          if name:
              payload["contact_name"] = name[:255]
          if mail.get("date"):
              payload["received_on"] = mail["date"][:10]
          return {"payload": payload, "title": (name or addr)[:255]}
  - name: crm_mail_activity
    language: starlark
    description: The mail as a done incoming activity of the person found; the person and their open opportunities kept for the links.
    code: |
      CLOSED = ["won", "lost"]

      def handle(inputs, msg):
          mail = msg["mail"]
          subject = mail.get("subject", "") or "(no subject)"
          # The opportunities the person is involved in and still open: the
          # mail counts as their last activity too.
          opps = [l["other"]["id"] for l in msg.get("links", {}).get("involved_in", [])
                  if l.get("direction") == "out" and l.get("other", {}).get("type") == "opportunity"
                  and l["other"].get("properties", {}).get("stage", "") not in CLOSED]
          payload = {
              "ref": "mail:" + mail.get("message_id", ""),
              "kind": "mail",
              "state": "done",
              "direction": "inbound",
              "content": subject + "\n\n" + mail.get("text", ""),
          }
          if mail.get("date"):
              payload["done_at"] = mail["date"]
          return {
              "payload": payload,
              "title": "mail · " + subject[:200],
              "person": {"id": msg["object"]["id"]},
              "opportunities": opps,
          }
  - name: crm_mail_link
    language: starlark
    description: "The links from the activity to the person (or the account found by domain) and their open opportunities (payload = the list): written when the sender is trusted, proposed otherwise or when found by domain."
    outputs:
      - {name: link, ty: any, desc: "Trusted sender: the links are written"}
      - {name: proposal, ty: any, desc: "Sender not authenticated: the links are proposed"}
    code: |
      def handle(inputs, msg):
          act = msg["object"]["id"]
          targets = [msg["person"]["id"]] + msg.get("opportunities", [])
          links = [{"source_id": act, "target_id": t} for t in targets]
          # A match by the domain of the address is a guess: always proposed.
          domain = msg.get("by_domain", "")
          if msg["mail"].get("trusted") and not domain:
              return [{"payload": links}, None]
          evidence = {"reason": "sender not authenticated", "subject": msg["mail"].get("subject", "")}
          if domain:
              evidence = {"reason": "matched by the e-mail domain", "domain": domain, "subject": msg["mail"].get("subject", "")}
          for l in links:
              l["confidence"] = 50 if domain else 40
              l["evidence"] = evidence
          return [None, {"payload": links}]
  - name: crm_mail_domain
    language: starlark
    description: "A sender no person uses as identifier: the domain of their address, unless a webmail, to find the account by its website (web_presence)."
    code: |
      WEBMAIL = ["gmail.com", "googlemail.com", "hotmail.com", "hotmail.fr", "outlook.com",
                 "outlook.fr", "live.com", "live.fr", "msn.com", "yahoo.com", "yahoo.fr",
                 "orange.fr", "wanadoo.fr", "free.fr", "sfr.fr", "neuf.fr", "laposte.net",
                 "icloud.com", "me.com", "gmx.fr", "gmx.com", "aol.com", "bbox.fr",
                 "protonmail.com", "proton.me", "numericable.fr"]

      def handle(inputs, msg):
          if msg["payload"]:
              return None
          d = msg.get("addr", "").split("@")[-1]
          if "." not in d or d in WEBMAIL:
              return None
          return {"payload": {}, "domain": d, "addr": msg["addr"], "mail": msg["mail"]}
  - name: crm_mail_account
    language: starlark
    description: The mail as a done incoming activity of the account whose website has the sender's domain; its open opportunities kept for the links, all proposed.
    code: |
      CLOSED = ["won", "lost"]

      def handle(inputs, msg):
          mail = msg["mail"]
          subject = mail.get("subject", "") or "(no subject)"
          opps = [l["other"]["id"] for l in msg.get("links", {}).get("opportunity_with", [])
                  if l.get("direction") == "in" and l.get("other", {}).get("type") == "opportunity"
                  and l["other"].get("properties", {}).get("stage", "") not in CLOSED]
          payload = {
              "ref": "mail:" + mail.get("message_id", ""),
              "kind": "mail",
              "state": "done",
              "direction": "inbound",
              "content": subject + "\n\n" + mail.get("text", ""),
          }
          if mail.get("date"):
              payload["done_at"] = mail["date"]
          return {
              "payload": payload,
              "title": "mail · " + subject[:200],
              "person": {"id": msg["object"]["id"]},
              "opportunities": opps,
              "mail": mail,
              "by_domain": msg.get("domain", ""),
          }
  - name: crm_meeting_prep
    language: starlark
    description: "A mail carrying a meeting invitation: the meeting keyed by the invitation's UID, the addresses of its organizer and attendees, and whether the sender may be trusted."
    code: |
      # Same rule as crm_mail_prep (mail.md D458).
      def trusted(auth):
          spf, dkim, dmarc = auth.get("spf", "none"), auth.get("dkim", "none"), auth.get("dmarc", "none")
          if dmarc == "pass":
              return True
          if dmarc == "fail":
              return False
          return (spf == "pass" or dkim == "pass") and spf != "fail" and dkim != "fail"

      def handle(inputs, msg):
          m = msg["payload"]
          inv = m.get("invitation") or {}
          method = (inv.get("method", "") or "").upper()
          # A reply only says whether one attendee comes.
          if not inv.get("uid") or method == "REPLY":
              return None
          purpose = (inv.get("summary", "") or m.get("subject", "") or "(no subject)")[:500]
          payload = {
              "invitation_uid": inv["uid"][:1024],
              "purpose": purpose,
              "status": "cancelled" if method == "CANCEL" else "planned",
          }
          if inv.get("start"):
              payload["date"] = inv["start"]
          if inv.get("location"):
              payload["place"] = inv["location"][:255]
          who = ([inv["organizer"]] if inv.get("organizer") else []) + inv.get("attendees", [])
          addrs = []
          for a in who:
              addr = (a.get("address", "") or "").lower()
              if addr and addr not in addrs:
                  addrs.append(addr)
          return {
              "payload": payload,
              "title": "meeting · " + purpose[:200],
              "addresses": addrs,
              "trusted": trusted(m.get("auth", {})),
          }
  - name: crm_meeting_participants
    language: starlark
    description: The meeting written; one address per message follows (payload = the list), the meeting kept for the links.
    code: |
      def handle(inputs, msg):
          return {"payload": [{"address": a} for a in msg.get("addresses", [])], "meeting": {"id": msg["object"]["id"], "purpose": msg["object"]["title"]}}
  - name: crm_meeting_link
    language: starlark
    description: "The person found takes part in the meeting: written when the sender is trusted, proposed otherwise."
    outputs:
      - {name: link, ty: any, desc: "Trusted sender: the person takes part"}
      - {name: proposal, ty: any, desc: "Sender not authenticated: the link is proposed"}
    code: |
      def handle(inputs, msg):
          link = {"source_id": msg["object"]["id"], "target_id": msg["meeting"]["id"]}
          if msg.get("trusted"):
              return [{"payload": link}, None]
          link["confidence"] = 40
          link["evidence"] = {"reason": "sender not authenticated", "meeting": msg["meeting"]["purpose"]}
          return [None, {"payload": link}]
  - name: crm_lead_params
    language: starlark
    description: Keeps the parameters of a convert action while the lead is read.
    code: |
      def handle(inputs, msg):
          return {"payload": {}, "convert": msg.get("payload", {}) or {}}
  - name: crm_lead_convert
    language: starlark
    description: "The opportunity a lead becomes: stage discovery, the lead's source, keyed by the lead so a second convert finds it."
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          c = msg.get("convert", {})
          if not c.get("organization"):
              return None
          links = msg.get("links", {})
          shows = [l["other"]["id"] for l in links.get("met_at", []) + links.get("from_list", []) if l.get("direction") == "out"]
          payload = {"ref": "lead:" + o["id"], "stage": "discovery"}
          for k in ["source", "source_detail"]:
              if p.get(k):
                  payload[k] = p[k]
          # The company rather than the lead's title, which may name a person.
          return {
              "payload": payload,
              "title": c.get("name") or p.get("company") or o["title"],
              "lead": {"id": o["id"], "account": c["organization"], "person": c.get("person") or "", "show": shows[0] if shows else ""},
          }
  - name: crm_lead_links
    language: starlark
    description: "The links of a converted lead: the opportunity's account and origin, the lead's account and contact, the contact involved; then the lead marked converted."
    outputs:
      - {name: account, ty: any, desc: "Opportunity is an opportunity with the account"}
      - {name: origin, ty: any, desc: "Opportunity comes from the lead"}
      - {name: lead_of, ty: any, desc: "Lead is a lead of the account"}
      - {name: contact, ty: any, desc: "Lead has as contact the person, when given"}
      - {name: involved, ty: any, desc: "The person is involved in the opportunity, when given"}
      - {name: converted, ty: any, desc: "The lead, marked converted"}
      - {name: show, ty: any, desc: "The opportunity was met at the lead's trade show, when it has one"}
    code: |
      def handle(inputs, msg):
          opp = msg["object"]["id"]
          lead = msg["lead"]
          def link(a, b):
              return {"payload": {"source_id": a, "target_id": b}}
          person = lead.get("person", "")
          return [
              link(opp, lead["account"]),
              link(opp, lead["id"]),
              link(lead["id"], lead["account"]),
              link(lead["id"], person) if person else None,
              link(person, opp) if person else None,
              {"payload": {"status": "converted"}, "object_id": lead["id"]},
              link(opp, lead["show"]) if lead.get("show") else None,
          ]
  - name: crm_list_show
    language: starlark
    description: A trade show naming a list, kept on the message while its contacts are read.
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          return {"payload": {"list": p["list"]},
                  "show": {"id": o["id"], "title": o["title"], "start_on": p.get("start_on", "")}}
  - name: crm_list_ask
    language: starlark
    description: A list contact, kept on the message while its address is looked up among known people.
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          return {
              "payload": {"email": p.get("email", "")},
              "show": msg["show"],
              "today": msg.get("today", ""),
              "contact": {"id": o["id"], "title": o["title"], "company": p.get("company", ""), "email": p.get("email", "")},
          }
  - name: crm_list_lead
    language: starlark
    description: "The lead of a list contact, or the contact marked when a person known by that address objected. The key is the contact, so a contact never makes two leads."
    outputs:
      - {name: lead, ty: any, desc: "The new lead"}
      - {name: objected, ty: any, desc: "The contact, marked objected"}
    code: |
      def handle(inputs, msg):
          c = msg["contact"]
          show = msg["show"]
          for row in msg["payload"]:
              for l in row.get("links", {}).get("uses_identifier", []):
                  if l.get("other", {}).get("properties", {}).get("opposed_on"):
                      return [None, {"payload": {"lead_state": "objected"}, "object_id": c["id"]}]
          payload = {
              "ref": "list:" + c["id"],
              "status": "new",
              "source": "trade_show",
              "source_detail": show["title"],
              "contact_name": c["title"],
              "received_on": show["start_on"] or msg["today"],
          }
          for k in ["company", "email"]:
              if c[k]:
                  payload[k] = c[k]
          return [{"payload": payload, "title": c["title"], "show": show, "contact": c}, None]
  - name: crm_list_links
    language: starlark
    description: "After the lead is written: its link to the trade show, then the contact marked. A failure before this leaves the contact to retry."
    outputs:
      - {name: show, ty: any, desc: "The lead is on the list of the trade show"}
      - {name: done, ty: any, desc: "The contact, marked created"}
    code: |
      def handle(inputs, msg):
          return [
              {"payload": {"source_id": msg["object"]["id"], "target_id": msg["show"]["id"]}},
              {"payload": {"lead_state": "created"}, "object_id": msg["contact"]["id"]},
          ]
  - name: crm_quote_expired
    language: starlark
    description: A sent quote past its validity date is marked expired.
    code: |
      def handle(inputs, msg):
          return {"payload": {"state": "expired"}, "object_id": msg["object"]["id"]}
  - name: crm_invoice_overdue
    language: starlark
    description: "An unpaid invoice past its due date: marked overdue, and a reminder task due today on what it invoices."
    outputs:
      - {name: mark, ty: any, desc: "The invoice, marked overdue"}
      - {name: reminder, ty: any, desc: "The reminder activity to do, with the objects it is about"}
    code: |
      def money(v):
          if not v:
              return "-"
          a = v.get("amount", 0)
          return (str(int(a)) if a == int(a) else str(a)) + " " + v.get("currency", "")

      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          about = [l["other"]["id"] for l in msg.get("links", {}).get("invoice_for", []) if l.get("direction") == "out"]
          mark = {"payload": {"state": "overdue"}, "object_id": o["id"]}
          num = p.get("ref", "")
          reminder = {
              "payload": {
                  "ref": "invoice:" + o["id"] + ":overdue",
                  "kind": "task",
                  "state": "to_do",
                  "due_on": msg.get("today", ""),
                  "direction": "outbound",
                  "content": "Invoice " + num + " was due on " + p.get("due_on", "") + ": amount " + money(p.get("amount")) + ", paid " + money(p.get("paid_amount")) + ".",
              },
              "title": "Overdue invoice " + num,
              "about": about,
          }
          return [mark, reminder]
  - name: crm_about
    language: starlark
    description: "Link payloads (payload = the list) from the activity just written to the objects it is about."
    code: |
      def handle(inputs, msg):
          about = msg.get("about", [])
          if not about:
              return None
          return {"payload": [{"source_id": msg["object"]["id"], "target_id": t} for t in about]}
  - name: crm_day_due
    language: starlark
    description: Keeps the activities due on the message for the morning digest.
    code: |
      def handle(inputs, msg):
          return {"payload": {}, "dues": msg["payload"]}
  - name: crm_day_dormant
    language: starlark
    description: Keeps the dormant opportunities on the message for the morning digest.
    code: |
      def handle(inputs, msg):
          return {"payload": {}, "dormant": msg["payload"]}
  - name: crm_day
    language: starlark
    description: "The morning digest: activities due or late, open opportunities with no recent activity, then the new leads."
    outputs:
      - {name: digest, ty: any, desc: "The digest (payload.text), when there is something to do"}
    code: |
      def handle(inputs, msg):
          dues = sorted(msg.get("dues", []), key = lambda r: r["properties"].get("due_on", ""))
          dormant = sorted(msg.get("dormant", []), key = lambda r: r["properties"].get("last_activity", ""))
          leads = sorted(msg["payload"], key = lambda r: r["properties"].get("received_on", ""))
          if not dues and not dormant and not leads:
              return None
          lines = []
          if dues:
              lines.append("To do:")
              for r in dues:
                  lines.append("- " + r["properties"].get("due_on", "") + " " + r["title"])
          if dormant:
              lines.append("No recent activity:")
              for r in dormant:
                  last = (r["properties"].get("last_activity", "") or "")[:10]
                  lines.append("- " + r["title"] + " (last activity " + last + ")")
          if leads:
              lines.append("New leads:")
              for r in leads:
                  p = r["properties"]
                  lines.append("- " + r["title"] + " (" + " · ".join([x for x in [p.get("received_on", ""), p.get("source_detail", "")] if x]) + ")")
          return {"digest": {"trigger": True, "count": len(dues) + len(dormant) + len(leads), "text": "\n".join(lines)}}
flows:
  - name: "CRM · follow-up plan"
    note: "Every hour, up to 20 opportunities that entered the stage qualification get one activity to do per active step of the org's follow-up plan (objects 'Follow-up step': day, kind, instruction), due on the start day plus the step's day, linked to the opportunity. An opportunity whose people involved all objected is only marked. Add the steps first, then deploy."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "5 * * * *" }, outputs: [{ port: 0, targets: [opps] }] }
        - id: opps
          kind: ontology_query
          config:
            object_type: opportunity
            filters: [{ key: stage, op: eq, value: qualification }, { key: follow_up_started_on, op: missing }]
            limit: 20
            with_links: [involved_in, opportunity_with]
          outputs: [{ port: 0, targets: [start] }]
        - { id: start, kind: pnex_function, config: { function_name: crm_cadence_start, language: starlark }, outputs: [{ port: 0, targets: [started] }, { port: 1, targets: [steps] }] }
        - { id: started, kind: object_upsert, config: { object_type: opportunity, key: id } }
        - id: steps
          kind: ontology_query
          config:
            object_type: follow_up_step
            order_by: day
            limit: 50
          outputs: [{ port: 0, targets: [act] }]
        - { id: act, kind: pnex_function, config: { function_name: crm_cadence_activity, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: activity, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [about] }] }
        - { id: about, kind: pnex_function, config: { function_name: crm_link, language: starlark }, outputs: [{ port: 0, targets: [linked] }, { port: 1, targets: [stepped] }] }
        - { id: linked, kind: link_upsert, config: { link_type: activity_on } }
        - { id: stepped, kind: link_upsert, config: { link_type: from_step } }
  - name: "CRM · replies to follow-ups"
    note: "Every hour, a follow-up of the plan done without a reply yet is marked replied when an incoming activity (a mail filed by CRM · mails received, or one entered by hand) lands on the same opportunity from the moment it was done. The newest 200 are read at each pass. It feeds the reply rate of the Figures screen."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "25 * * * *" }, outputs: [{ port: 0, targets: [done] }] }
        - id: done
          kind: ontology_query
          config:
            object_type: activity
            filters:
              - { key: state, op: eq, value: done }
              - { key: direction, op: eq, value: outbound }
              - { key: replied, op: missing }
            order_by: done_at
            descending: true
            limit: 200
            with_links: [activity_on, from_step]
          outputs: [{ port: 0, targets: [prep] }]
        - { id: prep, kind: pnex_function, config: { function_name: crm_reply_prep, language: starlark }, outputs: [{ port: 0, targets: [others] }] }
        - id: others
          kind: ontology_query
          config:
            object_type: opportunity
            filters: [{ key: id, op: eq, value: "$msg.act.opp" }]
            traverse: [{ link_type: activity_on, direction: in }]
            limit: 200
            output: array
          outputs: [{ port: 0, targets: [found] }]
        - { id: found, kind: pnex_function, config: { function_name: crm_reply_found, language: starlark }, outputs: [{ port: 0, targets: [mark] }] }
        - { id: mark, kind: object_upsert, config: { object_type: activity, key: id } }
  - name: "CRM · trade show figures"
    note: "Every hour, each trade show (type Trade show: its cost, and the link was met at from a lead or an opportunity) gets its opportunities, won ones, conversion rate, won amount in the currency of its cost, and return (won amount / cost). Wins in another currency are counted apart, never converted."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "35 * * * *" }, outputs: [{ port: 0, targets: [shows] }] }
        - id: shows
          kind: ontology_query
          config:
            object_type: trade_show
            limit: 200
            with_links: [met_at]
          outputs: [{ port: 0, targets: [figures] }]
        - { id: figures, kind: pnex_function, config: { function_name: crm_show_figures, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: trade_show, key: id } }
  - name: "CRM · last activity"
    note: "Every 15 minutes, a done activity moves the last activity of its opportunity forward (the date it was done, or now), then is marked reported; an opportunity with no activity yet starts counting from now. The morning digest reads it."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "*/15 * * * *" }, outputs: [{ port: 0, targets: [done, fresh] }] }
        - id: done
          kind: ontology_query
          config:
            object_type: activity
            filters: [{ key: state, op: eq, value: done }, { key: reported, op: missing }]
            limit: 200
            with_links: [activity_on]
          outputs: [{ port: 0, targets: [report] }]
        - { id: report, kind: pnex_function, config: { function_name: crm_report, language: starlark }, outputs: [{ port: 0, targets: [moved] }, { port: 1, targets: [reported] }] }
        - { id: moved, kind: object_upsert, config: { object_type: opportunity, key: id } }
        - { id: reported, kind: object_upsert, config: { object_type: activity, key: id } }
        - id: fresh
          kind: ontology_query
          config:
            object_type: opportunity
            filters: [{ key: last_activity, op: missing }]
            limit: 200
          outputs: [{ port: 0, targets: [init] }]
        - { id: init, kind: pnex_function, config: { function_name: crm_init, language: starlark }, outputs: [{ port: 0, targets: [started] }] }
        - { id: started, kind: object_upsert, config: { object_type: opportunity, key: id } }
  - name: "CRM · missing criteria"
    note: "Every hour, each open opportunity gets the list of the org's active qualification criteria required up to its stage that are not valid on it (link 'is qualified on', status valid). Nothing is blocked: a stage changes by a human decision. Add the criteria first (your SPICED, MEDDPICC or own grid), then deploy."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "10 * * * *" }, outputs: [{ port: 0, targets: [crit] }] }
        - id: crit
          kind: ontology_query
          config:
            object_type: qualification_criterion
            limit: 200
            output: array
          outputs: [{ port: 0, targets: [keep] }]
        - { id: keep, kind: pnex_function, config: { function_name: crm_criteria, language: starlark }, outputs: [{ port: 0, targets: [opps] }] }
        - id: opps
          kind: ontology_query
          config:
            object_type: opportunity
            filters: [{ key: stage, op: in, value: [discovery, qualification, proposal, negotiation] }]
            limit: 200
            with_links: [qualified_on]
          outputs: [{ port: 0, targets: [missing] }]
        - { id: missing, kind: pnex_function, config: { function_name: crm_missing, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: opportunity, key: id } }
  - name: "CRM · drafts"
    note: "Every hour, up to 20 mails and network messages to do, due by tomorrow and without a draft, get one written by the organization's LLM from the step's instruction and the account. Nothing is sent: a person reads the draft, sends it and marks the activity done (flow CRM · drafts to the outbox puts the mail drafts in the outbox of a mailbox). Needs an AI provider."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "20 * * * *" }, outputs: [{ port: 0, targets: [todo] }] }
        - id: todo
          kind: ontology_query
          config:
            object_type: activity
            filters:
              - { key: kind, op: in, value: [mail, network_message] }
              - { key: state, op: eq, value: to_do }
              - { key: draft, op: missing }
              - { key: due_on, op: lte, value: "$today+1" }
            limit: 20
          outputs: [{ port: 0, targets: [prep] }]
        - { id: prep, kind: pnex_function, config: { function_name: crm_draft_prep, language: starlark }, outputs: [{ port: 0, targets: [draft] }] }
        - id: draft
          kind: llm_text
          config:
            data_field: text
            max_chars: 1500
            prompt: "Write the first draft of a short professional follow-up message of the kind given, following the instruction, for the account in the context. Plain text, at most 120 words, no subject line, no placeholder in brackets, no invented fact or figure. Write in the language of the instruction."
          outputs: [{ port: 0, targets: [keep] }]
        - { id: keep, kind: pnex_function, config: { function_name: crm_draft, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: activity, key: id } }
  - name: "CRM · drafts to the outbox"
    note: "Every hour, up to 20 mails to do that have a draft (flow CRM · drafts) are written in the outbox of the mailbox you pick (node Send mail: choose it, you must read it, it needs an SMTP server), addressed to the e-mail identifiers (identifier kind email) of the people involved in the opportunity who did not object; the opportunity is the subject. A person reads it in Mailboxes › Outbox, sends or discards it, then marks the activity done. A mailbox set to send on its own sends at once: keep it on draft unless you mean it. An activity with nobody to write to is only marked. Pick the mailbox, then deploy."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "40 * * * *" }, outputs: [{ port: 0, targets: [todo] }] }
        - id: todo
          kind: ontology_query
          config:
            object_type: activity
            filters:
              - { key: kind, op: eq, value: mail }
              - { key: state, op: eq, value: to_do }
              - { key: draft, op: exists }
              - { key: outbox_mail, op: missing }
            limit: 20
          outputs: [{ port: 0, targets: [prep] }]
        - { id: prep, kind: pnex_function, config: { function_name: crm_outbox_prep, language: starlark }, outputs: [{ port: 0, targets: [who] }] }
        - id: who
          kind: ontology_query
          config:
            object_type: activity
            filters: [{ key: ref, op: eq, value: "$msg.act.ref" }]
            traverse: [{ link_type: activity_on, direction: out }, { link_type: involved_in, direction: in }]
            limit: 20
            with_links: [uses_identifier]
            output: array
          outputs: [{ port: 0, targets: [address] }]
        - { id: address, kind: pnex_function, config: { function_name: crm_outbox_mail, language: starlark }, outputs: [{ port: 0, targets: [send] }, { port: 1, targets: [mark] }] }
        - { id: send, kind: mail_send, config: { mailbox: "" }, outputs: [{ port: 0, targets: [sent] }] }
        - { id: sent, kind: pnex_function, config: { function_name: crm_outbox_mark, language: starlark }, outputs: [{ port: 0, targets: [mark] }] }
        - { id: mark, kind: object_upsert, config: { object_type: activity, key: id } }
  - name: "CRM · mails received"
    note: "Each new mail of the mailboxes you pick (node Mail received: choose them, you must read them) becomes a done incoming activity of its correspondent and of their open opportunities (it moves their last activity) — the original sender of a forward made by a member, else the sender — found by an e-mail identifier of a person (identifier kind email, value in lower case). A sender whose authentication fails is only proposed for the link, on the To validate page. A sender no person uses, writing from an own domain (not a webmail), is proposed as an activity of the account whose website has that domain (Web presence pack), and of its open opportunities. Automatic replies, lists and the organization's own mails are left out. Pick the mailboxes, then deploy."
    graph:
      nodes:
        - { id: mail, kind: mail_received, config: { skip_automatic: true }, outputs: [{ port: 0, targets: [prep] }] }
        - { id: prep, kind: pnex_function, config: { function_name: crm_mail_prep, language: starlark }, outputs: [{ port: 0, targets: [who, known] }] }
        - id: known
          kind: ontology_query
          config:
            object_type: identifier
            filters: [{ key: value, op: eq, value: "$msg.addr" }]
            traverse: [{ link_type: uses_identifier, direction: in }]
            limit: 1
            output: array
          outputs: [{ port: 0, targets: [domain] }]
        - { id: domain, kind: pnex_function, config: { function_name: crm_mail_domain, language: starlark }, outputs: [{ port: 0, targets: [account] }] }
        - id: account
          kind: ontology_query
          config:
            object_type: website
            filters: [{ key: domain, op: eq, value: "$msg.domain" }]
            traverse: [{ link_type: has_website, direction: in }]
            limit: 3
            with_links: [opportunity_with]
          outputs: [{ port: 0, targets: [act_account] }]
        - { id: act_account, kind: pnex_function, config: { function_name: crm_mail_account, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - id: who
          kind: ontology_query
          config:
            object_type: identifier
            filters: [{ key: value, op: eq, value: "$msg.addr" }]
            traverse: [{ link_type: uses_identifier, direction: in }]
            limit: 5
            with_links: [involved_in]
          outputs: [{ port: 0, targets: [act] }]
        - { id: act, kind: pnex_function, config: { function_name: crm_mail_activity, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: activity, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [link] }] }
        - { id: link, kind: pnex_function, config: { function_name: crm_mail_link, language: starlark }, outputs: [{ port: 0, targets: [each_linked] }, { port: 1, targets: [each_proposed] }] }
        - { id: each_linked, kind: json_split, config: { keys: [], auto: false }, outputs: [{ port: 0, targets: [linked] }] }
        - { id: linked, kind: link_upsert, config: { link_type: activity_on } }
        - { id: each_proposed, kind: json_split, config: { keys: [], auto: false }, outputs: [{ port: 0, targets: [proposed] }] }
        - { id: proposed, kind: link_upsert, config: { link_type: activity_on, propose: true } }
  - name: "CRM · leads from a mailbox"
    note: "Each new mail of the mailboxes you pick (node Mail received: choose a shared box such as contact@, you must read it) from an authenticated sender no person uses as an address becomes a lead at status new, source inbound, one per address. Automatic replies, forged senders and known people make none. Nothing is answered."
    graph:
      nodes:
        - { id: mail, kind: mail_received, config: { skip_automatic: true }, outputs: [{ port: 0, targets: [prep] }] }
        - { id: prep, kind: pnex_function, config: { function_name: crm_mail_prep, language: starlark }, outputs: [{ port: 0, targets: [known] }] }
        - id: known
          kind: ontology_query
          config:
            object_type: identifier
            filters: [{ key: value, op: eq, value: "$msg.addr" }]
            traverse: [{ link_type: uses_identifier, direction: in }]
            limit: 1
            output: array
          outputs: [{ port: 0, targets: [decide] }]
        - { id: decide, kind: pnex_function, config: { function_name: crm_mail_lead, language: starlark }, outputs: [{ port: 0, targets: [lead] }] }
        - { id: lead, kind: object_upsert, config: { object_type: lead, key: ref, skip_existing: true } }
  - name: "CRM · meetings received"
    note: "Each mail of the mailboxes you pick (node Mail received: choose them, you must read them) that carries a meeting invitation becomes a meeting (Meeting, keyed by the invitation id): date, purpose, place, planned or cancelled; an update of the invitation moves the same meeting. The organizer and each attendee whose address a person uses as e-mail identifier (identifier kind email, value in lower case) take part in it; when the sender's authentication fails the participation is only proposed, on the To validate page. Unknown addresses are left out: nobody is created. Pick the mailboxes, then deploy."
    graph:
      nodes:
        - { id: mail, kind: mail_received, config: { skip_automatic: false }, outputs: [{ port: 0, targets: [prep] }] }
        - { id: prep, kind: pnex_function, config: { function_name: crm_meeting_prep, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: meeting, key: invitation_uid }, outputs: [{ port: 0, targets: [fan] }] }
        - { id: fan, kind: pnex_function, config: { function_name: crm_meeting_participants, language: starlark }, outputs: [{ port: 0, targets: [each] }] }
        - { id: each, kind: json_split, config: { keys: [], auto: false }, outputs: [{ port: 0, targets: [who] }] }
        - id: who
          kind: ontology_query
          config:
            object_type: identifier
            filters: [{ key: value, op: eq, value: "$msg.payload.address" }]
            traverse: [{ link_type: uses_identifier, direction: in }]
            limit: 1
          outputs: [{ port: 0, targets: [link] }]
        - { id: link, kind: pnex_function, config: { function_name: crm_meeting_link, language: starlark }, outputs: [{ port: 0, targets: [linked] }, { port: 1, targets: [proposed] }] }
        - { id: linked, kind: link_upsert, config: { link_type: takes_part_in } }
        - { id: proposed, kind: link_upsert, config: { link_type: takes_part_in, propose: true } }
  - name: "CRM · my day"
    note: "Each morning one digest (payload.text, payload.count) of the activities due today or late, of the open opportunities with no activity for 14 days (edit $today-14 to change the delay) and of the new leads. Add a JSON Split node on the digest port with the keys trigger and text, then your Notification node (a template with a 'text' variable): the split's trigger port on its trigger row, its text port on its text row. Wired straight to the digest port, the trigger reads no boolean and nothing is sent. Then deploy."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 7 * * *" }, outputs: [{ port: 0, targets: [due] }] }
        - id: due
          kind: ontology_query
          config:
            object_type: activity
            filters: [{ key: state, op: eq, value: to_do }, { key: due_on, op: lte, value: "$today" }]
            limit: 200
            output: array
          outputs: [{ port: 0, targets: [keep] }]
        - { id: keep, kind: pnex_function, config: { function_name: crm_day_due, language: starlark }, outputs: [{ port: 0, targets: [dormant] }] }
        - id: dormant
          kind: ontology_query
          config:
            object_type: opportunity
            filters:
              - { key: stage, op: in, value: [discovery, qualification, proposal, negotiation] }
              - { key: last_activity, op: lt, value: "$today-14" }
            limit: 200
            output: array
          outputs: [{ port: 0, targets: [keep_dormant] }]
        - { id: keep_dormant, kind: pnex_function, config: { function_name: crm_day_dormant, language: starlark }, outputs: [{ port: 0, targets: [leads] }] }
        - id: leads
          kind: ontology_query
          config:
            object_type: lead
            filters: [{ key: status, op: eq, value: new }]
            limit: 200
            output: array
          outputs: [{ port: 0, targets: [digest] }]
        - { id: digest, kind: pnex_function, config: { function_name: crm_day, language: starlark } }
  - name: "CRM · convert a lead"
    note: "Convert on a lead (Lead page: pick its account, optionally its contact and the opportunity's name) makes an opportunity at stage discovery with the lead's source, linked to the account, coming from the lead, with the contact involved; the lead gets the account and contact and becomes converted. Converting twice keeps the same opportunity. Deploy it to enable the action."
    graph:
      nodes:
        - { id: act, kind: action_trigger, config: { object_type: lead, action: convert }, outputs: [{ port: 0, targets: [params] }] }
        - { id: params, kind: pnex_function, config: { function_name: crm_lead_params, language: starlark }, outputs: [{ port: 0, targets: [lead] }] }
        - id: lead
          kind: ontology_query
          config: { object_type: lead, filters: [{ key: id, op: eq, value: "$msg.object.id" }], limit: 1, with_links: [met_at, from_list] }
          outputs: [{ port: 0, targets: [convert] }]
        - { id: convert, kind: pnex_function, config: { function_name: crm_lead_convert, language: starlark }, outputs: [{ port: 0, targets: [opp] }] }
        - { id: opp, kind: object_upsert, config: { object_type: opportunity, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [links] }] }
        - { id: links, kind: pnex_function, config: { function_name: crm_lead_links, language: starlark }, outputs: [{ port: 0, targets: [l_account] }, { port: 1, targets: [l_origin] }, { port: 2, targets: [l_lead] }, { port: 3, targets: [l_contact] }, { port: 4, targets: [l_involved] }, { port: 5, targets: [converted] }, { port: 6, targets: [l_show] }] }
        - { id: l_show, kind: link_upsert, config: { link_type: met_at } }
        - { id: l_account, kind: link_upsert, config: { link_type: opportunity_with } }
        - { id: l_origin, kind: link_upsert, config: { link_type: comes_from } }
        - { id: l_lead, kind: link_upsert, config: { link_type: lead_of } }
        - { id: l_contact, kind: link_upsert, config: { link_type: lead_contact } }
        - { id: l_involved, kind: link_upsert, config: { link_type: involved_in } }
        - { id: converted, kind: object_upsert, config: { object_type: lead, key: id } }
  - name: "CRM · leads from trade show lists"
    note: "Every 15 minutes, the contacts of the list a trade show names (its property List to turn into leads, the name in the column list of the file) become leads at status new, up to 100 per show and per run, linked to the show. A contact whose address belongs to a person who objected makes no lead. Nothing is sent; the account is picked at conversion, and the opportunity then counts in the show's figures."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "*/15 * * * *" }, outputs: [{ port: 0, targets: [shows] }] }
        - id: shows
          kind: ontology_query
          config:
            object_type: trade_show
            filters: [{ key: list, op: exists }]
            limit: 200
          outputs: [{ port: 0, targets: [show] }]
        - { id: show, kind: pnex_function, config: { function_name: crm_list_show, language: starlark }, outputs: [{ port: 0, targets: [contacts] }] }
        - id: contacts
          kind: ontology_query
          config:
            object_type: list_contact
            filters: [{ key: list, op: eq, value: "$msg.payload.list" }, { key: lead_state, op: missing }]
            limit: 100
          outputs: [{ port: 0, targets: [ask] }]
        - { id: ask, kind: pnex_function, config: { function_name: crm_list_ask, language: starlark }, outputs: [{ port: 0, targets: [known] }] }
        - id: known
          kind: ontology_query
          config:
            object_type: identifier
            filters: [{ key: value, op: eq, value: "$msg.payload.email" }]
            limit: 20
            output: array
            with_links: [uses_identifier]
          outputs: [{ port: 0, targets: [decide] }]
        - { id: decide, kind: pnex_function, config: { function_name: crm_list_lead, language: starlark }, outputs: [{ port: 0, targets: [lead] }, { port: 1, targets: [mark] }] }
        - { id: lead, kind: object_upsert, config: { object_type: lead, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [links] }] }
        - { id: links, kind: pnex_function, config: { function_name: crm_list_links, language: starlark }, outputs: [{ port: 0, targets: [l_show] }, { port: 1, targets: [mark] }] }
        - { id: l_show, kind: link_upsert, config: { link_type: from_list } }
        - { id: mark, kind: object_upsert, config: { object_type: list_contact, key: id } }
  - name: "CRM · quotes and invoices due"
    note: "Each morning a sent quote past its validity date becomes expired, and an issued or partly paid invoice past its due date becomes overdue with a reminder task due today on the opportunity or account it invoices (link 'is an invoice for'); the reminder appears in My day. Invoices are issued by your billing tool: enter their number, amounts and due date here (by hand or through an import), then deploy."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "30 6 * * *" }, outputs: [{ port: 0, targets: [quotes, invoices] }] }
        - id: quotes
          kind: ontology_query
          config:
            object_type: quote
            filters: [{ key: state, op: eq, value: sent }, { key: valid_until, op: lt, value: "$today" }]
            limit: 200
          outputs: [{ port: 0, targets: [expired] }]
        - { id: expired, kind: pnex_function, config: { function_name: crm_quote_expired, language: starlark }, outputs: [{ port: 0, targets: [mark_quote] }] }
        - { id: mark_quote, kind: object_upsert, config: { object_type: quote, key: id } }
        - id: invoices
          kind: ontology_query
          config:
            object_type: invoice
            filters: [{ key: state, op: in, value: [issued, partially_paid] }, { key: due_on, op: lt, value: "$today" }]
            limit: 200
            with_links: [invoice_for]
          outputs: [{ port: 0, targets: [overdue] }]
        - { id: overdue, kind: pnex_function, config: { function_name: crm_invoice_overdue, language: starlark }, outputs: [{ port: 0, targets: [mark_invoice] }, { port: 1, targets: [reminder] }] }
        - { id: mark_invoice, kind: object_upsert, config: { object_type: invoice, key: id } }
        - { id: reminder, kind: object_upsert, config: { object_type: activity, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [about] }] }
        - { id: about, kind: pnex_function, config: { function_name: crm_about, language: starlark }, outputs: [{ port: 0, targets: [each] }] }
        - { id: each, kind: json_split, config: { keys: [], auto: false }, outputs: [{ port: 0, targets: [linked] }] }
        - { id: linked, kind: link_upsert, config: { link_type: activity_on } }
page_templates:
  - key: opportunity_sheet
    name: Opportunity sheet
    names: {fr: "Fiche opportunité"}
    description: The opportunity as of today, its account, stage, people involved, qualification, activities and meetings, then the next steps.
    descriptions: {fr: "L'opportunité au jour dit : compte, étape, personnes impliquées, qualification, activités et rendez-vous, puis les prochaines étapes."}
    subject: opportunity
    link: sheet_of
    body: |
      # Opportunity — {{title}}

      Sheet of {{today}}.

      ## At a glance

      - Stage: {{prop:stage}} · amount: {{prop:amount}} · probability: {{prop:probability}} %
      - Expected close: {{prop:expected_close}} · source: {{prop:source}} {{prop:source_detail}}
      - Last activity: {{prop:last_activity}}

      ## Account

      {{links:opportunity_with}}

      ## People involved

      {{links:involved_in:in}}

      ## Owned by

      {{links:owned_by}}

      ## Qualification

      {{links:qualified_on}}

      Missing criteria:

      {{prop:missing_criteria}}

      ## Activities

      {{links:activity_on:in}}

      ## Meetings

      {{links:meeting_for:in}}

      ## Next steps

      - To fill in
    bodies:
      fr: |
        # Opportunité — {{title}}

        Fiche du {{today}}.

        ## En bref

        - Étape : {{prop:stage}} · montant : {{prop:amount}} · probabilité : {{prop:probability}} %
        - Clôture prévue : {{prop:expected_close}} · source : {{prop:source}} {{prop:source_detail}}
        - Dernière activité : {{prop:last_activity}}

        ## Compte

        {{links:opportunity_with}}

        ## Personnes impliquées

        {{links:involved_in:in}}

        ## Portée par

        {{links:owned_by}}

        ## Qualification

        {{links:qualified_on}}

        Critères manquants :

        {{prop:missing_criteria}}

        ## Activités

        {{links:activity_on:in}}

        ## Rendez-vous

        {{links:meeting_for:in}}

        ## Prochaines étapes

        - À compléter
  - key: quote_sheet
    name: Quote
    names: {fr: "Devis"}
    description: The quote as a document to complete and export as PDF, from its number, amount, dates and opportunity.
    descriptions: {fr: "Le devis en document à compléter et exporter en PDF, depuis son numéro, son montant, ses dates et son opportunité."}
    subject: quote
    link: sheet_of
    body: |
      # Quote {{prop:ref}} — {{title}}

      Issued on {{prop:issued_on}} · valid until {{prop:valid_until}}.

      ## For

      {{links:quote_for}}

      ## Lines

      {{prop:content}}

      | Item | Quantity | Unit price excl. tax | Total excl. tax |
      |---|---|---|---|
      | To fill in | | | |

      Total excl. tax: {{prop:amount}}

      ## Terms

      - To fill in: payment terms, VAT, your legal mentions
    bodies:
      fr: |
        # Devis {{prop:ref}} — {{title}}

        Émis le {{prop:issued_on}} · valable jusqu'au {{prop:valid_until}}.

        ## Pour

        {{links:quote_for}}

        ## Lignes

        {{prop:content}}

        | Désignation | Quantité | Prix unitaire HT | Total HT |
        |---|---|---|---|
        | À compléter | | | |

        Total HT : {{prop:amount}}

        ## Conditions

        - À compléter : conditions de paiement, TVA, vos mentions légales
