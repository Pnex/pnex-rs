# Business pack "Sales follow-up" (crm.md D448–D452): the opportunities of
# an account, who takes part in them, what was done and what is left to do,
# in the same graph as the account map (`prospection_b2b`). The pack gives
# the shape, the org gives the playbook: stages are stable keys the org
# relabels (D370), qualification criteria and follow-up plans are objects
# of the org, the pack ships none.
# An opportunity moves through its stages by a human decision; a flow only
# writes what is missing (`missing_criteria`): the criteria required up to
# the current stage that are not `valid` on a `qualified_on` link.
# Activities are done by people. The follow-up plan (`follow_up_step`: day,
# kind, instruction) becomes one activity to do per step when an
# opportunity enters `qualification`, unless every person involved objected
# (`opposition_le`). Mails and network messages due by tomorrow get a draft
# written by the org's LLM; nothing is ever sent by the platform: a person
# reads it, sends it and marks the activity done.
# Mails received (mail.md D462): the flow model files each new mail of
# the mailboxes you pick as a done incoming activity of its correspondent
# (the original sender of a trusted forward, else the sender), found by an
# e-mail identifier of a person, else proposed under the account whose
# website has the sender's domain (never a webmail). A mail whose authentication fails is only
# proposed for linking; automatic mails and the org's own are left out.
# Meetings received (D484): a mail carrying a meeting invitation becomes a
# `meeting` keyed by its iCalendar UID (an update moves it, a
# cancellation marks it cancelled), and each organizer or attendee whose
# address a person uses as e-mail identifier takes part in it; proposed
# only when the sender is not authenticated. Nobody is created.
# The morning digest lists the activities due and the open opportunities
# with no activity for 14 days (edit `$today-14` in the flow): add the org's
# notification node on its first port, then deploy.
key: crm
name: Sales follow-up
names: {fr: "Suivi commercial"}
version: "1.6.0"
requires: [prospection_b2b]
description: "Opportunities of an account, their stages and qualification, the people involved, activities and follow-up plans, a morning digest. Questions: which opportunities had no activity for two weeks? What is due today? Which criteria are missing on this opportunity?"
descriptions: {fr: "Les opportunités d'un compte, leurs étapes et leur qualification, les personnes impliquées, les activités et les plans de relance, un digest du matin. Questions : quelles opportunités n'ont eu aucune activité depuis deux semaines ? Qu'y a-t-il à faire aujourd'hui ? Quels critères manquent sur cette opportunité ?"}
