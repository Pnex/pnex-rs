        required: true
      - { key: instruction, name: Instruction, names: {fr: "Consigne"}, kind: text, max_len: 2000 }
      - { key: active, name: Active, names: {fr: "Actif"}, kind: bool }
  - key: activity
    name: Activity
    names: {fr: "Activité"}
    icon: book
    properties:
      - { key: ref, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, required: true, unique: true }
      - key: kind
        name: Kind
        names: {fr: "Nature"}
        kind: enum
        values: [call, mail, meeting, network_message, note, task]
        labels: {call: {fr: "Appel", en: "Call"}, mail: {fr: "Mail", en: "Mail"}, meeting: {fr: "Rendez-vous", en: "Meeting"}, network_message: {fr: "Message réseau", en: "Network message"}, note: {fr: "Note", en: "Note"}, task: {fr: "Tâche", en: "Task"}}
