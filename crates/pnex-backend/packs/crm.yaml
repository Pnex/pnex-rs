# Business pack "Sales follow-up" (crm.md D448–D452): the opportunities of
# an account, who takes part in them, what was done and what is left to do,
# in the same graph as the account map (`prospecting_b2b`). The pack gives
# the shape, the org gives the playbook: stages are stable keys the org
# relabels (D370), qualification criteria and follow-up plans are objects
# of the org, the pack ships none.
# An opportunity moves through its stages by a human decision; a flow only
# writes what is missing (`missing_criteria`): the criteria required up to
# the current stage that are not `valid` on a `qualified_on` link.
# Activities are done by people. The follow-up plan (`follow_up_step`: day,
# kind, instruction) becomes one activity to do per step when an
# opportunity enters `qualification`, unless every person involved objected
# (`opposed_on`). Mails and network messages due by tomorrow get a draft
# written by the org's LLM; nothing is ever sent by the platform: a person
# reads it, sends it and marks the activity done.
# Mails received (mail.md D462): the flow model files each new mail of
# the mailboxes you pick as a done incoming activity of its correspondent
# (the original sender of a trusted forward, else the sender), found by an
# e-mail identifier of a person, else proposed under the account whose
# website has the sender's domain (never a webmail). A mail whose authentication fails is only
# proposed for linking; automatic mails and the org's own are left out.
# Meetings received (D484): a mail carrying a meeting invitation becomes a
# `meeting` keyed by its iCalendar UID (an update moves it, a
# cancellation marks it cancelled), and each organizer or attendee whose
# address a person uses as e-mail identifier takes part in it; proposed
# only when the sender is not authenticated. Nobody is created.
# The morning digest lists the activities due and the open opportunities
# with no activity for 14 days (edit `$today-14` in the flow): add the org's
# notification node on its first port, then deploy.
# Since 2.0.0 every identifier is English (breaking).
# Since 3.0.0 the `personal` classification value is English (breaking).
# Since 3.1.0 (crm.md D514–D517): leads, converted into an opportunity of
# an account by the `convert` action; quotes and invoices followed on the
# opportunity. Invoices are issued by the org's billing tool: PneX keeps
# their number, amounts and dates, marks the overdue ones and plans a
# reminder activity; an expired quote is marked. The morning digest lists
# the new leads too.
# Since 3.4.0 (crm.md D590): a trade show naming a list turns the list's
# contacts into leads, linked by `from_list`: being on a list is not having
# been met, and it keeps `met_at`, which the show's figures read, for those met.
# Since 3.2.0 (app-builder.md D513): the application "Sales follow-up", its
# screens ready to use: stages, leads, activities to do, quotes and invoices.
key: crm
name: Sales follow-up
names: {fr: "Suivi commercial"}
version: "3.4.0"
requires: [prospecting_b2b]
description: "Opportunities of an account, their stages and qualification, the people involved, activities and follow-up plans, a morning digest. Questions: which opportunities had no activity for two weeks? What is due today? Which criteria are missing on this opportunity?"
descriptions: {fr: "Les opportunités d'un compte, leurs étapes et leur qualification, les personnes impliquées, les activités et les plans de relance, un digest du matin. Questions : quelles opportunités n'ont eu aucune activité depuis deux semaines ? Qu'y a-t-il à faire aujourd'hui ? Quels critères manquent sur cette opportunité ?"}
extends:
  - type: list_contact
    properties:
      - key: lead_state
        name: Lead
        names: {fr: "Piste"}
        kind: enum
        values: [created, objected]
        labels: {created: {fr: "Créée", en: "Created"}, objected: {fr: "Opposition", en: "Objected"}}
        indexed: true
link_types:
  - key: opportunity_with
    name: is an opportunity with
    names: {fr: "est une opportunité avec"}
    inverse_name: has as opportunity
    inverse_names: {fr: "a pour opportunité"}
    from_types: [opportunity]
    to_types: [organization]
    one_target: true
  - key: involved_in
    name: is involved in
    names: {fr: "est impliqué dans"}
    inverse_name: involves
    inverse_names: {fr: "implique"}
    from_types: [person]
    to_types: [opportunity]
    attributes:
      - key: role
        name: Role
        names: {fr: "Rôle"}
        kind: enum
        values: [decision_maker, champion, sponsor, influencer, buyer, user, technical, other]
        labels: {decision_maker: {fr: "Décideur", en: "Decision maker"}, champion: {fr: "Champion", en: "Champion"}, sponsor: {fr: "Sponsor", en: "Sponsor"}, influencer: {fr: "Prescripteur", en: "Influencer"}, buyer: {fr: "Acheteur", en: "Buyer"}, user: {fr: "Utilisateur", en: "User"}, technical: {fr: "Technique", en: "Technical"}, other: {fr: "Autre", en: "Other"}}
        classification: personal
  - key: owned_by
    name: is carried by
    names: {fr: "est portée par"}
    inverse_name: carries
    inverse_names: {fr: "porte"}
    from_types: [opportunity, lead]
    to_types: [person]
    one_target: true
  - key: comes_from
    name: comes from
    names: {fr: "est issue de"}
    inverse_name: led to
    inverse_names: {fr: "a donné"}
    from_types: [opportunity]
    to_types: [sales_signal, meeting, lead]
  - key: meeting_for
    name: is a meeting for
    names: {fr: "est un rendez-vous pour"}
    inverse_name: has as meeting
    inverse_names: {fr: "a pour rendez-vous"}
    from_types: [meeting]
    to_types: [opportunity]
  - key: qualified_on
    name: is qualified on
    names: {fr: "est qualifiée sur"}
    inverse_name: qualifies
    inverse_names: {fr: "qualifie"}
    from_types: [opportunity]
    to_types: [qualification_criterion]
    attributes:
      - key: status
        name: Status
        names: {fr: "Statut"}
        kind: enum
        values: [unknown, partial, valid]
        labels: {unknown: {fr: "Inconnu", en: "Unknown"}, partial: {fr: "Partiel", en: "Partial"}, valid: {fr: "Validé", en: "Valid"}}
        colors: { unknown: gray, partial: amber, valid: green }
      - { key: note, name: Note, names: {fr: "Note"}, kind: text, max_len: 2000 }
  - key: activity_on
    name: is an activity on
    names: {fr: "est une activité sur"}
    inverse_name: has as activity
    inverse_names: {fr: "a pour activité"}
    from_types: [activity]
    to_types: [opportunity, organization, person, lead]
  - key: sheet_of
    name: is the sheet of
    names: {fr: "est la fiche de"}
    inverse_name: has as sheet
    inverse_names: {fr: "a pour fiche"}
    from_types: [doc]
    to_types: [opportunity, quote]
  - key: lead_of
    name: is a lead of
    names: {fr: "est une piste de"}
    inverse_name: has as lead
    inverse_names: {fr: "a pour piste"}
    from_types: [lead]
    to_types: [organization]
    one_target: true
  - key: lead_contact
    name: has as contact
    names: {fr: "a pour contact"}
    inverse_name: is the contact of
    inverse_names: {fr: "est le contact de"}
    from_types: [lead]
    to_types: [person]
    one_target: true
  - key: quote_for
    name: is a quote for
    names: {fr: "est un devis pour"}
    inverse_name: has as quote
    inverse_names: {fr: "a pour devis"}
    from_types: [quote]
    to_types: [opportunity]
    one_target: true
  - key: invoice_for
    name: is an invoice for
    names: {fr: "est une facture pour"}
    inverse_name: has as invoice
    inverse_names: {fr: "a pour facture"}
    from_types: [invoice]
    to_types: [opportunity, organization]
  - key: invoices_quote
    name: invoices
    names: {fr: "facture"}
    inverse_name: is invoiced by
    inverse_names: {fr: "est facturé par"}
    from_types: [invoice]
    to_types: [quote]
  - key: met_at
    name: was met at
    names: {fr: "rencontrée à"}
    inverse_name: brought
    inverse_names: {fr: "a apporté"}
    from_types: [opportunity, lead]
    to_types: [trade_show]
    one_target: true
  - key: from_list
    name: is on the list of
    names: {fr: "figure sur la liste de"}
    inverse_name: lists
    inverse_names: {fr: "liste"}
    from_types: [lead]
    to_types: [trade_show]
    one_target: true
  - key: from_step
    name: comes from the step
    names: {fr: "vient de l'étape"}
    inverse_name: produced
    inverse_names: {fr: "a produit"}
    from_types: [activity]
    to_types: [follow_up_step]
    one_target: true
apps:
  - key: sales_follow_up
    name: Sales follow-up
    names: {fr: "Suivi commercial"}
    description: Opportunities, leads, activities to do, quotes and invoices.
    scope:
      types: [opportunity, lead, activity, quote, invoice, trade_show]
    actions: [lead.convert]
    home: pipeline
    variables:
      - {name: opportunity, kind: object, type_key: opportunity}
      - {name: lead, kind: object, type_key: lead}
    object_sets:
      open_opportunities:
        query:
          type_key: opportunity
          filters: [{key: stage, op: in, value: [discovery, qualification, proposal, negotiation]}]
          order_by: expected_close
      all_opportunities: {query: {type_key: opportunity}}
      won_opportunities: {query: {type_key: opportunity, filters: [{key: stage, op: eq, value: won}]}}
      overdue_activities:
        query:
          type_key: activity
          filters: [{key: state, op: eq, value: to_do}, {key: due_on, op: lt, value: "$today"}]
      follow_ups_done:
        query:
          type_key: activity
          filters: [{key: state, op: eq, value: done}, {key: direction, op: eq, value: outbound}]
      trade_shows: {query: {type_key: trade_show, order_by: start_on, descending: true}}
      all_leads: {query: {type_key: lead}}
      new_leads:
        query:
          type_key: lead
          filters: [{key: status, op: in, value: [new, contacted, qualified]}]
          order_by: received_on
          descending: true
      activities_to_do:
        query:
          type_key: activity
          filters: [{key: state, op: eq, value: to_do}]
          order_by: due_on
      quotes_sent:
        query:
          type_key: quote
          filters: [{key: state, op: eq, value: sent}]
          order_by: valid_until
      invoices_due:
        query:
          type_key: invoice
          filters: [{key: state, op: in, value: [issued, partially_paid, overdue]}]
          order_by: due_on
    screens:
      - key: pipeline
        name: Pipeline
        names: {fr: "Pipeline"}
        layout:
          canvas: {width: 1600, height: 900}
          widgets:
            - id: c1
              type: stat
              x: 16
              y: 16
              w: 250
              h: 130
              options: {decimals: 0, app: {titles: {fr: "Opportunités ouvertes", en: "Open opportunities"}}}
              source: [{metric: "", device_id: "", window: 1h, objects: {object_set: open_opportunities, metrics: [{key: n, op: count}], show: n}}]
            - id: c2
              type: stat
              x: 280
              y: 16
              w: 420
              h: 130
              options: {decimals: 0, app: {titles: {fr: "Montant ouvert", en: "Open amount"}}}
              source: [{metric: "", device_id: "", window: 1h, objects: {object_set: open_opportunities, metrics: [{key: total, op: sum, property: amount}], show: total}}]
            - id: c3
              type: stat
              x: 714
              y: 16
              w: 250
              h: 130
              options: {decimals: 0, app: {titles: {fr: "Activités en retard", en: "Overdue activities"}}}
              source: [{metric: "", device_id: "", window: 1h, objects: {object_set: overdue_activities, metrics: [{key: n, op: count}], show: n}}]
            - {id: t1, type: object_table, x: 16, y: 164, w: 1048, h: 720, options: {app: {object_set: open_opportunities, columns: [title, stage, amount, expected_close, last_activity, missing_criteria], variable: opportunity, screen: opportunity, titles: {fr: "Opportunités ouvertes", en: "Open opportunities"}}}}
            - id: b1
              type: range_bars
              x: 1080
              y: 16
              w: 504
              h: 428
              options: {decimals: 0, app: {titles: {fr: "Opportunités par étape", en: "Opportunities by stage"}}}
              source: [{metric: "", device_id: "", window: 1h, objects: {object_set: open_opportunities, group_by: [{property: stage}], metrics: [{key: n, op: count}], show: n}}]
            - id: b2
              type: range_bars
              x: 1080
              y: 456
              w: 504
              h: 428
              options: {decimals: 0, app: {titles: {fr: "Montant par étape", en: "Amount by stage"}}}
              source: [{metric: "", device_id: "", window: 1h, objects: {object_set: open_opportunities, group_by: [{property: stage}], metrics: [{key: total, op: sum, property: amount}], show: total}}]
      - key: figures
        name: Figures
        names: {fr: "Chiffres"}
        layout:
          canvas: {width: 1600, height: 900}
          widgets:
            - id: f1
              type: range_bars
              x: 16
              y: 16
              w: 776
              h: 428
              options: {decimals: 0, app: {titles: {fr: "CA gagné par salon", en: "Won amount by trade show"}}}
              source: [{metric: "", device_id: "", window: 1h, objects: {object_set: won_opportunities, group_by: [{hops: [{link_type: met_at, direction: out}]}], metrics: [{key: total, op: sum, property: amount}], show: total}}]
            - id: f2
              type: range_bars
              x: 808
              y: 16
              w: 776
              h: 428
              options: {decimals: 0, unit: "%", app: {titles: {fr: "Taux de conversion par salon", en: "Conversion rate by trade show"}}}
              source: [{metric: "", device_id: "", window: 1h, objects: {object_set: all_opportunities, group_by: [{hops: [{link_type: met_at, direction: out}]}], metrics: [{key: won, op: count, where: {key: stage, op: eq, value: won}}, {key: all, op: count}, {key: rate, ratio: [won, all], percent: true}], show: rate}}]
            - id: f3
              type: range_bars
              x: 16
              y: 456
              w: 776
              h: 428
              options: {decimals: 0, app: {titles: {fr: "Activités en retard par commercial", en: "Overdue activities by owner"}}}
              source: [{metric: "", device_id: "", window: 1h, objects: {object_set: overdue_activities, group_by: [{hops: [{link_type: activity_on, direction: out}, {link_type: owned_by, direction: out}]}], metrics: [{key: n, op: count}], show: n}}]
            - id: f4
              type: range_bars
              x: 808
              y: 456
              w: 776
              h: 428
              options: {decimals: 0, unit: "%", app: {titles: {fr: "Taux de réponse par étape de relance", en: "Reply rate by follow-up step"}}}
              source: [{metric: "", device_id: "", window: 1h, objects: {object_set: follow_ups_done, group_by: [{hops: [{link_type: from_step, direction: out}]}], metrics: [{key: replied, op: count, where: {key: replied, op: eq, value: true}}, {key: all, op: count}, {key: rate, ratio: [replied, all], percent: true}], show: rate}}]
      - key: shows
        name: Trade shows
        names: {fr: "Salons"}
        layout:
          canvas: {width: 1600, height: 900}
          widgets:
            - {id: t1, type: object_table, x: 16, y: 16, w: 1400, h: 560, options: {app: {object_set: trade_shows, columns: [title, start_on, list, cost, opportunities, won, conversion, won_amount, roi], titles: {fr: "Salons", en: "Trade shows"}}}}
            - {id: n1, type: object_form, x: 1432, y: 16, w: 152, h: 100, options: {app: {object_type: trade_show}}}
            - id: l1
              type: range_bars
              title: Leads from lists
              x: 16
              y: 592
              w: 1400
              h: 292
              options: {app: {titles: {fr: "Pistes issues des listes", en: "Leads from lists"}}}
              source: [{metric: "", device_id: "", window: 1h, objects: {object_set: all_leads, group_by: [{hops: [{link_type: from_list, direction: out}]}], metrics: [{key: leads, op: count}], show: leads}}]
      - key: opportunity
        name: Opportunity
        names: {fr: "Opportunité"}
        layout:
          canvas: {width: 1600, height: 900}
          widgets:
            - {id: f1, type: object_fields, x: 16, y: 16, w: 1100, h: 620, options: {app: {variable: opportunity, columns: [stage, amount, probability, expected_close, source, source_detail, last_activity, missing_criteria, loss_reason]}}}
            - {id: e1, type: object_form, x: 1132, y: 16, w: 240, h: 100, options: {app: {object_type: opportunity, variable: opportunity}}}
      - key: leads
        name: Leads
        names: {fr: "Pistes"}
        layout:
          canvas: {width: 1600, height: 900}
          widgets:
            - {id: t1, type: object_table, x: 16, y: 16, w: 1000, h: 868, options: {app: {object_set: new_leads, columns: [title, status, company, source, received_on], variable: lead, titles: {fr: "Pistes à traiter", en: "Leads to handle"}}}}
            - {id: f1, type: object_fields, x: 1032, y: 16, w: 552, h: 620, options: {app: {variable: lead, columns: [status, company, contact_name, email, phone, source, source_detail, received_on, message]}}}
            - {id: n1, type: object_form, x: 1032, y: 652, w: 150, h: 100, options: {app: {object_type: lead}}}
            - {id: e1, type: object_form, x: 1192, y: 652, w: 150, h: 100, options: {app: {object_type: lead, variable: lead}}}
            - {id: a1, type: action_button, x: 1352, y: 652, w: 232, h: 100, options: {app: {variable: lead, action: lead.convert}}}
      - key: activities
        name: Activities
        names: {fr: "Activités"}
        layout:
          canvas: {width: 1600, height: 900}
          widgets:
            - {id: t1, type: object_table, x: 16, y: 16, w: 1568, h: 868, options: {app: {object_set: activities_to_do, columns: [title, kind, due_on, reported, context], titles: {fr: "Activités à faire", en: "Activities to do"}}}}
      - key: billing
        name: Quotes and invoices
        names: {fr: "Devis et factures"}
        layout:
          canvas: {width: 1600, height: 900}
          widgets:
            - {id: t1, type: object_table, x: 16, y: 16, w: 776, h: 868, options: {app: {object_set: quotes_sent, columns: [title, ref, amount, valid_until], titles: {fr: "Devis envoyés", en: "Quotes sent"}}}}
            - {id: t2, type: object_table, x: 808, y: 16, w: 776, h: 868, options: {app: {object_set: invoices_due, columns: [title, ref, state, amount, paid_amount, due_on], titles: {fr: "Factures à encaisser", en: "Invoices to collect"}}}}
hierarchies:
  # From an account, its opportunities; the band counts them by stage.
  - key: opportunities
    name: Opportunities
    names: {fr: "Opportunités"}
    steps:
      - { link: opportunity_with, inverse: true }
types:
  - key: opportunity
    name: Opportunity
    names: {fr: "Opportunité"}
    icon: flag
    properties:
      - key: stage
        name: Stage
        names: {fr: "Étape"}
        kind: enum
        values: [discovery, qualification, proposal, negotiation, won, lost]
        labels: {discovery: {fr: "Découverte", en: "Discovery"}, qualification: {fr: "Qualification", en: "Qualification"}, proposal: {fr: "Proposition", en: "Proposal"}, negotiation: {fr: "Négociation", en: "Negotiation"}, won: {fr: "Gagnée", en: "Won"}, lost: {fr: "Perdue", en: "Lost"}}
        colors: { discovery: gray, qualification: blue, proposal: violet, negotiation: amber, won: green, lost: red }
        required: true
        indexed: true
      - { key: amount, name: Amount, names: {fr: "Montant"}, kind: money }
      - { key: probability, name: Probability (%), names: {fr: "Probabilité (%)"}, kind: number, min: 0, max: 100 }
      - { key: expected_close, name: Expected close, names: {fr: "Clôture prévue"}, kind: date, indexed: true }
      - key: source
        name: Source
        names: {fr: "Source"}
        kind: enum
        values: [trade_show, buying_group, inbound, outbound, referral, network, other]
        labels: {trade_show: {fr: "Salon", en: "Trade show"}, buying_group: {fr: "Groupement", en: "Buying group"}, inbound: {fr: "Entrant", en: "Inbound"}, outbound: {fr: "Sortant", en: "Outbound"}, referral: {fr: "Recommandation", en: "Referral"}, network: {fr: "Réseau", en: "Network"}, other: {fr: "Autre", en: "Other"}}
        indexed: true
      - { key: source_detail, name: Source detail, names: {fr: "Détail de la source"}, kind: text, max_len: 255 }
      - { key: loss_reason, name: Reason lost, names: {fr: "Motif de perte"}, kind: text, max_len: 1000 }
      - { key: last_activity, name: Last activity, names: {fr: "Dernière activité"}, kind: date_time, indexed: true }
      - { key: missing_criteria, name: Missing criteria, names: {fr: "Critères manquants"}, kind: text, max_len: 2000 }
      - { key: follow_up_started_on, name: Follow-up started on, names: {fr: "Relances lancées le"}, kind: date, indexed: true }
      # Written by the convert flow (`lead:<lead id>`): a second convert finds it.
      - { key: ref, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, unique: true }
  - key: lead
    name: Lead
    names: {fr: "Piste"}
    icon: user
    # The title usually names the contact.
    title_classification: personal
    properties:
      - { key: ref, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, unique: true }
      - key: status
        name: Status
        names: {fr: "Statut"}
        kind: enum
        values: [new, contacted, qualified, disqualified, converted]
        labels: {new: {fr: "Nouvelle", en: "New"}, contacted: {fr: "Contactée", en: "Contacted"}, qualified: {fr: "Qualifiée", en: "Qualified"}, disqualified: {fr: "Écartée", en: "Disqualified"}, converted: {fr: "Convertie", en: "Converted"}}
        colors: { new: blue, contacted: amber, qualified: violet, disqualified: gray, converted: green }
        required: true
        indexed: true
      - key: source
        name: Source
        names: {fr: "Source"}
        kind: enum
        values: [trade_show, buying_group, inbound, outbound, referral, network, other]
        labels: {trade_show: {fr: "Salon", en: "Trade show"}, buying_group: {fr: "Groupement", en: "Buying group"}, inbound: {fr: "Entrant", en: "Inbound"}, outbound: {fr: "Sortant", en: "Outbound"}, referral: {fr: "Recommandation", en: "Referral"}, network: {fr: "Réseau", en: "Network"}, other: {fr: "Autre", en: "Other"}}
        indexed: true
      - { key: source_detail, name: Source detail, names: {fr: "Détail de la source"}, kind: text, max_len: 255 }
      - { key: company, name: Company, names: {fr: "Société"}, kind: text, max_len: 255 }
      - { key: contact_name, name: Contact, names: {fr: "Contact"}, kind: text, max_len: 255, classification: personal }
      - { key: email, name: E-mail, names: {fr: "E-mail"}, kind: text, max_len: 255, classification: personal }
      - { key: phone, name: Phone, names: {fr: "Téléphone"}, kind: text, max_len: 64, classification: personal }
      - { key: message, name: Message, names: {fr: "Message"}, kind: text, max_len: 4000, classification: personal }
      - { key: received_on, name: Received on, names: {fr: "Reçue le"}, kind: date, indexed: true }
      - { key: disqualify_reason, name: Reason disqualified, names: {fr: "Motif d'écart"}, kind: text, max_len: 1000 }
    actions:
      - key: convert
        name: Convert to opportunity
        names: {fr: "Convertir en opportunité"}
        confirm: true
        params:
          - { key: organization, name: Account, names: {fr: "Compte"}, kind: ref, to_type: organization, required: true }
          - { key: person, name: Contact, names: {fr: "Contact"}, kind: ref, to_type: person }
          - { key: name, name: Opportunity name, names: {fr: "Nom de l'opportunité"}, kind: text, max_len: 255 }
  - key: trade_show
    name: Trade show
    names: {fr: "Salon"}
    icon: landmark
    properties:
      - { key: start_on, name: Starts on, names: {fr: "Début"}, kind: date, indexed: true }
      - { key: place, name: Place, names: {fr: "Lieu"}, kind: text, max_len: 255 }
      - { key: list, name: List to turn into leads, names: {fr: "Liste à transformer en pistes"}, kind: text, max_len: 255, indexed: true }
