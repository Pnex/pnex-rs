        names: {fr: "Exigé à partir de l'étape"}
        kind: enum
        values: [discovery, qualification, proposal, negotiation]
        labels: {discovery: {fr: "Découverte", en: "Discovery"}, qualification: {fr: "Qualification", en: "Qualification"}, proposal: {fr: "Proposition", en: "Proposal"}, negotiation: {fr: "Négociation", en: "Negotiation"}}
        required: true
