    to_types: [opportunity]
hierarchies:
  # From an account, its opportunities; the band counts them by stage.
  - key: opportunities
    name: Opportunities
    names: {fr: "Opportunités"}
    steps:
      - { link: opportunity_with, inverse: true }
types:
  - key: opportunity
    name: Opportunity
    names: {fr: "Opportunité"}
    icon: flag
    properties:
      - key: stage
        name: Stage
        names: {fr: "Étape"}
        kind: enum
        values: [discovery, qualification, proposal, negotiation, won, lost]
        labels: {discovery: {fr: "Découverte", en: "Discovery"}, qualification: {fr: "Qualification", en: "Qualification"}, proposal: {fr: "Proposition", en: "Proposal"}, negotiation: {fr: "Négociation", en: "Negotiation"}, won: {fr: "Gagnée", en: "Won"}, lost: {fr: "Perdue", en: "Lost"}}
        colors: { discovery: gray, qualification: blue, proposal: violet, negotiation: amber, won: green, lost: red }
        required: true
        indexed: true
      - { key: amount, name: Amount, names: {fr: "Montant"}, kind: money }
      - { key: probability, name: Probability (%), names: {fr: "Probabilité (%)"}, kind: number, min: 0, max: 100 }
      - { key: expected_close, name: Expected close, names: {fr: "Clôture prévue"}, kind: date, indexed: true }
      - key: source
