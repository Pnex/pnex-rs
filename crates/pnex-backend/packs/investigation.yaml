# Reference pack "Investigation" (cases.md K4, K5, K7): human actors,
# events dated as precisely as known (fuzzy time), pieces wrapping a source,
# places, where anything was over time (`located_at`, dated by the link),
# claims sourced by pieces at an exact locator (corroborated with two
# origins, or one and a written justification), hypotheses they support or
# contradict, identifiers. Events and the `involves` attachment are core
# types since 1.3.0 (cases-workspace.md K20, K21): the pack uses them. Since
# 1.4.0 a place may carry a zone (geo_area, K29) for the zone detector.
# No "suspect" or "guilty" field (K16): an actor has roles in events, legal
# qualification is not an object attribute.
key: investigation
name: Investigation
version: "1.4.0"
description: People, organizations, events with approximate dates, sourced claims and hypotheses — for cases, newsrooms and root-cause analyses.
types:
  - key: person
    name: Person
    icon: user
    may_be_contained_in: [folder]
    properties:
      - { key: aliases, name: Aliases, kind: text, max_len: 1000 }
      - { key: role_label, name: Role, kind: text, max_len: 255 }
      - { key: notes, name: Notes, kind: text, max_len: 2000 }
  - key: organization
    name: Organization
    icon: building
    may_be_contained_in: [folder]
    properties:
      - key: kind
        name: Kind
        kind: enum
        values: [company, public_body, association, party, media, group, other]
      - { key: notes, name: Notes, kind: text, max_len: 2000 }
  - key: place
    name: Place
    icon: map-pin
    may_be_contained_in: [folder]
    properties:
      - { key: address, name: Address, kind: text, max_len: 500 }
      - { key: location, name: Location, kind: geo_point }
      - { key: zone, name: Zone, kind: geo_area }
      - { key: notes, name: Notes, kind: text, max_len: 2000 }
  - key: piece
    name: Piece
    icon: book
    may_be_contained_in: [folder]
    properties:
      - { key: source_url, name: Source URL, kind: url }
      - { key: captured_at, name: Captured at, kind: date_time }
      - { key: sha256, name: SHA-256, kind: text, max_len: 64 }
      - { key: notes, name: Notes, kind: text, max_len: 2000 }
  - key: claim
    name: Claim
    icon: tag
    may_be_contained_in: [folder]
    properties:
      - { key: statement, name: Statement, kind: text, max_len: 2000, required: true }
      - key: status
        name: Status
        kind: enum
        values: [unverified, corroborated, contested, refuted]
        required: true
        indexed: true
      - key: source_reliability
        name: Source reliability
        kind: enum
        values: [A, B, C, D, E, F]
      - key: information_credibility
        name: Information credibility
        kind: enum
        values: ["1", "2", "3", "4", "5", "6"]
      - { key: corroboration_note, name: Corroboration justification, kind: text, max_len: 1000 }
  - key: hypothesis
    name: Hypothesis
    icon: globe
    may_be_contained_in: [folder]
    properties:
      - { key: statement, name: Statement, kind: text, max_len: 2000, required: true }
      - key: status
        name: Status
        kind: enum
        values: [open, supported, refuted, retained]
        required: true
        indexed: true
  - key: identifier
    name: Identifier
    icon: tag
    may_be_contained_in: [folder]
    properties:
      - key: kind
        name: Kind
        kind: enum
        values: [phone, email, plate, account, imei, iban, other]
        required: true
      - { key: value, name: Value, kind: text, max_len: 255, required: true, indexed: true }
link_types:
  - key: occurred_at
    name: occurred at
    inverse_name: is the place of
    from_types: [event]
    to_types: [map_pin]
    one_target: true
  - key: located_at
    name: is located at
    inverse_name: is the location of
    from_types: "*"
    to_types: [map_pin, place]
    attributes:
      - key: kind
        name: Kind
        kind: enum
        values: [seen, lives, works, registered, stored, other]
  - key: before
    name: happened before
    inverse_name: happened after
    from_types: [event]
    to_types: [event]
  - key: member_of
    name: is a member of
    inverse_name: has as member
    from_types: [person, organization]
    to_types: [organization]
  - key: employs
    name: employs
    inverse_name: works for
    from_types: [organization]
    to_types: [person]
    attributes:
      - { key: position, name: Position, kind: text, max_len: 255 }
  - key: owns
    name: owns
    inverse_name: is owned by
    from_types: [person, organization]
    to_types: "*"
  - key: knows
    name: knows
    inverse_name: is known by
    from_types: [person]
    to_types: [person]
  - key: uses_identifier
    name: uses
    inverse_name: is used by
    from_types: [person, organization]
    to_types: [identifier]
  - key: wraps
    name: wraps
    inverse_name: is wrapped by
    from_types: [piece]
    to_types: "*"
    one_target: true
  - key: about
    name: is about
    inverse_name: is the subject of
    from_types: [claim]
    to_types: "*"
  - key: sourced_by
    name: is sourced by
    inverse_name: sources
    from_types: [claim]
    to_types: [piece]
    attributes:
      - { key: locator, name: Locator, kind: text, max_len: 255 }
  - key: supports
    name: supports
    inverse_name: is supported by
    from_types: [claim]
    to_types: [hypothesis, claim]
  - key: contradicts
    name: contradicts
    inverse_name: is contradicted by
    from_types: [claim]
    to_types: [hypothesis, claim]
page_templates:
  - key: five_whys
    name: 5 whys
    description: Walk back from the symptom to a root cause, one "why" at a time.
    body: |
      ## Problem
      What failed, where and when (link the alert or the event).

      ## Why?
      1. Why did it happen?
      2. Why?
      3. Why?
      4. Why?
      5. Why?

      ## Root cause

      ## Actions
      - Containment:
      - Correction:
      - Prevention:
  - key: ishikawa
    name: Ishikawa (6M)
    description: Sort the possible causes by family before testing them.
    body: |
      ## Effect
      The observed effect, in one sentence.

      ## Method
      - 

      ## Machine
      - 

      ## Manpower
      - 

      ## Material
      - 

      ## Measurement
      - 

      ## Mother nature (environment)
      - 

      ## Causes retained
      Each retained cause becomes a hypothesis of the case.
  - key: incident_report
    name: Incident report
    description: What happened, the impact, the response and what changes.
    body: |
      ## Summary

      ## Timeline
      Key moments from the case timeline, in UTC.

      ## Impact

      ## Response

      ## Root cause

      ## Actions
      - 
  - key: investigation_note
    name: Investigation note
    description: The question, what is established, what is not, and the sources.
    body: |
      ## Question

      ## Established facts
      Each fact cites its claims and pieces.

      ## Open hypotheses

      ## Not established

      ## Sources
  - key: script
    name: Script / rundown
    description: Sequences of a video or a story, each with its sources.
    body: |
