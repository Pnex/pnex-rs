# Reference pack "Investigation" (cases.md K4, K5, K7): human actors,
# events dated as precisely as known (fuzzy time), pieces wrapping a source,
# places, where anything was over time (`located_at`, dated by the link),
# claims sourced by pieces at an exact locator (corroborated with two
# origins, or one and a written justification), hypotheses they support or
# contradict, identifiers. Events and the `involves` attachment are core
# types since 1.3.0 (cases-workspace.md K20, K21): the pack uses them. Since
# 1.4.0 a place may carry a zone (geo_area, K29) for the zone detector.
# Since 1.5.0 names carry their French translation (`names`, O43).
# Since 1.6.0 `owns` carries the share held (cases-money.md K56): chains
# of shares give the computed beneficial owners.
# Since 1.7.0 people and organizations carry their Wikidata id, and
# `owns`, `employs`, `member_of` carry their provenance (source, retrieval
# date, note): a fact that cannot be sourced is a claim, not a link.
# Since 1.8.0 `published_by` says who published a piece or a media file
# (media-review.md D278): any publisher type, so the `media` type of the
# media coverage pack fits without this pack knowing it.
# Since 1.9.0 `about` may name the very link a claim bears on (`link`, the
# link id): a second source or a diverging date for a fact already linked.
# Since 1.10.0 a statement is quoted word for word from a media, said by a
# person (cases-workspace.md K43), and a person appears in a media file
# (`appears_in`, cases.md K17, media-review.md D278): present, speaking or
# mentioned, with the origin of the finding. The programme grain stays
# `appears_on` of the media coverage pack.
# Since 1.11.0 personal data is classified (crm.md D442): a person's name,
# aliases, role and notes, identifier values and a position held are
# `personnelle`, hidden from a role without the read permission and
# removed by an erasure.
# No "suspect" or "guilty" field (K16): an actor has roles in events, legal
# qualification is not an object attribute.
key: investigation
name: Investigation
names: {fr: "Enquête"}
version: "1.12.0"
description: People, organizations, events with approximate dates, sourced claims and hypotheses — for cases, newsrooms and root-cause analyses.
descriptions: {fr: "Personnes, organisations, événements datés au plus juste, affirmations sourcées et hypothèses — pour les enquêtes, les rédactions et les analyses de cause racine."}
types:
  - key: person
    name: Person
    names: {fr: "Personne"}
    icon: user
    may_be_contained_in: [folder]
    title_classification: personnelle
    properties:
      - { key: aliases, name: Aliases, names: {fr: "Alias"}, kind: text, max_len: 1000, classification: personnelle }
      - { key: role_label, name: Role, names: {fr: "Rôle"}, kind: text, max_len: 255, classification: personnelle }
      - { key: wikidata, name: Wikidata, names: {fr: "Wikidata"}, kind: text, max_len: 32, indexed: true }
      - { key: notes, name: Notes, names: {fr: "Notes"}, kind: text, max_len: 2000, classification: personnelle }
  - key: organization
    name: Organization
    names: {fr: "Organisation"}
    icon: building
    may_be_contained_in: [folder]
    properties:
      - key: kind
        name: Kind
        names: {fr: "Nature"}
        kind: enum
        values: [company, public_body, association, party, media, group, other]
        labels: {company: {fr: "Entreprise", en: "Company"}, public_body: {fr: "Organisme public", en: "Public body"}, association: {fr: "Association", en: "Association"}, party: {fr: "Parti", en: "Party"}, media: {fr: "Média", en: "Media"}, group: {fr: "Groupe", en: "Group"}, other: {fr: "Autre", en: "Other"}}
      - { key: wikidata, name: Wikidata, names: {fr: "Wikidata"}, kind: text, max_len: 32, indexed: true }
      - { key: notes, name: Notes, names: {fr: "Notes"}, kind: text, max_len: 2000 }
  - key: place
    name: Place
    names: {fr: "Lieu"}
    icon: map-pin
    may_be_contained_in: [folder]
    properties:
      - { key: address, name: Address, names: {fr: "Adresse"}, kind: text, max_len: 500 }
      - { key: location, name: Location, names: {fr: "Position"}, kind: geo_point }
      - { key: zone, name: Zone, names: {fr: "Zone"}, kind: geo_area }
      - { key: notes, name: Notes, names: {fr: "Notes"}, kind: text, max_len: 2000 }
  - key: piece
    name: Piece
    names: {fr: "Pièce"}
    icon: book
    may_be_contained_in: [folder]
    properties:
      - { key: source_url, name: Source URL, names: {fr: "URL de la source"}, kind: url }
      - { key: captured_at, name: Captured at, names: {fr: "Capturée le"}, kind: date_time }
      - { key: sha256, name: SHA-256, names: {fr: "SHA-256"}, kind: text, max_len: 64 }
      - { key: notes, name: Notes, names: {fr: "Notes"}, kind: text, max_len: 2000 }
  - key: claim
    name: Claim
    names: {fr: "Affirmation"}
    icon: tag
    may_be_contained_in: [folder]
    properties:
      - { key: statement, name: Statement, names: {fr: "Énoncé"}, kind: text, max_len: 2000, required: true }
      - key: status
        name: Status
        names: {fr: "Statut"}
        kind: enum
        values: [unverified, corroborated, contested, refuted]
        labels: {unverified: {fr: "Non vérifiée", en: "Unverified"}, corroborated: {fr: "Corroborée", en: "Corroborated"}, contested: {fr: "Contestée", en: "Contested"}, refuted: {fr: "Réfutée", en: "Refuted"}}
        required: true
        indexed: true
      - key: source_reliability
        name: Source reliability
        names: {fr: "Fiabilité de la source"}
        kind: enum
        values: [A, B, C, D, E, F]
        labels: {A: {fr: "A — fiable", en: "A — reliable"}, B: {fr: "B — plutôt fiable", en: "B — usually reliable"}, C: {fr: "C — assez fiable", en: "C — fairly reliable"}, D: {fr: "D — peu fiable", en: "D — not usually reliable"}, E: {fr: "E — non fiable", en: "E — unreliable"}, F: {fr: "F — inconnue", en: "F — cannot be judged"}}
      - key: information_credibility
        name: Information credibility
        names: {fr: "Crédibilité de l'information"}
        kind: enum
        values: ["1", "2", "3", "4", "5", "6"]
        labels: {"1": {fr: "1 — confirmée", en: "1 — confirmed"}, "2": {fr: "2 — probable", en: "2 — probably true"}, "3": {fr: "3 — possible", en: "3 — possibly true"}, "4": {fr: "4 — douteuse", en: "4 — doubtful"}, "5": {fr: "5 — improbable", en: "5 — improbable"}, "6": {fr: "6 — invérifiable", en: "6 — cannot be judged"}}
      - { key: corroboration_note, name: Corroboration justification, names: {fr: "Justification de la corroboration"}, kind: text, max_len: 1000 }
  - key: hypothesis
    name: Hypothesis
    names: {fr: "Hypothèse"}
    icon: globe
    may_be_contained_in: [folder]
    properties:
      - { key: statement, name: Statement, names: {fr: "Énoncé"}, kind: text, max_len: 2000, required: true }
      - key: status
        name: Status
        names: {fr: "Statut"}
        kind: enum
        values: [open, supported, refuted, retained]
        labels: {open: {fr: "Ouverte", en: "Open"}, supported: {fr: "Étayée", en: "Supported"}, refuted: {fr: "Réfutée", en: "Refuted"}, retained: {fr: "Retenue", en: "Retained"}}
        required: true
        indexed: true
  - key: statement
    name: Statement
    names: {fr: "Déclaration"}
    icon: radio
    may_be_contained_in: [folder]
    properties:
      - { key: quote, name: Quote, names: {fr: "Citation"}, kind: text, max_len: 2000, required: true }
      - { key: aired, name: Aired, names: {fr: "Diffusé le"}, kind: fuzzy_time }
      - { key: locator, name: Locator, names: {fr: "Repère"}, kind: text, max_len: 255 }
      - { key: context_before, name: Context before, names: {fr: "Contexte avant"}, kind: text, max_len: 1000 }
      - { key: context_after, name: Context after, names: {fr: "Contexte après"}, kind: text, max_len: 1000 }
      - key: stance
        name: Stance
        names: {fr: "Position"}
        kind: enum
        values: [for, against, nuanced, none]
        labels: {for: {fr: "Pour", en: "For"}, against: {fr: "Contre", en: "Against"}, nuanced: {fr: "Nuancé", en: "Nuanced"}, none: {fr: "Aucune", en: "None"}}
  - key: identifier
    name: Identifier
    names: {fr: "Identifiant"}
    icon: tag
    may_be_contained_in: [folder]
    title_classification: personnelle
    properties:
      - key: kind
        name: Kind
        names: {fr: "Nature"}
        kind: enum
        values: [phone, email, plate, account, imei, iban, other]
        labels: {phone: {fr: "Téléphone", en: "Phone"}, email: {fr: "E-mail", en: "Email"}, plate: {fr: "Plaque", en: "Plate"}, account: {fr: "Compte", en: "Account"}, imei: {fr: "IMEI", en: "IMEI"}, iban: {fr: "IBAN", en: "IBAN"}, other: {fr: "Autre", en: "Other"}}
        required: true
      - { key: value, name: Value, names: {fr: "Valeur"}, kind: text, max_len: 255, required: true, indexed: true, classification: personnelle }
link_types:
  - key: occurred_at
    name: occurred at
    names: {fr: "s'est produit à"}
    inverse_name: is the place of
    inverse_names: {fr: "est le lieu de"}
    from_types: [event]
    to_types: [map_pin]
    one_target: true
  - key: located_at
    name: is located at
    names: {fr: "se trouve à"}
    inverse_name: is the location of
    inverse_names: {fr: "est l'emplacement de"}
    from_types: "*"
    to_types: [map_pin, place]
    attributes:
      - key: kind
        name: Kind
        names: {fr: "Nature"}
        kind: enum
        values: [seen, lives, works, registered, stored, other]
        labels: {seen: {fr: "Vu", en: "Seen"}, lives: {fr: "Habite", en: "Lives"}, works: {fr: "Travaille", en: "Works"}, registered: {fr: "Enregistré", en: "Registered"}, stored: {fr: "Stocké", en: "Stored"}, other: {fr: "Autre", en: "Other"}}
  - key: before
    name: happened before
    names: {fr: "a eu lieu avant"}
    inverse_name: happened after
    inverse_names: {fr: "a eu lieu après"}
    from_types: [event]
    to_types: [event]
  - key: member_of
    name: is a member of
    names: {fr: "est membre de"}
    inverse_name: has as member
    inverse_names: {fr: "a pour membre"}
    from_types: [person, organization]
    to_types: [organization]
    attributes:
      - { key: role, name: Role, names: {fr: "Rôle"}, kind: text, max_len: 255 }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 1000 }
      - { key: retrieved_on, name: Retrieved on, names: {fr: "Consulté le"}, kind: date }
      - { key: note, name: Note, names: {fr: "Note"}, kind: text, max_len: 2000 }
  - key: employs
    name: employs
    names: {fr: "emploie"}
    inverse_name: works for
    inverse_names: {fr: "travaille pour"}
    from_types: [organization]
    to_types: [person]
    attributes:
      - { key: position, name: Position, names: {fr: "Poste"}, kind: text, max_len: 255, classification: personnelle }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 1000 }
      - { key: retrieved_on, name: Retrieved on, names: {fr: "Consulté le"}, kind: date }
      - { key: note, name: Note, names: {fr: "Note"}, kind: text, max_len: 2000, classification: personnelle }
  - key: owns
    name: owns
    names: {fr: "possède"}
    inverse_name: is owned by
    inverse_names: {fr: "appartient à"}
    from_types: [person, organization]
    to_types: "*"
    attributes:
      - { key: share, name: Share held, names: {fr: "Part détenue"}, kind: number, unit: "%", min: 0, max: 100 }
      - { key: voting_rights, name: Voting rights, names: {fr: "Droits de vote"}, kind: number, unit: "%", min: 0, max: 100 }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 1000 }
      - { key: retrieved_on, name: Retrieved on, names: {fr: "Consulté le"}, kind: date }
      - { key: note, name: Note, names: {fr: "Note"}, kind: text, max_len: 2000 }
  - key: knows
    name: knows
    names: {fr: "connaît"}
    inverse_name: is known by
    inverse_names: {fr: "est connu de"}
    from_types: [person]
    to_types: [person]
  - key: uses_identifier
    name: uses
    names: {fr: "utilise"}
    inverse_name: is used by
    inverse_names: {fr: "est utilisé par"}
    from_types: [person, organization]
    to_types: [identifier]
  - key: wraps
    name: wraps
    names: {fr: "contient"}
    inverse_name: is wrapped by
    inverse_names: {fr: "est contenu dans"}
    from_types: [piece]
    to_types: "*"
    one_target: true
  - key: said_by
    name: is said by
    names: {fr: "dite par"}
    inverse_name: said
    inverse_names: {fr: "a dit"}
    from_types: [statement]
    to_types: [person]
    one_target: true
    attributes:
      - { key: origin, name: Origin, names: {fr: "Origine"}, kind: enum, values: [manual, voice, transcript, grid], labels: {manual: {fr: "Manuelle", en: "Manual"}, voice: {fr: "Voix", en: "Voice"}, transcript: {fr: "Transcription", en: "Transcript"}, grid: {fr: "Grille", en: "Grid"}} }
      - { key: confidence, name: Confidence, names: {fr: "Confiance"}, kind: number }
  - key: appears_in
    name: appears in
    names: {fr: "apparaît dans"}
    inverse_name: shows
    inverse_names: {fr: "montre"}
    from_types: [person]
    to_types: [media_asset]
    attributes:
      - { key: kind, name: Kind, names: {fr: "Nature"}, kind: enum, values: [present, speaking, mentioned], labels: {present: {fr: "Présent", en: "Present"}, speaking: {fr: "Parle", en: "Speaking"}, mentioned: {fr: "Cité", en: "Mentioned"}} }
      - { key: origin, name: Origin, names: {fr: "Origine"}, kind: enum, values: [manual, voice, transcript, grid], labels: {manual: {fr: "Manuelle", en: "Manual"}, voice: {fr: "Voix", en: "Voice"}, transcript: {fr: "Transcription", en: "Transcript"}, grid: {fr: "Grille", en: "Grid"}} }
      - { key: confidence, name: Confidence, names: {fr: "Confiance"}, kind: number }
  - key: published_by
    name: is published by
    names: {fr: "publié par"}
    inverse_name: published
    inverse_names: {fr: "a publié"}
    from_types: [piece, media_asset]
    to_types: "*"
  - key: about
    name: is about
    names: {fr: "porte sur"}
    inverse_name: is the subject of
    inverse_names: {fr: "est le sujet de"}
    from_types: [claim]
    to_types: "*"
    attributes:
      - { key: link, name: Link, names: {fr: "Lien"}, kind: number }
  - key: sourced_by
    name: is sourced by
    names: {fr: "a pour source"}
    inverse_name: sources
    inverse_names: {fr: "est la source de"}
    from_types: [claim]
    to_types: [piece]
    attributes:
      - { key: locator, name: Locator, names: {fr: "Repère"}, kind: text, max_len: 255 }
  - key: supports
    name: supports
    names: {fr: "étaye"}
    inverse_name: is supported by
    inverse_names: {fr: "est étayé par"}
    from_types: [claim]
    to_types: [hypothesis, claim]
  - key: contradicts
    name: contradicts
    names: {fr: "contredit"}
    inverse_name: is contradicted by
    inverse_names: {fr: "est contredit par"}
    from_types: [claim]
    to_types: [hypothesis, claim]
page_templates:
  - key: five_whys
    name: 5 whys
    names: {fr: "5 pourquoi"}
    description: Walk back from the symptom to a root cause, one "why" at a time.
    descriptions: {fr: "Remonter du symptôme à la cause racine, un « pourquoi » à la fois."}
    body: |
      ## Problem
      What failed, where and when (link the alert or the event).

      ## Why?
      1. Why did it happen?
      2. Why?
      3. Why?
      4. Why?
      5. Why?

      ## Root cause

      ## Actions
      - Containment:
      - Correction:
      - Prevention:
  - key: ishikawa
    name: Ishikawa (6M)
    names: {fr: "Ishikawa (6M)"}
    description: Sort the possible causes by family before testing them.
    descriptions: {fr: "Classer les causes possibles par famille avant de les tester."}
    body: |
      ## Effect
      The observed effect, in one sentence.

      ## Method
      - 

      ## Machine
      - 

      ## Manpower
      - 

      ## Material
      - 

      ## Measurement
      - 

      ## Mother nature (environment)
      - 

      ## Causes retained
      Each retained cause becomes a hypothesis of the case.
  - key: incident_report
    name: Incident report
    names: {fr: "Rapport d'incident"}
    description: What happened, the impact, the response and what changes.
    descriptions: {fr: "Ce qui s'est passé, l'impact, la réponse et ce qui change."}
    body: |
      ## Summary

      ## Timeline
      Key moments from the case timeline, in UTC.

      ## Impact

      ## Response

      ## Root cause

      ## Actions
      - 
  - key: investigation_note
    name: Investigation note
    names: {fr: "Note d'enquête"}
    description: The question, what is established, what is not, and the sources.
    descriptions: {fr: "La question, ce qui est établi, ce qui ne l'est pas, et les sources."}
    body: |
      ## Question

      ## Established facts
      Each fact cites its claims and pieces.

      ## Open hypotheses

      ## Not established

      ## Sources
  - key: script
    name: Presentation outline
    names: {fr: "Plan de présentation"}
    description: Sequences of a presentation or a video, each with its sources.
    descriptions: {fr: "Les séquences d'une présentation ou d'une vidéo, chacune avec ses sources."}
    body: |
      ## Angle

      ## Sequences
      1. Opening
      2. 
      3. Conclusion

      ## Sources to show

      ## Rights and consent
