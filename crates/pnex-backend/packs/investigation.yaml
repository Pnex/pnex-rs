# Reference pack "Investigation" (cases.md K4, K5, K7): human actors,
# events dated as precisely as known (fuzzy time), pieces wrapping a source,
# claims sourced by pieces at an exact locator, hypotheses they support or
# contradict, identifiers. No "suspect" or "guilty" field (K16): an actor
# has roles in events, legal qualification is not an object attribute.
key: investigation
name: Investigation
version: "1.0.0"
description: People, organizations, events with approximate dates, sourced claims and hypotheses — for cases, newsrooms and root-cause analyses.
types:
  - key: person
    name: Person
    icon: user
    may_be_contained_in: [folder]
    properties:
      - { key: aliases, name: Aliases, kind: text, max_len: 1000 }
      - { key: role_label, name: Role, kind: text, max_len: 255 }
      - { key: notes, name: Notes, kind: text, max_len: 2000 }
  - key: organization
    name: Organization
    icon: building
    may_be_contained_in: [folder]
    properties:
      - key: kind
        name: Kind
        kind: enum
        values: [company, public_body, association, party, media, group, other]
      - { key: notes, name: Notes, kind: text, max_len: 2000 }
  - key: event
    name: Event
    icon: layers
    may_be_contained_in: [folder]
    properties:
      - { key: occurred, name: Occurred, kind: fuzzy_time }
      - { key: summary, name: Summary, kind: text, max_len: 2000 }
      - { key: location, name: Location, kind: geo_point }
  - key: piece
    name: Piece
    icon: book
    may_be_contained_in: [folder]
    properties:
      - { key: source_url, name: Source URL, kind: url }
      - { key: captured_at, name: Captured at, kind: date_time }
      - { key: sha256, name: SHA-256, kind: text, max_len: 64 }
      - { key: notes, name: Notes, kind: text, max_len: 2000 }
  - key: claim
    name: Claim
    icon: tag
    may_be_contained_in: [folder]
    properties:
      - { key: statement, name: Statement, kind: text, max_len: 2000, required: true }
      - key: status
        name: Status
        kind: enum
        values: [unverified, corroborated, contested, refuted]
        required: true
        indexed: true
      - key: source_reliability
        name: Source reliability
        kind: enum
        values: [A, B, C, D, E, F]
      - key: information_credibility
        name: Information credibility
        kind: enum
        values: ["1", "2", "3", "4", "5", "6"]
  - key: hypothesis
    name: Hypothesis
    icon: globe
    may_be_contained_in: [folder]
    properties:
      - { key: statement, name: Statement, kind: text, max_len: 2000, required: true }
      - key: status
        name: Status
        kind: enum
        values: [open, supported, refuted, retained]
        required: true
        indexed: true
  - key: identifier
    name: Identifier
    icon: tag
    may_be_contained_in: [folder]
    properties:
      - key: kind
        name: Kind
        kind: enum
        values: [phone, email, plate, account, imei, iban, other]
        required: true
      - { key: value, name: Value, kind: text, max_len: 255, required: true, indexed: true }
link_types:
  - key: involves
    name: involves
    inverse_name: is involved in
    from_types: [event]
    to_types: "*"
    attributes:
      - { key: role, name: Role, kind: text, max_len: 255 }
  - key: occurred_at
    name: occurred at
    inverse_name: is the place of
    from_types: [event]
    to_types: [map_pin]
    one_target: true
  - key: before
    name: happened before
    inverse_name: happened after
    from_types: [event]
    to_types: [event]
  - key: member_of
    name: is a member of
    inverse_name: has as member
    from_types: [person, organization]
    to_types: [organization]
  - key: employs
    name: employs
    inverse_name: works for
    from_types: [organization]
    to_types: [person]
    attributes:
      - { key: position, name: Position, kind: text, max_len: 255 }
  - key: owns
    name: owns
    inverse_name: is owned by
    from_types: [person, organization]
    to_types: "*"
  - key: knows
    name: knows
    inverse_name: is known by
    from_types: [person]
    to_types: [person]
  - key: uses_identifier
    name: uses
    inverse_name: is used by
    from_types: [person, organization]
    to_types: [identifier]
  - key: wraps
    name: wraps
    inverse_name: is wrapped by
    from_types: [piece]
    to_types: "*"
    one_target: true
  - key: about
    name: is about
    inverse_name: is the subject of
    from_types: [claim]
    to_types: "*"
  - key: sourced_by
    name: is sourced by
    inverse_name: sources
    from_types: [claim]
    to_types: [piece]
    attributes:
      - { key: locator, name: Locator, kind: text, max_len: 255 }
  - key: supports
    name: supports
    inverse_name: is supported by
    from_types: [claim]
    to_types: [hypothesis, claim]
  - key: contradicts
    name: contradicts
    inverse_name: is contradicted by
    from_types: [claim]
    to_types: [hypothesis, claim]
