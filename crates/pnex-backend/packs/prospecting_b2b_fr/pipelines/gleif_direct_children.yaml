# The direct subsidiaries of each followed account, by its LEI.
key: gleif_direct_children
name: Direct subsidiaries (GLEIF)
hosts: [api.gleif.org]
steps:
  - enumerate: { as: rows, cross: [{ as: lei, objects: { type: organization, property: lei, only: { account_status: [customer, prospect, target] } } }] }
  - fetch:
      as: answer
      for_each: rows
      url: "https://api.gleif.org/api/v1/lei-records/{{lei}}/direct-children?page%5Bsize%5D=200"
      every: 150ms
      missing_is_empty: true
  - read:
      as: found
      from: answer
      format: json
      records: /data
      columns:
        - { name: queried, value: "{{lei}}" }
        - { name: record, at: "/", type: json }
  - write: { from: found, table: { name: gleif_direct_children, replace: true } }
tests:
  - name: the records of one object
    objects: { "organization.lei?account_status=customer,prospect,target": ["969500UP76J52A9OXU27"] }
    given:
      "https://api.gleif.org/api/v1/lei-records/969500UP76J52A9OXU27/direct-children?page%5Bsize%5D=200": gleif_children.json
    expect:
      found:
        rows: 1
