# The world's press of the last day naming an account followed (customer,
# prospect, target): one signal per company. Source GDELT Project.
key: press_gdelt
name: Press (GDELT)
hosts: [data.gdeltproject.org]
steps:
  # The companies watched, each by the first unique key it holds.
  - enumerate: { as: by_siren, cross: [{ as: siren, objects: { type: organization, property: siren, only: { account_status: [customer, prospect, target] }, title: name, columns: [press_names] } }] }
  - enumerate: { as: by_lei, cross: [{ as: lei, objects: { type: organization, property: lei, only: { account_status: [customer, prospect, target] }, title: name, columns: [siren, press_names] } }] }
  - enumerate: { as: by_item, cross: [{ as: wikidata, objects: { type: organization, property: wikidata, only: { account_status: [customer, prospect, target] }, title: name, columns: [siren, lei, press_names] } }] }
  - sql:
      as: watched
      sql: |
        SELECT 'siren' AS via, siren AS account, name, press_names AS aliases FROM by_siren
        UNION ALL SELECT 'lei', lei, name, press_names FROM by_lei WHERE siren IS NULL
        UNION ALL SELECT 'wikidata', wikidata, name, press_names FROM by_item
          WHERE siren IS NULL AND lei IS NULL
  - call: { as: names, from: watched, function: companies/press_names }
  # Nothing watched: no file is read.
  - sql: { as: gate, sql: "SELECT 1 AS go FROM names LIMIT 1" }
  # One file every 15 minutes, and its translated twin.
  - enumerate:
      as: slices
      for_each: gate
      cross:
        - { as: hour, periods: hour, from: "-26h" }
        - { as: quarter, values: ["00", "15", "30", "45"] }
        - { as: kind, values: [gkg, translation.gkg] }
  - fetch:
      as: zip
      for_each: slices
      url: "http://data.gdeltproject.org/gdeltv2/{{hour_y}}{{hour_m}}{{hour_d}}{{hour_h}}{{quarter}}00.{{kind}}.csv.zip"
      missing_is_empty: true
  - unpack: { as: files, from: zip, entries: ["*.csv"] }
  - read:
      as: articles
      from: files
      format: csv
      delimiter: "\t"
      header: false
      quoted: false
      skip_invalid: true
      where: { orgs: ["?*"] }
      columns:
        - { name: date, at: 1 }
        - { name: source, at: 3, optional: true }
        - { name: url, at: 4 }
        - { name: orgs, at: 13 }
        - { name: tone, at: 15, optional: true }
        - { name: translation, at: 25, optional: true }
        - { name: extras, at: 26, optional: true }
  # A quick text search first: the articles whose organizations hold a
  # company's longest word; the call then matches whole words.
  - sql:
      as: candidates
      sql: |
        SELECT a.date, a.source, a.url, a.orgs, a.tone, a.translation,
               substr(a.extras, strpos(a.extras, '<PAGE_TITLE>') + 12,
                      strpos(a.extras, '</PAGE_TITLE>') - strpos(a.extras, '<PAGE_TITLE>') - 12) AS title,
               n.via, n.account, n.name_key
        FROM articles AS a
        JOIN names AS n
          ON strpos(translate(lower(a.orgs), 'àâäçéèêëîïôöùûüÿ', 'aaaceeeeiioouuuy'), n.probe) > 0
        WHERE strpos(a.extras, '<PAGE_TITLE>') > 0
          AND strpos(a.extras, '</PAGE_TITLE>') > strpos(a.extras, '<PAGE_TITLE>')
  - call: { as: signals, from: candidates, function: companies/press_digest }
  - write: { from: signals, table: { name: press_gdelt, replace: true } }
tests:
  - name: one signal per company, led by the central headline
    today: "2026-11-02"
    objects:
      "organization.siren?account_status=customer,prospect,target?columns=press_names": ["1", "732829320"]
      "organization.lei?account_status=customer,prospect,target?columns=siren,press_names": ["LEI1"]
    extra:
      "organization.siren?account_status=customer,prospect,target?columns=press_names": { "1": { name: INITECH }, "732829320": { name: GLOBEX } }
      "organization.lei?account_status=customer,prospect,target?columns=siren,press_names": { LEI1: { name: VOLTA DE FRANCE, press_names: VDF } }
    given:
      "http://data.gdeltproject.org/gdeltv2/20261102114500.gkg.csv.zip": gdelt_gkg.zip
    expect:
      names:
        rows: 4
      # VDF is named by an article, not by its headline: no signal.
      signals:
        rows: 2
        contains:
          - { ref: "press:siren:1:2026-11-02", url: "https://b", lang: eng }
          - { ref: "press:siren:732829320:2026-11-02", title: "Globex étend son usine & recrute", lang: fra }
  - name: nothing watched, nothing read
    today: "2026-11-02"
    given:
      "http://data.gdeltproject.org/gdeltv2/20261102114500.gkg.csv.zip": gdelt_gkg.zip
    expect:
      articles:
        rows: 0
