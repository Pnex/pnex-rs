  - key: same_company_as
    name: is the same company as
    names: {fr: "est la même société que"}
    inverse_name: is the same company as
    inverse_names: {fr: "est la même société que"}
    description: "A company known by its SEC number and the same one known by its LEI: proposed from GLEIF (D812), written once a member accepts it. Nothing is merged."
    descriptions: {fr: "Une société connue par son numéro SEC et la même connue par son LEI : proposé depuis GLEIF (D812), écrit quand un membre l'accepte. Rien n'est fusionné."}
    from_types: [organization]
    to_types: [organization]
    attributes:
      - { key: lei, name: LEI, names: {fr: "LEI"}, kind: text, max_len: 20 }
imports:
  - name: Companies followed (SEC)
    source: url
    source_url: "https://www.sec.gov/files/company_tickers.json"
    mode: incremental
    recurrence: { start: "2026-01-01", every: 1, unit: week }
    mapping:
      key: sec_companies
      name: Companies followed
      names: {fr: "Sociétés suivies"}
      shape: sec_tickers
      contact_setting: markets.source_contact
      rows_in_setting: { key: markets.covered_tickers, property: ticker }
      objects:
        # Never updated: the names a member added to it stay.
        - as: company
          type: organization
          key: cik
          title: title
          update: false
          properties:
            cik: cik
            ticker: ticker
            market_followed: { value: followed }
            market_names: press_name
        - as: instrument
          type: instrument
          key: ticker
          title: ticker
          properties:
            ticker: ticker
      links:
        - { type: issues, from: company, to: instrument }
