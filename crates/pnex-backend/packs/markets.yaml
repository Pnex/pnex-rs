# Read-only queries of the pack (pipeline-engine.md D948), run under the
# caller's rights by `POST /analysis/named/markets/<key>`.
queries:
  - key: market_moves
    name: Abnormal sessions between two days
    names: {fr: "Séances anormales entre deux jours"}
    description: The abnormal sessions found on the watched series, oldest first.
    params:
      - { name: from, type: date, description: First session day. }
      - { name: to, type: date, description: Last session day. }
    sql: >-
      SELECT id, title, kind, event_at FROM objects.market_event
      WHERE CAST(event_at AS DATE) BETWEEN {{from}} AND {{to}} ORDER BY event_at, id
# Cause → effect pairs of the market causal chains (H.7, D906): each one is
# two settings (prior, maximal gap) the org may set.
causal_pairs:
  - { cause: world.event, effect: price.move, max_gap_min: 1440, prior: 0.5 }
  - { cause: macro.release, effect: price.move, max_gap_min: 120, prior: 0.5 }
  - { cause: supply.disruption, effect: price.move, max_gap_min: 2880, prior: 0.5 }
# Functions of the pipelines only (D940), never installed in the org's
# function registry: the meeting pages of two central banks, read by the
# position of their cells.
pipeline_functions:
  # The Federal Reserve's FOMC calendar page: a panel per year ("2026 FOMC
  # Meetings"), a month cell then a date cell per meeting ("27-28", "17-18*"
  # with projections, "Apr/May" + "30-1" across months). The decision is the
  # last day; a note in words ("14 (unscheduled)") is not a scheduled meeting.
  - name: fomc_page
    language: starlark
    description: FOMC decision days of the calendar page (rows line → day, kind).
    code: |
      MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]

      def month_of(name):
          n = name.strip().lower()
          for i in range(len(MONTHS)):
              if n.startswith(MONTHS[i]):
                  return i + 1
          return None

      def pad(n, width):
          s = str(n)
          return "0" * (width - len(s)) + s

      def handle(rows):
          html = "\n".join([r.get("line") or "" for r in rows])
          if "fomc-meeting__month" not in html:
              fail("not the FOMC calendar page")
          pieces = html.split("<")
          year = None
          month = None
          out = []
          for i in range(len(pieces)):
              parts = pieces[i].split(">", 1)
              if len(parts) < 2:
                  continue
              tag, text = parts[0], parts[1].strip()
              at = text.find(" FOMC Meetings")
              if at >= 4 and text[at - 4:at].isdigit():
                  year = int(text[at - 4:at])
              is_month = "fomc-meeting__month" in tag
              if not is_month and "fomc-meeting__date" not in tag:
                  continue
              # The month is wrapped in a <strong>.
              if text == "" and i + 1 < len(pieces) and pieces[i + 1].startswith("strong>"):
                  text = pieces[i + 1][len("strong>"):].strip()
              if is_month:
                  month = month_of(text.split("/")[-1])
                  continue
              m = month
              month = None
              if m == None or year == None:
                  continue
              lead = ""
              for c in text.elems():
                  if c.isdigit() or c == "-" or c == "*":
                      lead += c
                  else:
                      break
              if lead == "" or len(lead) != len(text):
                  continue
              day = lead.rstrip("*").split("-")[-1]
              if not day.isdigit():
                  continue
              out.append({
                  "day": pad(year, 4) + "-" + pad(m, 2) + "-" + pad(int(day), 2),
                  "kind": "projections" if lead.endswith("*") else "scheduled",
              })
          return out
  # The ECB's calendar of the Governing Council: a dd/mm/yyyy date then its
  # description. Only the monetary policy meetings, on their decision day
  # ("Day 2", or a one-day meeting).
  - name: ecb_page
    language: starlark
    description: ECB monetary policy decision days of the calendar page (rows line → day, label).
    code: |
      def handle(rows):
          html = "\n".join([r.get("line") or "" for r in rows])
          if "Governing Council" not in html:
              fail("not the ECB calendar page")
          texts = []
          for p in html.split("<"):
              parts = p.split(">", 1)
              t = (parts[1] if len(parts) == 2 else parts[0]).strip()
              if t != "":
                  texts.append(t)
          out = []
          for i in range(len(texts) - 1):
              d = texts[i].split("/")
              if len(d) != 3 or len(d[0]) != 2 or len(d[1]) != 2 or len(d[2]) != 4:
                  continue
              if not (d[0].isdigit() and d[1].isdigit() and d[2].isdigit()):
                  continue
              what = texts[i + 1].replace("&amp;", "&")
              low = what.lower()
              if "monetary policy meeting" not in low or "non-monetary" in low or "day 1" in low:
                  continue
              out.append({"day": d[2] + "-" + d[1] + "-" + d[0], "label": what})
          return out
  # A company created from its SEC number found again in GLEIF (D812): only
  # a single record whose legal name (or another of its names) has the
  # same legal key as the SEC name is kept. "NVIDIA CORP" and "NVIDIA
  # Corporation", "COCA COLA CO" and "The Coca-Cola Company" share a key.
  - name: gleif_match
    language: starlark
    description: The single GLEIF record matching each SEC company's name (rows cik, title, lei, legal_name, other_names, url → cik, title, lei, legal_name, values, evidence).
    code: |
      FOLD = {"à": "a", "á": "a", "â": "a", "ä": "a", "ã": "a", "å": "a", "ç": "c", "é": "e", "è": "e",
              "ê": "e", "ë": "e", "í": "i", "ì": "i", "î": "i", "ï": "i", "ñ": "n", "ó": "o", "ò": "o",
              "ô": "o", "ö": "o", "õ": "o", "ú": "u", "ù": "u", "û": "u", "ü": "u", "ý": "y", "ÿ": "y"}
      FORMS = {"CORPORATION": "CORP", "INCORPORATED": "INC", "COMPANY": "CO", "LIMITED": "LTD"}

      def legal_key(name):
          chars = []
          for c in name.lower().elems():
              c = FOLD.get(c, c)
              chars.append(c.upper() if c.isalnum() else " ")
          words = [FORMS.get(w, w) for w in "".join(chars).split()]
          if len(words) > 1 and words[0] == "THE":
              words = words[1:]
          return " ".join(words)

      def handle(rows):
          by = {}
          order = []
          for r in rows:
              k = r.get("cik")
              if k not in by:
                  by[k] = []
                  order.append(k)
              by[k].append(r)
          out = []
          for k in order:
              found = by[k]
              key = legal_key(found[0].get("title") or "")
              if key == "":
                  continue
              hits = []
              for c in found:
                  lei = (c.get("lei") or "").upper()
                  if len(lei) != 20 or not lei.isalnum():
                      continue
                  names = [c.get("legal_name") or ""]
                  other = c.get("other_names")
                  if other:
                      for o in json.decode(other):
                          if type(o) == "dict" and o.get("name"):
                              names.append(o["name"])
                  if [n for n in names if legal_key(n) == key]:
                      hits.append({"lei": lei, "c": c})
              # None, or several companies: nothing proposed.
              if not hits or [h for h in hits if h["lei"] != hits[0]["lei"]]:
                  continue
              lei = hits[0]["lei"]
              c = hits[0]["c"]
              legal = c.get("legal_name") or ""
              out.append({
                  "cik": k,
                  "title": c.get("title") or "",
                  "lei": lei,
                  "legal_name": legal,
                  "values": json.encode({"lei": lei}),
                  "evidence": json.encode({"lei": lei, "legal_name": legal, "source": c.get("url") or ""}),
              })
          return out
  # The subsidiaries a US-listed group declares in the Exhibit 21 of its
  # annual report (10-K), worldwide. The exhibit has no fixed form: a table
  # (name, jurisdiction) or lines of text ("Name (Jurisdiction)", or apart by
  # a tab, two spaces or dots). A row whose jurisdiction is unknown is left
  # out, never guessed: a header, a note and a page number go that way.
  - name: ex21_link
    language: starlark
    description: The Exhibit 21 of a filing index page (rows line, url, cik, filed_on → exhibit_url, cik, filed_on).
    code: |
      FOLD = {"à": "a", "á": "a", "â": "a", "ä": "a", "ã": "a", "å": "a", "ç": "c", "é": "e", "è": "e",
              "ê": "e", "ë": "e", "í": "i", "ì": "i", "î": "i", "ï": "i", "ñ": "n", "ó": "o", "ò": "o",
              "ô": "o", "ö": "o", "õ": "o", "ø": "o", "ú": "u", "ù": "u", "û": "u", "ü": "u", "ý": "y", "ÿ": "y"}
      ENTITIES = {"amp": "&", "nbsp": " ", "rsquo": "'", "lsquo": "'", "quot": "\"", "lt": "<", "gt": ">"}

      def fold(s):
          chars = []
          for c in s.lower().elems():
              c = FOLD.get(c, c)
              chars.append(c.upper() if c.isalnum() else " ")
          return " ".join("".join(chars).split())

      def entities(raw):
          out = ""
          rest = raw
          for _ in range(len(raw) + 1):
              at = rest.find("&")
              if at < 0:
                  break
              out += rest[:at]
              rest = rest[at:]
              end = rest.find(";")
              c = None
              if end > 0 and end <= 10:
                  name = rest[1:end]
                  if name in ENTITIES:
                      c = ENTITIES[name]
                  elif name.startswith("#x") or name.startswith("#X"):
                      if name[2:] and [d for d in name[2:].lower().elems() if d not in "0123456789abcdef"] == []:
                          c = chr(int(name[2:], 16))
                  elif name.startswith("#") and name[1:].isdigit():
                      c = chr(int(name[1:]))
              if c == None:
                  out += "&"
                  rest = rest[1:]
              else:
                  out += c
                  rest = rest[end + 1:]
          return out + rest

      def text_of(cell):
          out = []
          in_tag = False
          for ch in cell.elems():
              if ch == "<":
                  in_tag = True
              elif ch == ">":
                  in_tag = False
                  out.append(" ")
              elif not in_tag:
                  out.append(ch)
          return " ".join(entities("".join(out)).replace("\u00a0", " ").split())

      def table_rows(html):
          lower = html.lower()
          out = []
          at = 0
          for _ in range(len(html)):
              start = lower.find("<tr", at)
              if start < 0:
                  break
              end = lower.find("</tr", start)
              if end < 0:
                  end = len(lower)
              row = html[start:end]
              rl = lower[start:end]
              cells = []
              c = 0
              for _ in range(len(row)):
                  o = rl.find("<td", c)
                  if o < 0:
                      break
                  b = rl.find(">", o)
                  b = len(row) if b < 0 else b + 1
                  e = rl.find("</td", b)
                  e = len(row) if e < 0 else e
                  cells.append(row[b:e])
                  c = e
                  if e >= len(row):
                      break
              out.append(cells)
              at = max(end, start + 3)
          return out

      def href_of(cell):
          at = cell.lower().find("href=")
          if at < 0:
              return None
          rest = cell[at + 5:]
          if rest == "":
              return None
          q = rest[0]
          if q == "\"" or q == "'":
              end = rest.find(q, 1)
              return rest[1:end] if end > 0 else None
          for i in range(len(rest)):
              if rest[i] in " \t\n>":
                  return rest[:i]
          return None

      def host_of(url):
          parts = url.split("/")
          return parts[2].lower() if len(parts) > 2 else ""

      def absolute(page, href):
          if href.startswith("https://") or href.startswith("http://"):
              return href
          parts = page.split("/")
          if len(parts) < 3:
              return None
          if href.startswith("/"):
              return parts[0] + "//" + parts[2] + href
          return "/".join(parts[:-1]) + "/" + href
      def one(rows):
          if not rows:
              return []
          page = rows[0].get("url") or ""
          html = "\n".join([r.get("line") or "" for r in rows])
          for row in table_rows(html):
              texts = [text_of(c).upper() for c in row]
              if not [t for t in texts if t == "EX-21" or t.startswith("EX-21.")]:
                  continue
              for cell in row:
                  h = href_of(cell)
                  if h == None:
                      continue
                  url = absolute(page, h)
                  # The exhibit lives in the same filing, on the same host.
                  if url == None or host_of(url) != host_of(page):
                      return []
                  return [{"exhibit_url": url, "cik": rows[0].get("cik"), "filed_on": rows[0].get("filed_on")}]
          return []
      def handle(rows):
          pages = {}
          order = []
          for r in rows:
              u = r.get("url") or ""
              if u not in pages:
                  pages[u] = []
                  order.append(u)
              pages[u].append(r)
          out = []
          for u in order:
              out.extend(one(pages[u]))
          return out
