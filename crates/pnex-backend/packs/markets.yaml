# Pack "Markets" (markets-research.md D523, D540-D542): the primary sources an
# analysis starts from, before any press. A company followed by its ticker
# gets its filings (documents kept and searchable) and its reported figures
# from SEC EDGAR; a macro series gets its values from FRED. A figure stays
# dated by the day it was published, so a test reads what was known then.
# Terms: SEC EDGAR is public, its fair-access rules ask for a declared contact
# and at most 10 requests per second. Some FRED series belong to third parties
# (their notes say so): check them before any use outside the org. ECB data
# are reusable with a citation; filings.xbrl.org is run by XBRL International.
# Daily prices come from Tiingo with the org's own key (vault secret
# `markets_tiingo_key`); its free plan is for personal internal use, a
# commercial use needs its commercial plan.
# Since 1.1.0 (D734-D738) the series of `move_series` are read every day and
# an abnormal session becomes a `market_event` of kind `market_move`, found
# from the series itself, never from the press.
# Since 1.2.0 the subsidiaries a group declares in the Exhibit 21 of its
# 10-K become organizations (`declared_key` = country and name) linked to it
# by `subsidiary_of`, nature `declared`, the exhibit as source.
# Since 1.3.0 (D810) a ticker entry of mode `volume` turns an unusually high
# traded volume into a `market_move` too (measure `volume`, up only), and
# ALFRED gives each FRED value as first published, with the org's FRED key
# (vault secret `markets_fred_key`, D811), so a past-dated test can read it.
# A company created by its SEC number is looked up in GLEIF (D812): a single
# match is proposed, as its LEI or as `same_company_as` the organization that
# already holds that LEI; nothing is merged.
# Since 1.4.0 (MK11, D807-D809) the symbols of `history_symbols` get their
# 1-minute bars from Binance's public files into the table
# `binance_klines_1m`, a closed month per transaction, never into objects. Binance's terms for redistribution or a
# SaaS use are not checked: the table stays private to the org.
# Since 1.13.0 the public price files are pipelines of this pack
# (`pipelines/*.yaml`, pipeline-engine.md), each in a new table loaded again
# from the start: times are read in their source's zone (D939).
# Since 1.5.0 (MK12) the pairs of `history_fx_pairs` get their bid/ask ticks
# from Dukascopy's public hour files into the table `dukascopy_quotes`, one
# day per transaction. Broker quotes, not exchange data; same terms caveat.
# Since 1.6.0 (MK13) the symbols of `history_trade_symbols` get every spot
# trade from Binance's daily files into the table `binance_trades`.
# MetaTrader 5 terminals are registered data sources (D847-D849, page MT5
# terminals): their bars and ticks go to `mt5_ohlcv_1m` and `mt5_ticks`.
# `histdata_pairs` loads HistData.com's free 1-minute bid bars (forex, metals,
# oil, indices) into `histdata_m1`, a closed year per file, by the pipeline
# `pipelines/histdata_m1.yaml` (pipeline-engine.md D939: New York time with
# daylight saving).
# Since 1.7.0 (D880) the series of `bis_series` come from the BIS Data Portal
# (SDMX CSV): by default the policy rates of the G10 central banks, daily
# since 2000. BIS terms: free for a non-commercial use, the BIS cited as the
# source; its statistics have their own terms ("About BIS statistics"), to
# check before any use outside the org. A `bis:` entry of `move_series`
# (D888) watches a BIS series: each policy rate decision of the G10 becomes a
# `market_move` (D881). The series must also be in `bis_series`.
# Scheduled dates (D882) come from each institution's own calendar (setting
# `calendars`): the BLS release schedule (iCalendar, read with the declared
# contact), the FOMC and ECB meeting pages; each date is a time range of the
# org (D182), on the calendar page, updated in place when it moves.
# `eurostat_series` reads Eurostat (SDMX CSV, reusable with a citation):
# HICP sub-indices and house prices by default (D883, D884). Since 2026 the
# HICP is published in COICOP 2018 (`prc_hicp_minr`, all items = `AP`); the
# former `prc_hicp_manr` stops in December 2025. `chokepoints` reads IMF PortWatch's daily transits
# (D885); its terms ask for a citation of the IMF and its partners.
# `cot_markets` reads the CFTC's weekly Commitments of Traders (US public
# domain): gold, silver and WTI by default, dated by the Friday release.
# DFII10 (10-year real yield) and T10YIE (breakeven inflation) join the
# FRED series: with the dollar, the macro drivers of gold. `eia_series`
# reads the EIA (US public domain) with the org's own key (vault secret
# `markets_eia_key`): weekly oil stocks and production by default.
# Since 1.10.0 (markets-research.md H.7) countries (type `nation`), the
# `exposed_to` link a member declares (country, company or macro series → instrument, it
# propagates a shock), a price move threshold per instrument and the cause
# → effect pairs read by `GET /markets/chains`: candidate chains computed at
# reading time, never stored as a cause (D742).
# Since 1.11.0 (D914) the pack declares `history: true`: every state of its
# objects is kept for point-in-time reads.
key: markets
name: Markets
names: {fr: "Marchés"}
version: "1.18.0"
history: true
requires: [companies]
description: Companies followed by ticker with their filings and reported figures (SEC EDGAR), and macroeconomic series (FRED), each value dated by its publication. An aid to analysis, not investment advice.
descriptions: {fr: "Sociétés suivies par ticker avec leurs dépôts et chiffres publiés (SEC EDGAR), et séries macroéconomiques (FRED), chaque valeur datée par sa publication. Une aide à l'analyse, pas un conseil en investissement."}
settings:
  - key: price_move_threshold_pct
    name: Price move threshold (% in 1 h)
    names: {fr: "Seuil de mouvement de cours (% en 1 h)"}
    description: A 1-hour return at least this large is a price move of the causal chains, unless the instrument sets its own.
    descriptions: {fr: "Un rendement sur 1 h au moins aussi grand est un mouvement de cours des chaînes causales, sauf seuil propre à l'instrument."}
    kind: number
    default: 1.5
    min: 0.01
    max: 100
  - key: source_contact
    name: Contact declared to the sources
    names: {fr: "Contact déclaré aux sources"}
    description: "Name and email sent in each request: the SEC refuses a client that does not declare one. Required."
    descriptions: {fr: "Nom et e-mail envoyés dans chaque requête : la SEC refuse un client qui n'en déclare pas. Obligatoire."}
    kind: text
    default: ""
  - key: covered_tickers
    name: US tickers followed
    names: {fr: "Tickers américains suivis"}
    description: Comma-separated tickers, for example ACME, BETA. Only these companies are created and read.
    descriptions: {fr: "Tickers séparés par des virgules, par exemple ACME, BETA. Seules ces sociétés sont créées et lues."}
    kind: text
    default: ""
  - key: covered_leis
    name: European companies followed (LEI)
    names: {fr: "Sociétés européennes suivies (LEI)"}
    description: Comma-separated legal entity identifiers. Their annual and half-year reports are read (ESEF).
    descriptions: {fr: "Identifiants LEI séparés par des virgules. Leurs rapports annuels et semestriels sont lus (ESEF)."}
    kind: text
    default: ""
  - key: benchmark_ticker
    name: Benchmark of the event studies
    names: {fr: "Référence des études d'événement"}
    description: The ticker a price move is compared to.
    descriptions: {fr: "Le ticker auquel un mouvement de cours est comparé."}
    kind: text
    default: "SPY"
  - key: ecb_series
    name: European series (ECB)
    names: {fr: "Séries européennes (BCE)"}
    description: "Comma-separated ECB series keys: main rate, inflation, euro-dollar by default."
    descriptions: {fr: "Clés de séries BCE séparées par des virgules : taux directeur, inflation, euro-dollar par défaut."}
    kind: text
    default: "FM.D.U2.EUR.4F.KR.MRR_FR.LEV, ICP.M.U2.N.000000.4.ANR, EXR.D.USD.EUR.SP00.A"
  - key: bis_series
    name: Central bank series (BIS)
    names: {fr: "Séries des banques centrales (BRI)"}
    description: "Comma-separated BIS series keys (dataflow.key). Policy rates of the G10 central banks by default: WS_CBPOL.D.<country>, XM = euro area."
    descriptions: {fr: "Clés de séries BRI (flux.clé) séparées par des virgules. Taux directeurs des banques centrales du G10 par défaut : WS_CBPOL.D.<pays>, XM = zone euro."}
    kind: text
    default: "WS_CBPOL.D.US, WS_CBPOL.D.XM, WS_CBPOL.D.JP, WS_CBPOL.D.GB, WS_CBPOL.D.CA, WS_CBPOL.D.CH, WS_CBPOL.D.AU, WS_CBPOL.D.NZ, WS_CBPOL.D.SE, WS_CBPOL.D.NO, WS_SPP.Q.US.R.628, WS_SPP.Q.XM.R.628, WS_SPP.Q.GB.R.628"
  - key: calendars
    name: Calendars of releases and meetings
    names: {fr: "Calendriers des publications et réunions"}
    description: "Comma-separated calendars read every day into the org's calendar: bls (US releases: CPI, employment, PPI), fomc (Federal Reserve decisions), ecb (ECB monetary policy decisions)."
    descriptions: {fr: "Calendriers séparés par des virgules, lus chaque jour dans le calendrier de l'org : bls (publications américaines : IPC, emploi, prix à la production), fomc (décisions de la Réserve fédérale), ecb (décisions de politique monétaire de la BCE)."}
    kind: text
    default: "bls, fomc, ecb"
  - key: cot_markets
    name: Positions of traders (CFTC COT)
    names: {fr: "Positions des opérateurs (CFTC COT)"}
    description: "Comma-separated CFTC market codes of the weekly Commitments of Traders: 088691 gold, 084691 silver, 067651 WTI crude oil by default. Each code becomes a series of open interest and of long, short and net positions by kind of trader, dated by its Friday release."
    descriptions: {fr: "Codes de marché CFTC séparés par des virgules, du rapport hebdomadaire Commitments of Traders : 088691 or, 084691 argent, 067651 pétrole WTI par défaut. Chaque code devient une série de positions ouvertes et de positions acheteuses, vendeuses et nettes par type d'opérateur, datée par sa publication du vendredi."}
    kind: text
    default: "088691, 084691, 067651"
  - key: eia_series
    name: Oil and gas statistics (EIA)
    names: {fr: "Statistiques pétrole et gaz (EIA)"}
    description: "Comma-separated EIA series ids, read with the org's EIA key (vault secret markets_eia_key, free on eia.gov). By default the weekly US stocks of crude oil (excluding the strategic reserve), gasoline and distillates, and the weekly crude production, each known on the Wednesday it is published."
    descriptions: {fr: "Identifiants de séries EIA séparés par des virgules, lus avec la clé EIA de l'org (secret markets_eia_key au coffre, gratuite sur eia.gov). Par défaut, les stocks hebdomadaires américains de pétrole brut (hors réserve stratégique), d'essence et de distillats, et la production hebdomadaire de brut, chacun connu le mercredi de sa publication."}
    kind: text
    default: "PET.WCESTUS1.W, PET.WGTSTUS1.W, PET.WDISTUS1.W, PET.WCRFPUS2.W"
  - key: eurostat_series
    name: European statistics (Eurostat)
    names: {fr: "Statistiques européennes (Eurostat)"}
    description: "Comma-separated Eurostat series keys (dataflow.key). By default the euro area HICP (all items, energy, food, services, core) and the house prices of the euro area, France and Germany."
    descriptions: {fr: "Clés de séries Eurostat (flux.clé) séparées par des virgules. Par défaut l'IPCH de la zone euro (ensemble, énergie, alimentation, services, sous-jacent) et les prix des logements de la zone euro, de la France et de l'Allemagne."}
    kind: text
    default: "prc_hicp_minr.M.RCH_A.AP.EA, prc_hicp_minr.M.RCH_A.NRG.EA, prc_hicp_minr.M.RCH_A.FOOD.EA, prc_hicp_minr.M.RCH_A.SERV.EA, prc_hicp_minr.M.RCH_A.AP_X_NRG_FOOD.EA, prc_hpi_q.Q.TOTAL.RCH_A.EA, prc_hpi_q.Q.TOTAL.RCH_A.FR, prc_hpi_q.Q.TOTAL.RCH_A.DE"
  - key: chokepoints
    name: Shipping chokepoints (IMF PortWatch)
    names: {fr: "Points de passage maritimes (FMI PortWatch)"}
    description: "Comma-separated PortWatch chokepoint ids: chokepoint1 Suez, 2 Panama, 3 Bosporus, 4 Bab el-Mandeb, 5 Malacca, 6 Hormuz, 7 Cape of Good Hope, 8 Gibraltar, 9 Dover, up to 28."
    descriptions: {fr: "Identifiants PortWatch séparés par des virgules : chokepoint1 Suez, 2 Panama, 3 Bosphore, 4 Bab el-Mandeb, 5 Malacca, 6 Ormuz, 7 cap de Bonne-Espérance, 8 Gibraltar, 9 Pas de Calais, jusqu'à 28."}
    kind: text
    default: "chokepoint1, chokepoint2, chokepoint3, chokepoint4, chokepoint5, chokepoint6, chokepoint7, chokepoint8"
  - key: macro_series
    name: Macroeconomic series (FRED)
    names: {fr: "Séries macroéconomiques (FRED)"}
    description: Comma-separated FRED codes.
    descriptions: {fr: "Codes FRED séparés par des virgules."}
    kind: text
    default: "CPIAUCSL, CPILFESL, UNRATE, FEDFUNDS, DGS10, GDPC1, USSTHPI, DFII10, T10YIE"
  # D737: series watched for abnormal sessions. The defaults are public
  # domain (EIA oil, Federal Reserve dollar and rate) or need a citation
  # (VIX: Chicago Board Options Exchange). FRED's SP500 and NASDAQCOM are
  # left out: S&P Dow Jones Indices and Nasdaq require a prior permission
  # for any reproduction; equity indices come from ETFs read with Tiingo.
  - key: move_series
    name: Series watched for abnormal sessions (FRED, BIS)
    names: {fr: "Séries surveillées (séances anormales, FRED, BRI)"}
    description: "Comma-separated CODE:mode:class entries, optionally :k:floor; a FRED code, or bis:KEY for a series of the BIS setting. Mode log_return (prices, indices) or diff (rates, VIX). Class equity_index, commodity, rates, volatility, fx or crypto. By default the G10 policy rates catch every decision of at least 5 bp (k 1, floor 0.05). FRED's SP500 and NASDAQCOM need the permission of S&P Dow Jones Indices and Nasdaq before any use."
    descriptions: {fr: "Entrées CODE:mode:classe séparées par des virgules, éventuellement :k:plancher ; un code FRED, ou bis:CLÉ pour une série du réglage BRI. Mode log_return (cours, indices) ou diff (taux, VIX). Classe equity_index, commodity, rates, volatility, fx ou crypto. Par défaut, les taux directeurs du G10 relèvent chaque décision d'au moins 5 pb (k 1, plancher 0,05). SP500 et NASDAQCOM de FRED exigent l'accord de S&P Dow Jones Indices et de Nasdaq avant tout usage."}
    kind: text
    default: "VIXCLS:diff:volatility, DGS10:diff:rates, DCOILWTICO:log_return:commodity, DCOILBRENTEU:log_return:commodity, DTWEXBGS:log_return:fx, bis:WS_CBPOL.D.US:diff:rates:1:0.05, bis:WS_CBPOL.D.XM:diff:rates:1:0.05, bis:WS_CBPOL.D.JP:diff:rates:1:0.05, bis:WS_CBPOL.D.GB:diff:rates:1:0.05, bis:WS_CBPOL.D.CA:diff:rates:1:0.05, bis:WS_CBPOL.D.CH:diff:rates:1:0.05, bis:WS_CBPOL.D.AU:diff:rates:1:0.05, bis:WS_CBPOL.D.NZ:diff:rates:1:0.05, bis:WS_CBPOL.D.SE:diff:rates:1:0.05, bis:WS_CBPOL.D.NO:diff:rates:1:0.05"
  - key: move_tickers
    name: Tickers watched for abnormal sessions (Tiingo)
    names: {fr: "Tickers surveillés (séances anormales, Tiingo)"}
    description: "Same entries as above for tickers, read with the org's Tiingo key: SPY follows the S&P 500, QQQ the Nasdaq-100. Mode volume watches the traded volume instead of the price: a session at several times its usual volume (k sigmas, at least twice by default)."
    descriptions: {fr: "Mêmes entrées que ci-dessus pour des tickers, lus avec la clé Tiingo de l'org : SPY suit le S&P 500, QQQ le Nasdaq-100. Le mode volume surveille le volume échangé au lieu du cours : une séance à plusieurs fois son volume habituel (k sigmas, au moins le double par défaut)."}
    kind: text
    default: "SPY:log_return:equity_index, QQQ:log_return:equity_index, SPY:volume:equity_index, QQQ:volume:equity_index"
  - key: session_summary
    name: Daily session summary (AI)
    names: {fr: "Synthèse quotidienne de séance (IA)"}
    description: "on: after a session with abnormal moves, the org's own AI provider (file analyses) writes a short note sent with the session notice. It reads only the session's moves, filings and world events, never decides nor writes. off by default."
    descriptions: {fr: "on : après une séance avec des mouvements anormaux, le fournisseur d'IA de l'org (analyses de fichiers) rédige une note courte envoyée avec l'avis de séance. Il lit seulement les mouvements, dépôts et événements du monde de la séance, ne décide ni n'écrit. off par défaut."}
    kind: text
    default: "off"
  - key: history_symbols
    name: Symbols of the minute history (Binance)
    names: {fr: "Symboles de l'historique à la minute (Binance)"}
    description: "Comma-separated Binance spot symbols (BTCUSDT, ETHUSDT…) whose 1-minute bars are loaded into the table binance_klines_1m, from Binance's public files. Empty: nothing is loaded."
    descriptions: {fr: "Symboles spot Binance (BTCUSDT, ETHUSDT…), séparés par des virgules, dont les bougies d'une minute sont chargées dans la table binance_klines_1m, depuis les fichiers publics de Binance. Vide : rien n'est chargé."}
    kind: text
    default: ""
  - key: history_from
    name: First month of the minute history
    names: {fr: "Premier mois de l'historique à la minute"}
    description: "YYYY-MM. The history is loaded from this month; 2017-08, Binance's first, when empty."
    descriptions: {fr: "AAAA-MM. L'historique est chargé à partir de ce mois ; 2017-08, le premier de Binance, si vide."}
    kind: text
    default: "2017-08"
  - key: history_trade_symbols
    name: Symbols of the trade history (Binance)
    names: {fr: "Symboles de l'historique des transactions (Binance)"}
    description: "Comma-separated Binance spot symbols whose every trade is loaded into the table binance_trades, one day per file. Much bigger than the minute bars: a busy symbol weighs hundreds of MB a day. Empty: nothing is loaded."
    descriptions: {fr: "Symboles spot Binance, séparés par des virgules, dont chaque transaction est chargée dans la table binance_trades, un fichier par jour. Bien plus lourd que les bougies minute : un symbole actif pèse des centaines de Mo par jour. Vide : rien n'est chargé."}
    kind: text
    default: ""
  - key: history_trade_from
    name: First month of the trade history
    names: {fr: "Premier mois de l'historique des transactions"}
    description: "YYYY-MM. The trades are loaded from this month; one month back when empty."
    descriptions: {fr: "AAAA-MM. Les transactions sont chargées à partir de ce mois ; un mois en arrière si vide."}
    kind: text
    default: ""
  - key: histdata_pairs
    name: Pairs of the HistData history
    names: {fr: "Paires de l'historique HistData"}
    description: "Comma-separated HistData codes (EURUSD, XAUUSD, SPXUSD, BCOUSD…) whose free 1-minute bid bars are loaded into the table histdata_m1, a closed year per file, one file every five minutes. HistData publishes no license: keep the table inside the org. Empty: nothing is loaded."
    descriptions: {fr: "Codes HistData (EURUSD, XAUUSD, SPXUSD, BCOUSD…), séparés par des virgules, dont les bougies bid d'une minute, gratuites, sont chargées dans la table histdata_m1, une année close par fichier, un fichier toutes les cinq minutes. HistData ne publie aucune licence : garder la table dans l'organisation. Vide : rien n'est chargé."}
    kind: text
    default: ""
  - key: histdata_from
    name: First year of the HistData history
    names: {fr: "Première année de l'historique HistData"}
    description: "YYYY. Loaded from this year; 2000, HistData's first, when empty. A year before a pair's first stays empty."
    descriptions: {fr: "AAAA. Chargé à partir de cette année ; 2000, la première de HistData, si vide. Une année antérieure au début d'une paire reste vide."}
    kind: text
    default: ""
  - key: histdata_tick_pairs
    name: Pairs of the HistData ticks
    names: {fr: "Paires des ticks HistData"}
    description: "Comma-separated HistData codes (XAUUSD, EURUSD…) whose free bid/ask ticks are loaded into the table histdata_quotes, a closed month per file, one file every five minutes. A month of XAUUSD is about 4.7 million ticks. HistData publishes no license: keep the table inside the org. Empty: nothing is loaded."
    descriptions: {fr: "Codes HistData (XAUUSD, EURUSD…), séparés par des virgules, dont les ticks bid/ask gratuits sont chargés dans la table histdata_quotes, un mois clos par fichier, un fichier toutes les cinq minutes. Un mois de XAUUSD compte environ 4,7 millions de ticks. HistData ne publie aucune licence : garder la table dans l'organisation. Vide : rien n'est chargé."}
    kind: text
    default: ""
  - key: histdata_tick_from
    name: First month of the HistData ticks
    names: {fr: "Premier mois des ticks HistData"}
    description: "YYYY-MM. Loaded from this month; last month when empty."
    descriptions: {fr: "AAAA-MM. Chargé à partir de ce mois ; le mois dernier si vide."}
    kind: text
    default: ""
  - key: history_fx_pairs
    name: Pairs of the tick history (Dukascopy)
    names: {fr: "Paires de l'historique des ticks (Dukascopy)"}
    description: "Comma-separated forex pairs (EURUSD, USDJPY…) whose bid/ask ticks are loaded into the table dukascopy_quotes, from Dukascopy's public files. Only six-letter forex pairs are read. Empty: nothing is loaded."
    descriptions: {fr: "Paires forex (EURUSD, USDJPY…), séparées par des virgules, dont les ticks bid/ask sont chargés dans la table dukascopy_quotes, depuis les fichiers publics de Dukascopy. Seules les paires forex de six lettres sont lues. Vide : rien n'est chargé."}
    kind: text
    default: ""
  - key: history_fx_from
    name: First month of the tick history
    names: {fr: "Premier mois de l'historique des ticks"}
    description: "YYYY-MM. The ticks are loaded from this month; twelve months back when empty."
    descriptions: {fr: "AAAA-MM. Les ticks sont chargés à partir de ce mois ; douze mois en arrière si vide."}
    kind: text
    default: ""
  - key: move_notify_channels
    name: Channels of the abnormal session notice
    names: {fr: "Canaux de l'avis de séance anormale"}
    description: "Comma-separated names of the org's notification channels (e-mail, Slack, ntfy…) that also get the notice of each abnormal session. The in-app notice is always sent."
    descriptions: {fr: "Noms des canaux de notification de l'org (e-mail, Slack, ntfy…), séparés par des virgules, qui reçoivent aussi l'avis de chaque séance anormale. L'avis dans l'application part toujours."}
    kind: text
    default: ""
extends:
  - type: organization
    properties:
      - { key: cik, name: SEC company number (CIK), names: {fr: "Numéro SEC (CIK)"}, kind: text, max_len: 10, unique: true }
      - { key: ticker, name: Ticker, names: {fr: "Ticker"}, kind: text, max_len: 16, indexed: true }
      - key: market_followed
        name: Followed for markets
        names: {fr: "Suivie pour les marchés"}
        kind: enum
        values: [followed]
        labels: {followed: {fr: "Suivie", en: "Followed"}}
        indexed: true
      - { key: declared_key, name: Declared as, names: {fr: "Déclarée comme"}, description: "Country and name of a company known by a group's declaration only (Exhibit 21 of a 10-K): the key it is found again by.", descriptions: {fr: "Pays et nom d'une société connue seulement par la déclaration d'un groupe (Exhibit 21 d'un 10-K) : la clé qui la retrouve."}, kind: text, max_len: 400, unique: true }
      - { key: incorporated_in, name: Incorporated in, names: {fr: "Immatriculée en"}, description: "The jurisdiction as the declaration writes it (a US state, a country).", descriptions: {fr: "La juridiction telle que la déclaration l'écrit (un État américain, un pays)."}, kind: text, max_len: 120 }
      - { key: market_names, name: Names in the press, names: {fr: "Noms dans la presse"}, description: "Comma-separated names the press uses, such as Nvidia for NVIDIA CORP.", descriptions: {fr: "Noms utilisés par la presse, séparés par des virgules, par exemple Nvidia pour NVIDIA CORP."}, kind: text, max_len: 500 }
types:
  - key: instrument
    name: Instrument
    names: {fr: "Instrument"}
    icon: chart
    properties:
      - { key: ticker, name: Ticker, names: {fr: "Ticker"}, kind: text, max_len: 16, unique: true, required: true }
