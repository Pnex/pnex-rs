      def country_of(jurisdiction):
          j = jurisdiction.strip().rstrip(".").lower().replace("\u00a0", " ").replace(",", " ")
          j = " ".join(j.split())
          if j in US_STATES:
              return "US"
          return PLACES.get(j)

      def declared(name, place):
          name = " ".join(name.split())
          jurisdiction = " ".join(place.split())
          country = country_of(jurisdiction)
          if country == None or len(name) < 2 or len(name) > 255 or name.lower().startswith("name"):
              return None
          if not [c for c in name.elems() if c.isalpha()]:
              return None
          return {"name": name, "jurisdiction": jurisdiction, "country": country}

      def from_line(line):
          line = line.strip()
          o = line.rfind("(")
          if o >= 0 and line.endswith(")"):
              return declared(line[:o], line[o + 1:len(line) - 1])
          cut = -1
          for sep in ["\t", "  ", ".."]:
              cut = line.find(sep)
              if cut >= 0:
                  break
          if cut < 0:
              return None
          return declared(line[:cut], line[cut:].strip(". \t"))

      def one(rows):
          if not rows:
              return []
          first = rows[0]
          doc = "\n".join([r.get("line") or "" for r in rows])
          found = []
          if "<tr" in doc.lower():
              for row in table_rows(doc):
                  cells = [t for t in [text_of(c) for c in row] if t != ""]
                  if len(cells) >= 2:
                      found.append(declared(cells[0], cells[-1]))
                  elif len(cells) == 1:
                      found.append(from_line(cells[0]))
          else:
              for line in doc.split("\n"):
                  found.append(from_line(line))
          out = []
          seen = {}
          for d in found:
              if d == None:
                  continue
              key = d["country"] + "|" + fold(d["name"])
              if key in seen or len(out) >= 5000:
                  continue
              seen[key] = True
              out.append({"cik": first.get("cik"), "filed_on": first.get("filed_on"), "source": first.get("url"),
                          "name": d["name"], "jurisdiction": d["jurisdiction"], "country": d["country"],
                          "declared_key": key})
          return out

      def handle(rows):
          pages = {}
          order = []
          for r in rows:
              u = r.get("url") or ""
              if u not in pages:
                  pages[u] = []
                  order.append(u)
              pages[u].append(r)
          out = []
          for u in order:
              out.extend(one(pages[u]))
          return out
