# The coded events of the last two days in the countries watched, one lead
# per country, kind and day, unconfirmed. Source GDELT Project.
key: gdelt_events
name: World events (GDELT)
hosts: [data.gdeltproject.org]
requires: [world_events.geo_watch, world_events.gdelt_codes]
steps:
  # One export every 15 minutes: `YYYYMMDDHHMM00.export.CSV.zip`.
  - enumerate:
      as: slices
      cross:
        - { as: hour, periods: hour, from: "-48h" }
        - { as: quarter, values: ["00", "15", "30", "45"] }
  - fetch:
      as: zip
      for_each: slices
      url: "http://data.gdeltproject.org/gdeltv2/{{hour_y}}{{hour_m}}{{hour_d}}{{hour_h}}{{quarter}}00.export.CSV.zip"
      missing_is_empty: true
  - unpack: { as: files, from: zip, entries: ["*.CSV"] }
  # The 61 tab-separated fields of a GDELT 2.0 event; countries in FIPS
  # 10-4, kept in ISO 3166 alpha-2 (both halves of Palestine are PS, a code
  # of no country gives none).
  - read:
      as: lines
      from: files
      format: csv
      delimiter: "\t"
      header: false
      skip_invalid: true
      columns:
        - { name: id, at: 0 }
        - { name: day, at: 1, type: date, format: "%Y%m%d" }
        - { name: actor1, at: 6, optional: true }
        - { name: actor2, at: 16, optional: true }
        - { name: code, at: 26 }
        - { name: goldstein, at: 30, type: float, optional: true }
        - { name: sources, at: 32, type: integer, optional: true }
        - { name: articles, at: 33, type: integer, optional: true }
        - { name: place, at: 52, optional: true }
        - name: country
          at: 53
          optional: true
          map: { "AA": "AW", "AC": "AG", "AE": "AE", "AF": "AF", "AG": "DZ", "AJ": "AZ", "AL": "AL", "AM": "AM", "AN": "AD", "AO": "AO", "AQ": "AS", "AR": "AR", "AS": "AU", "AU": "AT", "AV": "AI", "AY": "AQ", "BA": "BH", "BB": "BB", "BC": "BW", "BD": "BM", "BE": "BE", "BF": "BS", "BG": "BD", "BH": "BZ", "BK": "BA", "BL": "BO", "BM": "MM", "BN": "BJ", "BO": "BY", "BP": "SB", "BR": "BR", "BT": "BT", "BU": "BG", "BV": "BV", "BX": "BN", "BY": "BI", "CA": "CA", "CB": "KH", "CD": "TD", "CE": "LK", "CF": "CG", "CG": "CD", "CH": "CN", "CI": "CL", "CJ": "KY", "CK": "CC", "CM": "CM", "CN": "KM", "CO": "CO", "CS": "CR", "CT": "CF", "CU": "CU", "CV": "CV", "CW": "CK", "CY": "CY", "DA": "DK", "DJ": "DJ", "DO": "DM", "DR": "DO", "EC": "EC", "EG": "EG", "EI": "IE", "EK": "GQ", "EN": "EE", "ER": "ER", "ES": "SV", "ET": "ET", "EZ": "CZ", "FG": "GF", "FI": "FI", "FJ": "FJ", "FK": "FK", "FM": "FM", "FO": "FO", "FP": "PF", "FR": "FR", "FS": "TF", "GA": "GM", "GB": "GA", "GG": "GE", "GH": "GH", "GI": "GI", "GJ": "GD", "GK": "GG", "GL": "GL", "GM": "DE", "GP": "GP", "GQ": "GU", "GR": "GR", "GT": "GT", "GV": "GN", "GY": "GY", "GZ": "PS", "HA": "HT", "HK": "HK", "HM": "HM", "HO": "HN", "HR": "HR", "HU": "HU", "IC": "IS", "ID": "ID", "IM": "IM", "IN": "IN", "IO": "IO", "IR": "IR", "IS": "IL", "IT": "IT", "IV": "CI", "IZ": "IQ", "JA": "JP", "JE": "JE", "JM": "JM", "JO": "JO", "KE": "KE", "KG": "KG", "KN": "KP", "KR": "KI", "KS": "KR", "KT": "CX", "KU": "KW", "KV": "XK", "KZ": "KZ", "LA": "LA", "LE": "LB", "LG": "LV", "LH": "LT", "LI": "LR", "LO": "SK", "LS": "LI", "LT": "LS", "LU": "LU", "LY": "LY", "MA": "MG", "MB": "MQ", "MC": "MO", "MD": "MD", "MF": "YT", "MG": "MN", "MH": "MS", "MI": "MW", "MJ": "ME", "MK": "MK", "ML": "ML", "MN": "MC", "MO": "MA", "MP": "MU", "MR": "MR", "MT": "MT", "MU": "OM", "MV": "MV", "MX": "MX", "MY": "MY", "MZ": "MZ", "NC": "NC", "NE": "NU", "NF": "NF", "NG": "NE", "NH": "VU", "NI": "NG", "NL": "NL", "NN": "SX", "NO": "NO", "NP": "NP", "NR": "NR", "NS": "SR", "NU": "NI", "NZ": "NZ", "OD": "SS", "PA": "PY", "PC": "PN", "PE": "PE", "PK": "PK", "PL": "PL", "PM": "PA", "PO": "PT", "PP": "PG", "PS": "PW", "PU": "GW", "QA": "QA", "RE": "RE", "RI": "RS", "RM": "MH", "RN": "MF", "RO": "RO", "RP": "PH", "RQ": "PR", "RS": "RU", "RW": "RW", "SA": "SA", "SB": "PM", "SC": "KN", "SE": "SC", "SF": "ZA", "SG": "SN", "SH": "SH", "SI": "SI", "SL": "SL", "SM": "SM", "SN": "SG", "SO": "SO", "SP": "ES", "ST": "LC", "SU": "SD", "SV": "SJ", "SW": "SE", "SX": "GS", "SY": "SY", "SZ": "CH", "TB": "BL", "TD": "TT", "TH": "TH", "TI": "TJ", "TK": "TC", "TL": "TK", "TN": "TO", "TO": "TG", "TP": "ST", "TS": "TN", "TT": "TL", "TU": "TR", "TV": "TV", "TW": "TW", "TX": "TM", "TZ": "TZ", "UC": "CW", "UG": "UG", "UK": "GB", "UP": "UA", "US": "US", "UV": "BF", "UY": "UY", "UZ": "UZ", "VC": "VC", "VE": "VE", "VI": "VG", "VM": "VN", "VQ": "VI", "VT": "VA", "WA": "NA", "WE": "PS", "WF": "WF", "WI": "EH", "WS": "WS", "WZ": "SZ", "YM": "YE", "ZA": "ZM", "ZI": "ZW", "*": "" }
        - { name: region, at: 54, optional: true }
        - { name: lat, at: 56, type: float, optional: true }
        - { name: lon, at: 57, type: float, optional: true }
        - { name: added, at: 59, type: timestamp, format: "%Y%m%d%H%M%S" }
  - enumerate: { as: countries, cross: [{ as: country, setting: world_events.geo_watch, case: upper }] }
  - enumerate: { as: codes, cross: [{ as: prefix, setting: world_events.gdelt_codes }] }
  # One lead per (country, code family, day): the longest family a code
  # starts with; lines of one source at least and a Goldstein score of -5
  # or less (a line is born with one source, later mentions land elsewhere).
  - sql:
      as: leads
      sql: |
        WITH watch AS (SELECT DISTINCT country AS c FROM countries),
        families AS (SELECT DISTINCT prefix FROM codes),
        matched AS (
          SELECT l.*, f.prefix AS family,
                 row_number() OVER (PARTITION BY l.id ORDER BY length(f.prefix) DESC) AS rk
          FROM lines AS l JOIN families AS f ON starts_with(l.code, f.prefix)
          WHERE l.country IS NOT NULL
            AND (l.country IN (SELECT c FROM watch) OR EXISTS (SELECT 1 FROM watch WHERE c = '*'))
            AND l.sources >= 1 AND l.goldstein <= -5),
        kept AS (SELECT * FROM matched WHERE rk = 1),
        leads AS (
          SELECT country, family, day,
                 sum(sources) AS source_count, sum(articles) AS article_count,
                 avg(CASE WHEN lat BETWEEN -90 AND 90 AND lon BETWEEN -180 AND 180 THEN lat END) AS lat,
                 avg(CASE WHEN lat BETWEEN -90 AND 90 AND lon BETWEEN -180 AND 180 THEN lon END) AS lon,
                 min(added) AS first_added, max(added) AS last_added
          FROM kept GROUP BY country, family, day),
        ids AS (
          SELECT country, family, day, id,
                 row_number() OVER (PARTITION BY country, family, day ORDER BY id) AS n
          FROM (SELECT DISTINCT country, family, day, id FROM kept) AS t),
        id_lists AS (
          SELECT country, family, day, string_agg(id, ',' ORDER BY id) AS gdelt_ids
          FROM ids WHERE n <= 50 GROUP BY country, family, day),
        place_counts AS (
          SELECT country, family, day, place, count(*) AS c FROM kept
          WHERE place IS NOT NULL GROUP BY country, family, day, place),
        places AS (
          SELECT country, family, day, place FROM (
            SELECT *, row_number() OVER (PARTITION BY country, family, day ORDER BY c DESC, place) AS n
            FROM place_counts) AS t WHERE n = 1),
        region_counts AS (
          SELECT country, family, day, region, count(*) AS c FROM kept
          WHERE region IS NOT NULL GROUP BY country, family, day, region),
        regions AS (
          SELECT country, family, day, region FROM (
            SELECT *, row_number() OVER (PARTITION BY country, family, day ORDER BY c DESC, region) AS n
            FROM region_counts) AS t WHERE n = 1),
        actor_counts AS (
          SELECT country, family, day, actor, count(*) AS c FROM (
            SELECT country, family, day, actor1 AS actor FROM kept WHERE actor1 IS NOT NULL
            UNION ALL
            SELECT country, family, day, actor2 FROM kept WHERE actor2 IS NOT NULL) AS a
          GROUP BY country, family, day, actor),
        actors AS (
          SELECT country, family, day, string_agg(actor, ', ' ORDER BY c DESC, actor) AS actors FROM (
            SELECT *, row_number() OVER (PARTITION BY country, family, day ORDER BY c DESC, actor) AS n
            FROM actor_counts) AS t WHERE n <= 5 GROUP BY country, family, day),
        kinds AS (
          SELECT DISTINCT family,
                 CASE WHEN starts_with(family, '163') THEN 'sanctions'
                      WHEN starts_with(family, '191') THEN 'blockade'
                      WHEN starts_with(family, '0871') THEN 'ceasefire'
                      WHEN starts_with(family, '18') THEN 'attack'
                      WHEN starts_with(family, '19') OR starts_with(family, '20') THEN 'armed_conflict'
                      ELSE 'other' END AS kind
          FROM leads)
        SELECT concat('gdelt:', d.country, ':', d.family, ':', CAST(d.day AS VARCHAR)) AS ref,
               concat(coalesce(p.place, d.country), ' · ', k.kind, ' · ', CAST(d.day AS VARCHAR)) AS title,
               k.kind, d.family AS code, CAST(d.day AS VARCHAR) AS event_at,
               to_char(d.first_added, '%Y-%m-%dT%H:%M:%SZ') AS published_at,
               to_char(d.last_added, '%Y-%m-%dT%H:%M:%SZ') AS known_at,
               d.country, r.region,
               CASE WHEN d.lat IS NOT NULL
                    THEN concat('{"lat": ', CAST(d.lat AS VARCHAR), ', "lon": ', CAST(d.lon AS VARCHAR), '}') END AS location,
               a.actors, d.source_count, d.article_count, i.gdelt_ids
        FROM leads AS d
        JOIN kinds AS k ON k.family = d.family
        LEFT JOIN places AS p ON p.country = d.country AND p.family = d.family AND p.day = d.day
        LEFT JOIN regions AS r ON r.country = d.country AND r.family = d.family AND r.day = d.day
        LEFT JOIN actors AS a ON a.country = d.country AND a.family = d.family AND a.day = d.day
        LEFT JOIN id_lists AS i ON i.country = d.country AND i.family = d.family AND i.day = d.day
  - write: { from: leads, table: { name: gdelt_events, replace: true } }
tests:
  - name: one lead per country, family and day
    today: "2026-11-05"
    settings: { world_events.geo_watch: "UA, RU", world_events.gdelt_codes: "18,19,190" }
    given:
      "http://data.gdeltproject.org/gdeltv2/20261105101500.export.CSV.zip": gdelt_export.zip
    expect:
      lines:
        rows: 5
      leads:
        rows: 2
        contains:
          - { ref: "gdelt:UA:190:2026-11-05", kind: armed_conflict, event_at: "2026-11-05", country: UA, source_count: "3", gdelt_ids: "1001,1002", actors: "MILITARY, REBEL", title: "Kyiv, Ukraine · armed_conflict · 2026-11-05", published_at: "2026-11-05T10:15:00Z" }
          - { ref: "gdelt:RU:18:2026-11-04", kind: attack, country: RU }
  - name: an empty watch list reads nothing
    today: "2026-11-05"
    settings: { world_events.geo_watch: "", world_events.gdelt_codes: "18" }
    given:
      "http://data.gdeltproject.org/gdeltv2/20261105101500.export.CSV.zip": gdelt_export.zip
    expect:
      lines:
        rows: 0
