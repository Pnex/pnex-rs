      params: { _format: json, event_date: "{{run_date|days_before:30}}|{{run_date}}", event_date_where: BETWEEN, iso: "{{iso}}", limit: "5000" }
      pages: { param: page, until: /data, max: 40 }
      missing_is_empty: true
      secret:
        token:
          url: "https://acleddata.com/oauth/token"
          user: world_events_acled_email
          password: world_events_acled_password
          fields: { grant_type: password, client_id: acled, scope: authenticated }
