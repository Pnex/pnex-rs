# ACLED with the org's own account and licence: the events of the last
# 30 days of each watched country (ACLED is asked country by country, by
# ISO numeric code; `*` is not offered), one per country, kind and day.
key: acled_events
name: Verified events (ACLED)
hosts: [acleddata.com]
requires: [world_events.geo_watch]
steps:
  - enumerate:
