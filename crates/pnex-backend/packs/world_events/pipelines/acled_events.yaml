        - { name: event_type, at: event_type, optional: true }
        - { name: sub_event_type, at: sub_event_type, optional: true }
        - { name: place, at: location, optional: true }
        - { name: region, at: admin1, optional: true }
        - { name: lat, at: latitude, type: float, optional: true }
        - { name: lon, at: longitude, type: float, optional: true }
        - { name: actor1, at: actor1, optional: true }
        - { name: actor2, at: actor2, optional: true }
        - { name: deaths, at: fatalities, type: float, optional: true }
        - { name: read_at, value: "{{run_now}}" }
  - enumerate: { as: countries, cross: [{ as: country, setting: world_events.geo_watch, case: upper }] }
  - sql:
      as: days
      sql: |
        WITH watch AS (SELECT DISTINCT country AS c FROM countries),
        kept AS (
          SELECT id, country, day, CASE WHEN event_type = 'Battles' THEN 'armed_conflict'
                      WHEN event_type IN ('Explosions/Remote violence', 'Violence against civilians') THEN 'attack'
                      WHEN event_type = 'Strategic developments' AND sub_event_type = 'Agreement' THEN 'ceasefire'
                      ELSE 'other' END AS kind, place, region, lat, lon, actor1, actor2,
                 CAST(0 AS DOUBLE) AS sources, coalesce(deaths, 0) AS deaths,
                 CAST(NULL AS VARCHAR) AS reported, read_at
          FROM events
          WHERE country IS NOT NULL AND id IS NOT NULL AND day IS NOT NULL
            AND (country IN (SELECT c FROM watch) OR EXISTS (SELECT 1 FROM watch WHERE c = '*'))),
        days AS (
          SELECT country, kind, day, sum(sources) AS source_count, sum(deaths) AS deaths,
                 avg(CASE WHEN abs(lat) <= 90 AND abs(lon) <= 180 THEN lat END) AS lat,
                 avg(CASE WHEN abs(lat) <= 90 AND abs(lon) <= 180 THEN lon END) AS lon,
                 min(reported) AS reported, max(read_at) AS read_at
          FROM kept WHERE kind IS NOT NULL GROUP BY country, kind, day),
        ids AS (
          SELECT country, kind, day, string_agg(id, ',' ORDER BY id) AS event_ids FROM (
            SELECT *, row_number() OVER (PARTITION BY country, kind, day ORDER BY id) AS n
            FROM (SELECT DISTINCT country, kind, day, id FROM kept WHERE kind IS NOT NULL) AS d) AS t
          WHERE n <= 50 GROUP BY country, kind, day),
        place_counts AS (
          SELECT country, kind, day, place, count(*) AS c FROM kept
          WHERE place IS NOT NULL AND kind IS NOT NULL GROUP BY country, kind, day, place),
        places AS (
          SELECT country, kind, day, place FROM (
            SELECT *, row_number() OVER (PARTITION BY country, kind, day ORDER BY c DESC, place) AS n
            FROM place_counts) AS t WHERE n = 1),
        region_counts AS (
          SELECT country, kind, day, region, count(*) AS c FROM kept
          WHERE region IS NOT NULL AND kind IS NOT NULL GROUP BY country, kind, day, region),
        regions AS (
          SELECT country, kind, day, region FROM (
            SELECT *, row_number() OVER (PARTITION BY country, kind, day ORDER BY c DESC, region) AS n
            FROM region_counts) AS t WHERE n = 1),
        actor_counts AS (
          SELECT country, kind, day, actor, count(*) AS c FROM (
            SELECT country, kind, day, actor1 AS actor FROM kept WHERE actor1 IS NOT NULL AND kind IS NOT NULL
            UNION ALL
            SELECT country, kind, day, actor2 FROM kept WHERE actor2 IS NOT NULL AND kind IS NOT NULL) AS a
          GROUP BY country, kind, day, actor),
        actors AS (
          SELECT country, kind, day, string_agg(actor, ', ' ORDER BY c DESC, actor) AS actors FROM (
            SELECT *, row_number() OVER (PARTITION BY country, kind, day ORDER BY c DESC, actor) AS n
            FROM actor_counts) AS t WHERE n <= 5 GROUP BY country, kind, day)
        SELECT concat('acled:', d.country, ':', d.kind, ':', CAST(d.day AS VARCHAR)) AS ref,
               concat(coalesce(p.place, d.country), ' · ', d.kind, ' · ', CAST(d.day AS VARCHAR)) AS title,
               d.kind, CAST(d.day AS VARCHAR) AS event_at,
               CASE WHEN d.reported IS NOT NULL THEN concat(d.reported, 'T23:59:59Z') ELSE d.read_at END AS known_at,
               d.country, r.region,
               CASE WHEN d.lat IS NOT NULL
                    THEN concat('{"lat": ', CAST(d.lat AS VARCHAR), ', "lon": ', CAST(d.lon AS VARCHAR), '}') END AS location,
               a.actors, d.source_count, d.deaths, i.event_ids
        FROM days AS d
        LEFT JOIN places AS p ON p.country = d.country AND p.kind = d.kind AND p.day = d.day
        LEFT JOIN regions AS r ON r.country = d.country AND r.kind = d.kind AND r.day = d.day
        LEFT JOIN actors AS a ON a.country = d.country AND a.kind = d.kind AND a.day = d.day
        LEFT JOIN ids AS i ON i.country = d.country AND i.kind = d.kind AND i.day = d.day
  - write: { from: days, table: { name: acled_events, replace: true } }
tests:
  - name: the token first, then each country
    today: "2026-11-12"
    settings: { world_events.geo_watch: "UA, *" }
    given:
      "https://acleddata.com/oauth/token": acled_token.json
      "https://acleddata.com/api/acled/read?_format=json&event_date=2026-10-13%7C2026-11-12&event_date_where=BETWEEN&iso=804&limit=5000&page=1": acled_page.json
    expect:
      asked:
        rows: 1
      days:
        rows: 1
        contains:
          - { ref: "acled:UA:attack:2026-11-09", deaths: "2", known_at: "2026-11-12T12:00:00Z" }
