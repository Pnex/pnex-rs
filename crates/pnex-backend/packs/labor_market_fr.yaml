# Pack "Labour market, France" (labor-market.md, first lots of LM1 and LM2):
# public data on the jobs a territory finds hard to fill, as tables of the
# org written by pipelines only (M2), never objects:
# - `lm_bmo`: the yearly recruitment needs survey of France Travail (BMO),
#   projects, hard projects and seasonal ones per occupation (FAP 2021) and
#   department;
# - `lm_tension`: the yearly tension level (1 to 5) per ROME job and
#   region, and its factors (France Travail labour market API).
# Both indicator tables share the long form of M16 (occupation scheme and
# code, area scheme and code, metric, value, unit). The org chooses its
# regions and ROME jobs; the generic pivots (ISCO, NUTS) and the score
# come with the next lots. The France Travail API needs the org's own
# francetravail.io application, subscribed to the labour market API: its
# client id and secret in the org vault under lm_ft_client_id and
# lm_ft_client_secret. Open licence (Etalab) for BMO; France Travail API
# terms otherwise.
# Since 1.2.0 the job offers are gone (`fr_ft_offers`, `lm_offers_seen`,
# queries `job_postings` and `company_offers`, setting `departments`): the
# job offers API left the francetravail.io catalogue (access on request
# only since 2026), and no open source lists the offers one by one.
key: labor_market_fr
name: Labour market (France)
names: {fr: "Marché du travail (France)"}
version: "1.2.0"
requires: []
description: Hiring needs per department and tension per job and region, from France Travail (BMO survey and labour market API).
descriptions: {fr: "Besoins de recrutement par département et tension par métier et région, depuis France Travail (enquête BMO et API Marché du travail)."}
settings:
  - key: regions
    name: Regions followed
    names: {fr: "Régions suivies"}
    description: "Comma-separated INSEE region codes, for example 84,11 (all of mainland France: 11,24,27,28,32,44,52,53,75,76,84,93,94). Empty: tension is not read."
    descriptions: {fr: "Codes INSEE de région séparés par des virgules, par exemple 84,11 (toute la métropole : 11,24,27,28,32,44,52,53,75,76,84,93,94). Vide : la tension n'est pas lue."}
    kind: text
    default: ""
  - key: rome_codes
    name: ROME jobs followed
    names: {fr: "Métiers ROME suivis"}
    description: "Comma-separated ROME codes, for example N4101,H2913. Empty: tension is not read."
    descriptions: {fr: "Codes ROME séparés par des virgules, par exemple N4101,H2913. Vide : la tension n'est pas lue."}
    kind: text
    # Every ROME code (about 1 900 of 5 characters plus commas) fits.
    max_len: 12000
    default: ""
  - key: bmo_url
    name: Address of the BMO file
    names: {fr: "Adresse du fichier BMO"}
    description: The open data file of the edition read (France Travail renames it each year). Empty turns BMO off.
    descriptions: {fr: "Le fichier open data de l'édition lue (France Travail le renomme chaque année). Vide : BMO n'est pas lu."}
    kind: text
    default: "https://www.francetravail.org/files/live/sites/peorg/files/documents/Statistiques-et-analyses/Open-data/BMO/Base-open-data-BMO-2026.xlsx"
# Read-only queries (pipeline-engine.md D948), run under the caller's rights
# by `POST /analysis/named/labor_market_fr/<key>`.
queries:
  - key: bmo
    name: Hiring needs of a department (BMO)
    names: {fr: "Besoins de recrutement d'un département (BMO)"}
    description: Every BMO indicator of the latest edition in a department, by occupation (FAP 2021).
    params:
      - { name: department, type: text, description: "Department code, for example 69." }
    sql: >-
      SELECT edition, occupation_code, occupation_label, occupation_family, occupation_family_label,
      area_code, area_label, metric, value, unit FROM lm_bmo
      WHERE area_code = {{department}} AND edition = (SELECT max(edition) FROM lm_bmo)
      ORDER BY occupation_code, metric
  - key: tension
    name: Tension of the jobs of a region
    names: {fr: "Tension des métiers d'une région"}
    description: The latest tension level (1 to 5) of each ROME job followed in a region, and its factors.
    params:
      - { name: region, type: text, description: "INSEE region code, for example 84." }
    sql: >-
      SELECT edition, occupation_code, occupation_label, area_code, area_label, metric, factor_code, factor_label, value FROM lm_tension t
      WHERE area_code = {{region}}
      AND edition = (SELECT max(edition) FROM lm_tension x WHERE x.occupation_code = t.occupation_code AND x.area_code = t.area_code)
      ORDER BY occupation_code, metric DESC, value DESC
