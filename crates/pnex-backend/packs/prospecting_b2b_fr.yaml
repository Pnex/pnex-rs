# Country layer "B2B prospecting, France" (account-mapping.md D337, D343)
# of the generic `prospecting_b2b` pack. Convention: `<generic pack>_<country>`
# is the country layer of a generic pack (like `companies_fr` over
# `companies`): it holds only what is specific to the country, here the
# French registers. It joins `companies_fr` (SIREN, the register) and
# `prospecting_b2b` (account status, list contacts), so neither has to know
# the other.
# Target list: one API import per saved search of the company register
# (its filters in the URL: NAF codes, headcount bands, French departments…), paged
# up to the register's 10,000 results. New SIRENs enter as `target`; an
# existing account keeps its status. The latest revenue the company
# published fills `last_revenue` (its year stays in the register). The
# search gives the legal unit and its head office, not the other sites: the
# register import of `companies_fr` brings them, company by company.
# The shipped URL is an example (manufacturing, 100 employees and more,
# active): edit it to the org's ideal customer before running.
# Legal announcements (D335, BODACC): for each followed account (customer,
# prospect, target), the announcements of the register of commerce (sales,
# changes, openings, insolvency proceedings; account filings left out)
# become commercial signals linked to the account, `to_validate` when first
# seen and never reset after a human decided.
# List contacts (D337, type and file import in `prospecting_b2b`): a flow
# finds each company's SIREN in the French register (`org_resolve`), fills
# the contact's `registry_id`, creates the company and proposes the
# contact's attachment to it (to validate); an ambiguous company keeps its
# candidates for a human.
# Since 2.0.0 every identifier is English (breaking); the pack was
# `prospection_fr` before 2.0.0.
# Since 3.0.0 the import aliases and flow names are English (breaking).
# Since 3.6.0 the register import fills the establishment address.
key: prospecting_b2b_fr
name: B2B prospecting, France layer
names: {fr: "Prospection B2B, couche France"}
version: "3.7.0"
requires: [companies_fr, prospecting_b2b]
description: "The French layer of B2B prospecting: target lists from the company register (a saved search becomes accounts to target, without touching the status of known accounts), legal announcements as signals, and the SIREN of list contacts."
descriptions: {fr: "La couche France de la prospection B2B : listes de ciblage depuis le registre des entreprises (une recherche enregistrée devient des comptes à cibler, sans toucher au statut des comptes connus), annonces légales en signaux, et SIREN des contacts de liste."}
imports:
  - name: Press (GDELT)
    source: api
    source_url: "https://data.gdeltproject.org/gdeltv2"
    mapping:
      key: press_gdelt
      name: Press
      names: {fr: "Presse (GDELT)"}
      description: The world's press of the last day naming an account followed (customer, prospect, target). Source GDELT Project, gdeltproject.org.
      format: json
      press_feed:
        type: organization
        only: { property: account_status, values: [customer, prospect, target] }
        aliases: press_names
        keys: [siren, lei, wikidata]
        hours: 26
      objects:
        - as: signal
          type: sales_signal
          key: ref
          title: title
          update: false
          properties:
            ref: ref
            kind: { value: press }
            summary: summary
            date: date
            source_url: url
            lang: lang
            tone: tone
            # GDELT's terms: any use cites the project and links to its site.
            credit: { value: "GDELT Project, https://www.gdeltproject.org/" }
            state: { value: to_validate }
        - { as: by_siren, type: organization, key: siren, create: false, missing: skip, when: { from: via, equals: siren }, properties: { siren: account } }
        - { as: by_lei, type: organization, key: lei, create: false, missing: skip, when: { from: via, equals: lei }, properties: { lei: account } }
        - { as: by_item, type: organization, key: wikidata, create: false, missing: skip, when: { from: via, equals: wikidata }, properties: { wikidata: account } }
      links:
        - { type: signal_about, from: signal, to: by_siren }
        - { type: signal_about, from: signal, to: by_lei }
        - { type: signal_about, from: signal, to: by_item }
  - name: Direct subsidiaries (GLEIF)
    source: file
    mapping:
      key: gleif_direct_children
      pipeline: prospecting_b2b_fr/gleif_direct_children
      rows: record
      name: Direct subsidiaries
      names: {fr: "Filiales directes (GLEIF)"}
      objects:
        - as: parent
          type: organization
          key: lei
          create: false
          missing: skip
          properties:
            lei: queried
        - as: child_fr
          type: organization
          key: siren
          title: attributes.entity.legalName.name
          when: { from: attributes.entity.jurisdiction, equals: FR }
          properties:
            siren: { from: attributes.entity.registeredAs, convert: [digits] }
            lei: id
            country: { value: FR }
        - as: child_world
          type: organization
          key: lei
          title: attributes.entity.legalName.name
          when: { from: attributes.entity.jurisdiction, equals: FR, not: true }
          properties:
            lei: id
            country: attributes.entity.legalAddress.country
      links:
        - type: subsidiary_of
          from: child_fr
          to: parent
          attributes: &gleif_direct
            nature: { value: direct_consolidation }
            source: { value: "gleif.org" }
          on_conflict: { nature: direct_consolidation }
        - type: subsidiary_of
          from: child_world
          to: parent
          attributes: *gleif_direct
          on_conflict: { nature: direct_consolidation }
  - name: Group subsidiaries (GLEIF)
    source: file
    mapping:
      key: gleif_ultimate_children
      pipeline: prospecting_b2b_fr/gleif_ultimate_children
      rows: record
      name: Group subsidiaries
      names: {fr: "Filiales du groupe (GLEIF)"}
      objects:
        - as: parent
          type: organization
          key: lei
          create: false
          missing: skip
          properties:
            lei: queried
        - as: child_fr
          type: organization
          key: siren
          title: attributes.entity.legalName.name
          when: { from: attributes.entity.jurisdiction, equals: FR }
          properties:
            siren: { from: attributes.entity.registeredAs, convert: [digits] }
            lei: id
            country: { value: FR }
        - as: child_world
          type: organization
          key: lei
          title: attributes.entity.legalName.name
          when: { from: attributes.entity.jurisdiction, equals: FR, not: true }
          properties:
            lei: id
            country: attributes.entity.legalAddress.country
      links:
        - type: subsidiary_of
          from: child_fr
          to: parent
          attributes: &gleif_ultimate
            nature: { value: ultimate_consolidation }
            source: { value: "gleif.org" }
          on_conflict: { nature: direct_consolidation }
        - type: subsidiary_of
          from: child_world
          to: parent
          attributes: *gleif_ultimate
          on_conflict: { nature: direct_consolidation }
  - name: Foreign parents and subsidiaries (Wikidata)
    source: file
    mapping:
      key: wikidata_group_world
      pipeline: prospecting_b2b_fr/wikidata_group_world
      rows: record
      name: Foreign parents and subsidiaries
      names: {fr: "Mères et filiales étrangères (Wikidata)"}
      objects:
        - as: legal_unit
          type: organization
          key: siren
          create: false
          missing: skip
          properties:
            siren: self_siren.value
        - as: child_lei
          type: organization
          key: lei
          title: otherLabel.value
          update: false
          when: { from: lane.value, equals: child_lei }
          properties:
            lei: lei.value
            wikidata: qid.value
            country: iso.value
        - as: child_item
          type: organization
          key: wikidata
          title: otherLabel.value
          update: false
          when: { from: lane.value, equals: child_item }
          properties:
            wikidata: qid.value
            country: iso.value
        - as: parent_lei
          type: organization
          key: lei
          title: otherLabel.value
          update: false
          when: { from: lane.value, equals: parent_lei }
          properties:
            lei: lei.value
            wikidata: qid.value
            country: iso.value
        - as: parent_item
          type: organization
          key: wikidata
          title: otherLabel.value
          update: false
          when: { from: lane.value, equals: parent_item }
          properties:
            wikidata: qid.value
            country: iso.value
      links:
        - type: subsidiary_of
          from: child_lei
          to: legal_unit
          propose: true
          attributes: &wikidata_world
            nature: { value: wikidata }
            source: { value: "wikidata.org" }
        - type: subsidiary_of
          from: child_item
          to: legal_unit
          propose: true
          attributes: *wikidata_world
        - type: subsidiary_of
          from: legal_unit
          to: parent_lei
          propose: true
          attributes: *wikidata_world
        - type: subsidiary_of
          from: legal_unit
          to: parent_item
          propose: true
          attributes: *wikidata_world
  - name: Target list (company register search)
    source: file
    mapping:
      key: targeting_list
      pipeline: prospecting_b2b_fr/targeting_list
      rows: record
      name: Target list
      names: {fr: "Liste de ciblage"}
      objects:
        - as: legal_unit
          type: organization
          key: siren
          title: nom_complet
          defaults: { account_status: target }
          properties:
            siren: siren
            legal_form: nature_juridique
            naf: activite_principale
            administrative_state: { from: etat_administratif, convert: [{ enum: { A: active, C: ceased } }] }
            created_on: date_creation
            headcount_band: tranche_effectif_salarie
            headcount_min: { from: tranche_effectif_salarie, convert: [&headcount_min { enum: { NN: "", "00": "0", "01": "1", "02": "3", "03": "6", "11": "10", "12": "20", "21": "50", "22": "100", "31": "200", "32": "250", "41": "500", "42": "1000", "51": "2000", "52": "5000", "53": "10000" } }] }
            headcount_max: { from: tranche_effectif_salarie, convert: [&headcount_max { enum: { NN: "", "00": "0", "01": "2", "02": "5", "03": "9", "11": "19", "12": "49", "21": "99", "22": "199", "31": "249", "32": "499", "41": "999", "42": "1999", "51": "4999", "52": "9999", "53": "" } }] }
            country: { value: FR }
            activity_code: { from: activite_principale, convert: ["left:5"] }
            last_revenue: { from: finances.@last.ca, convert: ["money:EUR"] }
        - as: head_office
          type: map_pin
          key: siret
          title: nom_complet
          location: { lat: siege.latitude, lon: siege.longitude }
          properties:
            siret: siege.siret
            head_office: { value: true }
            administrative_state: { from: siege.etat_administratif, convert: [{ enum: { A: active, F: closed } }] }
            headcount_band: siege.tranche_effectif_salarie
            headcount_min: { from: siege.tranche_effectif_salarie, convert: [*headcount_min] }
            headcount_max: { from: siege.tranche_effectif_salarie, convert: [*headcount_max] }
      links:
        - { type: establishment_of, from: head_office, to: legal_unit }
  # The register lists an entity's sites for a search by name, never by SIREN
  # (measured 2026-11-04: 0 of 11 open sites by SIREN, all 16 sites by name).
  # shortcut: 100 sites per company (the API's cap, its page parameter answers
  # the same page), upgrade to the INSEE SIRENE API, which needs a key, when a
  # bigger group must be complete.
  - name: Establishments (company register)
    source: file
    mapping:
      key: company_establishments
      pipeline: prospecting_b2b_fr/company_establishments
      rows: record
      name: Establishments
      names: {fr: "Établissements"}
      description: The open sites of the accounts followed (customer, prospect, target), up to 100 per company, searched by the account's name in the company register.
      objects:
        - as: legal_unit
          type: organization
          key: siren
          create: false
          update: true
          missing: skip
          properties:
            siren: siren
            open_sites: nombre_etablissements_ouverts
        - as: establishment
          type: map_pin
          key: siret
          each: matching_etablissements
          when: { from: etat_administratif, equals: A }
          title: ^nom_complet
          location: { lat: latitude, lon: longitude }
          properties:
            siret: siret
            head_office: est_siege
            address: adresse
            administrative_state: { value: active }
            created_on: date_creation
            headcount_band: tranche_effectif_salarie
            headcount_min: { from: tranche_effectif_salarie, convert: [*headcount_min] }
            headcount_max: { from: tranche_effectif_salarie, convert: [*headcount_max] }
      links:
        - { type: establishment_of, from: establishment, to: legal_unit }
  - name: Legal announcements (BODACC)
    source: file
    mapping:
      key: bodacc
      pipeline: prospecting_b2b_fr/bodacc
      rows: record
      name: Legal announcements
      names: {fr: "Annonces légales (BODACC)"}
      objects:
        - as: legal_unit
          type: organization
          key: siren
          create: false
          missing: skip
          properties:
            siren: { from: registre.0, convert: [digits] }
        - as: sig
          type: sales_signal
          key: ref
          title: { concat: [commercant, familleavis_lib], sep: " · " }
          needs: legal_unit
          defaults: { state: to_validate }
          properties:
            ref: id
            kind: { from: familleavis, convert: [{ enum: { creation: new_establishment, radiation: establishment_closure, "*": legal_notice } }] }
            topic: familleavis
            summary: { concat: [familleavis_lib, typeavis_lib], sep: " — " }
            date: dateparution
            source_url: url_complete
        - as: sig_change
          type: sales_signal
          key: ref
          when: { from: familleavis, equals: modification }
          needs: legal_unit
          properties:
            ref: id
            excerpt: { from: modificationsgenerales, convert: [json, "field:descriptif"] }
        - as: sig_judgment
          type: sales_signal
          key: ref
          when: { from: familleavis, equals: collective }
          needs: legal_unit
          properties:
            ref: id
            excerpt: { from: jugement, convert: [json, "field:nature"] }
        - as: sig_deed
          type: sales_signal
          key: ref
          when: { from: familleavis, equals: immatriculation }
          needs: legal_unit
          properties:
            ref: id
            excerpt: { from: acte, convert: [json, "field:descriptif"] }
      links:
        - { type: signal_about, from: sig, to: legal_unit }
functions:
  - name: pl_prepare
    language: starlark
    description: The company of a list contact, as org_resolve asks it.
    code: |
      # The contact travels with the lookup (msg.contact).
      def handle(inputs, msg):
          p = msg["payload"]
          o = msg["object"]
          return {
              "payload": {"name": p.get("company", ""), "city": p.get("city", ""),
                          "postcode": p.get("postal_code", "")},
              "contact": {"id": o["id"], "title": o["title"]},
          }
  - name: pl_found
    language: starlark
    description: A company found for a list contact, and the contact marked.
    outputs:
      - {name: company, ty: any, desc: "The company to create or update, by SIREN"}
      - {name: contact, ty: any, desc: "The contact, marked found"}
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          best = p["candidates"][0]
          return [
              {"payload": {"siren": best["siren"], "country": "FR"}, "title": best["name"]},
              {"payload": {"matching": "found", "registry_id": best["siren"]},
               "object_id": msg["contact"]["id"]},
          ]
  - name: pl_review
    language: starlark
    description: An ambiguous or unknown company, its candidates kept for a human.
    code: |
      def handle(inputs, msg):
          c = msg["payload"].get("candidates", [])
          lines = [x["name"] + " (" + x["siren"] + ", " + x.get("city", "") + ", " + str(x["score"]) + ")" for x in c]
          return {
              "payload": {"matching": "to_review" if lines else "not_found",
                          "candidates": "\n".join(lines)},
              "object_id": msg["contact"]["id"],
          }
  - name: pl_link
    language: starlark
    description: Proposed attachment of the list contact to the company found.
    code: |
      def handle(inputs, msg):
          return {"payload": {"source_id": msg["contact"]["id"], "target_id": msg["object"]["id"],
                              "attributes": {}}}
  - name: pe_signal
    language: starlark
    description: "A site created lately on an account followed: a commercial signal about that account, to validate."
    code: |
      FOLLOWED = ["customer", "prospect", "target"]

      def handle(inputs, msg):
          p = msg["payload"]
          accounts = [l["other"] for l in msg.get("links", {}).get("establishment_of", [])
                      if l.get("direction") == "out"
                      and l.get("other", {}).get("properties", {}).get("account_status") in FOLLOWED]
          if not accounts or not p.get("siret"):
              return None
          return {
              "payload": {
                  "ref": "siret:" + p["siret"],
                  "kind": "new_establishment",
                  "summary": "SIRET " + p["siret"],
                  "date": p.get("created_on", ""),
                  "state": "to_validate",
              },
              "title": "New site · " + accounts[0]["title"],
              "account": accounts[0]["id"],
          }
  - name: pe_link
    language: starlark
    description: Link payload from the signal just written to its account.
    code: |
      def handle(inputs, msg):
          return {"payload": {"source_id": msg["object"]["id"], "target_id": msg["account"]}}
  - name: pcp_ask
    language: starlark
    description: A person with a captured profile not yet read, its document asked for.
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          # An objection stops everything about the person (D341).
          if p.get("opposed_on"):
              return None
          return {"payload": {"media_id": p.get("profile_to_read", "")}, "person": msg["object"]["id"]}
  - name: pcp_read
    language: starlark
    description: "The model's lines about a profile: the company to look up, and the person marked read with what the profile says."
    outputs:
      - {name: lookup, ty: any, desc: "The company named by the profile"}
      - {name: read, ty: any, desc: "The person, marked read"}
    code: |
      def field(lines, name):
          for l in lines:
              if l.lower().startswith(name + ":"):
                  v = l[len(name) + 1:].strip().strip("`*\"")
                  return "" if v.lower() in ["none", "unknown", "-", ""] else v
          return ""

      def handle(inputs, msg):
          lines = [l.strip() for l in msg["payload"].get("text", "").split("\n")]
          position = field(lines, "position")[:255]
          company = field(lines, "company")[:255]
          city = field(lines, "city")[:100]
          read = {"payload": {"profile_to_read": "", "profile_position": position,
                              "profile_company": company, "profile_read_on": msg.get("today", "")},
                  "object_id": msg["person"]}
          if not company:
              return [None, read]
          return [{"payload": {"name": company, "city": city}, "person": msg["person"], "position": position,
                   "company": company, "today": msg.get("today", "")}, read]
  - name: pcp_found
    language: starlark
    description: The company found in the register, created if it is new.
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          best = p.get("candidates", [{}])[0]
          return {"payload": {"siren": p["siren"], "country": "FR"}, "title": best.get("name", p["siren"]),
                  "person": msg["person"], "position": msg.get("position", ""),
                  "company": msg.get("company", ""), "today": msg.get("today", "")}
  - name: pcp_candidates
    language: starlark
    description: "An ambiguous company: the candidates tied at the top, to see whether one is already known."
    code: |
      def handle(inputs, msg):
          found = msg["payload"].get("candidates", [])
          if not found or found[0].get("score", 0) < 70:
              return None
          best = found[0]["score"]
          tied = [{"siren": c["siren"]} for c in found if c.get("score") == best][:3]
          return {"payload": tied, "person": msg["person"], "position": msg.get("position", ""),
                  "company": msg.get("company", ""), "today": msg.get("today", "")}
  - name: pcp_link
    language: starlark
    description: The link from the company to the person, as a proposal with what the profile said.
    code: |
      def handle(inputs, msg):
          attrs = {"source": "profile capture", "retrieved_on": msg.get("today", "")}
          if msg.get("position"):
              attrs["position"] = msg["position"]
          return {"payload": {"source_id": msg["object"]["id"], "target_id": msg["person"], "attributes": attrs,
                              "evidence": {"on the profile": msg.get("company", "")}}}
flows:
  - name: "Prospecting · new establishments"
    note: "Each morning a site created in the last 30 days on an account followed (customer, prospect, target) becomes a commercial signal to validate, once. Run the import Establishments first: it brings the sites and their creation dates. A BODACC announcement of the same opening stays a signal of its own."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "50 6 * * *" }, outputs: [{ port: 0, targets: [recent] }] }
        - id: recent
          kind: ontology_query
          config:
            object_type: map_pin
            filters: [{ key: created_on, op: gte, value: "$today-30" }]
            limit: 200
            with_links: [establishment_of]
          outputs: [{ port: 0, targets: [signal] }]
        - { id: signal, kind: pnex_function, config: { function_name: pe_signal, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: sales_signal, key: ref, skip_existing: true }, outputs: [{ port: 0, targets: [about] }] }
        - { id: about, kind: pnex_function, config: { function_name: pe_link, language: starlark }, outputs: [{ port: 0, targets: [linked] }] }
        - { id: linked, kind: link_upsert, config: { link_type: signal_about } }
  - name: "Prospecting · captured profiles"
    note: "Every hour, up to 20 people whose profile was captured by a person (Capture a profile, on the person's page) are read by the organization's LLM: what the profile says of the position and the company goes on the person, and a company found clearly in the register is created and proposed as their employer on the To validate page. An ambiguous name is proposed only when one of its homonyms is already known here; otherwise it stays on the person, for a human. It creates no person and follows no link of the network. Needs an AI provider."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "20 * * * *" }, outputs: [{ port: 0, targets: [todo] }] }
        - id: todo
          kind: ontology_query
          config:
            object_type: person
            filters:
              - { key: profile_to_read, op: exists }
              - { key: profile_to_read, op: ne, value: "" }
            limit: 20
          outputs: [{ port: 0, targets: [ask] }]
        - { id: ask, kind: pnex_function, config: { function_name: pcp_ask, language: starlark }, outputs: [{ port: 0, targets: [doc] }] }
        - { id: doc, kind: document_text, outputs: [{ port: 0, targets: [read] }] }
        - id: read
          kind: llm_text
          config:
            data_field: text
            max_chars: 500
            prompt: "This is the text of one person's professional profile page. Answer with exactly three lines and nothing else: 'position: <their current position>', 'company: <the company of their current position>', 'city: <its city>'. Write none for what the page does not say. Never guess."
          outputs: [{ port: 0, targets: [parse] }]
        - { id: parse, kind: pnex_function, config: { function_name: pcp_read, language: starlark }, outputs: [{ port: 0, targets: [lookup] }, { port: 1, targets: [mark] }] }
        - { id: mark, kind: object_upsert, config: { object_type: person, key: id } }
        - { id: lookup, kind: org_resolve, outputs: [{ port: 0, targets: [found] }, { port: 1, targets: [tied] }] }
        - { id: tied, kind: pnex_function, config: { function_name: pcp_candidates, language: starlark }, outputs: [{ port: 0, targets: [each] }] }
        - { id: each, kind: json_split, config: { auto: false }, outputs: [{ port: 0, targets: [known] }] }
        - id: known
          kind: ontology_query
          config:
            object_type: organization
            filters: [{ key: siren, op: eq, value: "$msg.payload.siren" }]
            limit: 1
          outputs: [{ port: 0, targets: [link] }]
        - { id: found, kind: pnex_function, config: { function_name: pcp_found, language: starlark }, outputs: [{ port: 0, targets: [company] }] }
        - { id: company, kind: object_upsert, config: { object_type: organization, key: siren, skip_existing: true }, outputs: [{ port: 0, targets: [link] }] }
        - { id: link, kind: pnex_function, config: { function_name: pcp_link, language: starlark }, outputs: [{ port: 0, targets: [attach] }] }
        - { id: attach, kind: link_upsert, config: { link_type: employs, skip_closed: true, propose: true } }
  - name: "Prospecting · list contacts to companies"
    note: "Every 15 minutes, up to 100 list contacts not looked up yet get their company's SIREN from the company register (org_resolve): a clear match creates the company and proposes the contact's attachment on the To validate page; an ambiguous one keeps its candidates on the contact (Company found: to_review). Deploy after importing a list."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "*/15 * * * *" }, outputs: [{ port: 0, targets: [todo] }] }
        - id: todo
          kind: ontology_query
          config:
            object_type: list_contact
            filters: [{ key: matching, op: missing }]
            limit: 100
          outputs: [{ port: 0, targets: [ask] }]
        - { id: ask, kind: pnex_function, config: { function_name: pl_prepare, language: starlark }, outputs: [{ port: 0, targets: [resolve] }] }
        - { id: resolve, kind: org_resolve, outputs: [{ port: 0, targets: [found] }, { port: 1, targets: [review] }] }
        - { id: found, kind: pnex_function, config: { function_name: pl_found, language: starlark }, outputs: [{ port: 0, targets: [company] }, { port: 1, targets: [mark] }] }
        - { id: company, kind: object_upsert, config: { object_type: organization, key: siren }, outputs: [{ port: 0, targets: [link] }] }
        - { id: link, kind: pnex_function, config: { function_name: pl_link, language: starlark }, outputs: [{ port: 0, targets: [attach] }] }
        - { id: attach, kind: link_upsert, config: { link_type: contact_of, skip_closed: true, propose: true } }
        - { id: review, kind: pnex_function, config: { function_name: pl_review, language: starlark }, outputs: [{ port: 0, targets: [mark] }] }
        - { id: mark, kind: object_upsert, config: { object_type: list_contact, key: id } }
