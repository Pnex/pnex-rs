# A person's profile page on X (D333).
key: x
domains: [x.com, twitter.com]
site: x.com
profiles:
  - { path: ["{h}"], canonical: "https://x.com/{h}" }
names:
  h:
    chars: "_"
    max: 15
    # First path segments that are pages, not usernames.
    not: [home, explore, search, notifications, messages, i, settings, compose, hashtag,
      login, signup, tos, privacy, intent, share, jobs, communities, lists, bookmarks,
      following, followers]
follow:
  pages: ["https://x.com/{handle}"]
  # Videos are files on the platform's media host.
  sites: ["https://x.com/", "https://video.twimg.com/"]
  post: "https://x.com/{author}/status/{id}"
  # Timeline responses; any object that looks like a post is read where it
  # sits (fields move between versions). Reposts of others are skipped.
  responses: ["/UserTweets", "/UserMedia"]
  posts:
    id: { digits: true, max: 25 }
    shapes:
      - when: { legacy.full_text: "*" }
        id: [rest_id]
        text: [legacy.full_text]
        author:
          - core.user_results.result.core.screen_name
          - core.user_results.result.legacy.screen_name
        published: { from: [legacy.created_at], as: "%a %b %d %H:%M:%S %z %Y" }
        # Highest-bitrate mp4 of the first video or GIF.
        video: ["legacy.extended_entities.media[type=video|animated_gif].video_info.variants[content_type=video/mp4]^bitrate.url"]
        duration: ["legacy.extended_entities.media[type=video|animated_gif].video_info.duration_millis"]
