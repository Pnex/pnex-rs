# A person entered by a sales rep, searched on LinkedIn (D788, D999): one
# query per row, opened as LinkedIn's people results in the browser agent of
# the flow's deployer, the results read (no profile opened). Collection only
# (operational-platform.md D998): the results whose name is the person are
# kept, everyone else is dropped on receipt (minimisation), and
# what is kept becomes one document of the person, stamped `match_to_score`
# and kept 2 days. The flow "Prospecting · score profiles" scores it, attaches
# or proposes, or asks the next query; nothing is decided here.
key: person_match_linkedin
name: Person search (LinkedIn)
hosts: [www.linkedin.com]
steps:
  - enumerate: { as: asked, track: true, cross: [{ as: person_id, asked: [query, step, words] }] }
  - browse:
      as: page
      for_each: asked
      site: www.linkedin.com
      session: required
      steps:
        # The people results page itself: its filter button and list markup
        # changed (probe of 2026-11-18); the cards are its profile links.
        - open: "/search/results/people/?keywords={{query}}"
        - wait: { ms: 5000 }
        - extract: { cards: { selector: "main a[href*='/in/']", max: 20, fields: { card: {}, link: { attr: href } } }, as: results, optional: true }
        - extract: { all_text: true, as: text }
  # One row per extract, the asked row on each (or alone without any).
  - sql:
      as: found
      sql: >-
        SELECT a.person_id, a.step, a.query, a.words, p.name, p.text
        FROM asked a LEFT JOIN page p ON true
  - call: { as: kept, from: found, function: person_match_collect }
  - sql:
      as: documents
      sql: >-
        SELECT 'person' AS type_key, 'id' AS key_property, person_id AS key,
          'https://www.linkedin.com/search/results/people/' AS source_url,
          'Profile search · ' || query AS name, bundle AS text
        FROM kept
  - write:
      from: documents
      media: { link_type: captured_text, source: browser_agent, stamp: match_to_score, keep_days: 2 }
tests:
  - name: the profile naming the person is kept, the other dropped
    asked: [{ person_id: "8f1c2b9e-0000-4000-8000-000000000001", query: "jane doe example", step: "0", words: "jane doe" }]
    given: { "browse:page": match_jane_doe.json }
    expect:
      kept:
        rows: 1
        contains: [{ kept_urls: "https://www.linkedin.com/in/jane-doe" }]
      documents:
        rows: 1
  - name: a search that kept nobody still tells the flow
    asked: [{ person_id: "8f1c2b9e-0000-4000-8000-000000000001", query: "john smith", step: "0", words: "john smith" }]
    given: { "browse:page": match_jane_doe.json }
    expect:
      kept:
        rows: 1
        contains: [{ kept_urls: "" }]
      documents:
        rows: 1
