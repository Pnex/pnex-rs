# A person entered by a sales rep, matched with their LinkedIn profile
# (D788, D996): one query of the ladder per row, typed in the search bar of
# the asking member's browser agent, the first profiles of the results
# opened and scored by `person_match_score`. The best profile above the
# attaching score becomes an account identifier of the person; plausible ones
# wait in "To validate"; when nothing scores, the next query of the ladder is
# asked. The route builds the subject (folded names, the ladder, the
# thresholds) and keeps the guards: objection, daily searches.
key: person_match_linkedin
name: Person match (LinkedIn)
hosts: [www.linkedin.com]
steps:
  - enumerate: { as: asked, track: true, cross: [{ as: person_id, asked: [query, step, subject] }] }
  - browse:
      as: page
      for_each: asked
      site: www.linkedin.com
      session: required
      steps:
        - open: /feed/
        - wait: { ms: 2500 }
        - type: { text: "{{query}}" }
        - press: Enter
        - wait: { ms: 3000 }
        - click: { role: button, name: People, optional: true }
        - click: { role: button, name: Personnes, optional: true } # english-guard: allow (button label of the French UI)
        - wait: { ms: 3000 }
        - extract: { cards: { selector: "main li:has(a[href*='/in/'])", max: 5, fields: { card: {}, link: { selector: "a[href*='/in/']", attr: href } } }, as: results, optional: true }
        - for_each: { from: results, link: link, max: 3, steps: [{ wait: { ms: 2500 } }, { scroll: bottom }, { wait: { ms: 1500 } }, { extract: { all_text: true, as: profile } }] }
  # One row per extract, the asked row on each (or alone without any).
  - sql:
      as: found
      sql: >-
        SELECT a.person_id, a.step, a.subject, p.name, p.text
        FROM asked a LEFT JOIN page p ON true
  - call: { as: scored, from: found, function: person_match_score }
  # The best profile above the attaching score, never a job change.
  - sql:
      as: best
      sql: SELECT * FROM scored WHERE verdict = 'write'
  - sql:
      as: best_documents
      sql: >-
        SELECT 'person' AS type_key, 'id' AS key_property, person_id AS key,
          url AS source_url, 'Profile · ' || url AS name, profile AS text
        FROM best WHERE length(trim(profile)) > 0
  - write:
      from: best_documents
      media: { link_type: captured_text, source: browser_agent, stamp: profile_to_read, keep_days: 30 }
  - write:
      from: best
      objects:
        objects:
          - { as: account, type: identifier, key: value, create: true, title: url, properties: { value: url, kind: { value: account } } }
          - { as: person, type: person, key: "@id", create: false, properties: { "@id": person_id } }
        links:
          - { type: uses_identifier, from: person, to: account }
  # Without an attached profile, the plausible ones wait for a human.
  - sql:
      as: plausible
      sql: SELECT * FROM scored WHERE verdict = 'propose'
  - sql:
      as: plausible_documents
      sql: >-
        SELECT 'person' AS type_key, 'id' AS key_property, person_id AS key,
          url AS source_url, 'Profile · ' || url AS name, profile AS text
        FROM plausible WHERE length(trim(profile)) > 0
  - write:
      from: plausible_documents
      media: { link_type: captured_text, source: browser_agent, keep_days: 30 }
  - write:
      from: plausible
      objects:
        objects:
          - { as: account, type: identifier, key: value, create: true, title: url, properties: { value: url, kind: { value: account } } }
  - sql:
      as: proposed
      sql: >-
        SELECT 'person' AS type_key, 'id' AS key_property, person_id AS key, url AS title,
          'uses_identifier' AS link_type, 'identifier' AS to_type, 'value' AS to_property,
          url AS to_key, score AS confidence, evidence
        FROM plausible
  - write:
      from: proposed
      proposals: { origin: prospecting_b2b.person_match }
  # Nothing plausible: the next query of the ladder, as the function gives it.
  - sql:
      as: next
      sql: SELECT person_id, query, step, subject FROM scored WHERE verdict = 'next'
  - write:
      from: next
      ask: {}
tests:
  - name: the profile naming the person at their company is attached
    asked: [{ person_id: "8f1c2b9e-0000-4000-8000-000000000001", query: "jane doe example", step: "0", subject: '{"name":["jane","doe"],"orgs":[["example","industries"],["example"]],"groups":[],"cities":[["lyon"]],"queries":["jane doe example industries","jane doe"],"write_at":80,"propose_at":40}' }]
    given: { "browse:page": match_jane_doe.json }
    expect:
      best:
        rows: 1
      best_documents:
        rows: 1
      plausible:
        rows: 0
      next:
        rows: 0
  - name: a profile at another company only is proposed
    asked: [{ person_id: "8f1c2b9e-0000-4000-8000-000000000001", query: "jane doe example", step: "0", subject: '{"name":["jane","doe"],"orgs":[["globex"]],"groups":[],"cities":[["lyon"]],"queries":["jane doe globex","jane doe"],"write_at":80,"propose_at":40}' }]
    given: { "browse:page": match_jane_doe.json }
    expect:
      best:
        rows: 0
      plausible:
        rows: 1
      proposed:
        rows: 1
      next:
        rows: 0
  - name: nobody found asks the next query
    asked: [{ person_id: "8f1c2b9e-0000-4000-8000-000000000001", query: "john smith", step: "0", subject: '{"name":["john","smith"],"orgs":[["example"]],"groups":[],"cities":[],"queries":["john smith example","john smith"],"write_at":80,"propose_at":40}' }]
    given: { "browse:page": match_jane_doe.json }
    expect:
      best:
        rows: 0
      plausible:
        rows: 0
      next:
        rows: 1
