# Business pack "B2B account mapping" (account-mapping.md D329–D343): an
# account is the `organization` of the worldwide companies pack (any
# country; country packs add their registers), extended
# with its commercial status and coverage; no "company" or "account" type
# next to it (D304), so the graph stays one.
# `filiale_de` (group structure, D331) moved to `entreprises` 1.1.0 in
# 1.1.0: it is not specific to selling.
# `ca_dernier` is the latest known revenue and `ca_exercice` its fiscal
# year: the core has no per-year scalar property (D178 temporal = O2
# series or events), past years stay in the object history.
# `persona` is the role in the buying committee, not a job title (the
# title stays on `employs.position`). Several people may follow one account,
# each with the role the org gives it (`suit_le_compte.role`, free text).
# Coverage and white space are computed at read time (D330), never stored:
# the commercial group sums the users and lists the nodes without a
# contact or a client status. Statuses carry a colour (D339) for the map,
# the hierarchy and the graph.
# Target score (D336): the pack ships the scoring function and its flow,
# never a criterion. Criteria are objects of the org (`critere_ciblage`:
# property, operator, value, points), so the profile of an ideal customer
# stays the org's data; the score is explained line by line in
# `score_detail`. Organizations only: sites are system objects a flow does
# not write, the explorer filters them on their own headcount.
# Commercial signals (D335): something that moved on an account, kept with
# where it came from and the words quoted. `kind` says how it was detected
# (closed list), `theme` what it is about (the org's own list). A signal
# from a model is always `a_valider`; a human retains or dismisses it. The
# daily digest flow prepares one text of the new signals: add the org's
# notification node on its first port, then deploy.
# Watched pages (D335, news, careers, competitors' offers): a crawl of the
# page with a `record` into `page_suivie` keeps its text and flags it when
# the text changed; a flow asks the org's LLM which topic of the org's list
# the page announces and writes a `page_modifiee` signal (to validate)
# about the account, quoting the sentence.
# Page templates (D340) are filled from the account they are opened on
# (placeholders of `page_render`): account plan, competitor sheet, meeting
# preparation. A snapshot of the day, then free text.
# Personal data (D341, crm.md D442–D447): the persona of a person is
# `personnelle`; `opposition_le` records an objection (prospecting flows
# skip the person); the legal basis shown on a person and the retention
# period of the erasure queue are settings of the org.
# Meetings: a `meeting` with an account, its participants (ours and
# theirs), its recording (a media: transcription and summary with a focus
# are the media analyses), its debrief page, and the criteria of the org's
# sales playbook it covered (`coaching_criterion`, the org's own list). The
# coaching reads per criterion how many meetings covered it: aggregates of
# the team's practice, never a score of a person. A meeting read from a
# mail invitation (crm pack) is keyed by the invitation's iCalendar UID
# (`invitation_uid`): an update moves it, a cancellation marks it.
key: prospection_b2b
name: B2B account mapping
names: {fr: "Cartographie commerciale"}
version: "1.7.0"
requires: [entreprises, presence_web]
description: "Accounts as a dated network: group and subsidiaries, sites with their commercial status, contacts by persona, who recommended whom. Questions: which subsidiaries of this group have no contact yet? Who follows this account? Which sites are customers?"
descriptions: {fr: "Les comptes vus comme un réseau daté : groupe et filiales, sites avec leur statut commercial, contacts par persona, qui a recommandé qui. Questions : quelles filiales de ce groupe n'ont encore aucun contact ? Qui suit ce compte ? Quels sites sont clients ?"}
settings:
  - key: base_legale
    name: Legal basis
    names: {fr: "Base légale"}
    description: Legal basis of the processing of the contacts' personal data, shown on a person (D341).
    descriptions: {fr: "Base légale du traitement des données personnelles des contacts, affichée sur une personne (D341)."}
    kind: text
    default: interet_legitime_prospection_b2b
  - key: retention_mois
    name: Retention (months)
    names: {fr: "Durée de conservation (mois)"}
    description: A person with no change, link or capture for this many months is proposed for erasure (D341).
    descriptions: {fr: "Une personne sans modification, lien ni capture depuis ce nombre de mois est proposée à l'effacement (D341)."}
    kind: number
    default: 36
    min: 6
    max: 120
extends:
  - type: organization
    properties:
      - key: statut_compte
        name: Account status
        names: {fr: "Statut du compte"}
        kind: enum
        values: [client, prospect, cible, ancien_client, concurrent, partenaire, exclu]
        labels: {client: {fr: "Client", en: "Customer"}, prospect: {fr: "Prospect", en: "Prospect"}, cible: {fr: "Cible", en: "Target"}, ancien_client: {fr: "Ancien client", en: "Former customer"}, concurrent: {fr: "Concurrent", en: "Competitor"}, partenaire: {fr: "Partenaire", en: "Partner"}, exclu: {fr: "Exclu", en: "Excluded"}}
        colors: { client: green, prospect: amber, cible: blue, ancien_client: gray, concurrent: red, partenaire: violet, exclu: gray }
        indexed: true
      - { key: utilisateurs_actuels, name: Current users, names: {fr: "Utilisateurs actuels"}, kind: number, min: 0 }
      - { key: potentiel_utilisateurs, name: Potential users, names: {fr: "Utilisateurs potentiels"}, kind: number, min: 0 }
      - { key: ca_dernier, name: Latest revenue, names: {fr: "Dernier chiffre d'affaires"}, kind: money }
      - { key: ca_exercice, name: Revenue fiscal year, names: {fr: "Exercice du chiffre d'affaires"}, kind: number, min: 1900, max: 2100 }
      - { key: score_cible, name: Target score, names: {fr: "Score de ciblage"}, kind: number, indexed: true }
      - { key: score_detail, name: Score detail, names: {fr: "Détail du score"}, kind: text, max_len: 4000 }
      - { key: score_le, name: Scored on, names: {fr: "Score calculé le"}, kind: date }
  - type: map_pin
    properties:
      - key: statut_site
        name: Site status
        names: {fr: "Statut du site"}
        kind: enum
        values: [client, prospect, non_couvert]
        labels: {client: {fr: "Client", en: "Customer"}, prospect: {fr: "Prospect", en: "Prospect"}, non_couvert: {fr: "Non couvert", en: "Not covered"}}
        colors: { client: green, prospect: amber, non_couvert: gray }
        indexed: true
      - { key: utilisateurs_actuels, name: Current users, names: {fr: "Utilisateurs actuels"}, kind: number, min: 0 }
  - type: person
    properties:
      - key: persona
        name: Persona
        names: {fr: "Persona"}
        kind: enum
        values: [decideur, champion, sponsor, prescripteur, acheteur, utilisateur, technique, autre]
        labels: {decideur: {fr: "Décideur", en: "Decision maker"}, champion: {fr: "Champion", en: "Champion"}, sponsor: {fr: "Sponsor", en: "Sponsor"}, prescripteur: {fr: "Prescripteur", en: "Influencer"}, acheteur: {fr: "Acheteur", en: "Buyer"}, utilisateur: {fr: "Utilisateur", en: "User"}, technique: {fr: "Technique", en: "Technical"}, autre: {fr: "Autre", en: "Other"}}
        indexed: true
        classification: personnelle
      - { key: revoir_le, name: Review on, names: {fr: "À revoir le"}, kind: date }
      - { key: opposition_le, name: Objected on, names: {fr: "Opposition le"}, kind: date, indexed: true }
link_types:
  - key: recommande
    name: recommends
    names: {fr: "recommande"}
    inverse_name: is recommended by
    inverse_names: {fr: "est recommandé par"}
    from_types: [person]
    to_types: [person, organization]
    attributes:
      - { key: date, name: Date, names: {fr: "Date"}, kind: date }
      - { key: contexte, name: Context, names: {fr: "Contexte"}, kind: text, max_len: 1000 }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 1000 }
  - key: suit_le_compte
    name: follows the account
    names: {fr: "suit le compte"}
    inverse_name: is followed by
    inverse_names: {fr: "est suivi par"}
    from_types: [person]
    to_types: [organization]
    attributes:
      - { key: role, name: Role, names: {fr: "Rôle"}, kind: text, max_len: 255 }
  - key: signal_sur
    name: is about
    names: {fr: "porte sur"}
    inverse_name: has as signal
    inverse_names: {fr: "a pour signal"}
    from_types: [signal_commercial]
    to_types: [organization, map_pin, person]
  - key: page_sur
    name: is a page about
    names: {fr: "est une page sur"}
    inverse_name: has as page
    inverse_names: {fr: "a pour page"}
    from_types: [doc]
    to_types: [organization, meeting]
  - key: takes_part_in
    name: takes part in
    names: {fr: "participe à"}
    inverse_name: has as participant
    inverse_names: {fr: "a pour participant"}
    from_types: [person]
    to_types: [meeting]
    attributes:
      - key: side
        name: Side
        names: {fr: "Côté"}
        kind: enum
        values: [internal, customer]
        labels: {internal: {fr: "Interne", en: "Internal"}, customer: {fr: "Client", en: "Customer"}}
  - key: meeting_with
    name: is a meeting with
    names: {fr: "est un rendez-vous avec"}
    inverse_name: has as meeting
    inverse_names: {fr: "a pour rendez-vous"}
    from_types: [meeting]
    to_types: [organization, map_pin]
  - key: recording_of
    name: is the recording of
    names: {fr: "est l'enregistrement de"}
    inverse_name: has as recording
    inverse_names: {fr: "a pour enregistrement"}
    from_types: [media_asset]
    to_types: [meeting]
  - key: covered
    name: covered
    names: {fr: "a abordé"}
    inverse_name: was covered in
    inverse_names: {fr: "abordé lors de"}
    from_types: [meeting]
    to_types: [coaching_criterion]
    attributes:
      - { key: comment, name: Comment, names: {fr: "Commentaire"}, kind: text, max_len: 1000 }
  - key: utilise_solution
    name: uses the solution of
    names: {fr: "utilise la solution de"}
    inverse_name: is the solution of
    inverse_names: {fr: "équipe"}
    from_types: [organization, map_pin]
    to_types: [organization]
    attributes:
      - { key: depuis, name: Since, names: {fr: "Depuis"}, kind: date }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 1000 }
hierarchies:
  - key: groupe_commercial
    name: Commercial group
    names: {fr: "Groupe commercial"}
    steps:
      - { link: filiale_de, inverse: true }
      - { link: owns }
      - { link: etablissement_de, inverse: true }
    # Coverage (D330): users summed, a node with a contact or a client
    # status is covered, the others are the account's white space.
    sums: [utilisateurs_actuels, potentiel_utilisateurs]
    coverage:
      links: [employs]
      values: { statut_site: [client], statut_compte: [client] }
  # Coaching: from a playbook criterion, the meetings that covered it and
  # their accounts; the band counts them by status.
  - key: coaching
    name: Coaching
    names: {fr: "Coaching"}
    steps:
      - { link: covered, inverse: true }
      - { link: meeting_with }
types:
  - key: page_suivie
    name: Watched page
    names: {fr: "Page suivie"}
    icon: newspaper
    properties:
      - { key: url, name: URL, names: {fr: "URL"}, kind: text, max_len: 2048, required: true, unique: true }
      - { key: texte, name: Text, names: {fr: "Texte"}, kind: text, max_len: 20000 }
      - { key: modifiee, name: Changed, names: {fr: "Modifiée"}, kind: bool, indexed: true }
      - { key: compte, name: Account (id), names: {fr: "Compte (id)"}, kind: text, max_len: 36 }
      - { key: derniere_vue, name: Last seen, names: {fr: "Vue la dernière fois"}, kind: date_time }
  - key: meeting
    name: Meeting
    names: {fr: "Rendez-vous"}
    icon: user
    properties:
      - { key: date, name: Date, names: {fr: "Date"}, kind: date_time, indexed: true }
      - { key: purpose, name: Purpose, names: {fr: "Objet"}, kind: text, max_len: 500 }
      - key: status
        name: Status
        names: {fr: "Statut"}
        kind: enum
        values: [planned, held, cancelled]
        labels: {planned: {fr: "Prévu", en: "Planned"}, held: {fr: "Tenu", en: "Held"}, cancelled: {fr: "Annulé", en: "Cancelled"}}
        colors: { planned: blue, held: green, cancelled: gray }
        indexed: true
      - { key: place, name: Place, names: {fr: "Lieu"}, kind: text, max_len: 255 }
      - { key: next_step, name: Next step, names: {fr: "Suite donnée"}, kind: text, max_len: 2000 }
      - { key: invitation_uid, name: Invitation id, names: {fr: "Identifiant de l'invitation"}, kind: text, max_len: 1024, unique: true }
  - key: coaching_criterion
    name: Playbook criterion
    names: {fr: "Critère du playbook"}
    icon: tag
    properties:
      - { key: description, name: Description, names: {fr: "Description"}, kind: text, max_len: 2000 }
      - key: persona
        name: Persona
        names: {fr: "Persona"}
        kind: enum
        values: [decideur, champion, sponsor, prescripteur, acheteur, utilisateur, technique, autre]
        labels: {decideur: {fr: "Décideur", en: "Decision maker"}, champion: {fr: "Champion", en: "Champion"}, sponsor: {fr: "Sponsor", en: "Sponsor"}, prescripteur: {fr: "Prescripteur", en: "Influencer"}, acheteur: {fr: "Acheteur", en: "Buyer"}, utilisateur: {fr: "Utilisateur", en: "User"}, technique: {fr: "Technique", en: "Technical"}, autre: {fr: "Autre", en: "Other"}}
      - { key: active, name: Active, names: {fr: "Actif"}, kind: bool }
  - key: signal_commercial
    name: Commercial signal
    names: {fr: "Signal commercial"}
    icon: flag
    properties:
      - { key: cle, name: Key, names: {fr: "Clé"}, kind: text, max_len: 255, required: true, unique: true }
      - key: kind
        name: Detected by
        names: {fr: "Détecté par"}
        kind: enum
        values: [nouvel_etablissement, fermeture_etablissement, changement_dirigeant, annonce_legale, page_modifiee, changement_poste, autre]
        labels: {nouvel_etablissement: {fr: "Nouvel établissement", en: "New site"}, fermeture_etablissement: {fr: "Fermeture d'établissement", en: "Site closed"}, changement_dirigeant: {fr: "Changement de dirigeant", en: "New executive"}, annonce_legale: {fr: "Annonce légale", en: "Legal notice"}, page_modifiee: {fr: "Page modifiée", en: "Page changed"}, changement_poste: {fr: "Changement de poste", en: "Job change"}, autre: {fr: "Autre", en: "Other"}}
        required: true
        indexed: true
      - { key: theme, name: Theme, names: {fr: "Thème"}, kind: text, max_len: 64, indexed: true }
      - { key: resume, name: Summary, names: {fr: "Résumé"}, kind: text, max_len: 1000 }
      - { key: extrait, name: Quoted excerpt, names: {fr: "Extrait cité"}, kind: text, max_len: 4000 }
      - { key: date, name: Date, names: {fr: "Date"}, kind: date, indexed: true }
      - { key: source_url, name: Source, names: {fr: "Source"}, kind: url }
      - key: etat
        name: State
        names: {fr: "État"}
        kind: enum
        values: [a_valider, retenu, ecarte]
        labels: {a_valider: {fr: "À valider", en: "To validate"}, retenu: {fr: "Retenu", en: "Kept"}, ecarte: {fr: "Écarté", en: "Dismissed"}}
        colors: { a_valider: amber, retenu: green, ecarte: gray }
        indexed: true
      - { key: notifie_le, name: Notified on, names: {fr: "Notifié le"}, kind: date }
  - key: critere_ciblage
    name: Targeting criterion
    names: {fr: "Critère de ciblage"}
    icon: tag
    properties:
      - key: propriete
        name: Property
        names: {fr: "Propriété"}
        kind: text
        max_len: 64
        required: true
      - key: operateur
        name: Operator
        names: {fr: "Opérateur"}
        kind: enum
        values: [egal, parmi, commence_par, au_moins, au_plus, renseigne]
        labels: {egal: {fr: "Égal à", en: "Equals"}, parmi: {fr: "Parmi", en: "One of"}, commence_par: {fr: "Commence par", en: "Starts with"}, au_moins: {fr: "Au moins", en: "At least"}, au_plus: {fr: "Au plus", en: "At most"}, renseigne: {fr: "Renseigné", en: "Filled in"}}
        required: true
      - { key: valeur, name: Value, names: {fr: "Valeur"}, kind: text, max_len: 1000 }
      - { key: points, name: Points, names: {fr: "Points"}, kind: number, required: true }
      - { key: actif, name: Active, names: {fr: "Actif"}, kind: bool }
functions:
  - name: pb_criteres
    language: starlark
    description: Keeps the org's active targeting criteria on the message for the scoring that follows.
    code: |
      # The criteria (an array query) travel with the message: the next
      # query sends one message per organization, each carrying them.
      def handle(inputs, msg):
          return {"payload": {}, "criteres": msg["payload"]}
  - name: pb_score
    language: starlark
    description: "Target score of an organization: the points of each matching criterion, explained line by line (D336)."
    code: |
      # Target score (D336): generic, it holds no criterion. Each criterion
      # of msg.criteres ({title, properties: {propriete, operateur, valeur,
      # points}}) that the organization meets adds its points (negative
      # points exclude). Lists in `valeur` are comma-separated.
      def number(v):
          if type(v) == "dict":
              v = v.get("amount")
          if type(v) in ("int", "float"):
              return float(v)
          if type(v) == "string" and v.strip():
              t = v.strip().replace(",", ".")
              ok = len(t) > 0
              for c in t.elems():
                  if not (c.isdigit() or c in ".-"):
                      ok = False
              if ok:
                  return float(t)
          return None

      def text(v):
          if v == None:
              return ""
          if type(v) == "bool":
              return "true" if v else "false"
          if type(v) in ("int", "float"):
              f = float(v)
              return str(int(f)) if f == int(f) else str(f)
          return str(v)

      def meets(c, v):
          op = c.get("operateur", "")
          want = c.get("valeur", "") or ""
          items = [w.strip() for w in want.split(",") if w.strip()]
          if op == "renseigne":
              return text(v) != ""
          if op == "egal":
              return text(v) == want.strip()
          if op == "parmi":
              return text(v) in items
          if op == "commence_par":
              return any([text(v).startswith(w) for w in items])
          n = number(v)
          w = number(want)
          if n == None or w == None:
              return False
          if op == "au_moins":
              return n >= w
          if op == "au_plus":
              return n <= w
          return False

      def handle(inputs, msg):
          p = msg["payload"]
          total = 0
          lines = []
          for c in msg.get("criteres", []):
              props = c.get("properties", {})
              if props.get("actif") == False:
                  continue
              if meets(props, p.get(props.get("propriete", ""))):
                  pts = int(number(props.get("points", 0)) or 0)
                  total += pts
                  sign = "+" if pts >= 0 else ""
                  lines.append(c.get("title", props.get("propriete", "")) + " : " + sign + str(pts))
          return {
              "payload": {
                  "score_cible": total,
                  "score_detail": "\n".join(lines),
                  "score_le": msg.get("today", ""),
              },
              "object_id": msg["object"]["id"],
          }
  - name: pb_digest
    language: starlark
    description: One text of the new commercial signals, for the org's notification node.
    code: |
      # Daily digest (D335): one line per new signal, newest first.
      # @output digest any "The digest (payload.texte), when there is a new signal"
      # @output marquer any "Then mark them notified"
      def handle(inputs, msg):
          rows = msg["payload"]
          if len(rows) == 0:
              return None
          rows = sorted(rows, key = lambda r: r["properties"].get("date", ""), reverse = True)
          lines = []
          for r in rows:
              p = r["properties"]
              lines.append("- " + p.get("date", "") + " " + r["title"] + " : " + p.get("resume", ""))
          return [
              {"payload": {"trigger": True, "nombre": len(rows), "texte": "\n".join(lines)}},
              {"payload": {}},
          ]
  - name: ps_preparer
    language: starlark
    description: A changed watched page, its text for the model and the page kept aside.
    code: |
      def handle(inputs, msg):
          p = msg["payload"]
          return {"payload": {"texte": p.get("texte", "")},
                  "page": {"id": msg["object"]["id"], "url": p.get("url", ""),
                           "titre": msg["object"]["title"], "compte": p.get("compte", "")}}
  - name: ps_signal
    language: starlark
    description: "The model's answer about a watched page: a signal when it names a topic of the list, and the page cleared."
    code: |
      # The org's topics (D335): edit this list to the org's own, the
      # prompt of the LLM node names the same keys.
      # @output signal any "A signal about the account (to validate)"
      # @output lu any "The page, marked read"
      THEMES = ["ouverture_site", "investissement", "recrutement", "nouvelle_ligne", "rachat",
                "retraites", "qualite", "multi_sites", "ecole", "nouvelle_offre", "prix"]

      def handle(inputs, msg):
          page = msg.get("page", {})
          lines = [l.strip() for l in msg["payload"].get("text", "").strip().split("\n") if l.strip()]
          theme = lines[0].strip("`*. ").lower() if lines else "aucun"
          read = {"payload": {"modifiee": False}, "object_id": page.get("id")}
          if theme not in THEMES or not page.get("compte"):
              return [None, read]
          quote = lines[1][:4000] if len(lines) > 1 else ""
          day = msg.get("today", "")
          signal = {
              "payload": {
                  "cle": "page:" + page.get("url", "") + ":" + day,
                  "kind": "page_modifiee",
                  "theme": theme,
                  "resume": page.get("titre", ""),
                  "extrait": quote,
                  "date": day,
                  "source_url": page.get("url", ""),
                  "etat": "a_valider",
              },
              "title": theme.replace("_", " ") + " · " + page.get("titre", ""),
          }
          return [signal, read]
  - name: ps_lien
    language: starlark
    description: Link payload from the signal just written to the account of the page.
    code: |
      def handle(inputs, msg):
          return {"payload": {"source_id": msg["object"]["id"], "target_id": msg["page"]["compte"]}}
  - name: pb_notifie
    language: starlark
    description: Marks a signal notified today.
    code: |
      def handle(inputs, msg):
          return {"payload": {"notifie_le": msg.get("today", "")}, "object_id": msg["object"]["id"]}
flows:
  - name: "Prospection · watched pages to signals"
    note: "Every hour, up to 50 watched pages whose text changed are read by the organization's LLM: a page announcing a topic of the list (new site, investment, hiring, ramp-up, takeover, retirements, quality problem, multi-site, in-house school, new offer, prices) becomes a commercial signal about the account, to validate, quoting the sentence. Edit the topics in the function ps_signal and in the prompt together. Watch a page with a site crawl whose record writes type page_suivie (url, texte, changed → modifiee, link_to → compte). Needs an AI provider."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 * * * *" }, outputs: [{ port: 0, targets: [changed] }] }
        - id: changed
          kind: ontology_query
          config:
            object_type: page_suivie
            filters: [{ key: modifiee, op: eq, value: true }]
            limit: 50
          outputs: [{ port: 0, targets: [prep] }]
        - { id: prep, kind: pnex_function, config: { function_name: ps_preparer, language: starlark }, outputs: [{ port: 0, targets: [read] }] }
        - id: read
          kind: llm_text
          config:
            data_field: texte
            max_chars: 600
            prompt: "This is the text of a company web page (news, careers, offers). If it announces one of these topics, answer on the first line with the topic key only, then on the second line quote word for word the sentence that says it. Otherwise answer only: aucun. Topics: ouverture_site (a new plant, site or establishment), investissement (an investment), recrutement (a hiring wave), nouvelle_ligne (a new production line or a ramp-up), rachat (a takeover or a merger), retraites (retirements, generational change), qualite (a quality problem or a recall), multi_sites (a multi-site rollout), ecole (an in-house school or academy), nouvelle_offre (a new product or service), prix (prices or plans)."
          outputs: [{ port: 0, targets: [decide] }]
        - { id: decide, kind: pnex_function, config: { function_name: ps_signal, language: starlark }, outputs: [{ port: 0, targets: [signal] }, { port: 1, targets: [done] }] }
        - { id: signal, kind: object_upsert, config: { object_type: signal_commercial, key: cle, skip_existing: true }, outputs: [{ port: 0, targets: [about] }] }
        - { id: about, kind: pnex_function, config: { function_name: ps_lien, language: starlark }, outputs: [{ port: 0, targets: [linked] }] }
        - { id: linked, kind: link_upsert, config: { link_type: signal_sur } }
        - { id: done, kind: object_upsert, config: { object_type: page_suivie, key: id } }
  - name: "Prospection · signals digest"
    note: "Each morning the commercial signals not yet notified make one digest (payload.texte, payload.nombre), then are marked notified. Add your Notification node on the digest port (template with a « texte » variable, trigger = payload.trigger), then deploy."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "0 7 * * *" }, outputs: [{ port: 0, targets: [new] }] }
        - id: new
          kind: ontology_query
          config:
            object_type: signal_commercial
            filters: [{ key: notifie_le, op: missing }]
            limit: 200
            output: array
          outputs: [{ port: 0, targets: [digest] }]
        - { id: digest, kind: pnex_function, config: { function_name: pb_digest, language: starlark }, outputs: [{ port: 1, targets: [each] }] }
        - id: each
          kind: ontology_query
          config:
            object_type: signal_commercial
            filters: [{ key: notifie_le, op: missing }]
            limit: 200
          outputs: [{ port: 0, targets: [mark] }]
        - { id: mark, kind: pnex_function, config: { function_name: pb_notifie, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: signal_commercial, key: id } }
  - name: "Prospection · target score"
    note: "Every 15 minutes, up to 500 organizations not scored today get their target score from the org's active targeting criteria (objects « Targeting criterion »: property, operator, value, points). Add criteria first, then deploy. A large list is covered over the day."
    graph:
      nodes:
        - { id: tick, kind: inject, config: { cron: "*/15 * * * *" }, outputs: [{ port: 0, targets: [crit] }] }
        - id: crit
          kind: ontology_query
          config:
            object_type: critere_ciblage
            limit: 200
            output: array
          outputs: [{ port: 0, targets: [keep] }]
        - { id: keep, kind: pnex_function, config: { function_name: pb_criteres, language: starlark }, outputs: [{ port: 0, targets: [orgs] }] }
        - id: orgs
          kind: ontology_query
          config:
            object_type: organization
            filters: [{ key: score_le, op: ne, value: "$today" }]
            limit: 500
          outputs: [{ port: 0, targets: [score] }]
        - { id: score, kind: pnex_function, config: { function_name: pb_score, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: organization, key: id } }
