# Business pack "B2B account mapping" (account-mapping.md D329–D343): an
# account is the `organization` of the worldwide companies pack (any
# country; country packs add their registers), extended
# with its commercial status and coverage; no "company" or "account" type
# next to it (D304), so the graph stays one.
# `filiale_de` (group structure, D331) moved to `entreprises` 1.1.0 in
# 1.1.0: it is not specific to selling.
# `ca_dernier` is the latest known revenue and `ca_exercice` its fiscal
# year: the core has no per-year scalar property (D178 temporal = O2
# series or events), past years stay in the object history.
# `persona` is the role in the buying committee, not a job title (the
# title stays on `employs.position`). Several people may follow one account,
# each with the role the org gives it (`suit_le_compte.role`, free text).
# Coverage and white space are computed at read time (D330), never stored:
# the commercial group sums the users and lists the nodes without a
# contact or a client status. Statuses carry a colour (D339) for the map,
# the hierarchy and the graph.
# Target score (D336): the pack ships the scoring function and its flow,
# never a criterion. Criteria are objects of the org (`critere_ciblage`:
# property, operator, value, points), so the profile of an ideal customer
# stays the org's data; the score is explained line by line in
# `score_detail`. Organizations only: sites are system objects a flow does
# not write, the explorer filters them on their own headcount.
# Commercial signals (D335): something that moved on an account, kept with
# where it came from and the words quoted. `kind` says how it was detected
# (closed list), `theme` what it is about (the org's own list). A signal
# from a model is always `a_valider`; a human retains or dismisses it. The
# daily digest flow prepares one text of the new signals: add the org's
# notification node on its first port, then deploy.
# Page templates (D340) are filled from the account they are opened on
# (placeholders of `page_render`): account plan, competitor sheet, meeting
# preparation. A snapshot of the day, then free text.
# Meetings: a `rendez_vous` with an account, its participants (ours and
# theirs), its recording (a media: transcription and summary with a focus
# are the media analyses), its debrief page, and the criteria of the org's
# sales playbook it covered (`critere_coaching`, the org's own list). The
# coaching reads per criterion how many meetings covered it: aggregates of
# the team's practice, never a score of a person.
key: prospection_b2b
name: B2B account mapping
names: {fr: "Cartographie commerciale"}
version: "1.1.0"
requires: [entreprises, presence_web]
description: "Accounts as a dated network: group and subsidiaries, sites with their commercial status, contacts by persona, who recommended whom. Questions: which subsidiaries of this group have no contact yet? Who follows this account? Which sites are customers?"
descriptions: {fr: "Les comptes vus comme un réseau daté : groupe et filiales, sites avec leur statut commercial, contacts par persona, qui a recommandé qui. Questions : quelles filiales de ce groupe n'ont encore aucun contact ? Qui suit ce compte ? Quels sites sont clients ?"}
extends:
  - type: organization
    properties:
      - key: statut_compte
        name: Account status
        names: {fr: "Statut du compte"}
        kind: enum
        values: [client, prospect, cible, ancien_client, concurrent, partenaire, exclu]
        colors: { client: green, prospect: amber, cible: blue, ancien_client: gray, concurrent: red, partenaire: violet, exclu: gray }
        indexed: true
      - { key: utilisateurs_actuels, name: Current users, names: {fr: "Utilisateurs actuels"}, kind: number, min: 0 }
      - { key: potentiel_utilisateurs, name: Potential users, names: {fr: "Utilisateurs potentiels"}, kind: number, min: 0 }
      - { key: ca_dernier, name: Latest revenue, names: {fr: "Dernier chiffre d'affaires"}, kind: money }
      - { key: ca_exercice, name: Revenue fiscal year, names: {fr: "Exercice du chiffre d'affaires"}, kind: number, min: 1900, max: 2100 }
      - { key: score_cible, name: Target score, names: {fr: "Score de ciblage"}, kind: number, indexed: true }
      - { key: score_detail, name: Score detail, names: {fr: "Détail du score"}, kind: text, max_len: 4000 }
      - { key: score_le, name: Scored on, names: {fr: "Score calculé le"}, kind: date }
  - type: map_pin
    properties:
      - key: statut_site
        name: Site status
        names: {fr: "Statut du site"}
        kind: enum
        values: [client, prospect, non_couvert]
        colors: { client: green, prospect: amber, non_couvert: gray }
        indexed: true
      - { key: utilisateurs_actuels, name: Current users, names: {fr: "Utilisateurs actuels"}, kind: number, min: 0 }
  - type: person
    properties:
      - key: persona
        name: Persona
        names: {fr: "Persona"}
        kind: enum
        values: [decideur, champion, sponsor, prescripteur, acheteur, utilisateur, technique, autre]
        indexed: true
      - { key: revoir_le, name: Review on, names: {fr: "À revoir le"}, kind: date }
link_types:
  - key: recommande
    name: recommends
    names: {fr: "recommande"}
    inverse_name: is recommended by
    inverse_names: {fr: "est recommandé par"}
    from_types: [person]
    to_types: [person, organization]
    attributes:
      - { key: date, name: Date, names: {fr: "Date"}, kind: date }
      - { key: contexte, name: Context, names: {fr: "Contexte"}, kind: text, max_len: 1000 }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 1000 }
  - key: suit_le_compte
    name: follows the account
    names: {fr: "suit le compte"}
    inverse_name: is followed by
    inverse_names: {fr: "est suivi par"}
    from_types: [person]
    to_types: [organization]
    attributes:
      - { key: role, name: Role, names: {fr: "Rôle"}, kind: text, max_len: 255 }
  - key: signal_sur
    name: is about
    names: {fr: "porte sur"}
    inverse_name: has as signal
    inverse_names: {fr: "a pour signal"}
    from_types: [signal_commercial]
    to_types: [organization, map_pin, person]
  - key: page_sur
    name: is a page about
    names: {fr: "est une page sur"}
    inverse_name: has as page
    inverse_names: {fr: "a pour page"}
    from_types: [doc]
    to_types: [organization, rendez_vous]
  - key: participe_a
    name: takes part in
    names: {fr: "participe à"}
    inverse_name: has as participant
    inverse_names: {fr: "a pour participant"}
    from_types: [person]
    to_types: [rendez_vous]
    attributes:
      - key: nature
        name: Nature
        names: {fr: "Nature"}
        kind: enum
        values: [interne, client]
  - key: rdv_avec
    name: is a meeting with
    names: {fr: "est un rendez-vous avec"}
    inverse_name: has as meeting
    inverse_names: {fr: "a pour rendez-vous"}
    from_types: [rendez_vous]
    to_types: [organization, map_pin]
  - key: enregistrement_de
    name: is the recording of
    names: {fr: "est l'enregistrement de"}
    inverse_name: has as recording
    inverse_names: {fr: "a pour enregistrement"}
    from_types: [media_asset]
    to_types: [rendez_vous]
  - key: couvre
    name: covered
    names: {fr: "a abordé"}
    inverse_name: was covered in
    inverse_names: {fr: "abordé lors de"}
    from_types: [rendez_vous]
    to_types: [critere_coaching]
    attributes:
      - { key: commentaire, name: Comment, names: {fr: "Commentaire"}, kind: text, max_len: 1000 }
  - key: utilise_solution
    name: uses the solution of
    names: {fr: "utilise la solution de"}
    inverse_name: is the solution of
    inverse_names: {fr: "équipe"}
    from_types: [organization, map_pin]
    to_types: [organization]
    attributes:
      - { key: depuis, name: Since, names: {fr: "Depuis"}, kind: date }
      - { key: source, name: Source, names: {fr: "Source"}, kind: text, max_len: 1000 }
hierarchies:
  - key: groupe_commercial
    name: Commercial group
    names: {fr: "Groupe commercial"}
    steps:
      - { link: filiale_de, inverse: true }
      - { link: owns }
      - { link: etablissement_de, inverse: true }
    # Coverage (D330): users summed, a node with a contact or a client
    sums: [utilisateurs_actuels, potentiel_utilisateurs]
    coverage:
    steps:
        colors: { prevu: blue, tenu: green, annule: gray }
  - key: signal_commercial
    name: Commercial signal
    names: {fr: "Signal commercial"}
    icon: flag
        colors: { a_valider: amber, retenu: green, ecarte: gray }
      - { key: notifie_le, name: Notified on, names: {fr: "Notifié le"}, kind: date }
  - key: critere_ciblage
  - name: pb_criteres
  - name: pb_score
    description: "Target score of an organization: the points of each matching criterion, explained line by line (D336)."
      # Target score (D336): generic, it holds no criterion. Each criterion
                  "score_cible": total,
                  "score_detail": "\n".join(lines),
                  "score_le": msg.get("today", ""),
  - name: pb_digest
    description: One text of the new commercial signals, for the org's notification node.
      # Daily digest (D335): one line per new signal, newest first.
  - name: pb_notifie
          return {"payload": {"notifie_le": msg.get("today", "")}, "object_id": msg["object"]["id"]}
  - name: "Prospection · signals digest"
    note: "Each morning the commercial signals not yet notified make one digest (payload.texte, payload.nombre), then are marked notified. Add your Notification node on the digest port (template with a « texte » variable, trigger = payload.trigger), then deploy."
            object_type: signal_commercial
            filters: [{ key: notifie_le, op: missing }]
        - { id: digest, kind: pnex_function, config: { function_name: pb_digest, language: starlark }, outputs: [{ port: 1, targets: [each] }] }
            object_type: signal_commercial
            filters: [{ key: notifie_le, op: missing }]
        - { id: mark, kind: pnex_function, config: { function_name: pb_notifie, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
        - { id: write, kind: object_upsert, config: { object_type: signal_commercial, key: id } }
  - name: "Prospection · target score"
    note: "Every 15 minutes, up to 500 organizations not scored today get their target score from the org's active targeting criteria (objects « Targeting criterion »: property, operator, value, points). Add criteria first, then deploy. A large list is covered over the day."
            object_type: critere_ciblage
        - { id: keep, kind: pnex_function, config: { function_name: pb_criteres, language: starlark }, outputs: [{ port: 0, targets: [orgs] }] }
            filters: [{ key: score_le, op: ne, value: "$today" }]
        - { id: score, kind: pnex_function, config: { function_name: pb_score, language: starlark }, outputs: [{ port: 0, targets: [write] }] }
page_templates:
  - key: plan_de_compte
    name: Account plan
    description: The account as of today, its group, coverage, white space, contacts, signals and competitors, then the next actions.
    descriptions: {fr: "Le compte au jour dit : groupe, couverture, espace blanc, contacts, signaux et concurrents, puis les prochaines actions."}
    subject: organization
    link: page_sur
      - Statut : {{prop:statut_compte}} · score de ciblage : {{prop:score_cible}}
      {{coverage:groupe_commercial}}
      ## Espace blanc
      {{white_space:groupe_commercial}}
      {{links:signal_sur:in}}
  - key: fiche_concurrent
    subject: organization
    link: page_sur
      {{links:signal_sur:in}}
  - key: preparation_rdv
    subject: organization
    link: page_sur
      Statut {{prop:statut_compte}} · score {{prop:score_cible}} · dernier CA {{prop:ca_dernier}} · effectif {{prop:effectif_min}} à {{prop:effectif_max}}.
      {{coverage:groupe_commercial}}
      {{links:signal_sur:in}}
    subject: rendez_vous
    link: page_sur
