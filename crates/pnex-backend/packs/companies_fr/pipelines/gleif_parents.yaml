# The companies owning each company the org knows by its LEI.
key: gleif_parents
name: Parent companies (GLEIF)
hosts: [api.gleif.org]
steps:
  - enumerate: { as: companies, cross: [{ as: lei, objects: { type: organization, property: lei } }] }
  - fetch:
      as: answer
      for_each: companies
      url: "https://api.gleif.org/api/v1/lei-records"
      params: { "filter[owns]": "{{lei}}" }
      every: 150ms
      missing_is_empty: true
  - read:
      as: found
      from: answer
      format: json
      records: /data
      columns:
        - { name: queried, value: "{{lei}}" }
        - { name: record, at: "/", type: json }
  - write: { from: found, table: { name: gleif_parents, replace: true } }
tests:
  - name: the parents of a company
    objects: { organization.lei: ["969500UP76J52A9OXU27"] }
    given:
      "https://api.gleif.org/api/v1/lei-records?filter%5Bowns%5D=969500UP76J52A9OXU27": gleif_lei_552100554.json
    expect:
      found:
        rows: 1
        contains:
          - { queried: "969500UP76J52A9OXU27" }
