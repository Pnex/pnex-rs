[package]
name = "pnex-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "API PNEX — Loco/Axum, WS ingestion, worker"
publish = false
default-run = "pnex-server"

[dependencies]
pnex-core = { workspace = true }
pnex-migration = { path = "migration" }
loco-rs = { version = "1.0", default-features = false, features = [
  "cli",
  "with-db",
] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
axum-extra = { version = "0.10", features = ["form"] }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
serde_yaml = "0.9"

[[bin]]
name = "pnex-server"
path = "src/bin/main.rs"

[dev-dependencies]
loco-rs = { version = "1.0", default-features = false, features = ["testing"] }
serial_test = { version = "3.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
