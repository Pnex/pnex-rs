[package]
name = "pnex-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "API PNEX — Loco/Axum, WS ingestion, worker"
publish = false
default-run = "pnex-server"

[dependencies]
pnex-core = { workspace = true, features = ["naming", "prompb", "frame-crypto"] }
pnex-notify = { workspace = true }
# CoolProp in-process : validation des mélanges à la sauvegarde + (phase 3)
# moteur de diagrammes. Autorisé hors mode B : la règle « backend ne lie
# jamais » porte sur edgelinkd et les crates de nœuds, pas sur la lib de
# calcul.
pnex-coolprop = { workspace = true }
# Contrat app ↔ serveur (version de contrat + ServerInfo) — source partagée.
pnex-api-contract = { workspace = true }
pnex-firmware-builder = { workspace = true }
# Stitching serveur des prises 360° (Take 360 V2) — pipeline Quality dans
# le worker `stitch_panorama` (pure Rust, séquentiel ; aucune dep native).
pnex-stitcher = { path = "../pnex-stitcher", features = ["pose-model"] }
pnex-migration = { path = "migration" }
loco-rs = { version = "1.0", default-features = false, features = [
  "cli",
  "with-db",
  # Worker de build firmware : provider queue PostgreSQL (Phase 6)
  "worker",
] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Valkey live last-value cache (pnex-device-read acceleration)
redis = { workspace = true }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
  "time",
  "io-util",
  # CameraHub live fan-out (broadcast)
  "sync",
  # Superviseur du runtime de flows (D18) : spawn + pipes
  "process",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8", features = ["ws"] }
# Bare ChaCha20 (RFC 7539, no Poly1305) — parity with the legacy crypto_utils (D8)
chacha20 = "0.9"
# Org secrets vault (secrets.md D112): XChaCha20-Poly1305 AEAD at rest.
chacha20poly1305 = "0.10"
# Constant-time comparison of internal service tokens.
subtle = "2"
# Vision inference (model registry test endpoint, D82).
pnex-vision = { workspace = true }
# Ingestion metrics OpenObserve : Prometheus remote-write (protobuf+snappy)
prost = "0.13"
snap = "1"
# Pliage d'accents pour la normalisation des noms de mesures (D16)
deunicode = "1"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
regex = { version = "1.11" }
# Génération des DeviceTokens (parité secrets.token_urlsafe + clé ChaCha20)
rand = "0.10"
# Superviseur du runtime de flows (D18) : SIGUSR1 + test de vie du pid
libc = "0.2"
base64 = "0.22"
# Empreinte sha256 des artefacts firmware (intégrité, table firmware_artifacts)
sha2 = "0.10"
# Backend S3 des artefacts firmware (D5 v2, tier industriel) — dépendance
# directe plutôt que la feature loco `storage-aws-s3` : sa config Storage
# n'expose pas l'adressage path-style, requis pour RustFS & co
# (PNEX_S3_PATH_STYLE). Même version 0.58 que loco → un seul opendal-core
# dans l'arbre.
opendal = { version = "0.58", default-features = false, features = [
  "services-s3",
  # Backend `fs` du MediaStore (D21 — blobs média hors DB, disque local dev)
  "services-fs",
  "reqwest-rustls-tls",
  "layers-retry",
] }
# Parsing query-string multi-valeurs (filtre `capabilities` répétable)
form_urlencoded = "1"
axum-extra = { version = "0.10", features = ["form"] }
chrono = { workspace = true }
if-addrs = { workspace = true }
futures-util = "0.3"
uuid = { workspace = true, features = ["v5"] }
serde_yaml = "0.9"
# v10 : choix d'un backend crypto obligatoire. rust_crypto (défaut loco) :
# mettre aussi aws_lc_rs créerait une union de 2 backends -> panic runtime
# ("exactly one of the 'rust_crypto' and 'aws_lc_rs' features")
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }

[[bin]]
name = "pnex-server"
path = "src/bin/main.rs"

[dev-dependencies]
loco-rs = { version = "1.0", default-features = false, features = ["testing"] }
axum-test = { version = "17", features = ["ws"] }
# Client WS de l'exemple ingest_client (rôle firmware en e2e manuel)
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serial_test = { version = "3.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
# Smoke test sqlite : fichier de base temporaire
tempfile = "3"
