# pnex-server — configuration tests (loco testing)

logger:
  enable: <%= get_env(name="PNEX_TEST_LOG", default="false") %>
  pretty_backtrace: true
  level: debug
  format: compact

server:
  # Overridable for the multi-process cluster E2E (tests/flow_cluster_e2e.rs).
  port: <%= get_env(name="PNEX_TEST_PORT", default="5150") %>
  host: http://localhost
  middlewares:
    fallback:
      enable: false
    static:
      # No front required in tests — avoids the must_exist failure without dist/.
      enable: false

workers:
  # ForegroundBlocking: perform_later runs the worker INLINE in the
  # test request — the build is already terminal when the POST answers.
  mode: ForegroundBlocking

database:
  # Tests: persistent database migrated at boot, emptied between tests via the
  # `truncate` hook (the loco framework's database create/drop trips over
  # pool connections left open).
  dangerously_truncate: <%= get_env(name="PNEX_TEST_TRUNCATE", default="true") %>
  # Migrate at boot (dev/test) — in prod migrations stay explicit.
  auto_migrate: true
  uri: <%= get_env(name="TEST_DATABASE_URL", default="postgres://pnex:pnex@localhost:5432/pnex_test") %>
  enable_logging: false
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="10000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="500") %>
  min_connections: 1
  max_connections: 5

# Auth Rauthy (Phase 3/D19) : validation JWKS locale + JIT provisioning.
settings:
  # Mock servers listen on loopback: no egress filtering in tests.
  egress: <%= get_env(name="PNEX_EGRESS", default="open") %>
  # Org secrets vault keyring (secrets.md D112): "<id>:<base64 32 bytes>",
  # write key first. Fixed DEV key — never reuse it in production.
  secrets:
    keys: "<%= get_env(name="PNEX_SECRETS_KEYS", default="dev:rJlgG51k+ePf2XrLPnEAXacoz7wUPHiYSxkGT2upQPQ=") %>"
  # Per-pod users cache off in tests: suites mutate `users` rows directly
  # and recreate the same IdP `sub` after each truncation.
  auth:
    user_cache_ttl_ms: 0
  # Valkey is mandatory (device liveness leases, D108): compose valkey,
  # dedicated db; keys are namespaced by database name. The cluster E2E
  # sets its own db.
  valkey:
    url: <%= get_env(name="PNEX_TEST_APP_VALKEY_URL", default="redis://127.0.0.1:6379/14") %>
  # Phase 5 ingestion (default values when absent — see services/settings.rs)
  ingestion:
    # Short TTL (lease expiry testable quickly) + cache 0 (systematic
    # revalidation → deterministic close 4005).
    silence_ttl_secs: 2
    reaper_interval_secs: 1
    token_cache_secs: 0
    # Tests talk to the server directly, without the TLS edge (D154).
    require_tls: false
    # Device client certificates are covered by tests/device_pki.rs.
    require_client_cert: false
    batch_max: <%= get_env(name="PNEX_BATCH_MAX", default="500") %>
    batch_flush_secs: <%= get_env(name="PNEX_BATCH_FLUSH_SECS", default="10") %>
  # AI assistant kill-switch. LLM providers are managed in the UI
  # (secrets.md D116): no provider configuration in the environment.
  ai:
    enabled: <%= get_env(name="PNEX_AI_ENABLED", default="true") %>
  rauthy:
    base_url: <%= get_env(name="RAUTHY_URL", default="http://localhost:8080") %>
    client_id: <%= get_env(name="RAUTHY_CLIENT_ID", default="pnex") %>
  # OpenObserve: ABSENT by default (degraded telemetry
  # available:false — tests without O2). Set PNEX_O2_URL for the full
  # dashboard test against the mock (tests/openobserve.rs); root
  # "whatever" = credentials accepted by the mock.
  # <% if get_env(name="PNEX_O2_URL", default="") != "" %>
  openobserve:
    base_url: <%= get_env(name="PNEX_O2_URL") %>
    root_email: root@pnex.local
    root_password: <%= get_env(name="PNEX_O2_ROOT_PASSWORD", default="whatever") %>
  # <% endif %>
  # Firmware Phase 6 — toolchain replaced by fixture scripts
  # (fast, failure/timeout driven by wifi_ssid values).
  # Firmware: source embedded in the binary (no source config —
  # clean slate); toolchain replaced by the fixtures (fake pio/esptool).
  # Object storage: the compose `rustfs` service, bucket pnex-test
  # (`docker compose up -d rustfs rustfs-init`).
  storage:
    # Fixed on purpose: a dev shell exporting PNEX_S3_* never points the
    # tests at a real bucket.
    endpoint: http://localhost:9000
    bucket: pnex-test
    access_key: rustfsadmin
    secret_key: rustfsadmin
    path_style: true
  firmware:
    pio_cmd: ./tests/fixtures/firmware/fake_pio.sh
    esptool_cmd: ./tests/fixtures/firmware/fake_esptool.sh
    timeout_secs: 2
    # No edge PKI in tests: builds run without a pinned device CA.
    require_device_ca: false
  # Server-side stitching (Take 360 V2) — enabled by default; the e2e test
  # (tests/stitch_jobs.rs) lowers the width to 1024 via PNEX_STITCH_OUT_WIDTH
  # (set before boot) to stay < 60 s.
  stitch:
    enabled: <%= get_env(name="PNEX_STITCH_ENABLED", default="true") %>
    out_width: <%= get_env(name="PNEX_STITCH_OUT_WIDTH", default="4096") %>
    # ONNX pose models (SuperPoint + LightGlue) — absent → NCC fallback.
    models_dir: <%= get_env(name="PNEX_STITCH_MODELS_DIR", default="deploy/models") %>
    # Number of concurrent stitches (fixed knob, decision 2026-09-10):
    # RPi 8 GB → 2 (env overrides; firmware builds share the queue).
    max_concurrent: <%= get_env(name="PNEX_STITCH_MAX_CONCURRENT", default="2") %>
  # ETL flows (D18): OFF by default (no child process in tests).
  # Flow tests enable it via env before boot (#[serial]):
  #   PNEX_FLOW_ENABLED=true + PNEX_FLOW_RUNTIME_CMD=<real or fake runtime>.
  flow:
    enabled: <%= get_env(name="PNEX_FLOW_ENABLED", default="false") %>
    runtime_cmd: <%= get_env(name="PNEX_FLOW_RUNTIME_CMD", default="pnex-flow-runtime") %>
    state_dir: <%= get_env(name="PNEX_FLOW_STATE_DIR", default="/tmp/pnex-flow-test-state") %>
    restart_backoff_secs: 1
    restart_backoff_max_secs: 2
    terminate_secs: 2
    reload_ack_secs: <%= get_env(name="PNEX_FLOW_RELOAD_ACK_SECS", default="5") %>
    env_allowlist: ["OPENOBSERVE_URL", "OPENOBSERVE_ROOT_EMAIL", "OPENOBSERVE_ROOT_PASSWORD"]
    # Debug tools: flow tests enable them through env
    # (PNEX_FLOW_DEBUG_TOOLS=true) — test default = off, as in run mode.
    debug_tools: <%= get_env(name="PNEX_FLOW_DEBUG_TOOLS", default="false") %>
    # Flow execution cluster (D106): fast timings so failover/rebalance
    # tests run in seconds.
    cluster:
      worker_id: <%= get_env(name="PNEX_FLOW_WORKER_ID", default="test-worker") %>
      advertise_url: <%= get_env(name="PNEX_FLOW_ADVERTISE_URL", default="") %>
      token: <%= get_env(name="PNEX_FLOW_CLUSTER_TOKEN", default="") %>
      heartbeat_ms: 200
      worker_ttl_ms: 1500
      self_fence_ms: 900
      controller_tick_ms: 200
      lease_ttl_ms: 1000
      weights_refresh_ms: 300
      release_grace_ms: 3000
      drain_timeout_ms: 5000
      request_timeout_ms: 15000
# In tests: issuer redirectable to a mock JWKS (see tests/auth_*).
