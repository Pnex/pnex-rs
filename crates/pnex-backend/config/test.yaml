# pnex-server — configuration tests (loco testing)

logger:
  enable: false
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5150
  host: http://localhost
  middlewares:
    fallback:
      enable: false
    static:
      # Pas de front requis en test — évite l'échec must_exist sans dist/.
      enable: false

workers:
  mode: ForegroundBlocking

database:
  uri: {{ get_env(name="DATABASE_URL", default="postgres://pnex:pnex@localhost:5432/pnex_test") }}
  enable_logging: false
  connect_timeout: {{ get_env(name="DB_CONNECT_TIMEOUT", default="500") }}
  idle_timeout: {{ get_env(name="DB_IDLE_TIMEOUT", default="500") }}
  min_connections: 1
  max_connections: 5
