# pnex-server — configuration développement
# (scaffold Loco v1, adapté : front Dioxus servi en statique depuis ../pnex-frontend/dist)

logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5150
  # 0.0.0.0 : exposition LAN pour tests e2e (device/ESP → ws://192.168.1.185:5150).
  # Revenir à `localhost` hors tests device.
  binding: 0.0.0.0
  host: http://localhost
  middlewares:
    fallback:
      enable: false
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/"
        path: "../pnex-frontend/dist"
      fallback: "../pnex-frontend/dist/index.html"
    # CORS DEV UNIQUEMENT : `task dev:hot` sert le front via dx sur :5151
    # (origine différente du backend :5150). En prod le front est servi par
    # le backend (same-origin) — jamais de CORS hors développement.
    cors:
      enable: true
      allow_origins:
        - "http://localhost:5151"
      allow_headers:
        - "Content-Type"
        - "Authorization"
        - "X-Org-Id"
        # Media cache revalidation (util::media_blob_url).
        - "If-None-Match"
      expose_headers:
        - "ETag"
      allow_methods:
        - "GET"
        - "POST"
        - "PATCH"
        - "DELETE"
        - "OPTIONS"

workers:
  # Phase 6 : queue PostgreSQL — les jobs sont persistés dans pg_loco_queue
  # et consommés par le process qui drive la queue (`loco start
  # --server-and-worker`). En ServerOnly simple, l'API peut encore y
  # déposer des jobs.
  mode: BackgroundQueue

# File d'attente des workers (Phase 6) — table pg_loco_queue / sqlt_loco_queue
# créée par loco. Le backend suit le schéma de DATABASE_URL : bascule
# one-knob vers le tier hobbyist sqlite en pointant DATABASE_URL sur un
# fichier sqlite (db + queue ensemble). ATTENTION : jamais `sqlite::memory:`
# en mode app — les pools db et queue sont distincts et ne partageraient
# pas une base mémoire.
# <% set db_url = get_env(name="DATABASE_URL", default="postgres://pnex:pnex@localhost:5432/pnex") %>
queue:
  kind: <% if db_url is starting_with(pat="sqlite") %>Sqlite<% else %>Postgres<% endif %>
  uri: <%= db_url %>
  # 1 : contention du cache ~/.platformio ; scaling horizontal par réplicas
  # (PG). Côté sqlite, un seul dequeue à la fois (verrou applicatif loco) —
  # sans effet pour des builds de plusieurs minutes.
  num_workers: <%= get_env(name="PNEX_QUEUE_NUM_WORKERS", default="1") %>
  poll_interval_sec: 1
  # Dedicated (small) pool of the job queue: it only polls/claims jobs.
  max_connections: <%= get_env(name="PNEX_QUEUE_MAX_CONNECTIONS", default="2") %>
  min_connections: 1
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="300000") %>
  # Reprise des jobs orphelins (crash worker en cours de build) — âge >
  # timeout de build (15 min).
  reaper:
    age_minutes: 30
    interval_seconds: 120

database:
  # Migre au boot (dev/test) — en prod les migrations restent explicites.
  auto_migrate: true
  uri: <%= get_env(name="DATABASE_URL", default="postgres://pnex:pnex@localhost:5432/pnex") %>
  enable_logging: false
  # Pool timeouts (ms). connect/acquire = max wait for a pool connection
  # (500 ms made every load spike a 500); idle = how long an unused
  # connection is kept (500 ms closed and reopened connections constantly).
  # Sizing: pods x (max_connections + queue.max_connections) must stay
  # below Postgres max_connections (docs/architecture/horizontal-scaling.md).
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  acquire_timeout: <%= get_env(name="DB_ACQUIRE_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="300000") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="10") %>

# Auth Rauthy (Phase 3/D19) : validation JWKS locale + JIT provisioning.
# Le front étant servi par le backend (same-origin), pas de CORS nécessaire.
settings:
  # Outbound requests to user-chosen hosts (R8, security.md SEC-W3):
  # lan = loopback, link-local and metadata refused, LAN reachable;
  # public = private ranges refused too (shared hosting); open = no filter.
  egress: <%= get_env(name="PNEX_EGRESS", default="lan") %>
  # Org secrets vault keyring (secrets.md D112): "<id>:<base64 32 bytes>",
  # write key first. Fixed DEV key — never reuse it in production.
  secrets:
    keys: "<%= get_env(name="PNEX_SECRETS_KEYS", default="dev:rJlgG51k+ePf2XrLPnEAXacoz7wUPHiYSxkGT2upQPQ=") %>"
  # OpenObserve (D1/D2) — absent = télémétrie désactivée (sink noop)
  openobserve:
    base_url: <%= get_env(name="OPENOBSERVE_URL", default="http://localhost:5080") %>
    root_email: <%= get_env(name="OPENOBSERVE_ROOT_EMAIL", default="root@pnex.local") %>
    root_password: <%= get_env(name="OPENOBSERVE_ROOT_PASSWORD", default="Pnex-dev-2026!") %>
  # Valkey (compose.yaml) — REQUIRED (D108): device liveness leases,
  # last-value cache of the pnex-device-read flow node, cross-pod buses.
  valkey:
    url: <%= get_env(name="VALKEY_URL", default="redis://127.0.0.1:6379") %>
  # Ingestion Phase 5 (valeurs par défaut si absent — cf. services/settings.rs)
  ingestion:
    silence_ttl_secs: <%= get_env(name="PNEX_SILENCE_TTL_SECS", default="10") %>
    reaper_interval_secs: <%= get_env(name="PNEX_REAPER_INTERVAL_SECS", default="5") %>
    token_cache_secs: <%= get_env(name="PNEX_TOKEN_CACHE_SECS", default="30") %>
    # D154: devices only through the TLS edge (X-Forwarded-Proto: https).
    require_tls: <%= get_env(name="PNEX_DEVICE_REQUIRE_TLS", default="true") %>
    # D153: devices present their org-CA certificate on the device endpoint.
    require_client_cert: <%= get_env(name="PNEX_DEVICE_REQUIRE_CLIENT_CERT", default="true") %>
    admission_concurrency: <%= get_env(name="PNEX_DEVICE_ADMISSION_CONCURRENCY", default="32") %>
    admission_wait_ms: <%= get_env(name="PNEX_DEVICE_ADMISSION_WAIT_MS", default="5000") %>
    batch_max: <%= get_env(name="PNEX_BATCH_MAX", default="500") %>
    batch_flush_secs: <%= get_env(name="PNEX_BATCH_FLUSH_SECS", default="10") %>
  # Notifications (D49–D54) — jeton de service backend ↔ runtime (livraison
  # websocket des nœuds pnex-notify). Absent ⇒ le canal websocket est
  # fail-closed : /internal/notify/deliver répond 401.
  notifications:
    internal_token: <%= get_env(name="PNEX_NOTIFY_INTERNAL_TOKEN", default="pnex-dev-notify-token") %>
    deliver_url: <%= get_env(name="PNEX_NOTIFY_DELIVER_URL", default="http://127.0.0.1:5150/internal/notify/deliver") %>
  # AI assistant kill-switch. LLM providers are managed in the UI
  # (secrets.md D116): no provider configuration in the environment.
  ai:
    enabled: <%= get_env(name="PNEX_AI_ENABLED", default="true") %>
  rauthy:
    # Appels serveur-à-serveur (token, JWKS) — HTTP local, jamais impacté
    # par le certificat auto-signé de Rauthy.
    base_url: <%= get_env(name="RAUTHY_URL", default="http://localhost:8080") %>
    # Issuer vu par les navigateurs/devices — HTTPS auto-signé de Rauthy
    # (contexte sécurisé : `crypto.subtle` requis par la page login Rauthy
    # sur une IP LAN). Doit rester aligné avec PUB_URL du compose.yaml.
    issuer_url: <%= get_env(name="RAUTHY_ISSUER_URL", default="https://192.168.1.185:8443") %>
    client_id: <%= get_env(name="RAUTHY_CLIENT_ID", default="pnex") %>
  # Firmware Phase 6 (défauts champ par champ — cf. services/firmware.rs).
  # Source du firmware : embarquée dans le binaire (firmware/ du monorepo,
  # compilée dedans — aucune config). Artefacts en base par défaut (D5 v2,
  # table firmware_artifacts) ; STORAGE_BACKEND surcharge storage.backend.
  # S3 = tier industriel (artefacts sur S3-compatible via opendal, données
  # + queue restent en base). Aucune migration entre backends : on choisit
  # son tier à l'installation.
  #
  # Tier hobbyist sqlite (tout-en-un : données + artefacts + queue dans un
  # seul fichier, mono-pod) :
  #   DATABASE_URL="sqlite://./pnex.sqlite?mode=rwc"
  firmware:
    storage:
      backend: <%= get_env(name="STORAGE_BACKEND", default="db") %>
      s3_endpoint: <%= get_env(name="PNEX_S3_ENDPOINT", default="") %>
      s3_bucket: <%= get_env(name="PNEX_S3_BUCKET", default="") %>
      s3_region: <%= get_env(name="PNEX_S3_REGION", default="") %>
      # Credentials jamais commités — env/secrets manager uniquement
      # (le secret est masqué dans les Debug/logs du serveur).
      s3_access_key: <%= get_env(name="PNEX_S3_ACCESS_KEY", default="") %>
      s3_secret_key: <%= get_env(name="PNEX_S3_SECRET_KEY", default="") %>
      s3_path_style: <%= get_env(name="PNEX_S3_PATH_STYLE", default="false") %>
    # Machine de dev : `uv run pio` dans le dépôt firmware (sinon `pio`).
    pio_cmd: <%= get_env(name="PNEX_PIO_CMD", default="pio") %>
    esptool_cmd: <%= get_env(name="PNEX_ESPTOOL_CMD", default="esptool") %>
    timeout_secs: <%= get_env(name="PNEX_BUILD_TIMEOUT_SECS", default="900") %>
  # Média (D21) — bibliothèque d'assets versionnée par org ; les octets ne
  # vivent jamais en base : magasin dédié opendal (fs défaut / s3 RustFS).
  media:
    storage:
      backend: <%= get_env(name="MEDIA_BACKEND", default="fs") %>
      # Racine du magasin fs (créé au boot si absent).
      dir: <%= get_env(name="PNEX_MEDIA_DIR", default="./storage/media") %>
      # Dev runs on one host: the fs dir is shared by every local process
      # (multi-process cluster dev). Production defaults to false.
      fs_shared: <%= get_env(name="PNEX_MEDIA_FS_SHARED", default="true") %>
      # Plafond d'un upload — 413 JSON propre au-delà ; la limite axum
      # (max+1 Mo, vue routes()) reste le filet.
      max_bytes: <%= get_env(name="PNEX_MEDIA_MAX_BYTES", default="268435456") %>
      s3_endpoint: <%= get_env(name="PNEX_S3_ENDPOINT", default="") %>
      s3_bucket: <%= get_env(name="PNEX_S3_BUCKET", default="") %>
      s3_region: <%= get_env(name="PNEX_S3_REGION", default="") %>
      # Credentials jamais commités — env/secrets manager uniquement
      # (le secret est masqué dans les Debug/logs du serveur).
      s3_access_key: <%= get_env(name="PNEX_S3_ACCESS_KEY", default="") %>
      s3_secret_key: <%= get_env(name="PNEX_S3_SECRET_KEY", default="") %>
      s3_path_style: <%= get_env(name="PNEX_S3_PATH_STYLE", default="false") %>
  # Stitching serveur (Take 360 V2) — assemblage HD des prises 360° dans le
  # worker `stitch_panorama`. Les frames transitent par le MediaStore
  # (settings.media, aucune config de stockage propre). enabled=false :
  # POST /stitch-jobs répond 503 (kill-switch).
  stitch:
    enabled: <%= get_env(name="PNEX_STITCH_ENABLED", default="true") %>
    # Largeur du panorama HD (hauteur = /2). 4096 = la « spec » ; le stitch
    # est CPU-bound (minutes) — dimensionner la queue en conséquence.
    out_width: <%= get_env(name="PNEX_STITCH_OUT_WIDTH", default="4096") %>
    # Modèles ONNX de pose (SuperPoint + LightGlue) — absents → repli NCC.
    models_dir: <%= get_env(name="PNEX_STITCH_MODELS_DIR", default="deploy/models") %>
    # Nombre de stitches simultanés (knob fixe, décision 2026-09-10) :
    # RPi 8 Go → 2 (l'env surcharge ; les builds firmware partagent la queue).
    max_concurrent: <%= get_env(name="PNEX_STITCH_MAX_CONCURRENT", default="2") %>
  # Moteur de flow ETL (D18) — superviseur du runtime headless
  # `pnex-flow-runtime` (process enfant, mode B ; cf. services/flow_supervisor.rs).
  # enabled=false : flows éditables en base mais jamais exécutés (défaut) —
  # `task dev` force PNEX_FLOW_ENABLED=true pour partir avec le moteur.
  # env_allowlist : seules ces variables franchissent la frontière process —
  # aucun secret dans flows.json (PRD §8).
  flow:
    enabled: <%= get_env(name="PNEX_FLOW_ENABLED", default="false") %>
    # Défaut dev : binaire du workspace (résolu contre la racine monorepo,
    # quel que soit le cwd) — faire `cargo build -p pnex-flow-runtime` avant.
    runtime_cmd: <%= get_env(name="PNEX_FLOW_RUNTIME_CMD", default="./target/debug/pnex-flow-runtime") %>
    state_dir: <%= get_env(name="PNEX_FLOW_STATE_DIR", default="./flow-state") %>
    restart_backoff_secs: <%= get_env(name="PNEX_FLOW_BACKOFF_SECS", default="5") %>
    restart_backoff_max_secs: <%= get_env(name="PNEX_FLOW_BACKOFF_MAX_SECS", default="60") %>
    terminate_secs: <%= get_env(name="PNEX_FLOW_TERMINATE_SECS", default="10") %>
    reload_ack_secs: <%= get_env(name="PNEX_FLOW_RELOAD_ACK_SECS", default="10") %>
    env_allowlist: ["OPENOBSERVE_URL", "OPENOBSERVE_ROOT_EMAIL", "OPENOBSERVE_ROOT_PASSWORD", "VALKEY_URL"]
    # Outils de debug (panneau Debug) — mode dev/debug uniquement : absent de
    # la config de run → 403 sur /debug, boutons masqués.
    debug_tools: <%= get_env(name="PNEX_FLOW_DEBUG_TOOLS", default="true") %>
    # Jeton interne des nœuds `pnex-device-write` (route interne
    # /internal/flow/device-write) : absent/vide ⇒ 401 fail-closed et le
    # nœud échoue fort au préflight. Env PNEX_FLOW_RUNTIME_TOKEN prioritaire.
    runtime_token: <%= get_env(name="PNEX_FLOW_RUNTIME_TOKEN", default="pnex-dev-write") %>
    # Flow execution cluster (D106, docs/architecture/flow-engine.md §12).
    # Single node: nothing to set (a cluster of one). Several pods: give
    # each one a reachable advertise_url (e.g. http://$(POD_IP):5150) and
    # the same cluster token; PNEX_FLOW_RUN_WORKER=false makes an API-only pod.
    cluster:
      worker: <%= get_env(name="PNEX_FLOW_RUN_WORKER", default="true") %>
      worker_id: <%= get_env(name="PNEX_FLOW_WORKER_ID", default="") %>
      advertise_url: <%= get_env(name="PNEX_FLOW_ADVERTISE_URL", default="") %>
      token: <%= get_env(name="PNEX_FLOW_CLUSTER_TOKEN", default="") %>
      capacity: <%= get_env(name="PNEX_FLOW_WORKER_CAPACITY", default="0") %>
