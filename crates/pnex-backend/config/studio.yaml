# pnex-server — development configuration
# (Loco v1 scaffold, adapted: Dioxus front served as static files from ../pnex-frontend/dist)

logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 5250
  # 0.0.0.0: LAN exposure for e2e tests (device/ESP → ws://192.168.1.44:5150).
  # Go back to `localhost` outside device tests.
  binding: 0.0.0.0
  host: http://localhost
  middlewares:
    fallback:
      enable: false
    static:
      enable: true
      must_exist: true
      precompressed: false
      folder:
        uri: "/"
        path: "../pnex-frontend/dist"
      fallback: "../pnex-frontend/dist/index.html"
    # CORS DEV ONLY: `task dev:hot` serves the front via dx on :5151
    # (different origin from the backend :5150). In prod the front is served by
    # the backend (same-origin) — never CORS outside development.
    cors:
      enable: true
      allow_origins:
        - "http://localhost:5151"
      allow_headers:
        - "Content-Type"
        - "Authorization"
        - "X-Org-Id"
        # Media cache revalidation (util::media_blob_url).
        - "If-None-Match"
      expose_headers:
        - "ETag"
      allow_methods:
        - "GET"
        - "POST"
        - "PATCH"
        - "DELETE"
        - "OPTIONS"

workers:
  # Phase 6: PostgreSQL queue — jobs are persisted in pg_loco_queue
  # and consumed by the process that drives the queue (`loco start
  # --server-and-worker`). In plain ServerOnly, the API can still
  # enqueue jobs.
  mode: BackgroundQueue

# Worker job queue (Phase 6): pg_loco_queue table created by loco, on the
# same PostgreSQL database as the app (DATABASE_URL).
# <% set db_url = get_env(name="DATABASE_URL", default="postgres://pnex:pnex@localhost:5432/pnex_studio") %>
queue:
  kind: Postgres
  uri: <%= db_url %>
  # 1: ~/.platformio cache contention; horizontal scaling through replicas
  # (PG).
  num_workers: <%= get_env(name="PNEX_QUEUE_NUM_WORKERS", default="1") %>
  poll_interval_sec: 1
  # Dedicated (small) pool of the job queue: it only polls/claims jobs.
  max_connections: <%= get_env(name="PNEX_QUEUE_MAX_CONNECTIONS", default="2") %>
  min_connections: 1
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="300000") %>
  # Recovery of orphan jobs (worker crash mid-build) — age >
  # build timeout (15 min).
  reaper:
    age_minutes: 30
    interval_seconds: 120

database:
  # Migrate at boot (dev/test) — in prod migrations stay explicit.
  auto_migrate: true
  uri: <%= get_env(name="DATABASE_URL", default="postgres://pnex:pnex@localhost:5432/pnex_studio") %>
  enable_logging: false
  # Pool timeouts (ms). connect/acquire = max wait for a pool connection
  # (500 ms made every load spike a 500); idle = how long an unused
  # connection is kept (500 ms closed and reopened connections constantly).
  # Sizing: pods x (max_connections + queue.max_connections) must stay
  # below Postgres max_connections (docs/architecture/horizontal-scaling.md).
  connect_timeout: <%= get_env(name="DB_CONNECT_TIMEOUT", default="5000") %>
  acquire_timeout: <%= get_env(name="DB_ACQUIRE_TIMEOUT", default="5000") %>
  idle_timeout: <%= get_env(name="DB_IDLE_TIMEOUT", default="300000") %>
  min_connections: <%= get_env(name="DB_MIN_CONNECTIONS", default="1") %>
  max_connections: <%= get_env(name="DB_MAX_CONNECTIONS", default="10") %>

# Rauthy auth (Phase 3/D19): local JWKS validation + JIT provisioning.
# The front being served by the backend (same-origin), no CORS needed.
settings:
  # Outbound requests to user-chosen hosts (R8, security.md SEC-W3):
  # lan = loopback, link-local and metadata refused, LAN reachable;
  # public = private ranges refused too (shared hosting); open = no filter.
  egress: <%= get_env(name="PNEX_EGRESS", default="lan") %>
  # Org secrets vault keyring (secrets.md D112): "<id>:<base64 32 bytes>",
  # write key first. Fixed DEV key — never reuse it in production.
  secrets:
    keys: "<%= get_env(name="PNEX_SECRETS_KEYS", default="dev:rJlgG51k+ePf2XrLPnEAXacoz7wUPHiYSxkGT2upQPQ=") %>"
  # OpenObserve (D1/D2) — absent = telemetry disabled (noop sink)
  openobserve:
    base_url: <%= get_env(name="OPENOBSERVE_URL", default="http://localhost:5080") %>
    root_email: <%= get_env(name="OPENOBSERVE_ROOT_EMAIL", default="root@pnex.local") %>
    root_password: <%= get_env(name="OPENOBSERVE_ROOT_PASSWORD", default="Pnex-dev-2026!") %>
  # Phase 5 ingestion (default values when absent — see services/settings.rs)
  ingestion:
    silence_ttl_secs: <%= get_env(name="PNEX_SILENCE_TTL_SECS", default="10") %>
    reaper_interval_secs: <%= get_env(name="PNEX_REAPER_INTERVAL_SECS", default="5") %>
    token_cache_secs: <%= get_env(name="PNEX_TOKEN_CACHE_SECS", default="30") %>
    # D154: devices only through the TLS edge (X-Forwarded-Proto: https).
    require_tls: <%= get_env(name="PNEX_DEVICE_REQUIRE_TLS", default="true") %>
    # D153: devices present their org-CA certificate on the device endpoint.
    require_client_cert: <%= get_env(name="PNEX_DEVICE_REQUIRE_CLIENT_CERT", default="true") %>
    batch_max: <%= get_env(name="PNEX_BATCH_MAX", default="500") %>
    batch_flush_secs: <%= get_env(name="PNEX_BATCH_FLUSH_SECS", default="10") %>
  # AI assistant kill-switch. LLM providers are managed in the UI
  # (secrets.md D116): no provider configuration in the environment.
  ai:
    enabled: <%= get_env(name="PNEX_AI_ENABLED", default="true") %>
  rauthy:
    # Server-to-server calls (token, JWKS) — local HTTP, never affected
    # by Rauthy's self-signed certificate.
    base_url: <%= get_env(name="RAUTHY_URL", default="http://localhost:8080") %>
    # Issuer seen by browsers/devices — Rauthy's self-signed HTTPS
    # (secure context: `crypto.subtle` required by the Rauthy login page
    # on a LAN IP). Must stay aligned with PUB_URL in compose.yaml.
    issuer_url: <%= get_env(name="RAUTHY_ISSUER_URL", default="https://192.168.1.44:8443") %>
    client_id: <%= get_env(name="RAUTHY_CLIENT_ID", default="pnex") %>
  # Object storage (S3-compatible: RustFS, AWS, Scaleway…) of every stored
  # byte: firmware artifacts, media, video segments, stitch frames, models.
  # No local disk, no bytes in the database. Credentials come from the
  # environment only (the secret is masked in the server logs).
  storage:
    endpoint: "<%= get_env(name="PNEX_S3_ENDPOINT", default="http://localhost:9000") %>"
    bucket: "<%= get_env(name="PNEX_S3_BUCKET", default="pnex") %>"
    region: "<%= get_env(name="PNEX_S3_REGION", default="") %>"
    access_key: "<%= get_env(name="PNEX_S3_ACCESS_KEY", default="rustfsadmin") %>"
    secret_key: "<%= get_env(name="PNEX_S3_SECRET_KEY", default="rustfsadmin") %>"
    path_style: <%= get_env(name="PNEX_S3_PATH_STYLE", default="true") %>
  # Firmware Phase 6: source embedded in the binary (no source config),
  # artifacts in the object storage above.
  firmware:
    # Dev machine: `uv run pio` in the firmware repo (otherwise `pio`).
    pio_cmd: <%= get_env(name="PNEX_PIO_CMD", default="pio") %>
    esptool_cmd: <%= get_env(name="PNEX_ESPTOOL_CMD", default="esptool") %>
    timeout_secs: <%= get_env(name="PNEX_BUILD_TIMEOUT_SECS", default="900") %>
  # Media (D21): org-versioned asset library, bytes in the object storage.
  media:
    # Upload cap: clean 413 JSON beyond; the axum limit (max+1 MB, see
    # routes()) stays the safety net.
    max_bytes: <%= get_env(name="PNEX_MEDIA_MAX_BYTES", default="2147483648") %>
  # Server-side stitching (Take 360 V2) — HD assembly of 360° takes in the
  # `stitch_panorama` worker. Frames go through the MediaStore
  # (settings.media, no storage config of its own). enabled=false:
  # POST /stitch-jobs answers 503 (kill-switch).
  stitch:
    enabled: <%= get_env(name="PNEX_STITCH_ENABLED", default="true") %>
    # HD panorama width (height = /2). 4096 = the "spec"; the stitch
    # is CPU-bound (minutes) — size the queue accordingly.
    out_width: <%= get_env(name="PNEX_STITCH_OUT_WIDTH", default="4096") %>
    # ONNX pose models (SuperPoint + LightGlue) — absent → NCC fallback.
    models_dir: <%= get_env(name="PNEX_STITCH_MODELS_DIR", default="deploy/models") %>
    # Number of concurrent stitches (fixed knob, decision 2026-09-10):
    # RPi 8 GB → 2 (env overrides; firmware builds share the queue).
    max_concurrent: <%= get_env(name="PNEX_STITCH_MAX_CONCURRENT", default="2") %>
  # ETL flow engine (D18) — supervisor of the headless runtime
  # `pnex-flow-runtime` (child process, mode B; see services/flow_supervisor.rs).
  # enabled=false: flows editable in the database but never executed (default) —
  # `task dev` forces PNEX_FLOW_ENABLED=true to start with the engine.
  # env_allowlist: only these variables cross the process boundary —
  # no secret in flows.json (PRD §8).
  flow:
    enabled: <%= get_env(name="PNEX_FLOW_ENABLED", default="false") %>
    # Dev default: workspace binary (resolved against the monorepo root,
    # whatever the cwd) — run `cargo build -p pnex-flow-runtime` first.
    runtime_cmd: <%= get_env(name="PNEX_FLOW_RUNTIME_CMD", default="./target/debug/pnex-flow-runtime") %>
    state_dir: <%= get_env(name="PNEX_FLOW_STATE_DIR", default="./flow-state") %>
    restart_backoff_secs: <%= get_env(name="PNEX_FLOW_BACKOFF_SECS", default="5") %>
    restart_backoff_max_secs: <%= get_env(name="PNEX_FLOW_BACKOFF_MAX_SECS", default="60") %>
    terminate_secs: <%= get_env(name="PNEX_FLOW_TERMINATE_SECS", default="10") %>
    reload_ack_secs: <%= get_env(name="PNEX_FLOW_RELOAD_ACK_SECS", default="10") %>
    env_allowlist: ["OPENOBSERVE_URL", "OPENOBSERVE_ROOT_EMAIL", "OPENOBSERVE_ROOT_PASSWORD"]
    # Debug tools (Debug panel) — dev/debug mode only: absent from
    # the run config → 403 on /debug, buttons hidden.
    debug_tools: <%= get_env(name="PNEX_FLOW_DEBUG_TOOLS", default="true") %>
