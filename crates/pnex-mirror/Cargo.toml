[package]
name = "pnex-mirror"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline copy of a PneX organization for applications: change feed, SQLite mirror, media by hash (external-apps.md D439)"
publish = false

[dependencies]
# rusqlite 0.32 = libsqlite3-sys 0.30, the one SQLite of the workspace lock
# (`links = "sqlite3"` allows a single version).
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "time"] }
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "time"] }

[[example]]
name = "offline_copy"
