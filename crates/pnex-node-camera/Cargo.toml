[package]
name = "pnex-node-camera"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flow nodes PNeX — camera frame source (Valkey bus), MJPEG-AVI video recorder, media transcript source, topic classifier and time range writer"

[dependencies]
edgelink-core = { path = "../../vendor/edgelinkd/crates/core", default-features = false, features = ["core", "js"] }
edgelink-macro = { path = "../../vendor/edgelinkd/crates/macro" }
# Configs + checks (single source of truth with the editor), frame bus keys,
# AVI writer.
pnex-core = { workspace = true }
# Only for the Option<&config::Config> factory type — same features as edgelink-core
config = { version = "0.15", default-features = false, features = ["convert-case", "toml"] }
serde = { workspace = true }
serde_json = { workspace = true }
# Frame bus: SUBSCRIBE (pub/sub) + GET of the JPEG bytes.
redis = { workspace = true }
# Segment upload to the backend internal endpoint.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", default-features = false, features = ["time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false }
async-trait = "0.1"
tokio-util = "0.7"
log = "0.4"
chrono = { workspace = true }
# The `#[flow_node]` macro emits unqualified `inventory::submit!` — direct dep required
inventory = "0.3"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
