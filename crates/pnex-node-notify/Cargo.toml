[package]
name = "pnex-node-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PNEX flow node — multi-channel notification (websocket/webhook) rendered from a minijinja template (D49-D54)"

[dependencies]
pnex-core = { workspace = true }
pnex-notify = { workspace = true }
edgelink-core = { path = "../../vendor/edgelinkd/crates/core", default-features = false, features = ["core", "js"] }
edgelink-macro = { path = "../../vendor/edgelinkd/crates/macro" }
# Only for the factory's Option<&config::Config> type — same features as edgelink-core
config = { version = "0.15", default-features = false, features = ["convert-case", "toml"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["time", "rt", "sync", "macros"] }
async-trait = "0.1"
tokio-util = "0.7"
log = "0.4"
# The `#[flow_node]` macro emits an unqualified `inventory::submit!` — direct dependency required
inventory = "0.3"
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
