[package]
name = "pnex-node-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nœud de flow PNEX — notification multi-canaux (websocket/webhook) rendue depuis un template minijinja (D49-D54)"

[dependencies]
pnex-core = { workspace = true }
pnex-notify = { workspace = true }
edgelink-core = { path = "../../vendor/edgelinkd/crates/core", default-features = false, features = ["core", "js"] }
edgelink-macro = { path = "../../vendor/edgelinkd/crates/macro" }
# Seulement pour le type Option<&config::Config> de la factory — mêmes features que edgelink-core
config = { version = "0.15", default-features = false, features = ["convert-case", "toml"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", default-features = false, features = ["time", "rt", "sync", "macros"] }
async-trait = "0.1"
tokio-util = "0.7"
log = "0.4"
# La macro `#[flow_node]` émet `inventory::submit!` non qualifié — dépendance directe requise
inventory = "0.3"
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
