[package]
name = "pnex-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web UI PNEX — Dioxus 0.7, pure CSR, served statically by the Loco backend"

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
pnex-core = { workspace = true }
# serde-only (NEVER v4: getrandom does not compile on wasm32) — reading notif UUIDs.
uuid = { version = "1", default-features = false, features = ["serde"] }
# App ↔ server contract (contract version + ServerInfo) — shared source.
pnex-api-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Reading the bytes of a picked file (Dioxus FileData::read_bytes →
# bytes::Bytes) — media upload (D21).
bytes = "1"
# Single HTTP client for wasm AND native: on wasm32, reqwest delegates to the
# browser's fetch(); natively it will serve the desktop target (configurable
# server URL — see api/config.rs). gloo-net ruled out (wasm only).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# PKCE: S256 challenge (RFC 7636) — pure Rust, compiles on wasm32.
sha2 = "0.10"
base64 = "0.22"
# QR code of the root CA download link (Profile → About, D70) — SVG only.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
futures = "0.3"
# wasm+native timer (toast auto-dismiss; future WS pings).
futures-timer = "3"
# Fluent i18n (fr-FR + en-US), reactive through Dioxus's I18n signal.
dioxus-i18n = "0.5"
# Markdown rendering of the AI assistant's answers (assistant.rs component):
# tables, code, lists — pulldown-cmark is pure Rust, compiles on wasm32.
# Raw HTML filtered by hand (XSS sanitising, see components/markdown.rs).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "Storage",
  "Navigator",
  # Firmware download (download anchor) — util::save_blob;
  # clipboard copy (wizard token) — util::copy_text
  "Document",
  "HtmlAnchorElement",
  "HtmlTextAreaElement",
  "HtmlElement",
  "HtmlDocument",
  "Node",
  # Blob URL of media previews (D21) — util::media_blob_url
  "Blob",
  "Url",
  # Flow editor — client→graph conversion: measures the SVG viewBox
  # (getBoundingClientRect) at the start of each gesture (flow_editor/geometry.rs).
  "Element",
  "DomRect",
  "DomRectReadOnly",
  # Studio: natural size of an imported floor plan (tour_editor/geometry.rs).
  "HtmlImageElement",
  # Browser cache of media bytes (media_cache.rs).
  "Cache",
  "CacheStorage",
  "Request",
  "Response",
  "ResponseInit",
  "Headers",
] }
# Streamed media downloads with progress (api::client::request_bytes_conditional);
# native reads chunks without this feature.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
# Browser flash (flash.rs): bridge to the globals of the
# assets/flasher.js bundle (esptool-js). Versions unified with web-sys.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# wasm delay: futures-timer panics on wasm32 (`Instant::now()` not
# implemented — `sys/time/unsupported.rs`).
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"
# Native TLS for the desktop/Android target (self-hosted https server URL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Native login: opens the SSO flow in the system browser (the backend
# bridge brings the code back — see auth/native.rs). VENDORED and patched
# version ([patch.crates-io], see vendor/patches/README.md): the upstream
# Android implementation SIGABRTs the app (jni crate assert on Java exceptions).
# The patch rewrites it in raw JNI without panic; dioxus-desktop hard-calls
# webbrowser::open for the links of its webview — a single choke point
# makes both paths safe.
webbrowser = "1"

# Linux e2e only (feature `e2e`): turns on the vendored wry patch that lets
# WebKitWebDriver drive the app. Same crate dioxus-desktop already uses.
[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.53", default-features = false, optional = true }

# Native store persistence (tokens, server URL) — Android: resolves the app's
# files directory through ndk_context + raw JNI (same approach as the vendored
# webbrowser patch, versions aligned to deduplicate crates).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
# Take 360 sensor thread — raw FFI ASensorManager/ALooper (the `ndk` crate
# 0.9 has no sensor module, see capture360/sensors.rs).
ndk-sys = "0.6"
# Logging (logcat) of the Take 360 steps.
log = "0.4"
# log → logcat bridge (init_once in main.rs, filter via PNEX_LOG).
android_logger = "0.14"
# Stitching on-device (decode → warp → blend → GPano) — Take 360.
pnex-stitcher = { path = "../pnex-stitcher" }

[dev-dependencies]
# Parses the .ftl files for the fr-FR/en-US key parity test.
fluent-syntax = "0.11"

# Web CSR only. ⚠️ NO fullstack/ssr/server-fn feature: the server
# is Loco (Axum), not the Dioxus runtime — the two Axum servings collide
# (pitfall documented in docs/architecture/features.md).
#
# desktop/mobile: explicit later-phase decision — the architecture is
# prepared (api/config.rs for the server URL, native storage) but the
# features are not enabled here.
[features]
default = ["web"]
web = ["dioxus/web"]
# Android target (directive 2026-08-15, see docs/architecture/features.md):
# the toolchain is validated, PKCE login and flash remain to be decided.
# Built with --no-default-features --features mobile.
mobile = ["dioxus/mobile"]
# Native desktop UI (Linux webkit2gtk, Windows WebView2). Build with
# --no-default-features --features desktop (task build:frontend:desktop).
desktop = ["dioxus/desktop"]
router = ["dioxus/router"]
# On-device diagnostics (Take 360 raw state line). Off in every shipped
# build; opt in for device debugging (ANDROID_FEATURES="mobile diag").
diag = []
# Native e2e harness hooks (window.__pnexNavigate; Linux: WebKitWebDriver
# automation allowed under PNEX_E2E_AUTOMATION). Test builds only
# (task build:frontend:android:e2e / linux:e2e), never shipped. Does not
# imply `diag`: the suite checks the UI as shipped.
e2e = ["wry/pnex-automation"]
