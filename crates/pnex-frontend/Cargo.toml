[package]
name = "pnex-frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Web UI PNEX — Dioxus 0.7, CSR pur, servi en statique par le backend Loco"

[dependencies]
dioxus = { version = "0.7", features = ["router"] }
pnex-core = { workspace = true }
# serde-only (JAMAIS v4 : getrandom ne compile pas wasm32) — lecture des UUIDs notif.
uuid = { version = "1", default-features = false, features = ["serde"] }
# Contrat app ↔ serveur (version de contrat + ServerInfo) — source partagée.
pnex-api-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Lecture des octets d'un fichier choisi (Dioxus FileData::read_bytes →
# bytes::Bytes) — upload média (D21).
bytes = "1"
# Client HTTP unique pour wasm ET natif : sur wasm32, reqwest délègue au
# fetch() du navigateur ; côté natif il servira la cible desktop (URL serveur
# configurable — cf. api/config.rs). gloo-net écarté (wasm uniquement).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# PKCE : challenge S256 (RFC 7636) — pur Rust, compile en wasm32.
sha2 = "0.10"
base64 = "0.22"
# QR code of the root CA download link (Profile → About, D70) — SVG only.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
futures = "0.3"
# Timer wasm+natif (auto-dismiss des toasts ; futurs pings WS).
futures-timer = "3"
# i18n Fluent (fr-FR + en-US), réactif via le signal I18n de Dioxus.
dioxus-i18n = "0.5"
# Rendu markdown des réponses de l'assistant IA (composant assistant.rs) :
# tables, code, listes — pulldown-cmark est pur Rust, compile en wasm32.
# HTML brut filtré à la main (sanitisation XSS, cf. components/markdown.rs).
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
  "Window",
  "Location",
  "Storage",
  "Navigator",
  # Téléchargement du firmware (ancre de download) — util::save_blob ;
  # copie presse-papier (token du wizard) — util::copy_text
  "Document",
  "HtmlAnchorElement",
  "HtmlTextAreaElement",
  "HtmlElement",
  "HtmlDocument",
  "Node",
  # Blob URL des previews média (D21) — util::media_blob_url
  "Blob",
  "Url",
  # Éditeur de flows — conversion client→graphe : mesure du viewBox SVG
  # (getBoundingClientRect) au début de chaque geste (flow_editor/geometry.rs).
  "Element",
  "DomRect",
  "DomRectReadOnly",
  # Studio: natural size of an imported floor plan (tour_editor/geometry.rs).
  "HtmlImageElement",
  # Browser cache of media bytes (media_cache.rs).
  "Cache",
  "CacheStorage",
  "Request",
  "Response",
  "ResponseInit",
  "Headers",
] }
# Streamed media downloads with progress (api::client::request_bytes_conditional);
# native reads chunks without this feature.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
# Flash navigateur (flash.rs) : pont vers les globales du bundle
# assets/flasher.js (esptool-js). Versions unifiées avec web-sys.
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Delay wasm : futures-timer panique sur wasm32 (`Instant::now()` non
# implémenté — `sys/time/unsupported.rs`).
gloo-timers = { version = "0.3", features = ["futures"] }
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"
# TLS natif pour la cible desktop/Android (URL serveur auto-hébergée https).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Login natif : ouverture du flow SSO dans le navigateur système (le pont
# backend rapatrie le code — cf. auth/native.rs). Version VENDUE et patchée
# ([patch.crates-io], cf. vendor/patches/README.md) : l'implémentation
# Android amont SIGABRT l'app (assert du crate jni sur les exceptions Java).
# Le patch la réécrit en JNI brut sans panic ; dioxus-desktop appelle
# webbrowser::open en dur pour les liens de sa webview — un seul point de
# passage rend les deux chemins sûrs.
webbrowser = "1"

# Linux e2e only (feature `e2e`): turns on the vendored wry patch that lets
# WebKitWebDriver drive the app. Same crate dioxus-desktop already uses.
[target.'cfg(target_os = "linux")'.dependencies]
wry = { version = "0.53", default-features = false, optional = true }

# Persistance du store natif (tokens, URL serveur) — Android : résolution du
# dossier files de l'app par ndk_context + JNI brut (même école que le patch
# webbrowser vendu, versions alignées pour dédupliquer les crates).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
ndk-context = "0.1"
# Thread capteur Take 360 — FFI brut ASensorManager/ALooper (la crate `ndk`
# 0.9 n'a pas de module sensor, cf. capture360/sensors.rs).
ndk-sys = "0.6"
# Journalisation (logcat) des étapes Take 360.
log = "0.4"
# Pont log → logcat (init_once dans main.rs, filtre via PNEX_LOG).
android_logger = "0.14"
# Stitching on-device (decode → warp → blend → GPano) — Take 360.
pnex-stitcher = { path = "../pnex-stitcher" }

[dev-dependencies]
# Parse les .ftl pour le test de parité des clés fr-FR/en-US.
fluent-syntax = "0.11"

# CSR web uniquement. ⚠️ PAS de feature fullstack/ssr/server-fn : le serveur
# est Loco (Axum), pas le runtime Dioxus — les deux servings Axum entrent en
# collision (piège documenté dans docs/architecture/features.md).
#
# desktop/mobile : décision explicite de phase ultérieure — l'architecture est
# préparée (api/config.rs pour l'URL du serveur, storage natif) mais les
# features ne sont pas activées ici.
[features]
default = ["web"]
web = ["dioxus/web"]
# Cible Android (directive 2026-08-15, cf. docs/architecture/features.md) :
# la chaîne d'outils est validée, le login PKCE et le flash restent à trancher.
# Se construit avec --no-default-features --features mobile.
mobile = ["dioxus/mobile"]
# Native desktop UI (Linux webkit2gtk, Windows WebView2). Build with
# --no-default-features --features desktop (task build:frontend:desktop).
desktop = ["dioxus/desktop"]
router = ["dioxus/router"]
# On-device diagnostics (Take 360 raw state line). Off in every shipped
# build; opt in for device debugging (ANDROID_FEATURES="mobile diag").
diag = []
# Native e2e harness hooks (window.__pnexNavigate; Linux: WebKitWebDriver
# automation allowed under PNEX_E2E_AUTOMATION). Test builds only
# (task build:frontend:android:e2e / linux:e2e), never shipped. Does not
# imply `diag`: the suite checks the UI as shipped.
e2e = ["wry/pnex-automation"]
