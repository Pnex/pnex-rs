[package]
name = "pnex-notify"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PNEX notifications — Channel trait, channel registry, minijinja rendering (D49-D54)"

[dependencies]
base64 = "0.22"
pnex-core = { workspace = true, features = ["egress"] }
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
minijinja = "2"
async-trait = { version = "0.1" }
# smtp channel — rustls only (never openssl); verification against the system
# CAs (rustls-native-certs) for self-hosted relays with a private CA.
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "hostname",
  "pool",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls",
  "rustls",
  "ring",
  "rustls-native-certs",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tokio = { version = "1", default-features = false, features = ["time"] }
# Signed webhook bodies (D315).
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
# Local HTTP receiver (webhook / websocket delivery) — zero external network.
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
