[package]
name = "pnex-node-device"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PNEX Phase 6 flow nodes — device reads via OpenObserve, calculation, metric write"

[dependencies]
pnex-core = { workspace = true, features = ["naming", "prompb"] }
edgelink-core = { path = "../../vendor/edgelinkd/crates/core", default-features = false, features = ["core", "js"] }
edgelink-macro = { path = "../../vendor/edgelinkd/crates/macro" }
# Only for the factory's Option<&config::Config> type — same features as edgelink-core
config = { version = "0.15", default-features = false, features = ["convert-case", "toml"] }
serde = { workspace = true }
serde_json = { workspace = true }
# HTTP client to OpenObserve (PromQL read + remote-write), aligned with the backend.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Remote-write: prompb protobuf + snappy (same versions as the backend).
prost = "0.13"
snap = "1"
base64 = "0.22"
# Live last-value cache reader (Valkey, injected VALKEY_URL by the supervisor)
redis = { workspace = true }
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
async-trait = "0.1"
tokio-util = "0.7"
log = "0.4"
# The `#[flow_node]` macro emits an unqualified `inventory::submit!` — direct dependency required
inventory = "0.3"
chrono = { workspace = true }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
# Mock HTTP server for the O2 client tests (backend's spawn_mock_rauthy pattern).
axum = "0.8"
base64 = "0.22"
# Env vars are process-global: VALKEY_URL tests must not run in parallel.
serial_test = "3.1"
