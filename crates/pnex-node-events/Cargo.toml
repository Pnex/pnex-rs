[package]
name = "pnex-node-events"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flow node PNeX — JSON event log (OpenObserve logs through the backend)"

[dependencies]
edgelink-core = { path = "../../vendor/edgelinkd/crates/core", default-features = false, features = ["core", "js"] }
edgelink-macro = { path = "../../vendor/edgelinkd/crates/macro" }
pnex-core = { workspace = true }
# Only for the Option<&config::Config> factory type — same features as edgelink-core
config = { version = "0.15", default-features = false, features = ["convert-case", "toml"] }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
async-trait = "0.1"
tokio-util = "0.7"
log = "0.4"
# The `#[flow_node]` macro emits unqualified `inventory::submit!` — direct dep required
inventory = "0.3"
