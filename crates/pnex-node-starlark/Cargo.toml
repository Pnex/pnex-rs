[package]
name = "pnex-node-starlark"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Nœud de flow PNEX — exécuteur Starlark sandboxé (registre « Fonctions »)"

[dependencies]
pnex-core = { workspace = true }
edgelink-core = { path = "../../vendor/edgelinkd/crates/core", default-features = false, features = ["core", "js"] }
edgelink-macro = { path = "../../vendor/edgelinkd/crates/macro" }
config = { version = "0.15", default-features = false, features = ["convert-case", "toml"] }
serde = { workspace = true }
serde_json = { workspace = true }
starlark = "0.14.2"
tokio = { version = "1", default-features = false, features = ["time"] }
async-trait = "0.1"
tokio-util = "0.7"
log = "0.4"
inventory = "0.3"
smallvec = "1"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"] }
