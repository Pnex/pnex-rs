# Infra de développement PNEX — PostgreSQL 18 + Keycloak 26 + OpenObserve.
# Usage : docker compose up -d
# Le backend lit DATABASE_URL (voir .env.example).

services:
  postgres:
    image: postgres:18-alpine
    container_name: pnex-postgres
    environment:
      POSTGRES_USER: pnex
      POSTGRES_PASSWORD: pnex
      POSTGRES_DB: pnex
    ports:
      - "5432:5432"
    volumes:
      # PG 18+ : monter /var/lib/postgresql (pas .../data) — les données vont
      # dans un sous-répertoire par version majeure (compat pg_upgrade).
      - pnex-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnex -d pnex"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: pnex-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      # Realm de dev versionné (pnex-realm : client public pnex + users de
      # test) — importé si le realm n'existe pas encore (H2 dev = perdu à
      # chaque recréation du conteneur, donc réimporté automatiquement).
      - ./deploy/keycloak:/opt/keycloak/data/import
    ports:
      - "8080:8080"

  # Stockage télémétrie (D1) : ingestion backend → org OpenObserve par org
  # PNEX (D2) — le provisioning org + token d'ingestion est automatisé
  # côté backend (services/openobserve).
  openobserve:
    image: openobserve/openobserve:v0.92.1
    container_name: pnex-openobserve
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:-root@pnex.local}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:-Pnex-dev-2026!}
      ZO_DATA_DIR: /data
    ports:
      - "5080:5080"
    volumes:
      - pnex-o2data:/data

volumes:
  pnex-pgdata:
  pnex-o2data:
