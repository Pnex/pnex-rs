# PNEX development infra — PostgreSQL 18 + Rauthy (full-Rust OIDC IdP)
# + OpenObserve + RustFS (S3-compatible, industrial tier D5 v2).
# Usage: docker compose up -d
# The backend reads DATABASE_URL (see .env.example).

services:
  postgres:
    image: postgres:18-alpine
    container_name: pnex-postgres
    environment:
      POSTGRES_USER: pnex
      POSTGRES_PASSWORD: pnex
      POSTGRES_DB: pnex
    ports:
      - "5432:5432"
    volumes:
      # PG 18+: mount /var/lib/postgresql (not .../data) — the data goes
      # into one subdirectory per major version (pg_upgrade compat).
      - pnex-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnex -d pnex"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full-Rust OIDC IdP (D10) — embedded hiqlite DB (volume /app/data),
  # the Rust equivalent of Keycloak. Bootstrap on first start only
  # (empty DB): deploy/rauthy/bootstrap/*.json — public client pnex (PKCE
  # S256) + test users admin/bob. Admin UI: /auth/v1/admin (admin/admin).
  # hiqlite raft/gossip ports (8100/8200) deliberately not published.
  rauthy:
    image: ghcr.io/sebadob/rauthy:0.36.2
    container_name: pnex-rauthy
    depends_on:
      - mailcrab
    environment:
      # Issuer seen by browsers: self-signed HTTPS on the LAN IP —
      # secure context required (crypto.subtle for the Rauthy login page
      # from a physical device). Aligned with issuer_url in
      # development.yaml. If the DHCP IP changes, update both.
      PUB_URL: 192.168.1.185:8443
      # Self-signed certificate generated at boot by Rauthy (dev only) —
      # the device browser goes through the certificate warning once,
      # the context stays "secure" (https scheme).
      TLS_GENERATE_SELF_SIGNED: "true"
      HQL_NODE_ID: 1
      BOOTSTRAP_ADMIN_EMAIL: admin@localhost
      BOOTSTRAP_ADMIN_PASSWORD_PLAIN: admin
      # Local dev: by default Rauthy sets __Host- cookies with the Secure
      # attribute, which Chrome Android (emulator) rejects on http://localhost via
      # adb reverse → the authorize session is lost on every POST →
      # "Invalid credentials" in a loop (observed 2026-09-08: cause of the
      # half-day of login debugging). COOKIE_MODE=danger-insecure disables the
      # __Host- prefix and Secure — official Rauthy option for unencrypted
      # HTTP (NEVER enable in prod). DEV_MODE stays on (DPoP
      # http), but does NOT relax the cookies.
      DEV_MODE: "true"
      COOKIE_MODE: "danger-insecure"
      # DO NOT set ENC_KEYS/ENC_KEY_ACTIVE here: Rauthy generates its
      # encryption keys on first boot, persists them in the DB and reloads them
      # afterwards — any external key is overwritten by the DB one on the next
      # boot (details in deploy/rauthy/config.toml).
      # Open sign-up: account activation goes through a mail —
      # SMTP catcher in dev (mail UI: http://localhost:1080).
      SMTP_URL: mailcrab
      SMTP_PORT: "1025"
      SMTP_DANGER_INSECURE: "true"
    volumes:
      - ./deploy/rauthy/config.toml:/app/config.toml:ro
      - ./deploy/rauthy/bootstrap:/app/bootstrap:ro
      - pnex-rauthydata:/app/data
    ports:
      - "8080:8080"
      # Self-signed HTTPS: device browsers (Rauthy SSO login).
      - "8443:8443"

  # Dev SMTP catcher — Rauthy activates accounts by mail after open
  # sign-up. UI: http://localhost:1080 (image without shell → no healthcheck,
  # same approach as rustfs).
  mailcrab:
    image: marlonb/mailcrab:latest
    container_name: pnex-mailcrab
    ports:
      - "1080:1080"

  # Telemetry storage (D1): backend ingestion → one OpenObserve org per
  # PNEX org (D2) — org provisioning + ingestion token is automated
  # on the backend side (services/openobserve).
  openobserve:
    image: openobserve/openobserve:v1.0.0
    container_name: pnex-openobserve
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL:-root@pnex.local}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD:-Pnex-dev-2026!}
      ZO_DATA_DIR: /data
      # Edge agent (D95): points buffered offline keep their capture time —
      # accept up to 7 days old (agent queue max age), default is 5 h.
      ZO_INGEST_ALLOWED_UPTO: "168"
    ports:
      - "5080:5080"
    volumes:
      - pnex-o2data:/data

  # Object storage of every stored byte (firmware, media): bucket pnex for
  # dev runs, pnex-test for the tests. API :9000, web console :9001
  # (rustfsadmin/rustfsadmin by default).
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.2
    container_name: pnex-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pnex-rustfsdata:/data

  # One-shot: creates the buckets on first start (retries while
  # rustfs is not listening — no healthcheck on the image). AWS CLI rather
  # than mc.
  rustfs-init:
    image: amazon/aws-cli:2.27.49
    container_name: pnex-rustfs-init
    depends_on:
      - rustfs
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c '
      until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1;
      do echo "rustfs not ready, retrying…"; sleep 1; done;
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket pnex 2>/dev/null
      || echo "pnex: already exists";
      aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket pnex-test 2>/dev/null
      || echo "pnex-test: already exists";
      echo "buckets pnex + pnex-test ready"
      '

  # Valkey (BSD fork of Redis, Linux Foundation) — live last-point cache
  # for the pnex-device-read flow node: ~ms freshness instead of the latency
  # of the OpenObserve ingestion batcher. Persistence disabled: pure cache,
  # O2 stays the reference storage (lost cache = degraded to O2
  # freshness, never data loss) — zero disk writes (SD wear on Pi).
  valkey:
    image: valkey/valkey:9-alpine
    container_name: pnex-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Server browser of the navigation rules (site-recipes.md D325): Chrome
  # headless-shell over CDP. No token: reachable from the compose network
  # and 127.0.0.1 only (host-run backend: http://127.0.0.1:9222).
  browser:
    image: chromedp/headless-shell:155.0.8059.26
    container_name: pnex-browser
    ports:
      - "127.0.0.1:9222:9222"
    shm_size: 512m
    mem_limit: 1g

volumes:
  pnex-pgdata:
  pnex-rauthydata:
  pnex-o2data:
  pnex-rustfsdata:
