[package]
edition = "2021"
rust-version = "1.85"
name = "webbrowser"
version = "1.2.4"
authors = ["Amod Malviya @amodm"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Open URLs in web browsers available on a platform"
homepage = "https://github.com/amodm/webbrowser-rs"
documentation = "https://docs.rs/webbrowser"
readme = "README.md"
keywords = [
    "webbrowser",
    "browser",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/amodm/webbrowser-rs"

[features]
disable-wsl = []
hardened = []
wasm-console = ["web-sys/console"]

[lib]
name = "webbrowser"
path = "src/lib.rs"

[dependencies.log]
version = "0.4"
default-features = false

[dependencies.url]
version = "2"
features = ["std"]
