# End-to-end UI suite (O25): the Playwright suite of e2e/ against the whole
# stack (Postgres, Rauthy, OpenObserve, Valkey, RustFS, mailcrab, server,
# builder) started from the published `main` images.
#
# Nightly and manual only. Never on pull_request: the stack runs real
# images with dev secrets, and this job must not run code from forks.
# Hardware tests (@hardware) need boards on serial ports and stay manual
# (`task e2e:hardware`).
name: e2e

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag on docker.io/shanisma (main, main-<sha>, a version)"
        default: main
      grep:
        description: "Playwright --grep filter (empty = whole suite)"
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

env:
  REGISTRY: docker.io/shanisma
  IMAGE_TAG: ${{ inputs.image_tag || 'main' }}
  COMPOSE: docker compose -f compose.yaml -f compose.app.yaml -f compose.ci.yaml

jobs:
  e2e:
    if: github.repository_owner == 'Pnex'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Pull the application images
        run: |
          docker pull "$REGISTRY/pnex-server-rs:$IMAGE_TAG"
          docker pull "$REGISTRY/pnex-builder-rs:$IMAGE_TAG"
          docker tag "$REGISTRY/pnex-server-rs:$IMAGE_TAG" pnex-server:ci
          docker tag "$REGISTRY/pnex-builder-rs:$IMAGE_TAG" pnex-builder:ci
      - name: Start the stack
        env:
          PNEX_IMAGE_TAG: ci
        run: |
          $COMPOSE up -d --no-build
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:5150/health/ready >/dev/null 2>&1; then
              echo "server ready after ${i}x2 s"; exit 0
            fi
            sleep 2
          done
          echo "::error::pnex-server not ready after 180 s"
          $COMPOSE ps
          $COMPOSE logs --tail 200 pnex-server rauthy
          exit 1
      - uses: oven-sh/setup-bun@v2
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the suite
        run: task e2e:install
      - name: Run the suite
        env:
          PNEX_E2E_BASE_URL: http://localhost:5150
          PNEX_E2E_ISSUER: http://localhost:8080/auth/v1/
          PNEX_E2E_FRESH_ORG: "1"
          PNEX_E2E_DPR: "1"
          GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then
            task e2e -- --grep "$GREP" --grep-invert @hardware
          else
            task e2e -- --grep-invert @hardware
          fi
      - name: Stack logs
        if: failure()
        run: $COMPOSE logs --tail 500 > e2e-stack.log 2>&1 || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e-stack.log
          if-no-files-found: ignore
          retention-days: 14
