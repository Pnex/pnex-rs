# Publish the multi-arch (amd64 + arm64) Docker images on main — same
# Dockerfile as `task docker:publish`, gated on a green CI run of that
# commit. One GitHub-hosted amd64 runner: deploy/docker/Dockerfile assumes an
# amd64 build host (arm64 binaries are cross-compiled, the edge agent
# distribution needs x86_64 zig/mingw); QEMU only runs the arm64 PlatformIO
# prewarm of the builder image. Both images share their build stages, so
# they are built in the same job, server first.
#
# Tags pushed for each image (pnex-server-rs, pnex-builder-rs):
#   main-<shortsha>  immutable, pin it in pnex-deploy (--tag / VERSION)
#   main, latest     moving tags, always the latest green main
#   <version>        on a release tag `v<version>` (e.g. v0.1.0-beta.1 ->
#                    0.1.0-beta.1): what pnex-deploy's VERSION pins for
#                    `install.sh --version <version>`. latest is not moved.
#
# Required secrets: DOCKER_USERNAME, DOCKER_TOKEN (Docker Hub access
# token with read/write scope on the shanisma namespace).

name: Images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Release tags: versioned images of the tagged commit (tag a commit whose
  # CI is green).
  push:
    tags: ["v*"]
  # Manual re-publish of the current main (e.g. after rotating the token).
  workflow_dispatch:

env:
  REGISTRY: docker.io/shanisma

permissions:
  contents: read

# One publish at a time; a newer main commit supersedes a queued one.
# Runs that will be skipped (CI cancelled/failed) get their own throwaway
# group: concurrency applies before the job `if`, so in the shared group they
# would cancel an in-progress publish (e.g. a manual dispatch) and then skip.
concurrency:
  group: >-
    ${{ github.event_name == 'push' && format('images-{0}', github.ref_name) ||
        ((github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success')
         && 'images-main' || format('images-skip-{0}', github.run_id)) }}
  cancel-in-progress: true

jobs:
  publish:
    name: docker buildx (server + builder)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      # Two release Rust builds + the wasm front + the agent distribution
      # need more than the ~14 GB free on a hosted runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # vendor/edgelinkd is part of the build context (COPY . .).
          submodules: true
      - name: Tags
        id: tags
        run: |
          short=$(git rev-parse --short=7 HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          if [[ $GITHUB_EVENT_NAME == push && $GITHUB_REF == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            server="$REGISTRY/pnex-server-rs:$version"
            builder="$REGISTRY/pnex-builder-rs:$version"
          else
            server="$REGISTRY/pnex-server-rs:main-$short,$REGISTRY/pnex-server-rs:main,$REGISTRY/pnex-server-rs:latest"
            builder="$REGISTRY/pnex-builder-rs:main-$short,$REGISTRY/pnex-builder-rs:main,$REGISTRY/pnex-builder-rs:latest"
          fi
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build + push pnex-server-rs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: server
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: BUILD_SHA=${{ steps.tags.outputs.short }}
          tags: ${{ steps.tags.outputs.server }}
          cache-from: type=gha,scope=pnex-images
          cache-to: type=gha,scope=pnex-images,mode=max
      # Same BuildKit instance: the shared stages come from the server build.
      - name: Build + push pnex-builder-rs
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: builder
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: BUILD_SHA=${{ steps.tags.outputs.short }}
          tags: ${{ steps.tags.outputs.builder }}
          cache-from: type=gha,scope=pnex-images
      - name: Summary
        run: |
          {
            echo "### Published (linux/amd64 + linux/arm64)"
            echo "- \`${{ steps.tags.outputs.server }}\`"
            echo "- \`${{ steps.tags.outputs.builder }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
