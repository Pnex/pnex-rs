# Publish the multi-arch (amd64 + arm64) Docker images on main — same
# Dockerfile as `task docker:publish`, gated on a green CI run of that
# commit. GitHub-hosted runners: each architecture builds natively on its
# own runner (no QEMU), pushes by digest, then one job assembles the
# multi-arch manifests.
#
# Tags pushed for each image (pnex-server-rs, pnex-builder-rs):
#   main-<shortsha>  immutable, pin it in pnex-deploy (--tag / VERSION)
#   main, latest     moving tags, always the latest green main
#
# Required secrets: DOCKER_USERNAME, DOCKER_TOKEN (Docker Hub access
# token with read/write scope on the shanisma namespace).

name: Images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual re-publish of the current main (e.g. after rotating the token).
  workflow_dispatch:

env:
  REGISTRY: docker.io/shanisma

permissions:
  contents: read

# One publish at a time; a newer main commit supersedes a queued one.
# Runs that will be skipped (CI cancelled/failed) get their own throwaway
# group: concurrency applies before the job `if`, so in the shared group they
# would cancel an in-progress publish (e.g. a manual dispatch) and then skip.
concurrency:
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         github.event.workflow_run.conclusion == 'success')
        && 'images-main' || format('images-skip-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ matrix.target }} (${{ matrix.arch }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: true
      matrix:
        target: [server, builder]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # Release Rust builds inside BuildKit need more than the ~14 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # vendor/edgelinkd is part of the build context (COPY . .).
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/pnex-${{ matrix.target }}-rs,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.target }}-${{ matrix.arch }},mode=max
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: multi-arch manifests (${{ matrix.target }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [server, builder]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          image="$REGISTRY/pnex-${{ matrix.target }}-rs"
          short="${SHA::7}"
          # One argument per digest file: word splitting is intended.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "$image:main-$short" -t "$image:main" -t "$image:latest" \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:main-$short"
          {
            echo "### Published \`$image\`"
            echo "- \`$image:main-$short\` (also \`main\` and \`latest\`), linux/amd64 + linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
