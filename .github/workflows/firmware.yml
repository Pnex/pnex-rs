# Safeguard "one pnex version = one firmware that compiles": the firmware
# is merged into the monorepo (firmware/), this workflow compiles the
# predefined devices projects on every change — the build secrets (${sysenv.*}
# of platformio.ini) stay empty, like the pre-build of the
# pio-builder Dockerfile (the final merged image is produced by the worker with the
# device config).

name: Firmware

on:
  push:
    branches: ["*"]
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

# GitHub-hosted runners only (public repository), same policy as ci.yml.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: pio run (generic_esp8266 + generic_esp32c3)
    runs-on: ubuntu-latest
    # The generic_* projects read their board and screen pins from the build
    # env (injected per device by the builder). CI compiles a screenless
    # reference board per SoC family.
    env:
      PNEX_SCREEN_SSD1306: "0"
      PNEX_SCREEN_ST7735: "0"
      PNEX_SCREEN_SDA: "-1"
      PNEX_SCREEN_SCL: "-1"
      PNEX_SCREEN_SCK: "-1"
      PNEX_SCREEN_MOSI: "-1"
      PNEX_SCREEN_CS: "-1"
      PNEX_SCREEN_DC: "-1"
      PNEX_SCREEN_RST: "-1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: firmware/uv.lock
      # Cache of PlatformIO toolchains/platforms (otherwise downloaded on
      # every run: ~100 MB).
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/*/platformio.ini') }}
      # Brick 0: the generic .bin (device config compiled into the .bin,
      # empty secrets in CI — same regime as the Dockerfile pre-build).
      - name: Compile generic_esp8266
        working-directory: firmware
        run: PNEX_PIO_BOARD=nodemcuv2 uv run pio run -d generic_esp8266
      # ESP32-C3 variant (Seeed XIAO ESP32C3): same protocol, pio
      # downloads platform espressif32 + riscv toolchain on the first run.
      - name: Compile generic_esp32c3
        working-directory: firmware
        run: PNEX_PIO_BOARD=seeed_xiao_esp32c3 uv run pio run -d generic_esp32c3
      # Golden vectors Rust = C++ (D20 §6): the pnex_core::control reference
      # is replayed on the C++ side on the host (Unity) — the mirror cannot
      # drift without breaking CI.
      - name: Test pnex-core-cpp (golden vectors)
        working-directory: firmware
        run: uv run pio test -d core-cpp-tests -e native
      # Publishable package: valid library.json + bundled examples.
      - name: Pack lib PneX (validation manifeste)
        working-directory: firmware
        run: uv run pio pkg pack lib/pnex -o "$RUNNER_TEMP/pnex.tar.gz"
