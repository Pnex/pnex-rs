name: CI

on:
  push:
    branches: ["*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (natif + wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # asset!() exige assets/tailwind.css à la compilation ; le CSS réel est
      # gitignoré (généré par npm dans le job dx build) — stub pour compiler.
      - name: Stub Tailwind (compilation)
        run: test -f crates/pnex-frontend/assets/tailwind.css || printf '/* Stub CI — CSS reel genere par npm run css:build */\n' > crates/pnex-frontend/assets/tailwind.css
      - run: cargo check --workspace
      - run: cargo check -p pnex-core -p pnex-frontend --target wasm32-unknown-unknown

  test:
    name: cargo test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pnex
          POSTGRES_PASSWORD: pnex
          POSTGRES_DB: pnex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pnex -d pnex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pnex:pnex@localhost:5432/pnex_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stub Tailwind (compilation)
        run: test -f crates/pnex-frontend/assets/tailwind.css || printf '/* Stub CI — CSS reel genere par npm run css:build */\n' > crates/pnex-frontend/assets/tailwind.css
      - run: cargo test --workspace

  frontend:
    name: dx build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/pnex-frontend/package-lock.json
      - name: CSS Tailwind v4
        working-directory: crates/pnex-frontend
        run: |
          npm ci
          npm run css:build
      - name: Installer dx
        run: cargo install dioxus-cli --locked
      - name: Build front (release)
        run: |
          cd crates/pnex-frontend
          dx build --platform web --release
      - name: Copier vers dist (format servi par Loco)
        run: |
          rm -rf crates/pnex-frontend/dist
          cp -r target/dx/pnex-frontend/release/web/public crates/pnex-frontend/dist
