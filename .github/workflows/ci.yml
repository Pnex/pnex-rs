name: CI

on:
  push:
    branches: ["*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check (natif + wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/edgelinkd (D18) : submodule nécessaire à pnex-node-sql et
          # pnex-flow-runtime. NON récursif — 3rd-party/node-red est inutile.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # asset!() exige assets/tailwind.css et assets/flasher.js à la
      # compilation ; les fichiers réels sont gitignorés (générés par npm
      # dans le job dx build) — stubs pour compiler.
      - name: Stubs Tailwind + flasher.js (compilation)
        run: |
          mkdir -p crates/pnex-frontend/assets
          test -f crates/pnex-frontend/assets/tailwind.css || printf '/* Stub CI — CSS reel genere par npm run css:build */\n' > crates/pnex-frontend/assets/tailwind.css
          test -f crates/pnex-frontend/assets/flasher.js || printf '/* Stub CI — bundle reel genere par npm run js:build */\n' > crates/pnex-frontend/assets/flasher.js
      - run: cargo check --workspace
      - run: cargo check -p pnex-core -p pnex-frontend --target wasm32-unknown-unknown

  test:
    name: cargo test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pnex
          POSTGRES_PASSWORD: pnex
          POSTGRES_DB: pnex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pnex -d pnex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pnex:pnex@localhost:5432/pnex_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stubs Tailwind + flasher.js (compilation)
        run: |
          mkdir -p crates/pnex-frontend/assets
          test -f crates/pnex-frontend/assets/tailwind.css || printf '/* Stub CI — CSS reel genere par npm run css:build */\n' > crates/pnex-frontend/assets/tailwind.css
          test -f crates/pnex-frontend/assets/flasher.js || printf '/* Stub CI — bundle reel genere par npm run js:build */\n' > crates/pnex-frontend/assets/flasher.js
      - run: cargo test --workspace

  arm-check:
    name: cargo check ARM (pnex-flow-runtime)
    runs-on: ubuntu-latest
    env:
      # Build scripts C (ring, rquickjs-sys) compilent pour la cible même en
      # `cargo check` — le cross-compilateur C est requis, pas le linker.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
      AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Cross-compilateurs C (Raspberry Pi 64/32 bits)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-unknown-linux-gnu
            armv7-unknown-linux-gnueabihf
      - uses: Swatinem/rust-cache@v2
      # Cibles Raspberry Pi (PRD — cibles de premier rang chez EdgeLinkd aussi).
      - run: cargo check -p pnex-flow-runtime --target aarch64-unknown-linux-gnu
      - run: cargo check -p pnex-flow-runtime --target armv7-unknown-linux-gnueabihf

  frontend:
    name: dx build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/pnex-frontend/package-lock.json
      - name: CSS Tailwind v4 + bundle flasher.js (esptool-js)
        working-directory: crates/pnex-frontend
        run: |
          npm ci
          npm run css:build
          npm run js:build
      - name: Installer dx
        run: cargo install dioxus-cli --locked
      - name: Build front (release)
        run: |
          cd crates/pnex-frontend
          dx build --platform web --release
      - name: Copier vers dist (format servi par Loco)
        run: |
          rm -rf crates/pnex-frontend/dist
          cp -r target/dx/pnex-frontend/release/web/public crates/pnex-frontend/dist
