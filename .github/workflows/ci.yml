name: CI

on:
  push:
    branches: ["*"]
  pull_request:

# GitHub-hosted runners only: the repository is public, so a fork pull
# request must never run on a self-hosted machine.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Full debuginfo makes test binaries and links several times bigger (RAM +
  # disk) for no CI benefit; line tables keep usable backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (natif + wasm32)
    runs-on: ubuntu-latest
    steps:
      # Hosted runners ship ~14 GB free; a workspace test build needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          # vendor/edgelinkd (D18): submodule required by the pnex-node-* crates and
          # pnex-flow-runtime. NON récursif — 3rd-party/node-red est inutile.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # asset!() exige les bundles front à la compilation ; les fichiers
      # réels sont gitignorés (générés par bun dans le job dx build) —
      # stubs pour compiler.
      - name: Stubs Tailwind + flasher.js (compilation)
        run: |
          mkdir -p crates/pnex-frontend/assets
          test -f crates/pnex-frontend/assets/tailwind.css || printf '/* Stub CI — CSS reel genere par bun run css:build */\n' > crates/pnex-frontend/assets/tailwind.css
          test -f crates/pnex-frontend/assets/flasher.js || printf '/* Stub CI — bundle reel genere par bun run js:build */\n' > crates/pnex-frontend/assets/flasher.js
          test -f crates/pnex-frontend/assets/viewers.js || printf '/* Stub CI — bundle reel genere par bun run js:viewers */\n' > crates/pnex-frontend/assets/viewers.js
          test -f crates/pnex-frontend/assets/viewers.css || printf '/* Stub CI — CSS reel genere par bun run js:viewers */\n' > crates/pnex-frontend/assets/viewers.css
          test -f crates/pnex-frontend/assets/map.js || printf '/* Stub CI — bundle reel genere par bun run js:map */\n' > crates/pnex-frontend/assets/map.js
          test -f crates/pnex-frontend/assets/map.css || printf '/* Stub CI — CSS maplibre genere par bun run js:map */\n' > crates/pnex-frontend/assets/map.css
      - run: cargo check --workspace
      - run: cargo check -p pnex-core -p pnex-frontend --target wasm32-unknown-unknown

  test:
    name: cargo test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pnex
          POSTGRES_PASSWORD: pnex
          POSTGRES_DB: pnex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pnex -d pnex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Valkey is mandatory (device liveness, D108).
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pnex:pnex@localhost:5432/pnex_test
      PNEX_TEST_APP_VALKEY_URL: redis://localhost:6379/0
    steps:
      # Hosted runners ship ~14 GB free; a workspace test build needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Stubs Tailwind + flasher.js (compilation)
        run: |
          mkdir -p crates/pnex-frontend/assets
          test -f crates/pnex-frontend/assets/tailwind.css || printf '/* Stub CI — CSS reel genere par bun run css:build */\n' > crates/pnex-frontend/assets/tailwind.css
          test -f crates/pnex-frontend/assets/flasher.js || printf '/* Stub CI — bundle reel genere par bun run js:build */\n' > crates/pnex-frontend/assets/flasher.js
          test -f crates/pnex-frontend/assets/viewers.js || printf '/* Stub CI — bundle reel genere par bun run js:viewers */\n' > crates/pnex-frontend/assets/viewers.js
          test -f crates/pnex-frontend/assets/viewers.css || printf '/* Stub CI — CSS reel genere par bun run js:viewers */\n' > crates/pnex-frontend/assets/viewers.css
          test -f crates/pnex-frontend/assets/map.js || printf '/* Stub CI — bundle reel genere par bun run js:map */\n' > crates/pnex-frontend/assets/map.js
          test -f crates/pnex-frontend/assets/map.css || printf '/* Stub CI — CSS maplibre genere par bun run js:map */\n' > crates/pnex-frontend/assets/map.css
      - run: cargo test --workspace

  arm-check:
    name: cargo check ARM (pnex-flow-runtime)
    # Native arm64 runner (Raspberry Pi 64-bit class target): no cross
    # toolchain needed.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check -p pnex-flow-runtime
      # armv7 (RPi 32-bit) is currently UNBUILDABLE: the starlark stack pulls
      # pagable 0.4.2, whose 64-bit-only size assertions fail on any 32-bit
      # target (E0512, usize 4 vs 8 bytes). Upstream limitation — restore an
      # armv7 cross check when starlark/pagable ship a 32-bit compatible
      # release.

  fmt:
    name: fmt (cargo fmt + rsx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # cargo fmt --all loads the workspace, whose path deps live in the
          # vendor/edgelinkd submodule.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # rsx bodies are invisible to rustfmt: dx fmt owns them. The wrapper
      # runs dx on stdin only (`dx fmt --check` rewrites files).
      - uses: cargo-bins/cargo-binstall@main
      - name: Install dx
        run: cargo binstall -y --locked dioxus-cli@0.7.10
      - name: rsx fmt
        run: python3 crates/pnex-frontend/scripts/rsx_fmt.py check

  frontend:
    name: dx build (web)
    runs-on: ubuntu-latest
    steps:
      # Hosted runners ship ~14 GB free; a workspace test build needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          # Depuis D18 le workspace résout TOUT le graphe (pnex-flow-runtime
          # → vendor/edgelinkd) : sans le submodule, dx build échoue au
          # chargement des path deps. NON récursif — 3rd-party/node-red est
          # inutile (même choix que le job check).
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2
      - name: CSS Tailwind v4 + bundles JS (flasher, viewers, map)
        working-directory: crates/pnex-frontend
        run: |
          bun install --frozen-lockfile
          bun run css:build
          bun run js:build
          bun run js:viewers
          bun run js:map
      # Prebuilt dx, same version as deploy/docker/Dockerfile.
      - uses: cargo-bins/cargo-binstall@main
      - name: Installer dx
        run: cargo binstall -y --locked dioxus-cli@0.7.10
      - name: Build front (release)
        run: |
          cd crates/pnex-frontend
          dx build --platform web --release
      - name: Copier vers dist (format servi par Loco)
        run: |
          rm -rf crates/pnex-frontend/dist
          cp -r target/dx/pnex-frontend/release/web/public crates/pnex-frontend/dist
