name: CI

on:
  push:
    branches: ["*"]
  pull_request:

# GitHub-hosted runners only: the repository is public, so a fork pull
# request must never run on a self-hosted machine.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Full debuginfo makes test binaries and links several times bigger (RAM +
  # disk) for no CI benefit; line tables keep usable backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (natif + wasm32)
    runs-on: ubuntu-latest
    steps:
      # Hosted runners ship ~14 GB free; a workspace test build needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          # vendor/edgelinkd (D18): submodule required by the pnex-node-* crates and
          # pnex-flow-runtime. NOT recursive — 3rd-party/node-red is useless.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # asset!() requires the front bundles at compile time; the real
      # files are gitignored (generated by bun in the dx build job) —
      # stubs to compile.
      - name: Stubs Tailwind + flasher.js (compilation)
        run: |
          mkdir -p crates/pnex-frontend/assets
          test -f crates/pnex-frontend/assets/tailwind.css || printf '/* Stub CI — real CSS generated by bun run css:build */\n' > crates/pnex-frontend/assets/tailwind.css
          test -f crates/pnex-frontend/assets/flasher.js || printf '/* Stub CI — real bundle generated by bun run js:build */\n' > crates/pnex-frontend/assets/flasher.js
          test -f crates/pnex-frontend/assets/viewers.js || printf '/* Stub CI — real bundle generated by bun run js:viewers */\n' > crates/pnex-frontend/assets/viewers.js
          test -f crates/pnex-frontend/assets/viewers.css || printf '/* Stub CI — real CSS generated by bun run js:viewers */\n' > crates/pnex-frontend/assets/viewers.css
          test -f crates/pnex-frontend/assets/map.js || printf '/* Stub CI — real bundle generated by bun run js:map */\n' > crates/pnex-frontend/assets/map.js
          test -f crates/pnex-frontend/assets/map.css || printf '/* Stub CI — maplibre CSS generated by bun run js:map */\n' > crates/pnex-frontend/assets/map.css
          test -f crates/pnex-frontend/assets/doc.js || printf '/* Stub CI — real bundle generated by bun run js:doc */\n' > crates/pnex-frontend/assets/doc.js
          test -f crates/pnex-frontend/assets/graph.js || printf '/* Stub CI — real bundle generated by bun run js:graph */\n' > crates/pnex-frontend/assets/graph.js
      # pnex-recorder needs GTK/WebKit and ALSA: checked by the `recorder` job.
      - run: cargo check --workspace --exclude pnex-recorder
      - run: cargo check -p pnex-core -p pnex-frontend --target wasm32-unknown-unknown

  test:
    name: cargo test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: pnex
          POSTGRES_PASSWORD: pnex
          POSTGRES_DB: pnex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pnex -d pnex_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Valkey is mandatory (device liveness, D108).
      valkey:
        image: valkey/valkey:9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Object storage of every stored byte (config/test.yaml: bucket
      # pnex-test, created below).
      rustfs:
        image: rustfs/rustfs:1.0.0-rc.2
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
        ports:
          - 9000:9000
    env:
      TEST_DATABASE_URL: postgres://pnex:pnex@localhost:5432/pnex_test
      PNEX_TEST_APP_VALKEY_URL: redis://localhost:6379/0
    steps:
      # Hosted runners ship ~14 GB free; a workspace test build needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Stubs Tailwind + flasher.js (compilation)
        run: |
          mkdir -p crates/pnex-frontend/assets
          test -f crates/pnex-frontend/assets/tailwind.css || printf '/* Stub CI — real CSS generated by bun run css:build */\n' > crates/pnex-frontend/assets/tailwind.css
          test -f crates/pnex-frontend/assets/flasher.js || printf '/* Stub CI — real bundle generated by bun run js:build */\n' > crates/pnex-frontend/assets/flasher.js
          test -f crates/pnex-frontend/assets/viewers.js || printf '/* Stub CI — real bundle generated by bun run js:viewers */\n' > crates/pnex-frontend/assets/viewers.js
          test -f crates/pnex-frontend/assets/viewers.css || printf '/* Stub CI — real CSS generated by bun run js:viewers */\n' > crates/pnex-frontend/assets/viewers.css
          test -f crates/pnex-frontend/assets/map.js || printf '/* Stub CI — real bundle generated by bun run js:map */\n' > crates/pnex-frontend/assets/map.js
          test -f crates/pnex-frontend/assets/map.css || printf '/* Stub CI — maplibre CSS generated by bun run js:map */\n' > crates/pnex-frontend/assets/map.css
          test -f crates/pnex-frontend/assets/doc.js || printf '/* Stub CI — real bundle generated by bun run js:doc */\n' > crates/pnex-frontend/assets/doc.js
          test -f crates/pnex-frontend/assets/graph.js || printf '/* Stub CI — real bundle generated by bun run js:graph */\n' > crates/pnex-frontend/assets/graph.js
      - name: Create the test bucket
        env:
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          timeout 120 bash -c "until aws --endpoint-url http://localhost:9000 s3 ls >/dev/null 2>&1; do sleep 1; done"
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket pnex-test
      - run: cargo test --workspace --exclude pnex-recorder

  recorder:
    name: pnex-recorder (clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: System libraries (webkit2gtk, gtk, xdo, alsa)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: recorder
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p pnex-recorder --all-targets -- -D warnings
      - run: cargo test -p pnex-recorder

  arm-check:
    name: cargo check ARM (pnex-flow-runtime)
    # Native arm64 runner (Raspberry Pi 64-bit class target): no cross
    # toolchain needed.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check -p pnex-flow-runtime
      # armv7 (RPi 32-bit) is currently UNBUILDABLE: the starlark stack pulls
      # pagable 0.4.2, whose 64-bit-only size assertions fail on any 32-bit
      # target (E0512, usize 4 vs 8 bytes). Upstream limitation — restore an
      # armv7 cross check when starlark/pagable ship a 32-bit compatible
      # release.

  fmt:
    name: fmt (cargo fmt + rsx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # cargo fmt --all loads the workspace, whose path deps live in the
          # vendor/edgelinkd submodule.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # rsx bodies are invisible to rustfmt: dx fmt owns them. The wrapper
      # runs dx on stdin only (`dx fmt --check` rewrites files).
      - uses: cargo-bins/cargo-binstall@main
      - name: Install dx
        run: cargo binstall -y --locked dioxus-cli@0.7.10
      - name: rsx fmt
        run: python3 crates/pnex-frontend/scripts/rsx_fmt.py check

  english:
    name: english (no French in code comments and messages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: english_guard selftest
        run: python3 scripts/english_guard.py selftest
      # Ratchet: only the lines this push/PR adds (scripts/english_guard.py).
      - name: english_guard on the added lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD~1; fi
          python3 scripts/english_guard.py diff "$BASE"

  deny:
    name: deny (RustSec advisories + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Path deps of the workspace live in the vendor/edgelinkd submodule.
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-deny
        run: cargo binstall -y --locked cargo-deny
      # Policy and justified exceptions: deny.toml, docs/architecture/security.md §5.
      - name: cargo deny
        run: cargo deny check advisories sources

  frontend:
    name: dx build (web)
    runs-on: ubuntu-latest
    steps:
      # Hosted runners ship ~14 GB free; a workspace test build needs more.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v5
        with:
          # Since D18 the workspace resolves the WHOLE graph (pnex-flow-runtime
          # → vendor/edgelinkd): without the submodule, dx build fails when
          # loading path deps. NOT recursive — 3rd-party/node-red is
          # useless (same choice as the check job).
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2
      - name: CSS Tailwind v4 + bundles JS (flasher, viewers, map, doc)
        working-directory: crates/pnex-frontend
        run: |
          bun install --frozen-lockfile
          bun run css:build
          bun run js:build
          bun run js:viewers
          bun run js:map
          bun run js:doc
          bun run js:graph
      # Prebuilt dx, same version as deploy/docker/Dockerfile.
      - uses: cargo-bins/cargo-binstall@main
      - name: Installer dx
        run: cargo binstall -y --locked dioxus-cli@0.7.10
      - name: Build front (release)
        run: |
          cd crates/pnex-frontend
          dx build --platform web --release
      - name: Copier vers dist (format servi par Loco)
        run: |
          rm -rf crates/pnex-frontend/dist
          cp -r target/dx/pnex-frontend/release/web/public crates/pnex-frontend/dist
