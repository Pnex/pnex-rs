[workspace]
resolver = "2"
members = [
    "crates/pnex-core",
    "crates/pnex-backend",
    "crates/pnex-backend/migration",
    "crates/pnex-frontend",
    "crates/pnex-firmware-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
pnex-core = { path = "crates/pnex-core" }
pnex-firmware-builder = { path = "crates/pnex-firmware-builder" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
loco-rs = { version = "1.0" }
sea-orm = { version = "2.0", features = [
  "sqlx-postgres",
  "sqlx-sqlite", # tier hobbyist : tout-en-un sqlite (données + artefacts + queue)
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
